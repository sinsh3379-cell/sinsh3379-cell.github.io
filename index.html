은 5년이다.","note":"O — 토지임대부 분양주택의 거주의무기간은 5년이다(시행령 제60조의2①4호).","mark":"O","ans":true},{"n":"③","text":"거주의무자는 거주의무기간 중에는 해당 주택을 매매할 수 없으나 증여는 할 수 있다.","note":"X — 거주의무기간 중에는 매매뿐 아니라 증여 등 권리변동 행위도 할 수 없다(법 제57조의2②).","mark":"X","ans":false},{"n":"④","text":"토지임대부 분양주택에 입주하기 위해 준비기간이 필요한 경우 해당 주택에 거주한 것으로 보는 기간은 최초 입주가능일부터 60일까지로 한다.","note":"X — 준비기간으로 거주한 것으로 보는 기간은 최초 입주가능일부터 90일까지다.","mark":"X","ans":false},{"n":"⑤","text":"국토교통부장관 또는 행정안전부장관은 거주의무자등의 실제 거주 여부를 확인하기 위하여 거주의무자등에게 필요한 서류 등의 제출을 요구할 수 있다.","note":"X — 거주실태 조사는 국토교통부장관 또는 지방자치단체의 장이 한다(법 제57조의3①). 행정안전부장관이 아니다.","mark":"X","ans":false}],"combo":false,"answerText":"②","neg":false,"cite":["주택법 제57조의2","주택법 제57조의3","주택법 시행령 제60조의2"],"core":"토지임대부 분양주택의 거주의무를 묻는 문항이다. 토지임대부 분양주택의 거주의무기간은 5년이므로 ②가 옳다(시행령 제60조의2①4호).","key":"토지임대부 분양주택의 거주의무기간은 5년이다(시행령 제60조의2①4호).","terms":[],"freqConcept":{"name":"분양가상한제와 토지임대부 분양주택(적용지역·거주의무·분양가심사위원회)","count":14,"rounds":[11,12,13,15,17,19,20,21,23,24,28]},"about":"주택의 공급","siteAmend":null,"amend2027":null,"freqArticle":{"name":"주택법 제57조의2","count":2,"rounds":[24,28]}},{"id":"r28-003","round":28,"num":3,"law":"주택법","unit":"주택의 공급","type":"mc","stem":"주택법령상 입주자저축에 관한 설명으로 옳지 않은 것은?","passage":[],"choices":[{"n":"①","text":"“입주자저축”이란 국민주택과 민영주택을 공급받기 위하여 가입하는 주택청약종합저축을 말한다.","note":"O — 입주자저축은 국민주택과 민영주택을 공급받기 위한 주택청약종합저축이다.","mark":"O","ans":false},{"n":"②","text":"입주자저축계좌를 취급하는 기관은 「은행법」에 따른 은행 중 국토교통부장관이 지정한다.","note":"O — 취급기관은 은행 중 국토교통부장관이 지정한다.","mark":"O","ans":false},{"n":"③","text":"입주자저축은 한 사람이 한 계좌만 가입할 수 있다.","note":"O — 입주자저축은 1인 1계좌만 가입할 수 있다.","mark":"O","ans":false},{"n":"④","text":"국토교통부장관은 입주자저축에 관한 국토교통부령을 개정할 때에는 기획재정부장관과 미리 협의해야 한다.","note":"O — 국토교통부령 제정·개정 시 기획재정부장관과 미리 협의한다(법 제56조①).","mark":"O","ans":false},{"n":"⑤","text":"입주자저축취급기관의 장이 국토교통부장관에게 입주자저축정보를 제공한 경우 「금융실명거래 및 비밀보장에 관한 법률」에 따라 입주자저축정보의 제공사실을 명의인에게 통보하여야 한다.","note":"X — 입주자저축정보 제공 시에는 명의인 통보를 하지 아니할 수 있다. ‘통보하여야 한다’가 옳지 않다.","mark":"X","ans":true}],"combo":false,"answerText":"⑤","neg":true,"cite":["주택법 제56조"],"core":"입주자저축 제도를 묻는 문항이다. 입주자저축 취급기관이 국토교통부장관에게 정보를 제공한 경우에는 「금융실명거래 및 비밀보장에 관한 법률」에 따른 명의인 통보를 하지 않을 수 있으므로, 통보하여야 한다고 한 ⑤가 옳지 않다.","key":"입주자저축정보 제공 시에는 명의인 통보를 하지 아니할 수 있다. ‘통보하여야 한다’가 옳지 않다.","terms":[],"about":"주택의 공급","siteAmend":null,"amend2027":null,"freqArticle":{"name":"주택법 제56조","count":5,"rounds":[13,15,16,25,28]}},{"id":"r28-004","round":28,"num":4,"law":"주택법","unit":"주택건설사업의 시행","type":"mc","stem":"주택법령상 주택건설사업을 완료한 경우 주택의 사용검사에 관한 설명으로 옳은 것을 모두 고른 것은?","passage":["ㄱ.한국토지주택공사가 주택건설사업의 사업주체인 경우 시장·군수·구청장의 사용검사를 받아야 한다.","ㄴ.사용검사권자는 사용검사를 할 때 주택이 사업계획의 내용에 적합한지 여부를 확인해야 한다.","ㄷ.사용검사는 신청일부터 15일 이내에 하여야 한다.","ㄹ.사업주체가 파산 등으로 사용검사를 받을 수 없는 경우에는 해당 주택의 시공을 보증한 자 또는 입주예정자는 대통령령으로 정하는 바에 따라 사용검사를 받을 수 있다."],"choices":[{"n":"①","text":"ㄱ","note":"X — ㄴ·ㄷ·ㄹ이 빠진 조합이라 옳지 않다.","mark":"","ans":false},{"n":"②","text":"ㄱ, ㄷ","note":"X — ㄴ·ㄹ이 빠진 조합이라 옳지 않다.","mark":"","ans":false},{"n":"③","text":"ㄴ, ㄷ","note":"X — ㄹ이 빠진 조합이라 옳지 않다.","mark":"","ans":false},{"n":"④","text":"ㄴ, ㄷ, ㄹ","note":"O — ㄴ·ㄷ·ㄹ이 옳다.","mark":"정답","ans":true},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ, ㄹ","note":"X — ㄱ(한국토지주택공사가 사업주체면 시장·군수·구청장의 사용검사)은 옳지 않다. 이 경우 국토교통부장관의 사용검사를 받는다(법 제49조①).","mark":"","ans":false}],"combo":true,"answerText":"④","neg":false,"cite":["주택법 제49조"],"core":"사용검사 규정을 묶은 문항이다. 사용검사권자의 적합성 확인(ㄴ), 신청일부터 15일 이내 사용검사(ㄷ), 사업주체 파산 시 보증한 자·입주예정자의 사용검사(ㄹ)가 모두 옳아 ④다.","key":"LH·국가가 사업주체면 ‘국토교통부장관’ 사용검사 / 신청일부터 15일 이내 / 파산 시 보증한 자·입주예정자도 신청 가능.","terms":[],"freqConcept":{"name":"주택건설공사의 감리와 사용검사(품질점검단·사전방문·임시 사용승인)","count":10,"rounds":[11,15,22,24,26,27,28]},"about":"주택건설사업의 시행","siteAmend":null,"amend2027":null,"freqArticle":{"name":"주택법 제49조","count":4,"rounds":[15,22,24,28]}},{"id":"r28-005","round":28,"num":5,"law":"주택법","unit":"주택의 공급","type":"mc","stem":"주택법령상 투기과열지구에 관한 설명으로 옳은 것은?","passage":[],"choices":[{"n":"①","text":"투기과열지구는 국토교통부장관 또는 시·도지사가 지정한다.","note":"O — 투기과열지구는 국토교통부장관 또는 시·도지사가 지정한다.","mark":"O","ans":true},{"n":"②","text":"투기과열지구에서 전매행위 제한규정에 위반하여 전매행위 제한기간 내에 주택을 전매하는 행위는 「주택법」에 따른 벌칙의 적용대상이 아니다.","note":"X — 전매제한 위반 전매행위는 벌칙(과태료·형벌) 적용 대상이다.","mark":"X","ans":false},{"n":"③","text":"투기과열지구는 그 지정 목적을 달성할 수 있는 최소한의 범위에서 시·도 또는 시·군·구 단위로 지정한다.","note":"X — 지정 단위는 시·군·구(또는 그 일부)이며, ‘시·도 단위’까지 포함한 서술은 옳지 않다.","mark":"X","ans":false},{"n":"④","text":"투기과열지구지정직전월의 주택분양실적이 전달보다 20퍼센트 이상 감소한 곳으로 주택공급이 위축될 우려가 있는 곳은 투기과열지구로 지정될 수 있다.","note":"X — 분양실적이 전달보다 감소한 ‘위축’ 지역은 투기과열지구 지정 사유가 아니다.","mark":"X","ans":false},{"n":"⑤","text":"「수도권정비계획법」에 따른 수도권의 투기과열지구에서 건설·공급되는 주택의 전매행위 제한기간은 1년이다.","note":"X — 수도권 투기과열지구의 전매제한기간은 3년이다. 1년이 아니다.","mark":"X","ans":false}],"combo":false,"answerText":"①","neg":false,"cite":["주택법 제63조의2","주택법 시행령 별표 3"],"core":"투기과열지구의 지정과 전매제한을 묻는 문항이다. 투기과열지구는 국토교통부장관 또는 시·도지사가 지정하므로 ①이 옳다.","key":"투기과열지구는 국토교통부장관 또는 시·도지사가 지정한다.","terms":[],"freqConcept":{"name":"투기과열지구·조정대상지역과 전매제한·공급질서 교란 금지","count":12,"rounds":[13,14,16,17,18,19,20,21,22,23,24,28]},"about":"주택의 공급","siteAmend":null,"amend2027":null,"freqArticle":{"name":"주택법 제63조의2","count":4,"rounds":[16,22,23,28]}},{"id":"r28-006","round":28,"num":6,"law":"공동주택관리법","unit":"공동주택관리법 총칙과 관리방법","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 관리방법 등에 관한 설명으로 옳지 않은 것은?","passage":[],"choices":[{"n":"①","text":"시장·군수·구청장은 관할구역내 공동주택의 관리에 필요하다고 인정하는 경우에는 인접한 공동주택단지를 공동으로 관리하게 할 수 있다.","note":"X — 공동관리는 단지별 입주자등 과반수의 서면동의로 정한다(법 제8조②). 시장·군수·구청장이 공동관리하게 할 수 있다는 근거가 없다.","mark":"X","ans":true},{"n":"②","text":"입주자대표회의 구성원은 자치관리기구의 직원을 겸할 수 없다.","note":"O — 입주자대표회의 구성원은 자치관리기구 직원을 겸할 수 없다(법 제6조④).","mark":"O","ans":false},{"n":"③","text":"입주자등이 공동주택의 관리방법을 변경하는 경우, 전체 입주자등의 10분의 1 이상이 서면으로 제안하고 전체 입주자등의 과반수가 찬성하는 방법으로 관리방법을 변경할 수 있다.","note":"O — 10분의 1 이상 서면 제안 + 전체 입주자등 과반수 찬성으로 변경할 수 있다(법 제11조③).","mark":"O","ans":false},{"n":"④","text":"입주자등이 공동주택의 관리방법을 정하는 경우, 입주자대표회의의 의결로 제안하고 전체 입주자등의 과반수가 찬성하는 방법으로 관리방법을 결정할 수 있다.","note":"O — 입주자대표회의 의결로 제안하고 전체 입주자등 과반수가 찬성해 결정할 수 있다.","mark":"O","ans":false},{"n":"⑤","text":"입주자대표회의는 해당 공동주택의 관리에 필요하다고 인정하는 경우에는 국토교통부령으로 정하는 바에 따라 500세대 이상의 단위로 나누어 관리하게 할 수 있다.","note":"O — 500세대 이상 단위로 나누어 관리하게 할 수 있다(법 제11조③).","mark":"O","ans":false}],"combo":false,"answerText":"①","neg":true,"cite":["공동주택관리법 제8조","공동주택관리법 제11조","공동주택관리법 제6조"],"core":"관리방법 결정·변경 절차를 묻는 문항이다. 공동관리는 시장·군수·구청장이 명하는 것이 아니라 입주자등의 서면동의로 정하므로, ①이 옳지 않다(법 제8조②).","key":"공동관리는 단지별 입주자등 과반수의 서면동의로 정한다(법 제8조②). 시장·군수·구청장이 공동관리하게 할 수 있다는 근거가 없다.","terms":[],"freqConcept":{"name":"관리방법의 결정과 관리의 이관(의무관리대상 전환·공동관리·혼합주택단지)","count":32,"rounds":[11,12,13,14,15,16,17,18,20,21,22,23,24,26,27,28]},"about":"공동주택관리법 총칙과 관리방법","siteAmend":null,"amend2027":null,"freqArticle":{"name":"공동주택관리법 제11조","count":13,"rounds":[11,12,15,16,18,19,20,22,23,24,25,26,28]}},{"id":"r28-007","round":28,"num":7,"law":"공동주택관리법","unit":"입주자대표회의와 관리규약","type":"mc","stem":"공동주택관리법상 입주자대표회의의 구성 등에 관한 설명으로 옳지 않은 것은?","passage":[],"choices":[{"n":"①","text":"입주자대표회의는 4명 이상으로 구성한다.","note":"O — 입주자대표회의는 4명 이상으로 구성한다(법 제14조①).","mark":"O","ans":false},{"n":"②","text":"입주자대표회의의 구성을 위한 동별 대표자 선거구는 2개 동 이상으로 묶거나 통로나 층별로 구획하여 정할 수 있다.","note":"O — 선거구는 2개 동 이상 묶거나 통로·층별로 구획할 수 있다.","mark":"O","ans":false},{"n":"③","text":"동별 대표자 선출공고에서 정한 각종 서류 제출 마감일을 기준으로는 미성년자였으나 선거일 기준으로는 성년이 된 자의 경우에는 동별 대표자가 될 수 있다.","note":"X — 결격 판단 기준일은 ‘서류 제출 마감일’이다. 마감일에 미성년이면 선거일 성년 여부와 무관하게 될 수 없다.","mark":"X","ans":true},{"n":"④","text":"동별 대표자가 임기 중에 파산자가 된 경우에는 당연히 퇴임한다.","note":"O — 임기 중 파산자가 되면 당연히 퇴임한다.","mark":"O","ans":false},{"n":"⑤","text":"입주자인 동별 대표자 중에서 회장 후보자가 있는 경우, 사용자인 동별 대표자는 회장이 될 수 없다.","note":"O — 입주자 동별 대표자 중 회장 후보자가 있으면 사용자 동별 대표자는 회장이 될 수 없다.","mark":"O","ans":false}],"combo":false,"answerText":"③","neg":true,"cite":["공동주택관리법 제14조","공동주택관리법 시행령 제11조"],"core":"동별 대표자의 결격사유를 묻는 문항이다. 결격 여부는 ‘서류 제출 마감일’을 기준으로 판단하므로, 선거일 기준으로 성년이 되었으니 될 수 있다는 ③이 옳지 않다(시행령 제11조).","key":"결격 판단 기준일은 ‘서류 제출 마감일’이다. 마감일에 미성년이면 선거일 성년 여부와 무관하게 될 수 없다.","terms":[],"about":"입주자대표회의와 관리규약","siteAmend":null,"amend2027":null,"freqArticle":{"name":"공동주택관리법 제14조","count":13,"rounds":[12,13,15,16,18,21,22,23,24,25,26,27,28]}},{"id":"r28-008","round":28,"num":8,"law":"공동주택관리법","unit":"관리비·회계와 시설관리","type":"mc","stem":"공동주택관리법령상 관리주체가 관리비를 예치할 수 있도록 입주자대표회의가 지정할 수 있는 금융기관에 해당하지 않는 것은?","passage":[],"choices":[{"n":"①","text":"「산림조합법」에 따른 산림조합","note":"X — 산림조합은 예치 금융기관에 해당한다.","mark":"X","ans":false},{"n":"②","text":"「한국주택금융공사법」에 따른 한국주택금융공사","note":"X — 한국주택금융공사도 해당한다.","mark":"X","ans":false},{"n":"③","text":"「보험업법」에 따른 보험회사","note":"X — 보험회사도 해당한다.","mark":"X","ans":false},{"n":"④","text":"「수산업협동조합법」에 따른 수산업협동조합","note":"X — 수산업협동조합도 해당한다.","mark":"X","ans":false},{"n":"⑤","text":"「건설기술 진흥법」에 따른 공제조합","note":"O — 건설기술 진흥법상 공제조합은 관리비 예치 금융기관이 아니다.","mark":"O","ans":true}],"combo":false,"answerText":"⑤","neg":false,"cite":["공동주택관리법 제23조","공동주택관리법 시행령 제24조"],"core":"관리비 예치 금융기관을 묻는 문항이다. 은행·산림조합·수협·보험회사·한국주택금융공사 등은 지정 대상이지만, 「건설기술 진흥법」에 따른 공제조합은 이에 해당하지 않으므로 ⑤가 답이다(법 제23조④, 시행령 제24조).","key":"건설기술 진흥법상 공제조합은 관리비 예치 금융기관이 아니다.","terms":[],"about":"관리비·회계와 시설관리","siteAmend":null,"amend2027":null,"freqArticle":{"name":"공동주택관리법 제23조","count":9,"rounds":[11,12,13,14,15,18,22,27,28]}},{"id":"r28-009","round":28,"num":9,"law":"공동주택관리법","unit":"공동주택관리법 총칙과 관리방법","type":"mc","stem":"공동주택관리법령상 주택관리업의 등록신청을 할 때 그 신청서에 첨부하여야 하는 서류에 해당하지 않는 것은?","passage":[],"choices":[{"n":"①","text":"장비보유현황 및 그 증명서류","note":"X — 장비보유현황 및 증명서류는 첨부서류다.","mark":"X","ans":false},{"n":"②","text":"기술자의 기술자격 및 주택관리사의 자격에 관한 증명서 사본","note":"X — 기술자·주택관리사 자격 증명서 사본도 첨부서류다.","mark":"X","ans":false},{"n":"③","text":"사무실 확보를 증명하는 서류(건물 임대차 계약서 사본 등 사용에 관한 권리를 증명하는 서류)","note":"X — 사무실 확보 증명서류도 첨부서류다.","mark":"X","ans":false},{"n":"④","text":"법인인 경우에는 납입자본금에 관한 증명서류","note":"X — 법인의 납입자본금 증명서류도 첨부서류다.","mark":"X","ans":false},{"n":"⑤","text":"개인인 경우에는 보증보험 가입증명서 및 관련 서류","note":"O — 개인의 보증보험 가입증명서는 등록신청 첨부서류가 아니다.","mark":"O","ans":true}],"combo":false,"answerText":"⑤","neg":false,"cite":["공동주택관리법 제52조","공동주택관리법 시행규칙 제18조"],"core":"주택관리업 등록신청 첨부서류를 묻는 문항이다. 개인인 경우의 ‘보증보험 가입증명서’는 등록신청 첨부서류가 아니므로 ⑤가 답이다(시행규칙 제18조).","key":"개인의 보증보험 가입증명서는 등록신청 첨부서류가 아니다.","terms":[],"about":"공동주택관리법 총칙과 관리방법","siteAmend":null,"amend2027":null,"freqArticle":{"name":"공동주택관리법 제52조","count":5,"rounds":[11,13,20,22,28]}},{"id":"r28-010","round":28,"num":10,"law":"공동주택관리법","unit":"관리비·회계와 시설관리","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 안전점검의 결과 건축물의 구조·설비의 안전도가 매우 낮아 위해 발생의 우려가 있는 경우에 관리주체가 시장·군수·구청장에게 보고해야 할 사항으로 명시된 것이 아닌 것은?","passage":[],"choices":[{"n":"①","text":"점검기관의 정보 및 검사기간","note":"O(정답) — 점검기관 정보·검사기간은 보고사항으로 명시되어 있지 않다.","mark":"X","ans":true},{"n":"②","text":"점검대상 구조·설비","note":"X — 점검대상 구조·설비는 보고사항이다.","mark":"O","ans":false},{"n":"③","text":"취약의 정도","note":"X — 취약의 정도도 보고사항이다.","mark":"O","ans":false},{"n":"④","text":"발생 가능한 위해의 내용","note":"X — 발생 가능한 위해의 내용도 보고사항이다.","mark":"O","ans":false},{"n":"⑤","text":"조치할 사항","note":"X — 조치할 사항도 보고사항이다.","mark":"O","ans":false}],"combo":false,"answerText":"①","neg":true,"cite":["공동주택관리법 제33조"],"core":"안전점검 결과 위해 우려 시 보고사항을 묻는 문항이다. 점검대상 구조·설비, 취약의 정도, 발생 가능한 위해의 내용, 조치할 사항을 보고하며, ‘점검기관의 정보 및 검사기간’은 보고사항이 아니다(법 제33조②).","key":"O(정답) — 점검기관 정보·검사기간은 보고사항으로 명시되어 있지 않다.","terms":[],"about":"관리비·회계와 시설관리","siteAmend":null,"amend2027":null,"freqArticle":{"name":"공동주택관리법 제33조","count":4,"rounds":[16,19,22,28]}},{"id":"r28-017","round":28,"num":17,"law":"민간임대주택법","unit":"민간임대주택에 관한 특별법","type":"mc","stem":"민간임대주택에 관한 특별법령상 임대사업자 등에 관한 설명으로 옳지 않은 것은?","passage":[],"choices":[{"n":"①","text":"공공지원민간임대주택의 임차인은 거짓이나 그 밖의 부정한 방법으로 공공지원민간임대주택을 공급받아서는 아니 된다.","note":"O — 거짓·부정한 방법으로 공공지원민간임대주택을 공급받아서는 안 된다.","mark":"O","ans":false},{"n":"②","text":"100세대 이상의 공동주택을 임대하는 임대사업자는 임대차기간을 변경한 날부터 3개월 이내에 시장·군수·구청장에게 변경신고를 하여야 한다.","note":"X — 100세대 이상 공동주택 임대사업자의 변경신고는 ‘변경예정일 1개월 전까지’다(법 제46조②). 3개월 이내가 아니다.","mark":"X","ans":true},{"n":"③","text":"장기일반민간임대주택의 임대사업자는 임대기간 중 임차인 자격 및 선정방법 등에 대하여 임대사업자가 정한 기준에 따라 공급하여야 한다.","note":"O — 장기일반민간임대주택은 임대사업자가 정한 기준에 따라 임차인을 공급한다.","mark":"O","ans":false},{"n":"④","text":"임대사업자가 민간임대주택에 대한 임대차계약을 체  등의 장’ 추천 위원으로 넓어지고 ‘시·도’가 ‘지방자치단체’로 정비됐다.","key":"심의 분야에 ‘환경·재해’ 추가 + 교육환경·성능위주설계·재해영향평가 3개 심의사항 신설.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"주택법"},{"id":"a2027-07","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 주택법 제49조제5항의 신설 규정이다. ( )에 들어갈 용어를 쓰시오.","passage":["제46조제2항에 따라 감리를 받은 주택의 사업주체는 해당 주택의 입주예정자의 ( )가 주택의 구조안전성 등을 확인하기 위하여 사용검사를 받기 전에 현장점검을 요청하는 경우에는 이에 따라야 한다."],"choices":[],"combo":false,"answerText":"과반수","neg":false,"cite":["주택법 제49조","주택법 제46조"],"core":"2026. 8. 4. 시행. 자연재난으로 주요 구조부에 균열 등이 확인되면 감리자는 건축구조기술사의 협력을 받아야 하고(제46조제2항 신설), 그렇게 감리한 주택은 입주예정자 과반수가 요청하면 사용검사 전 현장점검에 응하여야 한다(제49조제5항 신설). 불응 시 과태료 근거도 신설됐다(제106조제2항제5호의2).","key":"과반수 요청 + 사용검사 ‘전’ 현장점검 + 자연재난 시 건축구조기술사 협력.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"주택법"},{"id":"a2027-08","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 주택법 제12조의2의 신설 규정이다. ( )에 들어갈 용어를 쓰시오.","passage":["주택조합사업에 드는 비용이 100분의 10(생산자물가상승률은 제외) 이상 늘어나는 경우에는 총회의 의결을 거쳐야 하며, 총회는 조합원 ( ) 이상의 출석과 출석 조합원 3분의 2 이상의 찬성으로 의결한다."],"choices":[],"combo":false,"answerText":"3분의 2","neg":false,"cite":["주택법 제12조의2"],"core":"2027. 3. 9. 시행(법률 제21902호). 사업비 10% 이상 증가 시 총회 의결이 의무화되고, 의결 정족수는 조합원 3분의 2 이상 출석 + 출석 조합원 3분의 2 이상 찬성이다.","key":"10% / 3분의 2 출석 / 3분의 2 찬성 — 세 숫자가 그대로 출제된다.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"주택법"},{"id":"a2027-09","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 주택법 제11조의2제7항의 신설 규정이다. ( )에 들어갈 용어를 쓰시오.","passage":["제1항에 따른 업무대행자는 제2항제1호부터 제4호까지 및 제6호에 해당하는 업무와 같은 항 제5호에 해당하는 대행업무를 ( )하여 할 수 없다."],"choices":[],"combo":false,"answerText":"병행","neg":false,"cite":["주택법 제11조의2"],"core":"2027. 3. 9. 시행. 업무대행자가 자기 업무(조합설립·사업성 검토·설계자 선정 지원·사업계획승인 업무·총회 운영 지원)와 자금 보관 대행업무를 함께 하는 이해충돌을 막기 위해 병행을 금지했다.","key":"업무대행자 = ‘자기 업무’와 ‘자금 보관 대행’ 병행 금지(이해충돌 방지).","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"주택법"},{"id":"a2027-10","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 민간임대주택에 관한 특별법 제42조제8항의 신설 규정이다. ( )에 들어갈 용어를 쓰시오.","passage":["누구든지 임대사업자가 제5조에 따라 등록한 민간임대주택을 공급하는 경우 등에 해당하지 아니하면 민간임대주택의 ( ) 또는 임차인이 되려는 자를 모집하여서는 아니 된다."],"choices":[],"combo":false,"answerText":"임차인","neg":false,"cite":["민간임대주택에 관한 특별법 제42조"],"core":"2027. 3. 9. 시행. 미등록 사업자 등의 임차인 모집을 직접 금지하고, 투자자·회원·발기인 등 명칭과 관계없이 장래 임차인이 되려는 자까지 모집 대상에 포함했다. 금전을 받은 경우와 그렇지 않은 경우로 벌칙이 갈린다(제65조제2항제10호, 제67조제1항제1호 신설).","key":"등록 임대사업자 외 ‘임차인 모집’ 금지 — 명칭 불문, 금전 수령 여부로 벌칙 구분.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"민간임대주택법"},{"id":"a2027-11","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 민간임대주택에 관한 특별법 제43조의2의 신설 규정이다. ( )에 들어갈 아라비아 숫자를 쓰시오.","passage":["상속인이 임대사업을 계속하려면 임대사업자가 사망한 날부터 ( )일 이내에 시장·군수·구청장에게 신고하여야 한다. 시장·군수·구청장은 신고를 받은 날부터 10일 이내에 신고수리 여부를 통지하고, 통지가 없으면 그 기간이 끝난 날의 다음 날에 수리한 것으로 본다."],"choices":[],"combo":false,"answerText":"90","neg":false,"cite":["민간임대주택에 관한 특별법 제43조의2"],"core":"2027. 3. 9. 시행. 상속에 따른 임대사업자 지위 승계 절차가 처음으로 법에 들어왔다. 90일 내 신고 → 10일 내 통지 → 미통지 시 수리 간주, 수리 시 사망일부터 수리일까지의 등록은 상속인 등록으로 본다.","key":"90일(신고) → 10일(통지) → 미통지 시 수리 간주.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"민간임대주택법"},{"id":"a2027-12","round":0,"num":0,"law":"2027 개정 포인트","unit":"2027 개정 포인트","type":"short","stem":"[2027 개정] 민간임대주택에 관한 특별법 제46조제2항 단서의 신설 규정이다. ( )에 들어갈 아라비아 숫자를 쓰시오.","passage":["새로운 임차인과 임대차계약을 체결할 때 임대차계약일부터 변경예정일까지 기간이 1개월 미만인 경우 등 변경예정일 1개월 전까지 신고하는 것이 현저히 곤란한 경우에는 변경한 날부터 ( )일 이내에 신고할 수 있다."],"choices":[],"combo":false,"answerText":"15","neg":false,"cite":["민간임대주택에 관한 특별법 제46조"],"core":"2027. 3. 9. 시행. 신고 기산일이 각 호로 정비되고(계약 체결 시 계약일·등록일, 변경 시 변경한 날), 100세대 이상 임대사업자의 ‘변경예정일 1개월 전’ 원칙에 ‘변경한 날부터 15일’ 특례가 붙었다.","key":"원칙 ‘변경예정일 1개월 전’ / 곤란하면 ‘변경한 날부터 15일’.","terms":[],"freqConcept":null,"freqArticle":null,"about":"","siteAmend":null,"amend2027":null,"isNew":true,"statute":"민간임대주택법"}];

<script>
const BADGE='①②③④⑤⑥⑦⑧⑨⑩';
const LS='jutaek_3law_cbt_v1';
const LAWS=['공동주택관리법','주택법','민간임대주택법','2027 개정 포인트'];
const LAWLABEL={'공동주택관리법':'공동주택관리법','주택법':'주택법','민간임대주택법':'민간임대주택법','2027 개정 포인트':'2027 개정 포인트'};
let state = load() || {answers:{}, graded:{}, law:'공동주택관리법', unit:null, idx:0};
let list = [];      // 현재 단원 문항
let cur = 0;

function load(){ try{ const s=JSON.parse(localStorage.getItem(LS)); return s&&s.answers?s:null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)) }catch(e){} }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1600); }

function unitsOf(law){
  const set=[]; DATA.forEach(q=>{ if(q.law===law && !set.includes(q.unit)) set.push(q.unit); });
  return set;
}
function buildSelectors(){
  const sl=document.getElementById('selLaw');
  sl.innerHTML=LAWS.map(l=>`<option value="${l}">${LAWLABEL[l]} (${DATA.filter(q=>q.law===l).length})</option>`).join('');
  sl.value=state.law;
  const su=document.getElementById('selUnit');
  const us=unitsOf(state.law);
  su.innerHTML=us.map(u=>`<option value="${u}">${u} (${DATA.filter(q=>q.law===state.law&&q.unit===u).length})</option>`).join('');
  if(!state.unit || !us.includes(state.unit)) state.unit=us[0];
  su.value=state.unit;
  sl.onchange=()=>{ state.law=sl.value; state.unit=null; state.idx=0; buildSelectors(); rebuild(); };
  su.onchange=()=>{ state.unit=su.value; state.idx=0; rebuild(); };
}
function rebuild(){
  list = DATA.filter(q=>q.law===state.law && q.unit===state.unit);
  cur = Math.min(state.idx||0, list.length-1);
  document.getElementById('chipInfo').textContent = `${state.law} · ${state.unit}`;
  render(); renderGrid(); renderScore(); renderUnits();
}
function key(q){ return q.id }
function isCorrect(q){
  const a=(state.graded||{})[key(q)];
  return a===true;
}
function renderScore(){
  const done=Object.keys(state.graded||{}).length;
  const right=Object.values(state.graded||{}).filter(v=>v===true).length;
  document.getElementById('score').innerHTML = `확인한 문항 <b>${done}</b> · 맞음 <b>${right}</b>${done?` · 정답률 <b>${Math.round(right/done*100)}%</b>`:''}`;
}
function renderUnits(){
  const rows=LAWS.map(l=>{
    const qs=DATA.filter(q=>q.law===l);
    const pick=qs.filter(q=>state.answers[q.id]!==undefined&&state.answers[q.id]!=='').length;
    return `<div><b>${LAWLABEL[l]}</b> ${qs.length}문항 · 푼 문항 ${pick}</div>`;
  }).join('');
  document.getElementById('unitlist').innerHTML=rows;
}
function roundsText(rounds){
  if(!rounds||!rounds.length) return '';
  const s=rounds.map(r=>r+'회').join('·');
  return s;
}
function render(){
  const q=list[cur]; if(!q) return;
  const picked=state.answers[q.id];
  const graded=state.graded[q.id];
  const ansIdx=(q.choices||[]).filter(c=>c.ans).map(c=>c.n);
  const badgeRound = q.isNew ? '<span class="b new">2027 개정</span>' : `<span class="b round">${q.round}-${q.num}</span>`;
  const badges = `${badgeRound}<span class="b">${q.statute||q.law}</span><span class="b">${q.unit}</span>`+
    (q.isNew?'<span class="b new">신설·개정 조문</span>':`<span class="b">제${q.round}회 ${q.num}번</span>`)+
    (q.amend2027?'<span class="b amend">[2027 개정 반영]</span>':'');
  let body='';
  if(q.type==='mc'){
    body=`<div class="opts">`+(q.choices||[]).map((c,i)=>{
      let cls='opt';
      const isPick = picked===c.n;
      if(graded!==undefined && graded!==null){
        if(c.ans) cls+=' correct';
        else if(isPick && !c.ans) cls+=' wrongpick';
      } else if(isPick) cls+=' selected';
      const mk = '';
      const tag = (graded!==undefined && graded!==null && c.ans) ? `<span class="tag">정답${isPick?' · 내 선택':''}</span>` : (isPick? `<span class="tag">내 선택</span>`:'');
      return `<div class="${cls}" data-opt="${c.n}"><span class="num">${c.n}</span><span class="txt">${c.text}</span>${mk}${tag}</div>`;
    }).join('')+`</div>`;
  } else {
    const val = picked? String(picked).replace(/</g,'&lt;') : '';
    body=`<div class="shortbox"><input id="shortInput" placeholder="답을 입력하고 Enter 또는 [정답 확인] (예: 10, 입주자등)" value="${val}">
      <div class="shortrow"><button class="btn primary" id="btnCheck">정답 확인</button>
      <span style="font-size:12px;color:#6b7787;align-self:center">주관식 단답형</span></div></div>`;
  }
  const passage = (q.passage&&q.passage.length)? `<div class="passage">`+q.passage.map(p=>{
      const m=p.match(/^([ㄱ-ㅎ]|[①-⑩]|\d+\.|[가-힣]\.)\s*(.*)$/s);
      return m? `<div><span class="pk">${m[1]}</span><span>${m[2]}</span></div>`:`<div><span>${p}</span></div>`;
    }).join('')+`</div>`:'';
  let result='';
  if(graded===true) result=`<div class="result ok">정답입니다. (${q.type==='mc'?ansIdx.join('·'):q.answerText})<span class="small">${q.type==='short'?'입력한 답이 정답과 일치합니다.':'해설에서 근거를 확인하세요.'}</span></div>`;
  else if(graded===false) result=`<div class="result no">틀렸습니다. (정답 ${q.type==='mc'?ansIdx.join('·'):q.answerText})<span class="small">${q.type==='short'?'정답과 다릅니다. 해설의 조문을 확인하세요.':'내 선택과 정답을 해설에서 비교해 보세요.'}</span></div>`;
  let exp='';
  if(graded!==undefined && graded!==null){
    const optNotes = (q.choices||[]).map(c=>{
      const note=(c.note||'').replace(/^[OX]\s*—\s*/,'');
      const mark=c.mark==='O'||c.mark==='X'? `<span class="mk ${c.mark}">${c.mark}</span>`:'<span class="mk" style="background:#eef1f6;color:#41556f;border:1px solid #e2e7ef">정답</span>';
      return `<div class="optnote"><b>${c.n}</b> ${mark} ${note}</div>`;
    }).join('');
    const freq=[];
    if(q.freqArticle) freq.push(`<div><span class="t">[기출 빈도]</span>「${q.freqArticle.name}」 인용 <b>${q.freqArticle.count}문항</b> (${roundsText(q.freqArticle.rounds)})</div>`);
    if(q.freqConcept) freq.push(`<div><span class="t">[기출 빈도]</span>연관 쟁점(사이트 분류) 「${q.freqConcept.name}」 <b>${q.freqConcept.count}문항</b> (${roundsText(q.freqConcept.rounds)})</div>`);
    if(q.isNew) freq.push(`<div><span class="t">기출 빈도</span> 2026~2027년 시행 개정 조문 — <b>기출 없음(신규 출제 예상)</b></div>`);
    const cites=(q.cite||[]).map(c=>`<span class="c">${c}</span>`).join(' ');
    const amend = q.amend2027? `<div class="amendbox"><div class="h">2027 개정 반영 — 변경 전후</div>${q.amend2027}</div>`:'';
    const siteAm = (q.siteAmend && q.siteAmend.body)? `<div class="amendbox"><div class="h">${q.siteAmend.head||'법령 변경 유의'}</div>${q.siteAmend.body}</div>`:'';
    exp=`<div class="exp">
      <h3>해설</h3>
      <p>${q.core||''}</p>
      ${(q.choices||[]).length? `<h3 style="margin-top:12px">선지별 O / X</h3>${optNotes}`:''}
      ${freq.length? `<div class="freqbox">${freq.join('')}</div>`:''}
      ${cites? `<div class="cite"><span class="lab">[관련 조문]</span>${cites}</div>`:''}
      ${q.key? `<div class="keybox"><b>[핵심]</b> ${q.keyPrefix||''}${q.key}</div>`:''}
      ${amend}${siteAm}
      <div class="hint">단축키: 1~5 보기 선택 · ←/→ 이동 · Enter 정답 확인/다음<br>기출 출처: 한국산업인력공단 큐넷 공개문제 · 해설: 제11~23회는 풀고패스 기출해설 정리, 제24~28회·2027 개정 문항은 클이 조문 대조로 작성</div>
    </div>`;
  }
  document.getElementById('card').innerHTML = `
    <div class="badges">${badges}</div>
    <div class="qhead"><span class="qno">${cur+1}.</span><span>${q.stem}</span></div>
    ${passage}
    ${body}
    <div class="actions">
      <button class="btn" id="btnPrev">이전</button>
      <button class="btn" id="btnNext">다음</button>
      <div class="right">${graded!==undefined&&graded!==null
        ? `<button class="btn primary" id="btnHide">정답 숨기기</button>`
        : (q.type==='mc' ? `<button class="btn primary" id="btnSubmit">정답 확인</button>` : '')}</div>
    </div>
    ${result}
    ${exp}`;
  // bind
  document.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{ if(state.graded[q.id]!==undefined&&state.graded[q.id]!==null) return;
      state.answers[q.id]=el.dataset.opt; save(); render(); renderGrid(); renderUnits(); };
  });
  const bi=document.getElementById('btnHide'); if(bi) bi.onclick=()=>{ delete state.graded[q.id]; save(); render(); renderGrid(); renderScore(); };
  document.getElementById('btnPrev').onclick=()=>go(-1);
  document.getElementById('btnNext').onclick=()=>go(1);
  const bc=document.getElementById('btnCheck'); if(bc) bc.onclick=()=>checkShort();
  const bs=document.getElementById('btnSubmit'); if(bs) bs.onclick=()=>gradeCurrent();
  const si=document.getElementById('shortInput');
  if(si){ si.oninput=()=>{ state.answers[q.id]=si.value; save(); renderGrid(); }; si.focus(); }
  updateProgress();
}
function norm(s){ return String(s||'').toLowerCase().replace(/[\s,·ㆍ\.\-()]/g,''); }
function checkShort(){
  const q=list[cur]; const el=document.getElementById('shortInput'); const v=el? el.value : (state.answers[q.id]||'');
  if(!v.trim()){ toast('답을 입력해 주세요'); return; }
  state.answers[q.id]=v;
  const target=q.answerText||'';
  const ok = (()=>{
    const parts=target.split('·').map(p=>p.replace(/빈칸\s*[ㄱ-ㅎ]\s*/g,'').trim()).filter(Boolean);
    const nv=norm(v);
    if(parts.length>1) return parts.every(p=>nv.includes(norm(p)));
    return nv===norm(parts[0]||target) || nv.includes(norm(parts[0]||target));
  })();
  state.graded[q.id]=ok; save(); render(); renderGrid(); renderScore(); renderUnits();
}
function gradeCurrent(){
  const q=list[cur];
  if(q.type==='mc'){
    if(!state.answers[q.id]){ toast('보기를 선택해 주세요'); return; }
    const picked=(q.choices||[]).find(c=>c.n===state.answers[q.id]);
    state.graded[q.id]= !!(picked&&picked.ans);
  } else checkShort();
  save(); render(); renderGrid(); renderScore(); renderUnits();
}
function go(d){
  const n=cur+d;
  if(n<0){ toast('첫 문제입니다'); return; }
  if(n>list.length-1){ toast('마지막 문제입니다'); return; }
  cur=n; state.idx=cur; save(); render(); renderGrid();
}
function renderGrid(){
  const g=document.getElementById('grid');
  document.getElementById('sideCount').textContent=`${list.length}문항`;
  g.innerHTML=list.map((q,i)=>{
    let cls='gbtn';
    if(i===cur) cls+=' cur';
    const gd=state.graded[q.id];
    if(gd===true) cls+=' ok'; else if(gd===false) cls+=' no';
    else if(state.answers[q.id]!==undefined && state.answers[q.id]!=='') cls+=' pick';
    return `<button class="${cls}" data-i="${i}">${i+1}</button>`;
  }).join('');
  g.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ cur=+b.dataset.i; state.idx=cur; save(); render(); renderGrid(); } });
}
function updateProgress(){
  const done=list.filter(q=>state.answers[q.id]!==undefined&&state.answers[q.id]!=='').length;
  document.getElementById('progtxt').textContent=`${done} / ${list.length} 풀이`;
  document.getElementById('progfill').style.width=(list.length? done/list.length*100:0)+'%';
}
document.getElementById('btnGrade').onclick=()=>{
  let done=0, right=0;
  list.forEach(q=>{
    if(state.graded[q.id]!==undefined&&state.graded[q.id]!==null){ done++; if(state.graded[q.id]) right++; }
  });
  if(!done){ toast('아직 확인한 문항이 없습니다. 보기를 고르고 정답 확인을 눌러 주세요.'); return; }
  toast(`이 단원 확인 ${done}문항 중 ${right}문항 정답 (${Math.round(right/done*100)}%)`);
  renderScore();
};
document.getElementById('btnReset').onclick=()=>{
  if(!confirm('이 단원의 선택·채점 기록을 지우고 처음부터 시작할까요?')) return;
  list.forEach(q=>{ delete state.answers[q.id]; delete state.graded[q.id]; });
  cur=0; state.idx=0; save(); render(); renderGrid(); renderScore(); renderUnits();
  toast('기록을 지웠습니다');
};
function onKey(e){
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
    if(e.key==='Enter' && document.activeElement.id==='shortInput'){ e.preventDefault(); gradeCurrent(); }
    return;
  }
  if(/^[1-5]$/.test(e.key)){ const q=list[cur]; if(q.type==='mc'&&(q.choices||[])[+e.key-1]){
      if(state.graded[q.id]!==undefined&&state.graded[q.id]!==null) return;
      state.answers[q.id]=q.choices[+e.key-1].n; save(); render(); renderGrid(); renderUnits(); } }
  else if(e.key==='ArrowLeft'){ go(-1); }
  else if(e.key==='ArrowRight'){ go(1); }
  else if(e.key==='Enter'){ const q=list[cur]; if(state.graded[q.id]===undefined||state.graded[q.id]===null) gradeCurrent(); else go(1); }
}
document.addEventListener('keydown', onKey);
buildSelectors(); rebuild();
</script>
</body>
</html>
