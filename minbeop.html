 매수인이 그 소유권을 취득할 수 없는 경우, 저당권 설정 사실에 관하여 악의의 매수인은 그 입은 손해의 배상을 청구할 수 없다."},{"mk":"ㄷ","tx":"매매의 목적이 된 권리가 타인에게 속하여 매도인이 그 권리를 취득한 후 매수인에게 이전할 수 없는 때에는 매수인이 계약 당시 그 권리가 매도인에게 속하지 아니함을 알았더라도 손해배상을 청구할 수 있다."}],"letters":true,"combo":true,"choices":[{"n":"①","text":"ㄱ","ans":true,"mark":"O","note":"①에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","rnd":[26],"art":""},{"n":"②","text":"ㄴ","ans":false,"mark":"X","note":"②에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","rnd":[26],"art":""},{"n":"③","text":"ㄷ","ans":false,"mark":"X","note":"③에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","rnd":[26],"art":""},{"n":"④","text":"ㄱ, ㄴ","ans":false,"mark":"X","note":"④에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","rnd":[26],"art":""},{"n":"⑤","text":"ㄴ, ㄷ","ans":false,"mark":"X","note":"⑤에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","rnd":[26],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"정답은 ①이다. ①에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"①에는 옳지 않은 보기(ㄴ·ㄷ)가 들어 있거나 옳은 보기(없음)가 빠져 있어 정답이 아니다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"상","roundLabel":"제26회 37번","noAns":false,"stemBr":false},{"id":"r26-038","round":26,"num":38,"part":"PART 5 채권법","unit":"CHAPTER 03 계약법 각론(매매)","sub":"","type":"mc","stem":"도급계약에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"목적물의 인도를 요하지 않는 경우, 보수(報酬)는 수급인이 일을 완성한 후 지체없이 지급하여야 한다.","ans":false,"mark":"O","note":"","rnd":[26],"art":""},{"n":"②","text":"하자보수에 관한 담보책임이 없음을 약정한 경우에는 수급인이 하자에 관하여 알고서 고지하지 아니한 사실에 대하여 담보책임이 없다.","ans":true,"mark":"X","note":"수급인은 담보책임이 없음을 약정한 경우에도 알고 고지하지 아니한 사실에 대하여는 그 책임을 면하지 못한다(민법 제672조). 따라서 담보책임이 없다는 지문은 틀렸다.","rnd":[26],"art":"제672조"},{"n":"③","text":"수급인이 일을 완성하기 전에는 도급인은 손해를 배상하고 계약을 해제할 수 있다.","ans":false,"mark":"O","note":"","rnd":[26],"art":""},{"n":"④","text":"완성된 목적물의 하자가 중요하지 않은 경우, 그 보수(補修)에 과다한 비용을 요할 때에는 하자의 보수(補修)를 청구할 수 없다.","ans":false,"mark":"O","note":"","rnd":[26],"art":""},{"n":"⑤","text":"부동산공사의 수급인은 보수(報酬)에 관한 채권을 담보하기 위하여 그 부동산을 목적으로 한 저당권설정청구권을 갖는다.","ans":false,"mark":"O","note":"","rnd":[26],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"정답은 ②이다. 수급인은 담보책임이 없음을 약정한 경우에도 알고 고지하지 아니한 사실에 대하여는 그 책임을 면하지 못한다(민법 제672조).","paras":[],"cites":["민법 제672조"],"citeLabel":"관련 조문","citeFirst":false,"key":"수급인은 담보책임이 없음을 약정한 경우에도 알고 고지하지 아니한 사실에 대하여는 그 책임을 면하지 못한다(민법 제672조).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 38번","noAns":false,"stemBr":false},{"id":"r22-039","round":22,"num":39,"part":"PART 5 채권법","unit":"CHAPTER 03 계약법 각론(매매)","sub":"","type":"mc","stem":"매도인의 담보책임에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"특정물매매의 경우 목적물에 하자가 있더라도 악의의 매수인은 계약을 해제할 수 없다.","ans":false,"mark":"O","note":"하자담보책임은 매수인이 하자를 알았거나 과실로 알지 못한 때에는 인정되지 않으므로(제580조 제1항 단서) 악의의 매수인은 해제할 수 없다.","rnd":[22,25,28],"art":"제580조"},{"n":"②","text":"변제기에 도달한 채권의 매도인이 채무자의 자력을 담보한 때에는 매매계약 당시의 자력을 담보한 것으로 추정한다.","ans":false,"mark":"O","note":"채권의 매도인이 채무자의 자력을 담보한 때에는 매매계약 당시의 자력을 담보한 것으로 추정한다(제579조 제1항). 변제기의 자력으로 추정하는 것은 변제기에 도달하지 않은 채권이다(제579조 제2항).","rnd":[21,22],"art":"제579조"},{"n":"③","text":"무효인 강제경매절차를 통하여 하자있는 권리를 경락받은 자는 경매의 채무자나 채권자에게 담보책임을 물을 수 없다.","ans":false,"mark":"O","note":"판례에 따르면 경매 절차 자체가 무효이면 경락인은 권리를 취득하지 못하므로 경매의 담보책임(제578조)은 문제되지 않고, 채무자나 채권자에게 담보책임을 물을 수 없다.","rnd":[22],"art":"제578조"},{"n":"④","text":"매매계약 내용의 중요 부분에 착오가 있는 경우, 매수인은 매도인의 하자담보책임이 성립하는지와 상관없이 착오를 이유로 그 매매계약을 취소할 수 있다.","ans":false,"mark":"O","note":"판례에 따르면 착오를 이유로 한 취소와 매도인의 하자담보책임은 요건과 효과가 달라, 하자담보책임이 성립하는지와 관계없이 매수인은 착오를 이유로 매매계약을 취소할 수 있다.","rnd":[22],"art":""},{"n":"⑤","text":"종류매매의 경우 인도된 목적물에 하자가 있는 때에는 선의의 매수인은 하자없는 물건을 청구하는 동시에 손해배상을 청구할 수 있다.","ans":true,"mark":"X","note":"종류매매에서 매수인은 계약 해제나 손해배상을 청구하지 않고 하자 없는 물건을 청구할 수 있다(제581조 제2항). 완전물 청구와 손해배상을 동시에 하는 것이 아니다.","rnd":[22],"art":"제581조"}],"short":false,"ansText":"⑤","blanks":[],"core":"종류매매에서 특정된 목적물에 하자가 있으면 매수인은 계약 해제나 손해배상을 청구하지 않고 하자 없는 물건을 청구할 수 있다(제581조 제2항). 하자 없는 물건의 청구는 해제·손해배상에 갈음하는 선택지이지 손해배상과 함께 하는 것이 아니므로 ⑤가 옳지 않다. 악의 매수인의 해제 제한(제580조 제1항 단서)·채권 매도인의 자력 담보 추정(제579조 제1항)은 조문 그대로이고, 무효인 경매에서는 담보책임이 생기지 않으며 착오 취소는 하자담보책임과 별개로 할 수 있다는 것이 판례다.","paras":[],"cites":["민법 제581조","민법 제580조","민법 제579조","민법 제578조","민법 제109조"],"citeLabel":"관련 조문","citeFirst":false,"key":"종류매매 하자 → 해제·손배 '대신' 완전물 청구 · 악의 매수인 = 하자담보 × · 무효 경매 = 담보책임 × · 착오 취소는 따로 가능","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제22회 39번","noAns":false,"stemBr":false},{"id":"r27-036","round":27,"num":36,"part":"PART 5 채권법","unit":"CHAPTER 04 임대차","sub":"","type":"mc","stem":"임대인의 동의가 있는 전대차에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"전차인은 전대차계약으로 전대인에 대하여 부담하는 의무 이상으로 임대인에게 의무를 지지 않고 동시에 임대차계약으로 임차인이 임대인에 대하여 부담하는 의무 이상으로 임대인에게 의무를 지지 않는다.","ans":false,"mark":"O","note":"","rnd":[27],"art":""},{"n":"②","text":"전차인은 전대차의 차임지급시기 이후 전대인에게 차임을 지급한 것으로 임대인에게 대항할 수 있다.","ans":false,"mark":"O","note":"","rnd":[27],"art":""},{"n":"③","text":"전차인이 전대차의 차임지급시기 이전에 전대인에게 차임을 지급한 경우, 임대인의 차임청구 전에 그 차임지급시기가 도래한 때에는 임대인에게 대항할 수 있다.","ans":false,"mark":"O","note":"","rnd":[27],"art":""},{"n":"④","text":"건물전차인은 임대차 및 전대차의 기간이 동시에 만료되고 건물이 현존하는 경우, 특별한 사정이 없는 한 임대인에 대하여 이전 전대차와 동일한 조건으로 임대할 것을 청구할 수 있다.","ans":true,"mark":"X","note":"전차인의 임대청구권(민법 제644조) 은 건물 기타 공작물의 소유 등을 목적으로 한 '토지'임대차의 전차인에게 인정되는 것이다. 건물전차인에게는 이러한 임대청구권이 인정되지 않으므로 지문은 틀렸다.","rnd":[27],"art":"제644조"},{"n":"⑤","text":"임대차계약이 해지의 통고로 인하여 종료된 경우, 임대인은 전차인에 대하여 그 사유를 통지하지 아니하면 해지로써 전차인에게 대항하지 못한다.","ans":false,"mark":"O","note":"","rnd":[27],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"정답은 ④이다. 전차인의 임대청구권(민법 제644조) 은 건물 기타 공작물의 소유 등을 목적으로 한 '토지'임대차의 전차인에게 인정되는 것이다.","paras":[],"cites":["민법 제644조"],"citeLabel":"관련 조문","citeFirst":false,"key":"전차인의 임대청구권(민법 제644조) 은 건물 기타 공작물의 소유 등을 목적으로 한 '토지'임대차의 전차인에게 인정되는 것이다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제27회 36번","noAns":false,"stemBr":false},{"id":"r22-037","round":22,"num":37,"part":"PART 5 채권법","unit":"CHAPTER 04 임대차","sub":"","type":"mc","stem":"乙은 사과나무를 식재하여 과수원을 운영할 목적으로 甲소유의 X임야에 대해 甲과 존속기간을 10년으로 하는 임대차계약을 체결하였다. 이에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"차임지급시기에 대한 관습 또는 다른 약정이 없으면 乙은 甲에게 매월말에 차임을 지급하여야 한다.","ans":false,"mark":"X","note":"차임은 동산·건물·대지는 매월 말, 그 밖의 토지는 매년 말에 지급한다(제633조). 임야는 대지가 아닌 토지이므로 매월 말이 아니다.","rnd":[22],"art":"제633조"},{"n":"②","text":"산사태로 X임야가 일부 유실되어 복구가 필요한 경우, 乙은 甲에게 그 복구를 청구할 수 없다.","ans":false,"mark":"X","note":"임대인은 계약 존속 중 목적물의 사용·수익에 필요한 상태를 유지할 의무가 있으므로(제623조), 乙은 甲에게 복구를 청구할 수 있다.","rnd":[21,22],"art":"제623조"},{"n":"③","text":"甲이 X임야에 산사태 예방을 위해 필요한 옹벽설치공사를 하려는 경우, 乙은 과수원 운영을 이유로 이를 거부할 수 없다.","ans":true,"mark":"O","note":"임대인이 임대물의 보존에 필요한 행위를 하는 때에는 임차인은 이를 거절하지 못한다(제624조).","rnd":[22],"art":"제624조"},{"n":"④","text":"乙이 X임야에 대하여 유익비를 지출하여 그 가액이 증가된 경우, 甲에게 임대차종료 전에도 그 상환을 청구할 수 있다.","ans":false,"mark":"X","note":"유익비는 임대인이 임대차 종료 시에 가액 증가가 현존한 때에 한하여 상환한다(제626조 제2항). 종료 전에는 청구할 수 없다.","rnd":[21,22],"art":"제626조"},{"n":"⑤","text":"임대차가 존속기간의 만료로 종료되는 경우, 乙이 식재한 사과나무들이 존재하는 때에도 乙은 甲에게 갱신을 청구할 수 없다.","ans":false,"mark":"X","note":"식목을 목적으로 한 토지임대차의 기간이 만료한 경우 수목이 현존하면 제283조가 준용되어 임차인은 갱신을 청구할 수 있다(제643조).","rnd":[20,21,22,24,29],"art":"제283조"}],"short":false,"ansText":"③","blanks":[],"core":"임대인이 임대물의 보존에 필요한 행위를 하는 때에는 임차인은 이를 거절하지 못하므로(제624조) 산사태 예방 옹벽공사를 乙이 거부할 수 없다는 ③이 옳다. 대지가 아닌 토지의 차임은 매년 말에 지급하고(제633조), 임대인은 사용·수익에 필요한 상태를 유지할 의무가 있어 복구를 청구할 수 있으며(제623조), 유익비는 임대차 종료 시에 상환을 청구하고(제626조 제2항), 식목 목적 토지임대차가 기간 만료로 끝나면서 수목이 현존하면 갱신을 청구할 수 있다(제643조).","paras":[],"cites":["민법 제624조","민법 제633조","민법 제623조","민법 제626조","민법 제643조"],"citeLabel":"관련 조문","citeFirst":false,"key":"보존행위 = 임차인 거절 × · 차임: 건물·대지 매월 말 / 기타 토지 매년 말 · 유익비 = 종료 시 · 식목 토지임대차 = 갱신청구 ○","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 37번","noAns":false,"stemBr":false},{"id":"r25-037","round":25,"num":37,"part":"PART 5 채권법","unit":"CHAPTER 04 임대차","sub":"","type":"mc","stem":"乙은 건물 소유의 목적으로 甲 소유 X토지를 10년간 월차임 2백만 원에 임차한 후, X토지에 Y건물을 신축하여 자신의 명의로 보존등기를 마쳤다. 이에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"甲은 다른 약정이 없는 한 임대기간 중 X토지를 사용, 수익에 필요한 상태로 유지할 의무를 부담한다.","ans":false,"mark":"O","note":"","rnd":[25],"art":""},{"n":"②","text":"X토지에 대한 임차권등기를 하지 않았다면 특별한 사정이 없는 한 乙은 X토지에 대한 임차권으로 제3자에게 대항하지 못한다.","ans":true,"mark":"X","note":"건물의 소유를 목적으로 한 토지임대차는 이를 등기하지 않은 경우에도 임차인이 그 지상건물을 등기한 때에는 제3자에 대하여 임대차의 효력이 생긴다(민법 제622조 제1항). 乙은 Y건물의 보존등기를 마쳤으므로 임차권등기 없이도 제3자에게 대항할 수 있다. 따라서 지문은 틀렸다.","rnd":[25],"art":"제622조"},{"n":"③","text":"甲이 X토지의 보존을 위한 행위를 하는 경우, 乙은 특별한 사정이 없는 한 이를 거절하지 못한다.","ans":false,"mark":"O","note":"","rnd":[25],"art":""},{"n":"④","text":"乙이 6백만 원의 차임을 연체하고 있는 경우에 甲은 임대차계약을 해지할 수 있다.","ans":false,"mark":"O","note":"","rnd":[25],"art":""},{"n":"⑤","text":"甲이 변제기를 경과한 최후 2년의 차임채권에 의하여 Y건물을 압류한 때에는 저당권과 동일한 효력이 있다.","ans":false,"mark":"O","note":"","rnd":[25],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"정답은 ②이다. 건물의 소유를 목적으로 한 토지임대차는 이를 등기하지 않은 경우에도 임차인이 그 지상건물을 등기한 때에는 제3자에 대하여 임대차의 효력이 생긴다(민법 제622조 제1항).","paras":[],"cites":["민법 제622조"],"citeLabel":"관련 조문","citeFirst":false,"key":"건물의 소유를 목적으로 한 토지임대차는 이를 등기하지 않은 경우에도 임차인이 그 지상건물을 등기한 때에는 제3자에 대하여 임대차의 효력이 생긴다(민법 제622조 제1항).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 37번","noAns":false,"stemBr":false},{"id":"r28-037","round":28,"num":37,"part":"PART 5 채권법","unit":"CHAPTER 04 임대차","sub":"","type":"mc","stem":"민법상 건물의 소유를 목적으로 한 토지임차인이 토지소유자인 임대인에게 행사할 수 있는 권리가 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choic function norm(s){
  return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '').replace(/[,，·]/g, '').replace(/[()]/g, '');

function gradeShort(){
  const q = list[cur];
  if (!q || !q.short) return;
  const vals = [].slice.call(document.querySelectorAll('.sinput')).map(i => i.value.trim());
  if (!vals.length || vals.every(x => !x)) { toast('답을 입력해 주세요'); return; }
  const blanks = q.blanks || [];
  state.answers[q.id] = vals;
  let ok = vals.length === blanks.length && vals.every((v, i) => {
    const a = norm(v), b = norm(blanks[i]);
    return a && (a === b || (a.length >= 2 && b.indexOf(a) >= 0));
  });
  state.graded[q.id] = ok;
  if (!ok) { mistakes[q.id] = (mistakes[q.id] || 0) + 1; writeJSON(LSM, mistakes); }
  save(); markDaily(q.id, ok);
  render(); renderGrid(); renderScore(); buildSelectors();
}

  const n = cur + d;

  cur = n; state.idx = n; save(); render();

}

function renderScore(){

      }
      var mi = readJSON(LSM, {}) || {};
      keys(mi).forEach(function(k){ var v = mi[k] | 0; if (v > (mistakes[k] || 0)) { mistakes[k] = v; changed = true; } });
      var mk = readJSON(LSK, {}) || {};
      keys(mk).forEach(function(k){ if (!meta.wm[k] && mk[k] && !marks[k]) { marks[k] = 1; changed = true; } });
      var hl = readJSON(LSH, {}) || {};
      keys(hl).forEach(function(q){ keys(hl[q] || {}).forEach(function(key){
        if (meta.wh[q] && meta.wh[q][key]) return;
        if (!HLS[q] || !HLS[q][key]) { HLS[q] = HLS[q] || {}; HLS[q][key] = hl[q][key]; changed = true; }
      }); });
      var dl = loadDaily();
      if (dl && dl.day === daily.day) keys(dl.ids).forEach(function(k){
        var v = Math.max(daily.ids[k] || 0, dl.ids[k] || 0);
        if (daily.ids[k] !== v) { daily.ids[k] = v; changed = true; }
      });
    } catch(e){}
    return changed;
  }

  /* ── 업로드·내려받기 ─────────────────────────────────────────────── */
  function b64(buf){
    var bytes = new Uint8Array(buf), out = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  function unb64(str){
    var s = atob(str), arr = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
    return arr;
  }
  /* 기록이 커도 64KB 제한에 걸리지 않도록 gzip으로 접어서 보관한다 */
  function pack(doc){
    var text = JSON.stringify(doc);
    if (text.length < 8000 || typeof CompressionStream === 'undefined') {
      return Promise.resolve(JSON.stringify({v:1, raw: doc}));      // 작으면 그대로(사람이 읽을 수 있게)
    }
    try {
      var stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Response(stream).arrayBuffer().then(function(buf){
        return JSON.stringify({v:1, z:1, d:b64(buf)});
      }).catch(function(){ return JSON.stringify({v:1, raw: doc}); });
    } catch(e) { return Promise.resolve(JSON.stringify({v:1, raw: doc})); }
  }
  function normDoc(d){
    if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
    if (!d.ans && !d.hl && !d.mk && !d.mis && !d.day) return null;
    d.ans = (d.ans && typeof d.ans === 'object') ? d.ans : {};
    d.hl  = (d.hl  && typeof d.hl  === 'object') ? d.hl  : {};
    d.mk  = (d.mk  && typeof d.mk  === 'object') ? d.mk  : {};
    d.mis = (d.mis && typeof d.mis === 'object') ? d.mis : {};
    d.day = (d.day && typeof d.day === 'object') ? d.day : {};
    return d;
  }
  function unpack(obj){
    if (!obj) return Promise.resolve(null);
    if (obj.z && obj.d) {
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('no DecompressionStream'));
      try {
        var stream = new Blob([unb64(obj.d)]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text().then(function(t){ return normDoc(JSON.parse(t)); });
      } catch(e) { return Promise.reject(e); }
    }
    var raw = obj.raw;
    if (typeof raw === 'string') {                     // 예전 형식(문자열로 한 번 더 감싼 경우)
      try { raw = JSON.parse(raw); } catch(e) { raw = null; }
    }
    if (raw === undefined || raw === null) raw = obj;
    var d = normDoc(raw);
    return (d || !obj.ans) ? Promise.resolve(d) : Promise.resolve(normDoc(obj));
  }

  function trim(doc){
    var body = JSON.stringify(doc);
    if (body.length <= 60000) return body;
    var pairs = [];
    keys(doc.hl).forEach(function(q){ keys(doc.hl[q]).forEach(function(k){ pairs.push([q, k, doc.hl[q][k].t || 0]); }); });
    pairs.sort(function(a, b){ return a[2] - b[2]; });          // 오래된 형광펜부터 버림
    for (var i = 0; i < pairs.length && body.length > 60000; i++) {
      delete doc.hl[pairs[i][0]][pairs[i][1]];
      if (!keys(doc.hl[pairs[i][0]]).length) delete doc.hl[pairs[i][0]];
      body = JSON.stringify(doc);
    }
    return body;
  }

  function getCloud(tries){
    return fetch(URL_, {cache:'no-store'}).then(function(r){
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('GET ' + r.status);
      return r.json();
    }).then(function(raw){
      return unpack(raw).then(function(doc){
        if (raw && !doc) throw new Error('unreadable cloud doc');   // 해석 실패 시 덮어쓰지 않음
        return doc;
      });
    }).catch(function(err){
      if (tries > 1) {
        setChip('err', '오프라인', '연결을 다시 시도하는 중입니다.');
        return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return getCloud(tries - 1); });
      }
      throw err;
    });
  }

  function performSync(reason){
    if (busy) { again = true; return; }
    busy = true;
    setChip('', '확인 중', '기록을 확인하는 중입니다.');
    if (absorbExternalEdits()) dirty = true;
    getCloud(2)
      .then(function(cloud){
        meta.pull = Date.now();
        var local = buildDoc();
        var cloudHas = !!(cloud && !isEmptyDoc(cloud));
        var merged = cloudHas ? mergeDocs(local, cloud) : local;
        applyDoc(merged);
        saveMeta();
        if (isEmptyDoc(merged)) { setChip('ok', '동기화됨', '아직 올릴 기록이 없습니다.'); return null; }
        if (!cloudHas) return pushDoc(merged);                       // 첫 올리기(빈 저장소 채우기)
        var localNew = !jEq(merged.ans, cloud.ans) || !jEq(merged.mis, cloud.mis) ||
                       !jEq(merged.mk, cloud.mk) || !jEq(merged.hl, cloud.hl) || !jEq(merged.day, cloud.day);
        var beat = (Date.now() - (meta.push || 0)) > HEARTBEAT;      // 저장소 유지용 되살리기
        if (localNew || beat || reason === 'user') return pushDoc(merged);
        setChip('ok', '동기화됨', '마지막 확인 ' + timeLabel());
        return null;
      })
      .catch(function(err){
        try { console.warn('[sync] ' + (err && err.message || err)); } catch(e){}
        setChip('err', '오프라인', '연결되면 다시 올립니다. 기록은 이 기기에 안전하게 저장되어 있습니다.');
        dirty = true;
      })
      .then(function(){ busy = false; if (again) { again = false; setTimeout(function(){ performSync('queued'); }, 400); } });
  }

  function postDoc(body, tries, keepalive){
    var opt = {method:'POST', headers:{'Content-Type':'application/json'}, body: body};
    if (keepalive) opt.keepalive = true;
    return fetch(URL_, opt).then(function(r){
      if (!r.ok) throw new Error('POST ' + r.status);
    }).catch(function(err){
      if (tries > 1) return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return postDoc(body, tries - 1, keepalive); });
      throw err;
    });
  }

  function pushDoc(doc){
    setChip('wait', '저장중', '기록을 올리는 중입니다.');
    return pack(doc).then(function(body){
      return postDoc(body, 2, false);
    }).then(function(){
      meta.push = Date.now(); dirty = false; saveMeta();
      setChip('ok', '동기화됨', '마지막 저장 ' + timeLabel());
    });
  }

  function flush(){
    if (!dirty || suppress) return;
    if (Date.now() - (meta.pull || 0) > 120000) return;   // 오래 안 본 상태로 덮어쓰지 않음
    try {
      var doc = buildDoc();
      if (isEmptyDoc(doc)) return;
      pack(doc).then(function(body){ return postDoc(body, 1, true); }).catch(function(){});
      meta.push = Date.now(); dirty = false; saveMeta();
    } catch(e){}
  }

  function timeLabel(){
    var d = new Date();
    var p = function(n){ return String(n).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function scheduleSync(){
    if (suppress) return;
    setChip('wait', '저장중', '곧 올립니다.');
    clearTimeout(timer);
    timer = setTimeout(function(){ performSync('debounce'); }, DEBOUNCE);
  }

  /* ── 로컬 저장을 감시해 바뀐 문항에 시각을 찍는다 ─────────────────── */
  writeJSON = function(k, v){
    origWriteJSON(k, v);
    if (suppress) return;
    var now = Date.now(), touched = false;
    try {
      if (k === LS) {
        var a = (v && v.answers) || {}, g = (v && v.graded) || {};
        var ids = {};
        keys(a).forEach(function(x){ ids[x] = 1; }); keys(g).forEach(function(x){ ids[x] = 1; });
        keys(snapAns).forEach(function(x){ ids[x] = 1; }); keys(snapGraded).forEach(function(x){ ids[x] = 1; });
        keys(ids).forEach(function(x){
          var inA = Object.prototype.hasOwnProperty.call(a, x), inG = Object.prototype.hasOwnProperty.call(g, x);
          var hadA = Object.prototype.hasOwnProperty.call(snapAns, x), hadG = Object.prototype.hasOwnProperty.call(snapGraded, x);
          if (inA !== hadA || inG !== hadG || !jEq(a[x], snapAns[x]) || !jEq(g[x], snapGraded[x])) {
            meta.w[x] = now; touched = true;
          }
        });
        snapAns = jclone(a) || {}; snapGraded = jclone(g) || {};
      } else if (k === LSK) {
        var ids2 = {};
        keys(v).forEach(function(x){ ids2[x] = 1; }); keys(snapMarks).forEach(function(x){ ids2[x] = 1; });
        keys(ids2).forEach(function(x){
          if (!!v[x] !== !!snapMarks[x]) { meta.wm[x] = now; touched = true; }
        });
        snapMarks = jclone(v) || {};
      } else if (k === LSH) {
        var qs = {};
        keys(v).forEach(function(x){ qs[x] = 1; }); keys(snapHL).forEach(function(x){ qs[x] = 1; });
        keys(qs).forEach(function(q){
          var cur = v[q] || {}, old = snapHL[q] || {};
          var ks = {};
          keys(cur).forEach(function(x){ ks[x] = 1; }); keys(old).forEach(function(x){ ks[x] = 1; });
          keys(ks).forEach(function(key){
            if (!jEq(cur[key], old[key])) {
              meta.wh[q] = meta.wh[q] || {};
              meta.wh[q][key] = now; touched = true;
            }
          });
        });
        snapHL = jclone(v) || {};
      }
    } catch(e){}
    if (touched) { saveMeta(); dirty = true; scheduleSync(); }
  };

  saveDaily = function(){
    origSaveDaily();
    if (suppress) return;
    dirty = true; scheduleSync();
  };

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) flush(); else performSync('visible');
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  window.addEventListener('online', function(){ performSync('online'); });
  setInterval(function(){
    if (document.hidden) return;
    if (Date.now() - (meta.pull || 0) > PULL_EVERY) performSync('interval');
  }, 30000);

  if (chip) {
    chip.addEventListener('click', function(){
      if (busy) return;
      toast('기록을 확인합니다…', 900);
      performSync('user');
    });
  }

  window.__syncDebug = {build: buildDoc, merge: mergeDocs, apply: applyDoc, url: URL_, meta: function(){ return meta; }};

  setChip('', '확인 중', '기록을 확인하는 중입니다.');
  performSync('load');
})();
</script>
</body>
</html>
