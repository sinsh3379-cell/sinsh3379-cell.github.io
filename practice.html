":""},{"n":"⑤","text":"사업주가 해야 하는 직장 내 성희롱 예방을 위한 교육에는 직장 내 성희롱에 관한 법령이 포함되어야 한다.","ans":false,"mark":"O","note":"교육에는 관련 법령 내용이 포함되어야 한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"직장 내 성희롱 발생 사실을 조사한 사람은 해당 조사와 관련된 내용을 사업주에게 보고해야 한다. '보고해서는 아니 된다'고 한 ④가 틀렸다.","paras":[],"cites":["남녀고용평등법 제13조(성희롱 예방교육)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"조사자는 '보고 의무'가 있다 — 금지로 뒤집은 지문.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 28번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-29","round":24,"num":29,"part":"관리·법령","unit":"인사·노무관리","sub":"근로계약·해고·부당해고 구제","type":"mc","stem":"근로기준법상 해고에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사용자는 근로자를 해고하려면 적어도 20일 전에 예고를 하여야 한다.","ans":false,"mark":"X","note":"해고예고는 20일이 아니라 30일 전이다.","rnd":[],"art":""},{"n":"②","text":"근로자에 대한 해고는 해고사유와 해고시기를 밝히면 서면이 아닌 유선으로 통지하여도 효력이 있다.","ans":false,"mark":"X","note":"해고 통지는 반드시 서면으로 해야 한다.","rnd":[],"art":""},{"n":"③","text":"노동위원회는 부당해고 구제신청에 대한 심문을 할 때에 직권으로 증인을 출석하게 하여 필요한 사항을 질문할 수는 없다.","ans":false,"mark":"X","note":"노동위원회는 직권으로 증인을 출석시켜 질문할 수 있다.","rnd":[],"art":""},{"n":"④","text":"지방노동위원회의 해고에 대한 구제명령은 행정소송 제기가 있으면 그 효력이 정지된다.","ans":false,"mark":"X","note":"구제명령의 효력은 행정소송 제기로 정지되지 않는다.","rnd":[],"art":""},{"n":"⑤","text":"노동위원회는 이행강제금을 부과하기 30일 전까지 이행강제금을 부과ㆍ징수한다는 뜻을 사용자에게 미리 문서로써 알려 주어야 한다.","ans":true,"mark":"O","note":"이행강제금 부과 30일 전까지 문서로 예고한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"노동위원회는 이행강제금을 부과하기 30일 전까지 그 뜻을 사용자에게 문서로 알려야 한다. 해고예고는 30일 전이고, 해고 통지는 서면이어야 하며, 증인 출석·질문은 직권으로 할 수 있고, 구제명령은 행정소송 제기로 효력이 정지되지 않는다.","paras":[],"cites":["근로기준법 제26조·제27조·제33조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"해고예고 30일 · 이행강제금 사전통지 30일 — 숫자가 겹친다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-30","round":24,"num":30,"part":"관리·법령","unit":"하자관리와 분쟁조정","sub":"하자보수보증금(예치·사용·반환)","type":"mc","stem":"공동주택관리법령상 하자보수보증금에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"지방공사인 사업주체는 대통령령으로 정하는 바에 따라 하자보수를 보장하기 위하여 하자보수보증금을 담보책임기간 동안 예치하여야 한다.","ans":true,"mark":"X","note":"예치 의무는 지방공사뿐 아니라 모든 사업주체에 적용된다.","rnd":[],"art":""},{"n":"②","text":"입주자대표회의등은 하자보수보증금을 하자심사ㆍ분쟁조정위원회의 하자 여부 판정 등에 따른 하자보수비용 등 대통령령으로 정하는 용도로만 사용하여야 한다.","ans":false,"mark":"O","note":"하자보수보증금은 법령이 정한 용도로만 사용한다.","rnd":[],"art":""},{"n":"③","text":"사업주체는 하자보수보증금을 「은행법」에 따른 은행에 현금으로 예치할 수 있다.","ans":false,"mark":"O","note":"은행법상 은행에 현금으로 예치할 수 있다.","rnd":[],"art":""},{"n":"④","text":"입주자대표회의는 하자보수보증서 발급기관으로부터 하자보수보증금을 지급받기 전에 미리 하자보수를 하는 사업자를 선정해서는 아니 된다.","ans":false,"mark":"O","note":"보증금을 지급받기 전에 미리 보수 사업자를 선정할 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"입주자대표회의는 하자보수보증금을 사용한 때에는 그 날부터 30일 이내에 그 사용명세를 사업주체에게 통보하여야 한다.","ans":false,"mark":"O","note":"사용한 날부터 30일 이내에 사용명세를 통보한다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"하자보수보증금 예치 의무는 지방공사에 한정되지 않고 모든 사업주체에게 적용된다. '지방공사인 사업주체'로 한정한 ①이 틀렸다. 사용 용도 제한, 은행 현금 예치, 보증금 지급 전 사업자 선정 금지, 사용명세 30일 내 통보는 옳다.","paras":[],"cites":["공동주택관리법 제45조·제46조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"예치 의무자는 '모든 사업주체'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-31","round":24,"num":31,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"관리규약과 관리규약준칙(제정·개정·신고)","type":"mc","stem":"공동주택관리법상 공동주택의 입주자등을 보호하고 주거생활의 질서를 유지하기 위하여 대통령령으로 정하는 바에 따라 공동주택의 관리 또는 사용에 관하여 준거가 되는 관리규약의 준칙을 정하여야 하는 주체로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"서울특별시장","ans":false,"mark":"O","note":"서울특별시장은 준칙을 정하는 주체다.","rnd":[],"art":""},{"n":"②","text":"부산광역시장","ans":false,"mark":"O","note":"부산광역시장도 주체다.","rnd":[],"art":""},{"n":"③","text":"세종특별자치시장","ans":false,"mark":"O","note":"세종특별자치시장도 주체다.","rnd":[],"art":""},{"n":"④","text":"충청남도지사","ans":false,"mark":"O","note":"도지사도 주체다.","rnd":[],"art":""},{"n":"⑤","text":"경상북도 경주시장","ans":true,"mark":"X","note":"경주시장은 준칙을 정하는 주체가 아니다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"관리규약준칙을 정하는 주체는 특별시장·광역시장·특별자치시장·도지사·특별자치도지사(시·도지사)다. 기초자치단체인 시장(경주시장)은 준칙을 정하는 주체가 아니다.","paras":[],"cites":["공동주택관리법 제18조(관리규약의 준칙)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"관리규약준칙은 '시·도지사'가 정한다(시·군·구 아님).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-32","round":24,"num":32,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"자치관리와 위탁관리(자치관리기구·주택관리업자 선정)","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 입주자등이 공동주택을 위탁관리할 것을 정한 경우 입주자대표회의가 주택관리업자를 선정하는 기준 및 방식에 관한 설명으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"ㄱ.","tx":"입주자등은 기존 주택관리업자의 관리 서비스가 만족스럽지 못한 경우에는 대통령령으로 정하는 바에 따라 새로운 주택관리업자 선정을 위한 입찰에서 기존 주택관리업자의 참가를 제한하도록 입주자대표회의에 요구할 수 있다."},{"mk":"ㄴ.","tx":"입주자대표회의는 입주자대표회의의 감사가 입찰과정 참관을 원하는 경우에는 참관할 수 있도록 하여야 한다."},{"mk":"ㄷ.","tx":"입주자등이 새로운 주택관리업자 선정을 위한 입찰에서 기존 주택관리업자의 참가를 제한하도록 입주자대표회의에 요구하려면 전체 입주자등 3분의 2 이상의 서면동의가 있어야 한다."}],"letters":false,"combo":false,"choices":[{"n":"①","text":"ㄱ","ans":false,"mark":"X","note":"ㄱ은 옳은 지문이다.","rnd":[],"art":""},{"n":"②","text":"ㄷ","ans":false,"mark":"X","note":"ㄷ만 따로 고르면 틀린다.","rnd":[],"art":""},{"n":"③","text":"ㄱ, ㄴ","ans":true,"mark":"O","note":"ㄱ, ㄴ이 옳다.","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄷ","ans":false,"mark":"X","note":"ㄷ이 틀렸으므로 함께 고를 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ","ans":false,"mark":"X","note":"ㄷ이 포함되어 틀렸다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"입주자등은 기존 주택관리업자의 서비스가 만족스럽지 못하면 대통령령으로 정하는 바에 따라 입찰 참가 제한을 요구할 수 있고, 입주자대표회의는 감사의 참관 요구를 받아들여야 한다. 다만 그 요구에 필요한 서면동의 요건은 전체 입주자등의 3분의 1 이상이므로 ㄷ은 틀렸다.","paras":[],"cites":["공동주택관리법 제7조제2항 · 같은 법 시행령 제10조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"입찰 참가 제한 요구는 '전체 입주자등 3분의 1 이상' 서면동의(2/3 아님).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 32번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-33","round":24,"num":33,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"입주자대표회의의 임원과 의결사항(회의 소집·운영교육)","type":"mc","stem":"공동주택관리법령상 입주자대표회의의 구성 및 운영에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"입주자대표회의는 4명 이상으로 구성하되, 동별 세대수에 비례하여 관리규약으로 정한 선거구에 따라 선출된 대표자로 구성한다.","ans":false,"mark":"O","note":"4명 이상, 관리규약으로 정한 선거구에서 선출된 대표자로 구성한다.","rnd":[],"art":""},{"n":"②","text":"사용자는 입주자인 동별 대표자 후보자가 있는 선거구라도 해당 공동주택단지 안에서 주민등록을 마친 후 계속하여 6개월 이상 거주하고 있으면 동별 대표자로 선출될 수 있다.","ans":true,"mark":"X","note":"입주자 후보자가 있는 선거구에서는 사용자가 대표자가 될 수 없다.","rnd":[],"art":""},{"n":"③","text":"사용자인 동별 대표자는 입주자인 동별 대표자 중에서 회장 후보자가 없는 경우로서 선출 전에 전체 입주자 과반수의 서면동의를 얻은 경우에는 회장이 될 수 있다.","ans":false,"mark":"O","note":"사용자 대표자는 입주자 후보자가 없고 입주자 과반수 서면동의를 받으면 회장이 될 수 있다.","rnd":[],"art":""},{"n":"④","text":"공동체 생활의 활성화 및 질서유지에 관한 사항은 입주자대표회의 구성원 과반수의 찬성으로 의결한다.","ans":false,"mark":"O","note":"공동체 활성화·질서유지는 구성원 과반수 찬성으로 의결한다.","rnd":[],"art":""},{"n":"⑤","text":"입주자대표회의는 주택관리업자가 공동주택을 관리하는 경우에는 주택관리업자의 직원인사ㆍ노무관리 등의 업무수행에 부당하게 간섭해서는 아니 된다.","ans":false,"mark":"O","note":"위탁관리 시 주택관리업자의 인사·노무에 부당하게 간섭할 수 없다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"사용자는 입주자인 동별 대표자 후보자가 있는 선거구에서는 대표자가 될 수 없다(입주자 후보자가 없는 경우에 한해 사용자가 선출될 수 있다). 따라서 ②가 틀렸다. 4명 이상 구성, 회장 취임 요건, 과반수 의결, 인사·노무 부당간섭 금지는 옳다.","paras":[],"cites":["공동주택관리법 시행령 제16조 · 제17조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"사용자는 '입주자 후보자가 없는 선거구'에서만 대표자가 될 수 있다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 33번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"24-34","round":24,"num":34,"part":"관리·법령","unit":"관리사무소장·주택관리사와 경비원","sub":"관리주체의 업무와 관리사무소장의 업무·배치(경비원 업무 포함)","type":"mc","stem":"공동주택관리법령상 공동주 람은 등록할 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"시장ㆍ군수ㆍ구청장은 주택임대관리업자가 거짓이나 그 밖의 부정한 방법으로 등록을 한 경우에는 그 등록을 말소하여야 한다.","ans":false,"mark":"O","note":"거짓·부정한 방법의 등록은 말소하여야 한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"자본금이 증가한 경우는 변경신고 사항이 아니므로 ③이 틀렸다. 자기관리형 등록 시 위탁관리형 등록 간주, 위탁관리형 자본금 1억원 이상, 집행유예 기간 중 결격, 부정 등록의 말소는 옳다.","paras":[],"cites":["민간임대주택에 관한 특별법 제14조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"증가 신고 없음 — 22-32와 동일 논점.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 32번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"25-33","round":25,"num":33,"part":"관리·법령","unit":"인사·노무관리","sub":"근로계약·해고·부당해고 구제","type":"mc","stem":"근로기준법상 구제명령과 이행강제금에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"노동위원회는 부당해고가 성립한다고 판정하면 정년의 도래로 근로자가 원직복직이 불가능한 경우에도 사용자에게 구제명령을 하여야 한다.","ans":false,"mark":"O","note":"원직복직이 불가능해도 구제명령을 하여야 한다.","rnd":[],"art":""},{"n":"②","text":"지방노동위원회의 구제명령에 불복하는 사용자는 구제명령서를 통지받은 날부터 10일 이내에 중앙노동위원회에 재심을 신청할 수 있다.","ans":false,"mark":"O","note":"구제명령서 통지일부터 10일 이내에 재심을 신청한다.","rnd":[],"art":""},{"n":"③","text":"노동위원회의 구제명령은 중앙노동위원회에 대한 재심 신청에 의하여 그 효력이 정지되지 아니한다.","ans":false,"mark":"O","note":"재심 신청으로 구제명령의 효력이 정지되지 않는다.","rnd":[],"art":""},{"n":"④","text":"노동위원회는 구제명령을 받은 자가 구제명령을 이행하면 구제명령을 이행하기 전에 이미 부과된 이행강제금을 징수할 수 없다.","ans":true,"mark":"X","note":"이미 부과된 이행강제금은 징수할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"근로자는 구제명령을 받은 사용자가 이행기한까지 구제명령을 이행하지 아니하면 이행기한이 지난 때부터 15일 이내에 그 사실을 노동위원회에 알려줄 수 있다.","ans":false,"mark":"O","note":"이행하지 않으면 15일 이내에 그 사실을 노동위원회에 알릴 수 있다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"구제명령을 이행하면 새로운 이행강제금을 부과하지 않지만, 이미 부과된 이행강제금은 징수할 수 있다. '징수할 수 없다'고 한 ④가 틀렸다. 정년 도래로 원직복직이 불가능한 경우에도 구제명령을 해야 하고, 재심 10일, 효력 부정지, 이행 여부 통보(15일)는 옳다.","paras":[],"cites":["근로기준법 제30조·제31조·제33조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"이행해도 기 부과된 이행강제금은 징수된다.","terms": ters":false,"combo":false,"choices":[{"n":"①","text":"승강기의 제조ㆍ수입업자 또는 관리주체는 설치검사를 받지 아니하거나 설치검사에 불합격한 승강기를 운행하게 하거나 운행하여서는 아니 된다.","ans":false,"mark":"O","note":"설치검사에 불합격한 승강기는 운행할 수 없다.","rnd":[],"art":""},{"n":"②","text":"새로운 유지관리기법의 도입 등 대통령령으로 정하는 사유에 해당하여 자체점검의 주기 조정이 필요한 승강기에 대해서는 자체점검의 전부 또는 일부를 면제할 수 있다.","ans":false,"mark":"O","note":"새로운 유지관리기법 도입 시 자체점검 일부를 면제할 수 있다.","rnd":[],"art":""},{"n":"③","text":"승강기 실무경력이 2년 이상이고, 법규에 따른 직무교육을 이수한 사람이 자체점검을 담당할 수 있다.","ans":true,"mark":"X","note":"담당자 요건은 실무경력 3년 이상이다.","rnd":[],"art":""},{"n":"④","text":"자체점검을 담당하는 사람은 자체점검을 마치면 지체 없이 자체점검 결과를 양호, 주의관찰 또는 긴급수리로 구분하여 관리주체에 통보해야 한다.","ans":false,"mark":"O","note":"결과를 양호·주의관찰·긴급수리로 구분해 통보한다.","rnd":[],"art":""},{"n":"⑤","text":"원격점검 및 실시간 고장 감시 등 행정안전부장관이 정하여 고시하는 원격관리기능이 있는 승강기를 관리하는 경우는 새로운 유지관리기법의 도입 등 대통령령으로 정하는 사유에 해당한다.","ans":false,"mark":"O","note":"원격관리기능이 있으면 자체점검 특례가 인정된다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"자체점검 담당자는 승강기 실무경력 3년 이상(2년 아님)이고 법정 직무교육을 이수한 사람이다. 설치검사 미필 승강기 운행 금지, 자체점검 주기 조정·면제, 점검 결과 구분 통보, 원격관리기능 승강기의 특례는 옳다.","paras":[],"cites":["승강기 안전관리법(자체점검)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"자체점검 담당자 — 실무경력 3년 + 직무교육.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 38번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"25-39","round":25,"num":39,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"부대시설 설치기준(전기시설·급배수·비상급수·주차장·영상정보처리기기)","type":"mc","stem":"주차장법 시행규칙상 주차장의 구조 및 설비의 기준에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"노외주차장 내부 공간의 일산화탄소 농도는 주차장을 이용하는 차량이 가장 빈번한 시각의 앞뒤 8시간의 평균치가 100피피엠 이하로 유지되어야 한다.","ans":true,"mark":"X","note":"CO 농도 기준은 100ppm이 아니라 50ppm 이하다.","rnd":[],"art":""},{"n":"②","text":"자주식주차장으로서 지하식 노외주차장에서 주차구획(벽면에서부터 50센티미터 이내를 제외한 바닥면)의 최소 조도는 10럭스 이상, 최대 조도는 최소 조도의 10배 이내이어야 한다.","ans":false,"mark":"O","note":"주차구획의 최소 조도 10럭스, 최대는 최소의 10배 이내다.","rnd":[],"art":""},{"n":"③","text":"자주식주차장으로서 지하식 노외주차장에서 사람이 출입하는 통로(벽면에서부터 50센티미터 이내를 제외한 바닥면)의 최소 조도는 50럭스 이상이어야 한다.","ans":false,"mark":"O","note":"사람이 출입하는 통로의 최소 조도는 50럭스 이상이다.","rnd":[],"art":""},{"n":"④","text":"주차대수 30대를 초과하는 규모의 자주식주차장으로서 지하식 노외주차장에는 관리사무소에서 주차장 내부 전체를 볼 수 있는 폐쇄회로 텔레비전(녹화장치를 포함한다) 또는 네트워크 카메라를 포함하는 방범설비를 설치ㆍ관리하여야 한다.","ans":false,"mark":"O","note":"30대 초과 지하식 노외주차장은 CCTV 등을 설치해야 한다.","rnd":[],"art":""},{"n":"⑤","text":"주차장 내부 전체를 볼 수 있는 방범설비를 설치ㆍ관리하여야 하는 주차장에서 촬영된 자료는 컴퓨터보안시스템을 설치하여 1개월 이상 보관하여야 한다.","ans":false,"mark":"O","note":"촬영자료는 1개월 이상 보관한다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"노외주차장 내부의 일산화탄소 농도는 차량 통행이 가장 빈번한 시각 전후 8시간 평균치가 100피피엠이 아니라 50피피엠 이하로 유지되어야 한다. 조도·CCTV·녹화자료 보관(1개월 이상)에 관한 설명은 옳다.","paras":[],"cites":["주차장법 시행규칙 제6조(주차장의 구조·설비 기준)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"CO 50ppm · 통로 조도 50럭스 · 녹화자료 1개월.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제25회 39번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"25-40","round":25,"num":40,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"환기설비와 배기설비(기계환기설비·환기구·부엌·욕실 배기·냉방설비 배기장치)","type":"mc","stem":"주택건설기준 등에 관한 규칙상 주택의 부엌ㆍ욕실 및 화장실에 설치하는 배기설비에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"배기구는 반자 또는 반자아래 80센티미터이내의 높이에 설치하고, 항상 개방될 수 있는 구조로 한다.","ans":false,"mark":"O","note":"배기구는 반자 또는 반자 아래 80cm 이내 높이에 설치한다.","rnd":[],"art":""},{"n":"②","text":"세대간 배기통을 서로 연결하고 직접 외기에 개방되도록 설치하여 연기나 냄새의 역류를 방지한다.","ans":true,"mark":"X","note":"세대 간 배기통을 연결해서는 안 된다(세대별 독립).","rnd":[],"art":""},{"n":"③","text":"배기구는 외기의 기류에 의하여 배기에 지장이 생기지 아니하는 구조로 한다.","ans":false,"mark":"O","note":"외기 기류로 배기에 지장이 생기지 않는 구조로 한다.","rnd":[],"art":""},{"n":"④","text":"배기통에는 그 최상부 및 배기구를 제외하고 개구부를 두지 아니한다.","ans":false,"mark":"O","note":"배기통에는 최상부와 배기구 외에 개구부를 두지 않는다.","rnd":[],"art":""},{"n":"⑤","text":"부엌에 설치하는 배기구에는 전동환기설비를 설치한다.","ans":false,"mark":"O","note":"부엌 배기구에는 전동환기설비를 설치한다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"세대 간 배기통을 서로 연결하면 냄새·연기가 다른 세대로 역류하므로, 배기통은 세대별로 독립 설치해 직접 외기에 개방해야 한다. 배기구 높이(반자 또는 반자 아래 80cm 이내), 기류 대책, 개구부 제한, 부엌 전동환기설비는 옳다.","paras":[],"cites":["주택건설기준 등에 관한 규칙(부엌·욕실 배기설비)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"배기통은 세대별 독립 — 연결 금지가 정답 축.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 40번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"25-41","round":25,"num":41,"part":"시설·설비","unit":"설비 기초와 배관","sub":"설비의 기본 사항(열·습공기·유체 마찰저항)","type":"mc","stem":"설비의 기본 사항에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"열용량은 어떤 물질을 1K 올리는데 필요한 열량이다.","ans":false,"mark":"O","note":"열용량은 1K 올리는 데 필요한 열량이다.","rnd":[],"art":""},{"n":"②","text":"단위 질량당 체적을 비체적이라 한다.","ans":false,"mark":"O","note":"단위 질량당 체적이 비체적이다.","rnd":[],"art":""},{"n":"③","text":"온도변화에 따라 유입 또는 유출되는 열은 현열이다.","ans":false,"mark":"O","note":"온도변화에 따른 열 출입은 현열이다.","rnd":[],"art":""},{"n":"④","text":"열관류율의 단위는 W/m²ㆍK이다.","ans":false,"mark":"O","note":"열관류율의 단위는 W/㎡·K이다.","rnd":[],"art":""},{"n":"⑤","text":"유체의 운동에너지는 배관내 어느 지점에서나 일정하다.","ans":true,"mark":"X","note":"운동에너지는 지점마다 달라질 수 있다(일정하지 않다).","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"유체의 운동에너지는 유속에 따라 달라지므로 배관 내 어느 지점에서나 일정하지 않다. 열용량, 비체적, 현열, 열관류율의 단위에 관한 설명은 옳다.","paras":[],"cites":["건축설비 기본사항(열·유체)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"베르누이 정리 — 압력·위치·속도에너지의 합이 일정.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 41번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"25-42","round":25,"num":42,"part":"시설·설비","unit":"배수·통기·위생설비","sub":"배수배관과 오수정화(청소구·발포존·조집기·BOD)","type":"mc","stem":"급수 및 배수 설비에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"터빈펌프는 임펠러의 외주에 안내날개(guide vane)가 달려 있지 않다.","ans":true,"mark":"X","note":"터빈펌프는 안내 의","body":"<b>2026.6.2. 시행</b> 「공동주택관리법 시행령」 개정(대통령령 제36374호)으로 제26조제1항이 '입주자대표회의에 <b>제출하여</b> 매 회계연도 개시 1개월 전까지 <b>승인</b>을 받아야 한다'로 정비되었습니다. 1개월 전까지는 예산안 제출기한이 아니라 승인기한입니다(법제처 25-0195 해석의 취지를 반영). ⑤는 이 문구대로 읽으면 되고, 정답 ②(감사보고서 1개월)는 그대로입니다.","html":true}],"diff":"중","roundLabel":"제26회 26번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-27","round":26,"num":27,"part":"관리·법령","unit":"장기수선계획","sub":"장기수선계획(수립·검토·조정과 수선주기)","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 시설관리에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리주체는 장기수선계획에 따라 공동주택의 주요 시설의 교체 및 보수에 필요한 장기수선충당금을 해당 주택의 소유자로부터 징수하여 적립하여야 한다.","ans":false,"mark":"O","note":"장기수선충당금은 소유자로부터 징수해 적립한다.","rnd":[],"art":""},{"n":"②","text":"입주자대표회의와 관리주체는 주요시설을 신설하는 등 관리여건상 필요하여 전체 입주자 3분의 1 이상의 서면동의를 받은 경우에는 장기수선계획을 조정할 수 있다.","ans":true,"mark":"X","note":"조정 요건은 3분의 1이 아니라 전체 입주자 3분의 2 이상의 서면동의다.","rnd":[],"art":""},{"n":"③","text":"공동주택의 안전점검 방법, 안전점검의 실시 시기, 안전점검을 위한 보유 장비, 그 밖에 안전점검에 필요한 사항은 대통령령으로 정한다.","ans":false,"mark":"O","note":"안전점검의 방법·시기·장비 등은 대통령령으로 정한다.","rnd":[],"art":""},{"n":"④","text":"공동주택의 소유자는 장기수선충당금을 사용자가 대신하여 납부한 경우에는 그 금액을 반환하여야 한다.","ans":false,"mark":"O","note":"사용자가 대신 납부한 충당금은 소유자가 반환해야 한다.","rnd":[],"art":""},{"n":"⑤","text":"관리주체는 공동주택의 사용자가 장기수선충당금의 납부 확인을 요구하는 경우에는 지체 없이 확인서를 발급해 주어야 한다.","ans":false,"mark":"O","note":"납부 확인을 요구하면 지체 없이 확인서를 발급한다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"주요시설을 신설하는 등 관리여건상 필요한 경우 장기수선계획을 조정하려면 전체 입주자 3분의 2 이상의 서면동의가 필요하다. '3분의 1'이라고 한 ②가 틀렸다. 충당금 적립, 안전점검 사항의 대통령령 위임, 사용자 대납분의 소유자 반환, 납부확인서 발급은 옳다.","paras":[],"cites":["공동주택관리법 제29조제2항 · 제30조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"장기수선계획 조정은 '전체 입주자 3분의 2 이상 서면동의'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 27번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-28","round":26,"num":28,"part":"관리·법령","unit":"하자관리와 분쟁조정","sub":"하자담보책임기간과 하자보 s":true,"mark":"O","note":"이행기한까지 이행하지 않으면 이행강제금을 부과한다.","rnd":[],"art":""},{"n":"⑤","text":"노동위원회의 구제명령, 기각결정 또는 재심판정은 행정소송 제기에 의하여 그 효력이 정지된다.","ans":false,"mark":"X","note":"행정소송 제기로 효력이 정지되지 않는다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"구제명령을 받은 후 이행기한까지 이행하지 않으면 이행강제금을 부과한다는 ④가 옳다. 전차금 상계는 금지되고, 근로기준법 기준에 미달하는 부분만 무효이며, 근로자 명부·임금대장은 3년 보존, 구제명령은 행정소송으로 효력이 정지되지 않는다.","paras":[],"cites":["근로기준법 제22조·제42조·제33조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"미달 부분만 무효, 명부 3년 보존.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-30","round":26,"num":30,"part":"관리·법령","unit":"사회보험","sub":"건강보험·국민연금의 가입자와 급여(피부양자·자격 상실·보험료)","type":"mc","stem":"국민건강보험법상 가입자에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"가입자는 「의료급여법」에 따른 수급권자가 된 날의 다음 날에 그 자격을 잃는다.","ans":true,"mark":"X","note":"수급권자가 된 날 자격을 잃는다(다음 날이 아니다).","rnd":[],"art":""},{"n":"②","text":"「병역법」에 따른 현역병은 직장가입자에서 제외된다.","ans":false,"mark":"O","note":"현역병은 직장가입자에서 제외된다.","rnd":[],"art":""},{"n":"③","text":"유공자등 의료보호대상자이었던 사람은 그 대상자에서 제외된 날에 직장가입자 또는 지역가입자의 자격을 얻는다.","ans":false,"mark":"O","note":"의료보호대상자에서 제외된 날 자격을 얻는다.","rnd":[],"art":""},{"n":"④","text":"가입자는 국내에 거주하지 아니하게 된 날의 다음 날에 그 자격을 잃는다.","ans":false,"mark":"O","note":"국내에 거주하지 않게 된 날의 다음 날 자격을 잃는다.","rnd":[],"art":""},{"n":"⑤","text":"직장가입자인 근로자등은 그 사용관계가 끝난 날의 다음 날에 그 자격이 변동된다.","ans":false,"mark":"O","note":"사용관계가 끝난 날의 다음 날 자격이 변동된다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"의료급여법에 따른 수급권자가 되면 '그 날' 자격을 잃는다(다음 날 아님). 현역병의 직장가입자 제외, 유공자등 의료보호대상자 제외 시 자격 취득, 국외 거주 시 다음 날 상실, 사용관계 종료 시 다음 날 자격 변동은 옳다.","paras":[],"cites":["국민건강보험법 제6조~제8조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"당일 상실(의료급여 수급)과 다음 날 상실(사망·국외)을 구분.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 30번","noAns":false,"stemBr":false,"tabl 유족 중 25세 미만인 자녀는 유족보상연금 수급자격자에 해당한다.","ans":false,"mark":"O","note":"25세 미만 자녀는 유족보상연금 수급자격자다.","rnd":[],"art":""},{"n":"⑤","text":"유족보상연금 수급자격자인 손자녀가 19세가 된 때에도 그 자격을 잃지 아니한다.","ans":true,"mark":"X","note":"손자녀가 19세가 되면 수급자격을 잃는다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"유족보상연금 수급자격자인 손자녀가 19세가 되면 그 자격을 잃는다. 요양급여 3일 규정, 수급권 소멸, 재요양 시 연금 지급, 25세 미만 자녀의 수급자격은 옳다.","paras":[],"cites":["산업재해보상보험법 제62조·제65조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"유족보상연금 자격 연령 — 자녀 25세, 손자녀 19세.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 32번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-33","round":26,"num":33,"part":"관리·법령","unit":"관리사무소장·주택관리사와 경비원","sub":"주택관리업(등록기준·등록말소·영업정지·과징금)","type":"mc","stem":"공동주택관리법령상 주택관리사등에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"400세대의 의무관리대상 공동주택에는 주택관리사보를 해당 공동주택의 관리사무소장으로 배치할 수 없다.","ans":false,"mark":"X","note":"500세대 미만이면 주택관리사보를 관리사무소장으로 배치할 수 있다.","rnd":[],"art":""},{"n":"②","text":"주택관리사보가 공무원으로 주택관련 인ㆍ허가 업무에 3년 9개월 종사한 경력이 있다면 주택관리사 자격을 취득할 수 있다.","ans":false,"mark":"X","note":"공무원 경력은 합격 후 경력이 아니므로 인정되지 않는다.","rnd":[],"art":""},{"n":"③","text":"금고 이상의 형의 집행유예를 선고받고 그 유예기간이 끝난 날부터 1년 6개월이 지난 사람은 주택관리사가 될 수 없다.","ans":false,"mark":"X","note":"유예기간이 끝난 날부터 2년이 지나면 자격 제한이 없다.","rnd":[],"art":""},{"n":"④","text":"주택관리사로서 공동주택의 관리사무소장으로 12년 근무한 사람은 하자분쟁조정위원회의 위원으로 위촉될 수 없다.","ans":false,"mark":"X","note":"관리사무소장 10년 이상 경력자는 위원으로 위촉될 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"임원 또는 사원의 3분의 1 이상이 주택관리사인 상사법인은 주택관리업의 등록을 신청할 수 있다.","ans":true,"mark":"O","note":"임원·사원의 3분의 1 이상이 주택관리사인 상사법인은 등록 신청이 가능하다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"주택관리업 등록을 신청할 수 있는 상사법인은 임원 또는 사원의 3분의 1 이상이 주택관리사인 법인이다. 400세대(500세대 미만)는 주택관리사보를 배치할 수 있고, 공무원 경력 3년 9개월은 합격 후 경력으로 인정되지 않으며, 금고 이상 형의 집행유예 기간이 끝난 날부터 2년이 지나면 결격사유가 해소되고, 관리사무소장 10년 이상 경력자는 하자분쟁조정위원회 위원이 될 수 있다.","paras":[],"cites":["공동주택관리법 제67조 · 제73조 · 제53조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"주택관리업 상사법인 요건은 '임원·사원 3분의 1 이상이 주택관리사'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 33번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-34","round":26,"num":34,"part":"관리·법령","unit":"관리사무소장·주택관리사와 경비원","sub":"관리주체의 업무와 관리사무소장의 업무·배치(경비원 업무 포함)","type":"mc","stem":"공동주택관리법령상 관리사무소장 및 경비원의 업무에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리사무소장이 집행하는 업무에는 공동주택단지 안에서 발생한 도난사고에 대한 대응 조치의 지휘ㆍ총괄이 포함된다.","ans":false,"mark":"O","note":"도난사고 대응 조치의 지휘·총괄은 관리사무소장 업무다.","rnd":[],"art":""},{"n":"②","text":"관리사무소장의 업무에 대하여 입주자등이 관계 법령에 위반되는 지시를 하는 등 부당하게 간섭하는 행위를 한 경우 관리사무소장은 시장ㆍ군수ㆍ구청장에게 이를 보고 하고, 사실 조사를 의뢰할 수 있다.","ans":false,"mark":"O","note":"입주자등의 부당 간섭 시 시장·군수·구청장에게 보고하고 조사를 의뢰할 수 있다.","rnd":[],"art":""},{"n":"③","text":"경비원은 입주자등에게 수준 높은 근로 서비스를 제공하여야 한다.","ans":false,"mark":"O","note":"경비원은 입주자등에게 수준 높은 근로 서비스를 제공해야 한다.","rnd":[],"art":""},{"n":"④","text":"주택관리사등이 관리사무소장의 업무를 집행하면서 입주자등에게 재산상의 손해를 입힌 경우에 그 손해를 배상할 책임을 지는 것은 고의 또는 중대한 과실이 있는 경우에 한한다.","ans":true,"mark":"X","note":"배상책임은 고의 또는 과실이면 인정되고, 중대한 과실에 한정되지 않는다.","rnd":[],"art":""},{"n":"⑤","text":"공동주택에 경비원을 배치한 경비업자는 청소와 이에 준하는 미화의 보조 업무에 경비원을 종사하게 할 수 있다.","ans":false,"mark":"O","note":"경비업자는 경비원에게 청소·미화 보조 업무를 하게 할 수 있다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"주택관리사등의 손해배상책임은 '고의 또는 과실'이면 인정되며, 중대한 과실에 한하지 않는다. 따라서 ④가 틀렸다. 도난사고 대응 지휘·총괄, 부당 간섭 시 보고·조사 의뢰, 경비원의 근로 서비스 제공, 경비원의 청소·미화 보조 업무는 모두 옳다.","paras":[],"cites":["공동주택관리법 제66조 · 제76조(경비원의 업무) · 경비업법"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"손해배상책임 요건은 '고의 또는 과실'(중대한 과실 한정 아님).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 34번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-35","round":26,"num":35,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"공동주택관리의 감독·지원과 벌칙·과태료","type":"mc","stem":"공동주택관리법상 지방자치단체의 장의 감사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"감사 대상이 되는 업무는 입주자대표회의나 그 구성원, 관리주체, 관리사무소장 또는 선거관리위원회나 그 위원 등의 업무이다.","ans":false,"mark":"O","note":"감사 대상은 대표회의·관리주체·관리사무소장·선거관리위원회 등의 업무다.","rnd":[],"art":""},{"n":"②","text":"공동주택단지 내 분쟁의 조정이 필요한 경우 공동주택의 입주자등은 지방자치단체의장에게 감사를 요청할 수 있다.","ans":false,"mark":"O","note":"분쟁 조정이 필요하면 입주자등이 감사를 요청할 수 있다.","rnd":[],"art":""},{"n":"③","text":"공동주택의 입주자등이 감사를 요청하려면 전체 입주자등의 과반수의 동의를 받아야 한다.","ans":true,"mark":"X","note":"요청에 필요한 동의율은 과반수가 아니라 10분의 3 이상이다.","rnd":[],"art":""},{"n":"④","text":"지방자치단체의 장은 공동주택의 입주자등의 감사 요청이 없더라도 공동주택관리의 효율화와 입주자등의 보호를 위하여 필요하다고 인정하는 경우에는 감사를 실시할 수 있다.","ans":false,"mark":"O","note":"요청이 없어도 필요하다고 인정하면 직권으로 감사할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"지방자치단체의 장은 감사 요청이 이유가 있다고 인정하는 경우에는 감사를 실시한 후 감사를 요청한 입주자등에게 그 결과를 통보하여야 한다.","ans":false,"mark":"O","note":"감사 후 그 결과를 요청한 입주자등에게 통보하여야 한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"입주자등이 감사를 요청하려면 전체 입주자등의 10분의 3 이상의 동의를 받아야 한다. 과반수라는 ③이 틀린 지문이다. 감사 대상 업무, 직권 감사, 결과 통보에 관한 나머지 설명은 모두 옳다.","paras":[],"cites":["공동주택관리법 제93조(감사)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"감사 요청 동의율 10분의 3 — 숫자를 바꾼 지문이 정답인 경우가 많다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 35번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-36","round":26,"num":36,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품·위수탁계약)","type":"mc","stem":"민간임대주택에 관한 특별법령상 임대를 목적으로 하는 주택에 대하여 자기관리형 주택임대관리업자가 업무를 위탁받은 경우 작성하는 위ㆍ수탁계약서에 포함되어야 하는 사항이 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"임대료","ans":false,"mark":"O","note":"임대료는 포함되어야 한다.","rnd":[],"art":""},{"n":"②","text":"계약기간","ans":false,"mark":"O","note":"계약기간도 포함되어야 한다.","rnd":[],"art":""},{"n":"③","text":"관리수수료","ans":true,"mark":"X","note":"관리수수료는 자기관리형 위·수탁계약서의 필수 기재사항이 아니다.","rnd":[],"art":""},{"n":"④","text":"전대료(轉貸料) 및 전대보증금","ans":false,"mark":"O","note":"전대료·전대보증금은 포함되어야 한다.","rnd":[],"art":""},{"n":"⑤","text":"주택임대관리업자 및 임대인의 권리ㆍ의무에 관한 사항","ans":false,"mark":"O","note":"권리·의무에 관한 사항도 포함되어야 한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"자기관리형 주택임대관리업자의 위·수탁계약서에는 임대료, 계약기간, 전대료·전대보증금, 권리·의무에 관한 사항 등이 포함된다. '관리수수료'는 위탁관리형 계약의 내용으로, 자기관리형 계약서의 필수 기재사항이 아니다.","paras":[],"cites":["민간임대주택에 관한 특별법 시행규칙(위·수탁계약서 기재사항)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"자기관리형 계약서에 '관리수수료'는 없다(위탁관리형의 항목).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 36번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-37","round":26,"num":37,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"주택단지 안의 도로와 수해방지(보도·과속방지턱·비탈면·물막이설비)","type":"mc","stem":"주택건설기준 등에 관한 규정상 공동주택을 건설하는 주택단지 안의 도로에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"유선형(流線型) 도로로 설계하여 도로의 설계속도(도로설계의 기초가 되는 속도를 말한다)가 시속 20킬로미터 이하가 되도록 하여야 한다.","ans":false,"mark":"O","note":"유선형 도로로 설계속도 20km/h 이하가 되게 한다.","rnd":[],"art":""},{"n":"②","text":"폭 1.5미터 이상의 보도를 포함한 폭 7미터 이상의 도로(보행자전용도로, 자전거도로는 제외한다)를 설치하여야 한다.","ans":false,"mark":"O","note":"폭 1.5m 이상 보도를 포함한 7m 이상 도로를 설치한다.","rnd":[],"art":""},{"n":"③","text":"도로노면의 요철(凹凸) 포장 또는 과속방지턱의 설치를 통하여 도로의 설계속도가 시속 20킬로미터 이하가 되도록 하여야 한다.","ans":false,"mark":"O","note":"노면 요철포장·과속방지턱으로 설계속도 20km/h 이하가 되게 한다.","rnd":[],"art":""},{"n":"④","text":"300세대 이상의 경우 어린이 통학버스의 정차가 가능하도록 어린이 안전보호구역을 1개소 이상 설치하여야 한다.","ans":true,"mark":"X","note":"어린이 안전보호구역 기준은 300세대가 아니라 500세대 이상이다.","rnd":[],"art":""},{"n":"⑤","text":"해당 도로를 이용하는 공동주택의 세대수가 100세대 미만이고 해당 도로가 막다른 도로로서 그 길이가 35미터 미만인 경우 도로의 폭을 4미터 이상으로 할 수 있다.","ans":false,"mark":"O","note":"100세대 미만이고 길이 35m 미만인 막다른 도로는 폭 4m 이상으로 할 수 있다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"어린이 통학버스 정차가 가능한 어린이 안전보호구역을 1개소 이상 설치해야 하는 기준 세대수는 300세대가 아니다(500세대 이상). 유선형·과속방지턱 설계속도 20km/h, 보도 포함 7m 이상 도로, 막다른 도로의 예외는 옳다.","paras":[],"cites":["주택건설기준 등에 관한 규정 제26조·제28조(주택단지 안의 도로)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"도로 폭 7m(보도 1.5m 포함) · 막다른 도로 4m 예외.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 37번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-38","round":26,"num":38,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"주택단지 안의 도로와 수해방지(보도·과속방지턱·비탈면·물막이설비)","type":"mc","stem":"주택건설기준 등에 관한 규칙상 주택단지에 비탈면이 있는 경우 수해방지에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사업계획승인권자가 건축물의 안전상 지장이 없다고 인정하지 않은 경우, 비탈면의 높이가 3미터를 넘는 경우에는 높이 3미터이내마다 그 비탈면의 면적의 5분의 1이상에 해당하는 면적의 단을 만들어야 한다.","ans":false,"mark":"O","note":"높이 3m를 넘으면 3m 이내마다 비탈면 면적의 1/5 이상 단을 만든다.","rnd":[],"art":""},{"n":"②","text":"토양의 유실을 막기 위하여 석재ㆍ합성수지재 또는 콘크리트를 사용한 배수로를 설치하여야 한다.","ans":false,"mark":"O","note":"토양 유실 방지를 위한 배수로를 설치한다.","rnd":[],"art":""},{"n":"③","text":"비탈면의 안전을 위하여 필요한 경우에는 돌붙이기를 하거나 콘크리트격자블록 기타 비탈면보호용구조물을 설치하여야 한다.","ans":false,"mark":"O","note":"필요한 경우 돌붙이기·격자블록 등 보호구조물을 설치한다.","rnd":[],"art":""},{"n":"④","text":"비탈면 아랫부분에 옹벽 또는 축대(이하 “옹벽등”이라 한다)가 있는 경우에는 그 옹벽등과 비탈면 사이에 너비 1미터이상의 단을 만들어야 한다.","ans":false,"mark":"O","note":"아랫부분 옹벽과 비탈면 사이에는 너비 1m 이상의 단을 만든다.","rnd":[],"art":""},{"n":"⑤","text":"비탈면 윗부분에 옹벽등이 있는 경우에는 그 옹벽등과 비탈면 사이에 너비 1.5미터이상으로서 당해 옹벽등의 높이의 3분의 1이상에 해당하는 너비이상의 단을 만들어야 한다.","ans":true,"mark":"X","note":"윗부분 옹벽의 경우 단의 너비 기준이 1.5m가 아니라 조문의 다른 수치다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"비탈면 윗부분에 옹벽등이 있는 경우 단의 너비 기준을 1.5미터로 본 ⑤가 조문과 다르다. 높이 3m 초과 비탈면의 3m 이내마다 5분의 1 이상 단 만들기, 배수로 설치, 돌붙이기 등 보호구조물, 아랫부분 옹벽과 비탈면 사이 1m 이상 단은 옳다.","paras":[],"cites":["주택건설기준 등에 관한 규칙 제7조(수해방지)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"비탈면 단 — 3m마다 1/5, 아랫부분 1m.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 38번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-39","round":26,"num":39,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"승강기 설치기준(승용·화물용·비상용승강기와 배연설비)","type":"mc","stem":"건축물의 설비기준 등에 관한 규칙상 비상용승강기의 승강장과 승강로에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"각층으로부터 피난층까지 이르는 승강로는 화재대피의 효율성을 위해 단일구조로 연결하지 않는다.","ans":false,"mark":"X","note":"승강로는 피난층까지 단일구조로 연결한다.","rnd":[],"art":""},{"n":"②","text":"승강장은 각층의 내부와 연결될 수 있도록 하되, 그 출입구(승강로의 출입구를 제외한다)에는 을종방화문을 설치한다. 다만, 피난층에는 갑종방화문을 설치하여야 한다.","ans":false,"mark":"X","note":"승강장 출입구는 을종방화문이나 피난층은 갑종이 아니라 반대 기준이 적용된다.","rnd":[],"art":""},{"n":"③","text":"승강로는 당해 건축물의 다른 부분과 방화구조로 구획하여야 한다.","ans":false,"mark":"X","note":"승강로는 방화구조가 아니라 방화구획으로 구획한다.","rnd":[],"art":""},{"n":"④","text":"옥외에 승강장을 설치하는 경우 승강장의 바닥면적은 비상용승강기 1대에 대하여 6제곱미터 이상으로 한다.","ans":false,"mark":"X","note":"옥외 승강장 바닥면적 기준이 6㎡와 다르다.","rnd":[],"art":""},{"n":"⑤","text":"승강장의 벽 및 반자가 실내에 접하는 부분의 마감재료(마감을 위한 바탕을 포함한다)는 불연재료를 사용한다.","ans":true,"mark":"O","note":"승강장 벽·반자 마감재료는 불연재료를 사용한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"비상용승강기 승강장 벽·반자의 실내 접하는 부분 마감재료는 불연재료를 사용해야 한다(⑤). 승강로는 피난층까지 단일구조로 연결하고, 승강장 출입구는 을종방화문(피난층은 갑종)이며, 승강로는 방화구획, 옥외 승강장 바닥면적은 6㎡ 이상이 아니라 그 이상 기준이 별도로 정해져 있다.","paras":[],"cites":["건축물의 설비기준 등에 관한 규칙 제8조(비상용승강기)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"마감재료는 불연재료 — 가장 확실한 정답 축.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 39번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"26-40","round":26,"num":40,"part":"시설·설비","unit":"급수·급탕설비","sub":"급수방식과 급수설비(고가수조·수도직결·크로스커넥션)","type":"mc","stem":"급탕설비에 관한 내용으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"급탕배관에서 하향 공급방식은 급탕관과 반탕(복귀)관을 모두 선하향 구배로 한다.","ans":true,"mark":"O","note":"하향 공급방식은 두 관 모두 선하향 구배로 한다.","rnd":[],"art":""},{"n":"②","text":"중앙식 급탕법에서 간접가열식은 보일러 내에 스케일이 부착될 염려가 크기 때문에 소규모 건물의 급탕설비에 적합하다.","ans":false,"mark":"X", ③","text":"입주자대표회의는 해당 공동주택의 관리에 필요하다고 인정하는 경우 공동주택을 300세대 이상의 단위로 나누어 관리하게 할 수 있다.","ans":false,"mark":"X","note":"구분관리 단위는 300세대가 아니라 500세대 이상이다.","rnd":[],"art":""},{"n":"④","text":"의무관리대상 공동주택 전환 신고를 하려는 자는 입주자등의 동의를 받은 날부터 15일 이내에 관할 시ㆍ도지사에게 신고하여야 한다.","ans":false,"mark":"X","note":"신고 기한은 15일이지만 신고 상대는 시·도지사가 아니라 시장·군수·구청장이다.","rnd":[],"art":""},{"n":"⑤","text":"의무관리대상 전환 공동주택의 입주자등은 관리규약의 제정 신고가 수리된 날부터 3개월 이내에 입주자대표회의를 구성하여야 한다.","ans":true,"mark":"O","note":"관리규약 제정 신고 수리일부터 3개월 이내에 입주자대표회의를 구성한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"의무관리대상 전환 공동주택의 입주자등은 관리규약의 제정 신고가 수리된 날부터 3개월 이내에 입주자대표회의를 구성하여야 한다. 관리방법은 10분의 1 이상 제안·과반수 찬성으로 결정하고, 구분관리는 500세대 이상 단위, 전환 신고는 동의를 받은 날부터 15일 이내에 시장·군수·구청장에게 한다.","paras":[],"cites":["공동주택관리법 제5조 · 제6조 · 제8조 · 같은 법 시행령 제4조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"전환 공동주택은 '관리규약 수리 → 3개월 내 대표회의 구성'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 26번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-27","round":27,"num":27,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품·위수탁계약)","type":"mc","stem":"민간임대주택에 관한 특별법상 주택임대관리업에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"주택임대관리업의 등록기관은 시장ㆍ군수ㆍ구청장이다.","ans":false,"mark":"O","note":"등록기관은 시장·군수·구청장이다.","rnd":[],"art":""},{"n":"②","text":"주택임대관리업의 등록기관은 등록 사항의 변경 신고를 받은 때에는 신고를 받은 날부터 10일 이내에 신고수리 여부를 신고인에게 통지하여야 한다.","ans":true,"mark":"X","note":"신고수리 여부 통지 기한을 10일로 못 박은 규정이 없다(조문과 다른 서술).","rnd":[],"art":""},{"n":"③","text":"주택임대관리업의 등록이 말소된 후 2년이 지나지 아니한 자는 주택임대관리업의 등록을 할 수 없다.","ans":false,"mark":"O","note":"등록 말소 후 2년이 지나지 않으면 등록할 수 없다.","rnd":[],"art":""},{"n":"④","text":"거짓으로 주택임대관리업의 등록을 한 경우 주택임대관리업의 등록기관은 그 등록을 말소하여야 한다.","ans":false,"mark":"O","note":"거짓 등록은 말소하여야 한다.","rnd":[],"art":""},{"n":"⑤","text":"임대 목적 주택에 대한 임대차계약의 갱신 및 갱신거절은 주택임대관리업자의 업무범위에 해당한다.","ans":false,"mark":"O","note":"임대차계약의 갱신·갱신거절도 업무범위다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"등록·변경신고의 수리 여부 통지 기한을 10일로 본 ②가 조문과 다르다. 등록기관이 시장·군수·구청장이라는 점, 등록 말소 후 2년 결격, 부정 등록의 말소, 갱신·갱신거절이 업무범위에 포함된다는 점은 옳다.","paras":[],"cites":["민간임대주택에 관한 특별법 제14조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"기한 숫자를 바꾼 지문이 정답 — 조문에 없는 '10일'에 주의.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 27번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-28","round":27,"num":28,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"장기수선계획(수립·검토·조정과 수선주기)","type":"mc","stem":"공동주택관리법령상 공동주택의 관리주체에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"임대사업자는 관리주체가 될 수 없다.","ans":false,"mark":"X","note":"임대사업자도 관리주체가 될 수 있다.","rnd":[],"art":""},{"n":"②","text":"100세대 이상인 공동주택의 관리주체는 관리규약으로 정하는 바에 따라 입주자대표회의의 회의록을 입주자등에게 공개하여야 한다.","ans":false,"mark":"X","note":"회의록 공개 의무는 '100세대 이상'이 아니라 의무관리대상 공동주택 관리주체에 적용된다.","rnd":[],"art":""},{"n":"③","text":"주택내부의 구조물을 교체하는 행위로서 입주자가 창틀을 교체하는 행위는 관리주체의 동의를 받아야 한다.","ans":true,"mark":"O","note":"전유부분 구조물 교체(창틀 교체 등)는 관리주체 동의가 필요하다.","rnd":[],"art":""},{"n":"④","text":"관리주체는 전체 입주자 3분의 1 이상의 서면동의를 받은 경우에는 3년이 지나기 전에 장기수선계획을 조정할 수 있다.","ans":false,"mark":"X","note":"장기수선계획 조정은 전체 입주자 3분의 2 이상 서면동의(1/3 아님)로 3년 이내에도 가능하다.","rnd":[],"art":""},{"n":"⑤","text":"의무관리대상 공동주택의 관리주체는 회계연도마다 사업실적서 및 결산서를 작성하여 회계연도 종료 후 1개월 이내에 입주자대표회의에 제출하여야 한다.","ans":false,"mark":"X","note":"사업실적서·결산서 제출 기한은 회계연도 종료 후 2개월 이내다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"입주자가 전유부분 내부의 창틀을 교체하는 등 구조물을 교체하는 행위는 관리주체의 동의를 받아야 한다. 임대사업자도 관리주체가 될 수 있고, 회의록 공개는 100세대 이상이 아니라 의무관리대상 공동주택에 적용되며, 장기수선계획 조정은 3분의 2 이상의 서면동의가 있어야 하고, 사업실적서·결산서는 회계연도 종료 후 1개월이 아니라 2개월 이내에 제출한다.","paras":[],"cites":["공동주택관리법 제6조 · 제11조 · 제29조 · 같은 법 시행령 제5조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"전유부분 구조물 교체는 관리주체 동의, 결산서 제출은 '2개월 이내'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 28번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-29","round":27,"num":29,"part":"관리·법령","unit":"관리비와 회계관리","sub":"회계감사와 회계서류의 작성·보관·공개","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 관리주체에 대한 회계감사 등에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"회계감사는 공동주택 회계의 특수성을 고려하여 제정된 회계감사기준에 따라 실시되어야 한다.","ans":false,"mark":"O","note":"감사는 공동주택 회계의 특수성을 고려한 감사기준에 따른다.","rnd":[],"art":""},{"n":"②","text":"입주자대표회의는 입주자등의 10분의 1 이상이 연서하여 감사인의 추천을 요구하는 경우 감사인의 추천을 의뢰한 후 추천을 받은 자 중에서 감사인을 선정하여야 한다.","ans":false,"mark":"O","note":"입주자등 1/10 이상 연서로 감사인 추천을 요구하면 추천받은 자 중에서 선정한다.","rnd":[],"art":""},{"n":"③","text":"관리주체는 회계감사를 받은 경우에는 감사보고서 등 회계감사의 결과를 제출받은 날부터 1개월 이내에 입주자대표회의에 보고하고 해당 공동주택단지의 인터넷 홈페이지 및 동별 게시판에 공개하여야 한다.","ans":false,"mark":"O","note":"감사 결과는 제출받은 날부터 1개월 이내에 보고하고 홈페이지·게시판에 공개한다.","rnd":[],"art":""},{"n":"④","text":"300세대 이상인 공동주택으로서 해당 연도에 회계감사를 받지 아니하기로 입주자등의 과반수의 서면동의를 받은 경우, 그 연도에는 회계감사를 받지 않아도 된다.","ans":true,"mark":"X","note":"면제는 500세대 미만에 한정되므로 300세대 이상 전체를 면제 대상으로 본 서술이 틀렸다.","rnd":[],"art":""},{"n":"⑤","text":"회계감사의 감사인은 회계감사 완료일부터 1개월 이내에 회계감사 결과를 해당 공동주택을 관할하는 시장ㆍ군수ㆍ구청장에게 제출하고 공동주택관리정보시스템에 공개하여야 한다.","ans":false,"mark":"O","note":"감사인은 완료일부터 1개월 이내에 시장·군수·구청장에게 제출하고 시스템에 공개한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"감사 면제는 500세대 미만 단지에서만 인정되므로, '300세대 이상' 단지 전체가 과반수 동의로 면제된다고 한 ④가 틀렸다. 감사기준, 감사인 추천 요구(1/10 연서), 보고·공개, 감사인 제출 의무에 관한 설명은 옳다.","paras":[],"cites":["공동주택관리법 제26조 · 제27조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"'300세대 이상 + 과반수 동의로 면제'는 500세대 이상을 덮지 못한다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제27회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-30","round":27,"num":30,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"선거관리위원회(구성·위원 결격사유·선거관리)","type":"mc","stem":"공동주택관리법령상 선거관리위원회의 위원이 될 수 없는 사람을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"ㄱ.","tx":"피성년후견인 또는 피한정후견인"},{"mk":"ㄴ.","tx":"동별 대표자 후보자의 직계존비속"},{"mk":"ㄷ.","tx":"임기 중에 결격사유에 해당하여 동별 대표자에서 퇴임한 사람으로서 그 남은 임기 중에 있는 사람"},{"mk":"ㄹ.","tx":"선거관리위원회 위원에서 해임된 사람으로서 그 남은 임기 중에 있는 사람"}],"letters":false,"combo":false,"choices":[{"n":"①","text":"ㄱ","ans":false,"mark":"X","note":"ㄱ은 위원이 될 수 없다.","rnd":[],"art":""},{"n":"②","text":"ㄱ, ㄴ","ans":false,"mark":"X","note":"ㄴ도 될 수 없다.","rnd":[],"art":""},{"n":"③","text":"ㄱ, ㄴ, ㄷ","ans":false,"mark":"X","note":"ㄷ까지 포함해 모두 해당한다.","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄷ, ㄹ","ans":false,"mark":"X","note":"ㄱ이 빠졌다.","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ, ㄹ","ans":true,"mark":"O","note":"ㄱ, ㄴ, ㄷ, ㄹ 모두 위원 결격사유다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"피성년후견인·피한정후견인, 후보자의 직계존비속, 결격으로 퇴임한 동별 대표자로서 남은 임기 중인 사람, 선거관리위원회 위원에서 해임된 사람으로서 남은 임기 중인 사람은 모두 선거관리위원회 위원이 될 수 없다.","paras":[],"cites":["공동주택관리법 시행령 제15조(위원의 결격사유)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"선관위 결격 4종 — 후견인, 후보자 가족, 퇴임 대표자, 해임 위원.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-31","round":27,"num":31,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"입주자대표회의의 구성과 동별 대표자(선출·결격사유·임기·해임)","type":"mc","stem":"공동주택관리법령상 입주자대표회의의 구성에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"입주자대표회의는 4명 이상으로 구성한다.","ans":false,"mark":"O","note":"대표회의는 4명 이상으로 구성한다.","rnd":[],"art":""},{"n":"②","text":"하나의 공동주택단지를 여러 개의 공구로 구분하여 순차적으로 건설하는 경우, 먼저 입주하여 이미 입주자대표회의를 구성한 공구의 입주자들은 다음 공구의 입주예정자의 과반수가 입주한 때에는 다시 입주자대표회의를 구성하여야 한다.","ans":false,"mark":"O","note":"다음 공구 입주예정자 과반수가 입주하면 다시 구성하여야 한다.","rnd":[],"art":""},{"n":"③","text":"동별 대표자 선출공고에서 정한 각종 서류 제출 마감일을 기준으로, 해당 동별 대표자에서 해임된 날부터 2년이 지나지 아니한 사람은 동별 대표자가 될 수 없으며 그 자격을 상실한다.","ans":false,"mark":"O","note":"해임된 날부터 2년이 지나지 않으면 대표자가 될 수 없다.","rnd":[],"art":""},{"n":"④","text":"동별 대표자는 선거구별로 1명씩 선출하되, 후보자가 1명인 경우 해당 선거구 전체 입주자등의 과반수가 투표하고 투표자 과반수의 찬성으로 선출한다.","ans":false,"mark":"O","note":"후보자가 1명이면 과반수 투표 + 투표자 과반수 찬성으로 선출한다.","rnd":[],"art":""},{"n":"⑤","text":"최초의 입주자대표회의를 구성하기 위하여 동별 대표자를 선출하는 경우, 동별 대표자는 동별 대표자 선출공고에서 정한 각종 서류 제출 마감일을 기준으로 해당 공동주택단지 안에서 주민등록을 마친 후 계속하여 3개월 이상 거주하고 있어야 한다.","ans":true,"mark":"X","note":"최초 구성 시 거주요건은 3개월이 아니라 6개월 이상이다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"최초 입주자대표회의를 구성할 때 동별 대표자의 거주요건은 '3개월 이상'이 아니라 6개월 이상이다. 나머지 설명(4명 이상 구성, 공구별 재구성, 해임 후 2년 결격, 단수 후보자 선출)은 옳다.","paras":[],"cites":["공동주택관리법 시행령 제16조(동별 대표자의 자격)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"대표자 거주요건은 '6개월 이상'(최초 구성도 동일).","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제27회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"27-32","round":27,"num":32,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"관리규약과 관리규약준칙(제정·개정·신고)","type":"mc","stem":"공동주택관리법령상 입주자등이 관리주체의 동의를 받아야 하는 행위에 해당하지 않는 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"장애인 보조견을 사육함으로써 공동주거생활에 피해를 미치는 행위","ans":true,"mark":"X","note":"보조견 사육으로 피해를 주는 행위는 동의 대상이 아니라 금지 행위다.","rnd":[],"art":""},{"n":"②","text":"공동주택에 광고물을 부착하는 행위","ans":false,"mark":"O","note":"광고물 부착은 동의를 받아 할 수 있다.","rnd":[],"art":""},{"n":"③","text":"기계실에 출입하는 행위","ans":false,"mark":"O","note":"기계실 출입은 동의 대상이다.","rnd":[],"art":""},{"n":"④","text":"방송시설을 사용함으로써 공동주거생활에 피해를 미치는 행위","ans":false,"mark":"O","note":"방송시설 사용으로 피해를 미치는 행위도 동의 대상이다.","rnd":[],"art":""},{"n":"⑤","text":"「환경친화적 자동차의 개발 및 보급 촉진에 관한 법률」에 따른 전기자동차의 이동형 충전기를 이용하기 위한 차량무선인식장치[전자태그(RFID tag)를 말한다]를 콘센트 주위에 부착하는 행위","ans":false,"mark":"O","note":"전기차 RFID 태그 부착은 동의 대상이다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"장애인 보조견을 사육해 공동주거생활에 피해를 미치는 행위는 관리주체의 동의를 받아야 하는 행위가 아니라 금지되는 행위다. 광고물 부착, 기계실 출입, 방송시설 사용으로 인한 피해 행위, 전기차 RFID 태그 부착은 동의를 받아 할 수 있다.","paras":[],"cites":["공동주택관리법 제20조 · 시행령 별표 2"],"citeLabel":"관련 기준/법령","citeFirst":false, ark":"X","text":"200세대로 구성된 중앙집중식 난방방식의 공동주택"},{"n":"④","ans":true,"note":"해당하지 않는다. 100세대는 300세대에도, 150세대에도 미치지 못한다. 관리방법을 정하는 데 입주자등의 동의가 있었다는 사정은 의무관리대상 여부를 바꾸지 않는다.","rnd":[],"art":"","mark":"O","text":"100세대로 구성된 주택에서 전체 입주자등의 과반수가 동의하여 관리방법을 정하는 공동주택"},{"n":"⑤","ans":false,"note":"해당한다. 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 150세대 이상이다(같은 호 라목). 200세대이므로 해당한다.","rnd":[],"art":"","mark":"X","text":"「건축법」 제11조에 따른 건축허가를 받아 주택 외의 시설과 주택을 동일 건축물로 건축한 건축물로서 주택이 200세대인 건축물"}],"cites":["공동주택관리법 제2조"],"core":"의무관리대상 공동주택은 300세대 이상, 150세대 이상으로서 승강기가 설치된 공동주택, 150세대 이상으로서 중앙집중식 난방방식(지역난방 포함)인 공동주택, 건축허가를 받아 주택 외 시설과 동일 건축물로 건축한 건축물로서 주택이 150세대 이상인 건축물 등이다(법 제2조 제1항 제2호). 100세대는 어느 기준에도 미치지 못하므로 ④가 해당하지 않는다.","key":"의무관리대상은 300세대 이상, 150세대 이상+승강기, 150세대 이상+중앙집중식 난방, 150세대 이상+복합건축물이다(법 제2조 제1항 제2호).","ansText":"④","round":29,"roundLabel":"제29회 25번","blanks":[],"type":"mc","short":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"영상정보처리기기","d":"공동주택단지에 설치하는 CCTV 등으로, 개인정보 보호법 시행령 제3조 제1항 제1호·제2호에 따른 기기를 말한다."},{"t":"정보주체","d":"촬영된 개인영상정보로 본인을 식별할 수 있는 사람이다."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-026","num":26,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"영상정보처리기기의 설치·관리(장기수선계획 반영)","diff":"중","stem":"공동주택관리법령상 영상정보처리기기의 설치 및 관리 등에 관한 설명으로 옳은 것은?","choices":[{"n":"①","ans":false,"art":"제8조","note":"옳지 않다. 공동주택단지에 영상정보처리기기를 설치하거나 설치된 기기를 보수·교체하려면 장기수선계획에 반영하여야 하지만, 설치 자체가 의무는 아니다(시행규칙 제8조 제1항).","rnd":[],"mark":"X","text":"「주택법」에 따른 공동주택에는 영상정보처리기기를 설치하여야 한다."},{"n":"②","ans":false,"art":"제8조","note":"옳지 않다. 촬영된 자료는 컴퓨터보안시스템을 설치하여 30일 이상 보관하여야 한다(시행규칙 제8조 제2항 제3호). 30일 이상 보관할 수 없다는 설명이 반대다.","rnd":[],"mark":"X","text":"촬영된 자료는 컴퓨터보안시스템을 설치하여 보관하되 30일 이상 보관할 수 없다."},{"n":"③","ans":false,"art":"제8조","note":"옳지 않다. 영상정보처리기기가 고장 난 경우에는 지체 없이 수리하여야 하고, 안전관리자를 지정하여 관리하여야 한다(시행규칙 제8조 제2항 제4호·제5호). 3개월 이내에 수리하면 된다는 설명은 옳지 않다.","rnd":[],"mark":"X","text":"영상정보처리기기가 고장 난 경우에는 안전관리자를 지정하고 3개월 이내에 수리하여야 한다."},{"n":"④","ans":false,"art":"제8조","note":"옳지 않다. 정보주체의 동의가 있는 경우에는 촬영자료를 열람하게 하거나 제공할 수 있다(시행규칙 제8조 제3항 제2호). 동의가 있어도 안 된다는 설명이 틀렸다.","rnd":[],"mark":"X","text":"정보주체의 동의가 있더라도 관리주체는 영상정보처리기기의 촬영자료를 타인에게 열람하게 하거나 제공하여서는 아니 된다."},{"n":"⑤","ans":true,"art":"제8조","note":"옳다. 공동주택단지에 설치된 영상정보처리기기를 보수 또는 교체하려는 경우에는 장기수선계획에 반영하여야 한다(시행규칙 제8조 제1항).","rnd":[],"mark":"O","text":"공동주택단지에 설치된 영상정보처리기기를 보수 또는 교체하려는 경우에는 장기수선계획에 반영하여야 한다."}],"cites":["공동주택관리법 시행규칙 제8조"],"core":"영상정보처리기기를 설치하거나 보수·교체하려면 장기수선계획에 반영하여야 하고(시행규칙 제8조 제1항), 촬영자료는 컴퓨터보안시스템을 설치해 30일 이상 보관하며, 고장 시 지체 없이 수리하고 안전관리자를 지정해 관리한다(같은 조 제2항). 촬영자료는 정보주체의 동의가 있으면 열람·제공할 수 있다(제3항 제2호). 따라서 ⑤가 옳다.","key":"영상정보처리기기는 설치 의무가 아니라 보수·교체 시 장기수선계획 반영이 의무이고, 촬영자료는 30일 이상 보관한다(시행규칙 제8조).","ansText":"⑤","round":29,"roundLabel":"제29회 26번","blanks":[],"type":"mc","short":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"관리업무의 인계","d":"사업주체 등이 입주자대표회의의 요구나 자치관리기구 구성 등이 있은 날부터 1개월 이내에 관리주체에게 관리업무를 넘기는 절차다(법 제13조, 시행령 제10조)."},{"t":"입주예정자의 과반수 입주","d":"의무관리대상 공동주택에서 사업주체의 관리가 끝나고 입주자등의 관리가 시작되는 기준 시점이다(법 제11조 제1항)."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-028","num":28,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"관리방법의 결정과 관리의 이관(의무관리대상 전환·공동관리·혼합주택단지)","diff":"중","stem":"공동주택관리법령상 의무관리대상 공동주택을 건설한 사업주체가 관리의 이관을 위하여 입주자등에게 입주예정자의 과반수가 입주한 사실을 통지할 때 통지서에 기재하여야 하는 사항이 아닌 것은?","choices":[{"n":"①","ans":false,"note":"기재하여야 한다. 공동주택의 관리방법에 관한 결정의 요구를 적어야 한다(시행령 제8조 제1항 제3호).","rnd":[],"art":"","mark":"X","text":"공동주택의 관리방법에 관한 결정의 요구"},{"n":"②","ans":true,"note":"기재사항이 아니다. 통지서에는 총 입주예정세대수·총 입주세대수, 동별 입주예정세대수·동별 입주세대수, 관리방법에 관한 결정의 요구, 사업주체의 성명 및 주소를 적는다(시행령 제8조 제1항). 장기수선충당금의 적립현황은 관리업무 인계 시 인계서류에 포함되는 사항이다(같은 영 제10조 제4항 제3호).","rnd":[],"art":"","mark":"O","text":"장기수선충당금의 적립현황"},{"n":"③","ans":false,"note":"기재하여야 한다. 사업주체가 법인인 경우 그 명칭 및 소재지를 적어야 한다(시행령 제8조 제1항 제4호).","rnd":[],"art":"","mark":"X","text":"사업주체가 법인인 경우 법인의 명칭 및 소재지"},{"n":"④","ans":false,"note":"기재하여야 한다. 동별 입주예정세대수 및 동별 입주세대수를 적어야 한다(시행령 제8조 제1항 제2호).","rnd":[],"art":"","mark":"X","text":"동별 입주예정세대수 및 동별 입주세대수"},{"n":"⑤","ans":false,"note":"기재하여야 한다. 총 입주예정세대수 및 총 입주세대수를 적어야 한다(시행령 제8조 제1항 제1호).","rnd":[],"art":"","mark":"X","text":"총 입주예정세대수 및 총 입주세대수"}],"cites":["공동주택관리법 제11조","공동주택관리법 시행령 제8조","공동주택관리법 시행령 제10조"],"core":"사업주체는 입주예정자의 과반수가 입주한 사실을 통지할 때 통지서에 총 입주예정세대수·총 입주세대수, 동별 입주예정세대수·동별 입주세대수, 관리방법에 관한 결정의 요구, 사업주체의 성명 및 주소(법인은 명칭·소재지)를 적어야 한다(시행령 제8조 제1항). 장기수선충당금의 적립현황은 관리업무 인계 시 인계서류에 포함될 뿐 통지서 기재사항이 아니므로 ②가 정답이다.","key":"통지서 기재사항은 세대수(총·동별)·관리방법 결정 요구·사업주체의 성명과 주소이고, 장기수선충당금 적립현황은 인계서류다(시행령 제8조·제10조).","ansText":"②","round":29,"roundLabel":"제29회 28번","blanks":[],"type":"mc","short":false,"tableRows":[]},{"id":"28-33","round":28,"num":33,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"임차인대표회의(구성·협의사항)","type":"mc","stem":"민간임대주택에 관한 특별법령상 공공주택사업자 또는 임차인대표회의가 임대주택분쟁조정위원회에 조정을 신청할 수 있는 사항이 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리비","ans":false,"mark":"O","note":"관리비는 신청 대상이다.","rnd":[],"art":""},{"n":"②","text":"임대료의 증감","ans":false,"mark":"O","note":"임대료의 증감도 대상이다.","rnd":[],"art":""},{"n":"③","text":"공공임대주택의 분양전환승인","ans":true,"mark":"X","note":"분양전환승인은 조정 신청 대상이 아니다.","rnd":[],"art":""},{"n":"④","text":"민간임대주택의 공용부분·부대시설 및 복리시설의 유지·보수","ans":false,"mark":"O","note":"공용부분 등의 유지·보수도 대상이다.","rnd":[],"art":""},{"n":"⑤","text":"발행한 어음 및 수표를 기한까지 결제하지 못하여 어음교환소로부터 거래정지 처분을 받은 임대사업자의 민간임대주택에 대한 분양전환","ans":false,"mark":"O","note":"거래정지 처분 임대사업자의 분양전환도 대상이다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"공공임대주택의 분양전환승인은 조정 신청 대상이 아니다. 관리비, 임대료의 증감, 공용부분·부대시설의 유지·보수, 어음·수표 거래정지 임대사업자의 분양전환은 신청할 수 있는 사항이다.","paras":[],"cites":["민간임대주택에 관한 특별법 제55조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":" ","bogi":[],"letters":false,"combo":false,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"훈련연장급여","d":"수급자격자가 직업능력개발훈련 등을 받는 경우 소정급여일수를 넘겨 지급하는 급여로, 2년을 한도로 한다."},{"t":"특별연장급여","d":"실업의 급증 등 대통령령으로 정하는 사유가 있을 때 60일의 범위에서 연장 지급하는 구직급여다(고용보험법 제53조)."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-034","num":34,"part":"관리·법령","unit":"사회보험","sub":"실업급여(구직급여·취업촉진 수당)와 육아휴직 급여","diff":"중","stem":"고용보험법령상 구직급여에 관한 설명으로 옳지 않은 것은?","choices":[{"n":"①","ans":false,"note":"옳은 설명이다. 훈련연장급여의 지급기간은 2년을 한도로 한다(고용보험법 제51조 제2항).","rnd":[],"art":"","mark":"X","text":"훈련연장급여의 지급 기간은 2년을 한도로 한다."},{"n":"②","ans":false,"note":"옳은 설명이다. 구직급여는 대통령령으로 정하는 바에 따라 실업의 인정을 받은 일수분을 지급한다(고용보험법 제44조 제1항).","rnd":[],"art":"","mark":"X","text":"구직급여는 대통령령으로 정하는 바에 따라 실업의 인정을 받은 일수분(日數分)을 지급한다."},{"n":"③","ans":false,"note":"옳은 설명이다. 훈련연장급여의 일액은 해당 수급자격자의 구직급여일액의 100분의 100이다(고용보험법 제54조 제2항).","rnd":[],"art":"","mark":"X","text":"훈련연장급여를 지급하는 경우에 그 일액은 해당 수급자격자의 구직급여일액의 100분의 100으로 한다."},{"n":"④","ans":true,"note":"옳지 않다. 특별연장급여의 일액은 구직급여일액의 100분의 70을 곱한 금액이다(고용보험법 제54조 제2항). 100분의 80이 아니다.","rnd":[],"art":"","mark":"O","text":"특별연장급여를 지급하는 경우에 그 일액은 해당 수급자격자의 구직급여일액의 100분의 80을 곱한 금액으로 한다."},{"n":"⑤","ans":false,"note":"옳은 설명이다. 특별연장급여를 지급받고 있는 수급자격자가 훈련연장급여를 지급받게 되면 특별연장급여를 지급하지 아니한다(고용보험법 제55조 제3항).","rnd":[],"art":"","mark":"X","text":"특별연장급여를 지급받고 있는 수급자격자가 훈련연장급여를 지급받게 되면 특별연장급여를 지급하지 아니한다."}],"cites":["고용보험법 제51조","고용보험법 제54조","고용보험법 제55조"],"core":"연장급여 중 훈련연장급여는 지급기간 2년 한도, 일액은 구직급여일액의 100분의 100이고(고용보험법 제51조·제54조 제2항), 개별연장급여와 특별연장급여의 일액은 구직급여일액의 100분의 70이다(제54조 제2항). 특별연장급여를 받는 사람이 훈련연장급여를 받게 되면 특별연장급여는 지급하지 않는다(제55조 제3항). 따라서 100분의 80이라고 한 ④가 옳지 않다.","key":"특별연장급여 일액은 구직급여일액의 100분의 70, 훈련연장급여는 100분의 100이다(고용보험법 제54조 제2항).","ansText":"④","round":29,"roundLabel":"제29회 34번","blanks":[],"type":"mc","short":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"ㄱ","tx":"직장가입자인 근로자가 그 사용관계가 끝난 날"},{"mk":"ㄴ","tx":"직장가입자가 다른 적용대상 임대주택(제41조제3항 각 호의 공동주택으로 한정한다)의 공용부분, 부대시설 및 복리시설(분양된 시설은 제외한다)에 대한 장기수선계획을 수립하여 「주택법」 제49조에 따른 사용검사 신청 시 함께 제출하여야 하며, 임대기간 중 해당 민간임대주택단지에 있는 ( ㄴ )에 장기수선계획을 갖춰 놓아야 한다."}],"letters":false,"combo":false,"choices":[],"short":true,"ansText":"빈칸 ㄱ 특별수선충당금 · 빈칸 ㄴ 관리사무소 (주관식 단답형)","blanks":["특별수선충당금","관리사무소"],"core":"정답은 '특별수선충당금'(ㄱ), '관리사무소'(ㄴ)이다. 300세대 이상 민간임대주택의 임대사업자는 주요시설 교체·보수에 필요한 특별수선충당금을 적립하고, 장기수선계획을 사용검사 신청 시 제출하며 관리사무소 등을 두고 관리해야 한다.","paras":[],"cites":["민간임대주택에 관한 특별법 제51조 · 제53조 · 시행령 제43조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"민간임대의 장기수선 재원은 '특별수선충당금'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 71번","noAns":false,"stemBr":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"임차인대표회의","d":"민간임대주택단지의 임차인 대표자로 구성되어 관리규약 제정·개정, 관리비, 유지·보수, 임대료 증감 등에 관해 임대사업자와 협의하는 기구다(법 제52조)."},{"t":"준주택","d":"주택 외의 건축물 중 주거용으로 사용되는 오피스텔·기숙사 등으로, 민간임대주택법상 임대할 수 있으나 임차인대표회의 규정은 공동주택단지를 대상으로 한다."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-032","num":32,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"임차인대표회의(구성·협의사항)","diff":"중","stem":"민간임대주택에 관한 특별법령상 민간임대주택의 임차인대표회의에 관한 설명으로 옳은 것은?","choices":[{"n":"①","ans":true,"art":"제52조","note":"옳다. 임대사업자가 150세대 이상의 민간임대주택을 공급하는 공동주택단지 중 대통령령으로 정하는 단지(150세대 이상으로서 승강기가 설치된 공동주택단지)에 입주하는 임차인은 임차인대표회의를 구성하여야 한다(민간임대주택법 제52조 제1항 단서, 시행령 제42조 제2항 제2호).","rnd":[],"mark":"O","text":"임대사업자가 승강기가 설치된 150세대의 민간임대주택을 공급하는 공동주택단지에 입주하는 임차인은 임차인대표회의를 구성하여야 한다."},{"n":"②","ans":false,"art":"제52조","note":"옳지 않다. 임대사업자는 입주예정자의 과반수가 입주한 때부터 30일 이내에 입주현황과 임차인대표회의를 구성할 수 있다는 사실 등을 통지하여야 한다(법 제52조 제2항). 3분의 1이 입주한 때부터 60일 이내가 아니다.","rnd":[],"mark":"X","text":"임대사업자는 입주예정자의 3분의 1이 입주한 때에는 그 입주한 날부터 60일 이내에 임차인대표회의를 구성하여야 한다는 사실을 입주한 임차인에게 통지하여야 한다."},{"n":"③","ans":false,"art":"제42조","note":"옳지 않다. 임대사업자는 임차인대표회의가 협의를 요청하면 성실히 응하여야 한다(시행령 제42조 제5항). 응할 의무가 없다는 설명이 틀렸다.","rnd":[],"mark":"X","text":"임차인대표회의가 하자보수에 관하여 임대사업자에게 협의를 요청한 경우 임대사업자는 이에 응할 의무는 없다."},{"n":"④","ans":false,"art":"제42조","note":"옳지 않다. 동별 대표자가 될 수 있는 사람은 해당 단지에서 6개월 이상 계속 거주한 임차인이다(시행령 제42조 제7항). 1년이 아니다.","rnd":[],"mark":"X","text":"임차인대표회의를 구성하는 동별 대표자가 될 수 있는 사람은 해당 민간임대주택단지에서 1년 이상 계속 거주하고 있는 임차인으로 한다."},{"n":"⑤","ans":false,"art":"제52조","note":"옳지 않다. 임차인대표회의는 공동주택단지에 입주하는 임차인을 대상으로 하므로 준주택에는 같은 규정이 그대로 적용되지 않는다.","rnd":[],"mark":"X","text":"민간임대주택으로 등록한 준주택에 대하여도 「민간임대주택에 관한 특별법」이 정한 임차인대표회의에 관한 규정이 동일하게 적용된다."}],"cites":["민간임대주택에 관한 특별법 제52조","민간임대주택에 관한 특별법 시행령 제42조"],"core":"20세대 이상 단지의 임차인은 임차인대표회의를 구성할 수 있고, 150세대 이상으로서 승강기가 설치된 단지 등 대통령령으로 정하는 단지에서는 구성하여야 한다(법 제52조 제1항, 시행령 제42조 제2항). 통지는 과반수 입주 후 30일 이내에 하고(법 제52조 제2항), 임대사업자는 협의 요청에 성실히 응하며(시행령 제42조 제5항), 동별 대표자 자격은 6개월 이상 계속 거주다(같은 조 제7항). 따라서 ①이 옳다.","key":"150세대 이상+승강기 설치 단지는 임차인대표회의 구성이 의무다(민특법 제52조 제1항 단서, 시행령 제42조 제2항).","ansText":"①","round":29,"roundLabel":"제29회 32번","blanks":[],"type":"mc","short":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","letters":false,"combo":false,"choices":[],"short":true,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"자기관리형 주택임대관리업","d":"주택을 임차해 자기 책임으로 전대하는 형태의 주택임대관리업이다."},{"t":"위탁관리형 주택임대관리업","d":"주택 소유자로부터 수수료를 받고 임대료 부과·징수, 시설물 유지·관리 등을 대행하는 형태다."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-069","num":69,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품·위수탁계약)","diff":"중","stem":"민간임대주택에 관한 특별법상 용어 정의 규정의 일부이다. ( )에 들어갈 용어를 쓰시오.","bogi":[{"mk":"","tx":"제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다."},{"mk":"10","tx":"“주택임대관리업”이란 주택의 소유자로부터 임대관리를 위탁받아 관리하는 업(業)을 말하며, 다음 각 목으로 구분한다."},{"mk":"가","tx":"자기관리형 주택임대관리업: 주택의 소유자로부터 주택을 임차하여 자기 책임으로 전대(轉貸)하는 형태의 업"},{"mk":"나","tx":"( ㄱ ) 주택임대관리업: 주택의 소유자로부터 수수료를 받고 임대료 부과ㆍ징수 및 시설물 유지ㆍ관리 등을 대행하는 형태의 업"}],"blanks":["위탁관리형"],"ansText":"빈칸 ㄱ 위탁관리형","cites":["민간임대주택에 관한 특별법 제2조"],"core":"주택임대관리업은 자기관리형과 위탁관리형으로 나뉜다. 자기관리형은 주택을 임차해 자기 책임으로 전대하는 형태이고, 위탁관리형은 소유자로부터 수수료를 받고 임대료 부과·징수와 시설물 유지·관리를 대행하는 형태다(민간임대주택법 제2조 제10호).","key":"전대하면 자기관리형, 수수료 받고 대행하면 위탁관리형이다.","round":29,"roundLabel":"제29회 69번","type":"short","tableRows":[]},{"id":"28-72","round":28,"num":72,"part":"관리·법령","unit":"인사·노무관리","sub":"일·가정 양립·모성보호","type":"short","stem":"남녀고용평등과 일·가정 양립 지원에 관한 법률상 난임치료휴가에 관한 규정의 일부이다. ( )에 들어갈 아라비아 숫자를 쓰시오.","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"","tx":"제18조의3 ① 사업주는 근로자가 인공수정 또는 체외수정 등 난임치료를 받기 위하여 휴가를 청구하는 경우에 연간 ( ㄱ )일 이내의 휴가를 주어야 하며, 이 경우 최초 ( ㄴ )일은 유급으로 한다. 다만, 근로자가 청구한 시기에 휴가를 주는 것이 정상적인 사업 운영에 중대한 지장을 초래하는 경우에는 근로자와 협의하여 그 시기를 변경할 수 있다."}],"letters":false,"combo":false,"choices":[],"short":true,"ansText":"빈칸 ㄱ 6 · 빈칸 ㄴ 2 (주관식 단답형)","blanks":["6","2"],"core":"정답은 6일, 2일이다. 현행 난임치료휴가는 연간 6일 이내이고 최초 2일이 유급이다(23회 기출 당시 3일·최초 1일 유급에서 확대).","paras":[],"cites":["남녀고용평등법 제18조의3(난임치료휴가)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"난임치료휴가 6일(2일 유급) — 개정 전 3일(1일 유급)과 구분.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 72번","noAns":false,"stemBr":false,"tableRows":[]},{"intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"paras":[],"citeLabel":"관련 기준/법령","citeFirst":false,"terms":[{"t":"해고 예고","d":"사용자가 근로자를 해고하려면 적어도 30일 전에 예고해야 하고, 예고하지 않으면 30일분 이상의 통상임금을 지급해야 한다(근로기준법 제26조)."},{"t":"구제신청","d":"부당해고 등을 당한 근로자가 노동위원회에 그 구제를 신청하는 것으로, 3개월의 신청기간이 있다(근로기준법 제28조)."}],"extra":[],"pdf":[],"boxes":[],"noAns":false,"stemBr":false,"id":"r29-033","num":33,"part":"관리·법령","unit":"인사·노무관리","sub":"근로계약·해고·부당해고 구제","diff":"중","stem":"근로기준법상 근로계약에 관한 설명으로 옳은 것은?","choices":[{"n":"①","ans":false,"note":"옳지 않다. 사용자는 근로계약 불이행에 대한 위약금 또는 손해배상액을 예정하는 계약을 체결하지 못한다(근로기준법 제20조).","rnd":[],"art":"","mark":"X","text":"사용자는 근로계약 불이행에 대한 손해배상액을 예정하는 계약을 체결할 수 있다."},{"n":"②","ans":false,"note":"옳지 않다. 사용자는 근로자 명부와 근로계약에 관한 중요한 서류를 3년간 보존하여야 한다(근로기준법 제41조). 5년이 아니다.","rnd":[],"art":"","mark":"X","text":"사용자는 근로자 명부와 대통령령으로 정하는 근로계약에 관한 중요한 서류를 5년간 보존하여야 한다."},{"n":"③ function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), ms || 1600);
}

/* ── 상태 ─────────────────────────────────────────────────────────── */
function load(){
  const s = readJSON(LS, null);
  const def = {answers:{}, graded:{}, part:'전체', unit:'전체 단원', sub:'전체 세부',
               idx:0, view:'all', type:'all', star:0};
  if (!s || !s.answers) return def;
  const st = {answers:s.answers||{}, graded:s.graded||{}, idx:s.idx||0,
              view:['all','mark','wrong','fp','num'].indexOf(s.view) >= 0 ? s.view : 'all', type:s.type||'all',
              star:[0,1,2,3].indexOf(s.star) >= 0 ? s.star : 0,
              part:s.part || s.law || s.major || '전체'};
  const u = (typeof s.unit === 'string') ? s.unit : '';
  if (u && u !== '__all' && u.indexOf('|') > 0) {
    st.unit = u.split('|')[0];
    st.sub = u.split('|')[1] === '__all' ? '전체 세부' : u.split('|')[1];
  } else {
    st.unit = (u && u !== '__all') ? u : '전체 단원';
    st.sub = s.sub || '전체 세부';
  }
  return st;
}
function save(){ writeJSON(LS, state) }

state = load();
/* 옛 화면의 숫자 답(1~5)을 새 선지 기호(①~⑤)로 맞춘다 */
(function fixOldAnswers(){
  const map = {};
  DATA.forEach(q => { map[q.id] = q });
  Object.keys(state.answers || {}).forEach(k => {
    const q = map[k]; if (!q) return;
    const v = state.answers[k];
    if (typeof v === 'number' && q.choices && q.choices[v - 1]) state.answers[k] = q.choices[v - 1].n;
  });
})();
mistakes = readJSON(LSM, {}) || {};
marks = readJSON(LSK, {}) || {};
if (typeof marks !== 'object' || marks === null) marks = {};

/* 📌 핀 마킹 · ⭐ 자동 별표 · ⚠ 처음 고른 오답 ─── 4대 기능 ─── */
const LSF = LS + '_firstpick';                      // 처음 틀렸을 때 고른 선지
let firstPick = readJSON(LSF, {}) || {};
if (typeof firstPick !== 'object' || firstPick === null || Array.isArray(firstPick)) firstPick = {};
(function normFP(){
  const out = {};
  Object.keys(firstPick).forEach(k => {
    const e = firstPick[k];
    if (Array.isArray(e)) { if (e[0] || e[2]) out[k] = {n: e[0] || '', t: e[1] || 0, s: e[2] || ''}; }
    else if (e && typeof e === 'object' && (e.n || e.s)) out[k] = {n: e.n || '', t: e.t || 0, s: e.s || ''};
  });
  firstPick = out;
})();
/* 기능 배포 전에 쌓인 오답(mistakes) 중 firstPick이 없는 기록을 답안에서 되살린다 */
(function backfillFP(){
  let ch = false;
  Object.keys(mistakes).forEach(id => {
    if ((mistakes[id] || 0) <= 0 || firstPick[id]) return;
    const a = state.answers[id], g = state.graded[id];
    if (typeof a === 'string' && a) { firstPick[id] = {n: a, t: 0, back: 1}; ch = true; }
    else if (Array.isArray(a)) {
      const s = a.filter(x => x && String(x).trim()).join(' / ');
      firstPick[id] = s ? {n: '', s: s, t: 0, back: 1} : {n: '', s: '', t: 0, back: 1};
      ch = true;
    } else if (g === false) { firstPick[id] = {n: '', s: '', t: 0, back: 1}; ch = true; }
  });
  if (ch) writeJSON(LSF, firstPick);
})();
/* 자동 별표는 '누적 오답 횟수'에서 바로 계산한다(최대 ★★★).
   오답 기록(mistakes)은 이미 기기 간 동기화 대상이라 따로 저장할 것이 없다. */
function starLv(id){ return Math.min(3, mistakes[id] || 0); }
/* 틀림 기록: 오답 +1, 자동 별표, 그리고 '처음' 고른 선지만 남긴다. */
function markWrong(id, pick, shortAns){
  mistakes[id] = (mistakes[id] || 0) + 1;
  writeJSON(LSM, mistakes);
  if (!firstPick[id]) {
    var sAns = shortAns == null ? '' : String(shortAns);
    if (pick || sAns) {
      firstPick[id] = {n: pick || '', t: Date.now()};
      if (sAns) firstPick[id].s = sAns;
      writeJSON(LSF, firstPick);
    }
  }
  return starLv(id);
}

/* ── 오늘 푼 문제 (매일 새벽 6시 리셋) ─────────────────────────────── */
function dayKey(){
  const d = new Date(Date.now() - 6*3600*1000), p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function freshDay(){ return {day: dayKey(), ids: {}} }
function loadDaily(){
  let o = null;
  try { o = JSON.parse(localStorage.getItem(LSKD)) } catch(e){}
  if (!o || o.day !== dayKey()) o = freshDay();
  if (Array.isArray(o.ids)) {
    const right = Array.isArray(o.right) ? o.right : [], m = {};
    o.ids.forEach(k => { m[k] = right.indexOf(k) >= 0 ? 1 : 0 });
    o.ids = m;
  }
  if (!o.ids || typeof o.ids !== 'object') o.ids = {};
  return o;
}
let daily = loadDaily();
function saveDaily(){ try{ localStorage.setItem(LSKD, JSON.stringify(daily)) }catch(e){} }
function markDaily(id, ok){
  if (!id) return;
  if (daily.day !== dayKey()) daily = freshDay();
  daily.ids[id] = ok ? 1 : 0;
  saveDaily(); renderDaily();
}
function renderDaily(){
  const el = document.getElementById('todaybar'); if (!el) return;
  if (daily.day !== dayKey()) daily = freshDay();
  const ids = Object.keys(daily.ids || {});
  const n = ids.length, m = ids.filter(k => daily.ids[k] === 1).length;
  el.innerHTML = `<div class="tl">✏️ 오늘 푼 문제</div><div class="tv">${n}<small>문제</small></div>`
    + (n ? `<div class="ts">맞음 ${m} · 정답률 ${Math.round(m/n*100)}%</div>` : '');
}

/* ── 형광펜 ───────────────────────────────────────────────────────── */
const LSH = LS + '_highlights';
let hlOn = !!readJSON(LS + '_hlon', false);
let HLS = readJSON(LSH, {});
if (!HLS || typeof HLS !== 'object' || Array.isArray(HLS)) HLS = {};
let lastPaint = 0;

function hlStore(id){
  const s = HLS[id];
  return (s && typeof s === 'object' && !Array.isArray(s)) ? s : {};
}
function hlSave(){ writeJSON(LSH, HLS); }
function mergeHL(arr0){
  const a = (arr0 || []).map(r => [Math.max(0, Math.round(Number(r[0]))), Math.max(0, Math.round(Number(r[1])))])
    .filter(r => isFinite(r[0]) && isFinite(r[1]) && r[1] > r[0])
    .sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const out = [];
  a.forEach(r => {
    const last = out[out.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else out.push([r[0], r[1]]);
  });
  return out;
}
function locateText(root, offset){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let acc = 0, n;
  while ((n = w.nextNode())) {
    const len = n.nodeValue.length;
    if (offset <= acc + len) return {node: n, off: Math.max(0, offset - acc)};
    acc += len;
  }
  return null;
}
function unwrapMarks(zone){
  [].slice.call(zone.querySelectorAll('mark.user-hl')).forEach(m => {
    const p = m.parentNode;
    while (m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
  });
  zone.normalize();
}
function paintZone(zone, ranges){
  unwrapMarks(zone);
  const len = zone.textContent.length;
  const rs = mergeHL(ranges).map(r => [r[0], Math.min(r[1], len)]).filter(r => r[0] < len && r[1] > r[0]);
  for (let i = rs.length - 1; i >= 0; i--) {
    const s = rs[i][0], e = rs[i][1];
    const a = locateText(zone, s), b = locateText(zone, e);
    if (!a || !b) continue;
    const rg = document.createRange();
    try { rg.setStart(a.node, a.off); rg.setEnd(b.node, b.off); } catch (err) { continue; }
    const mk = document.createElement('mark');
    mk.className = 'user-hl';
    mk.dataset.range = s + '-' + e;
    try { rg.surroundContents(mk); }
    catch (err) {
      try { const frag = rg.extractContents(); mk.appendChild(frag); rg.insertNode(mk); } catch (err2) {}
    }
  }
}
function paintAllHL(){
  const q = list[cur]; if (!q) return;
  const store = hlStore(q.id);
  [].slice.call(document.querySelectorAll('#card [data-hl]')).forEach(z => {
    paintZone(z, store[z.dataset.hl] || []);
  });
}
function repaintKey(key){
  const q = list[cur]; if (!q) return;
  const z = document.querySelector('#card [data-hl="' + key + '"]');
  if (z) paintZone(z, hlStore(q.id)[key] || []);
}
function addRange(key, s, e){
  const q = list[cur];
  if (!q || !key || e <= s) return;
  const store = HLS[q.id] || (HLS[q.id] = {});
  store[key] = mergeHL((store[key] || []).concat([[s, e]]));
  hlSave(); lastPaint = Date.now(); repaintKey(key);
}
function dropRange(key, s, e){
  const q = list[cur]; if (!q) return;
  const store = HLS[q.id];
  if (!store || !store[key]) return;
  store[key] = mergeHL(store[key]).filter(r => !(r[0] === s && r[1] === e));
  if (!store[key].length) delete store[key];
  if (!Object.keys(store).length) delete HLS[q.id];
  hlSave(); lastPaint = Date.now(); repaintKey(key);
  toast('형광펜을 지웠습니다.', 1000);
}
function clearKey(key){
  const q = list[cur]; if (!q) return;
  const store = HLS[q.id];
  if (!store || !store[key]) return;
  delete store[key];
  if (!Object.keys(store).length) delete HLS[q.id];
  hlSave(); lastPaint = Date.now(); repaintKey(key);
  toast('형광펜을 지웠습니다.', 1000);
}
function toggleLine(key){
  const q = list[cur]; if (!q) return;
  const z = document.querySelector('#card [data-hl="' + key + '"]');
  if (!z) return;
  const len = z.textContent.length;
  if (!len) return;
  const cur0 = mergeHL(hlStore(q.id)[key] || []);
  const full = cur0.length === 1 && cur0[0][0] === 0 && cur0[0][1] >= len;
  if (full) clearKey(key);
  else { addRange(key, 0, len); toast('한 줄 전체를 칠했습니다.', 1100); }
}
function hlZoneOf(node){
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  return (el && el.closest) ? el.closest('#card [data-hl]') : null;
}
function textOffsetIn(zone, node, off){
  if (!zone.contains(node)) return null;
  const pre = document.createRange();
  pre.selectNodeContents(zone);
  try { pre.setEnd(node, off); } catch (err) { return null; }
  return pre.toString().length;
}
function hlSelection(){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  const z1 = hlZoneOf(r.startContainer), z2 = hlZoneOf(r.endContainer);
  if (!z1 || z1 !== z2) return null;
  const txt = z1.textContent;
  let s = textOffsetIn(z1, r.startContainer, r.startOffset);
  let e = textOffsetIn(z1, r.endContainer, r.endOffset);
  if (s == null || e == null) return null;
  while (s < e && /\s/.test(txt.charAt(s))) s++;
  while (e > s && /\s/.test(txt.charAt(e - 1))) e--;
  if (e <= s) return null;
  return {key: z1.dataset.hl, start: s, end: e};
}
function hideFloat(){
  const f = document.getElementById('hlfloat');
  if (f) f.classList.remove('show');
}
function updateFloat(){
  const f = document.getElementById('hlfloat');
  if (!f) return;
  if (!hlOn) { hideFloat(); return; }
  const hit = hlSelection();
  if (!hit) { hideFloat(); return; }
  const sel = window.getSelection();
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  f.classList.add('show');
  const w = f.offsetWidth || 130, h = f.offsetHeight || 42;
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
  let top = rect.bottom + 10;
  if (top + h > window.innerHeight - 8) top = Math.max(8, rect.top - h - 10);
  f.style.left = left + 'px';
  f.style.top = top + 'px';
}
function applyHLSelection(){
  const hit = hlSelection();
  if (!hit) return false;
  addRange(hit.key, hit.start, hit.end);
  const sel = window.getSelection();
  if (sel) sel.removeAllRanges();
  hideFloat();
  return true;
}
function onCardClick(e){
  if (!hlOn) return;
  if (Date.now() - lastPaint < 350) return;
  const t = e.target;
  const mk = (t && t.closest) ? t.closest('mark.user-hl') : null;
  if (mk) {
    const z = mk.closest('[data-hl]');
    const dr = String(mk.dataset.range || '').split('-');
    if (z && dr.length === 2) dropRange(z.dataset.hl, Number(dr[0]), Number(dr[1]));
    e.preventDefault(); e.stopPropagation();
    return;
  }
  const line = (t && t.closest) ? (t.closest('.bogi .bi') || t.closest('.opt') || t.closest('#card .exp [data-hl]')) : null;
  if (line) {
    const z = (line.matches && line.matches('[data-hl]')) ? line : line.querySelector('[data-hl]');
    if (z) { e.preventDefault(); toggleLine(z.dataset.hl); }
  }
}

/* ── 선택·필터 ─────────────────────────────────────────────────────── */
function unitsOfPart(){
  return META.units.filter(u => state.part === '전체' || u.part === state.part);
}
function matchBase(q){ return baseFilter(q); }
function baseFilter(q){
  if (state.part !== '전체' && q.part !== state.part) return false;
  if (state.unit && state.unit !== '전체 단원' && q.unit !== state.unit) return false;
  if (HAS_SUB && state.sub && state.sub !== '전체 세부' && q.sub !== state.sub) return false;
  if (HAS_SHORT && state.type && state.type !== 'all' && q.type !== state.type) return false;
  return true;
}
function matchView(q){
  if (state.view === 'mark') return !!marks[q.id];
  if (state.view === 'wrong') {
    const m = mistakes[q.id] || 0;
    if (m <= 0) return false;
    return !state.star || Math.min(3, m) === state.star;
  }
  if (state.view === 'fp') return !!firstPick[q.id];      // 내가 고른 오답
  if (state.view === 'num') return numRows(q).length > 0; // 핵심 숫자가 든 지문이 있는 문항
  return true;
}
function counts(){
  let mark = 0, wrong = 0, fp = 0, num = 0, s1 = 0, s2 = 0, s3 = 0;
  DATA.forEach(q => {
    if (!matchBase(q)) return;
    if (marks[q.id]) mark++;
    const m = mistakes[q.id] || 0;
    if (m > 0) { wrong++; const lv = Math.min(3, m); if (lv === 1) s1++; else if (lv === 2) s2++; else s3++; }
    if (firstPick[q.id]) fp++;
    if (numRows(q).length) num++;
  });
  return {mark, wrong, fp, num, s1, s2, s3};
}
function buildSelectors(){
  const sl = document.getElementById('selPart');
  sl.innerHTML = `<option value="전체">전체 PART (${DATA.length})</option>` +
    META.parts.map(p => `<option value="${esc(p.name)}">${esc(p.name)} (${p.n})</option>`).join('');
  if (state.part !== '전체' && !META.parts.some(p => p.name === state.part)) state.part = '전체';
  sl.value = state.part;

  const us = unitsOfPart();
  const su = document.getElementById('selUnit');
  const tot = us.reduce((a, u) => a + u.n, 0);
  su.innerHTML = `<option value="전체 단원">전체 단원 (11년간 ${tot}문제)</option>` +
    us.map(u => `<option value="${esc(u.name)}">${esc(u.name)} (11년간 ${u.n}문제)</option>`).join('');
  if (!us.some(u => u.name === state.unit)) state.unit = '전체 단원';
  su.value = state.unit;

  const ss = document.getElementById('selSub');
  if (ss) {
    const cu = us.find(u => u.name === state.unit);
    if (cu && cu.subs && cu.subs.length) {
      ss.style.display = '';
      const sn = cu.subs.reduce((a, s) => a + s.n, 0);
      ss.innerHTML = `<option value="전체 세부">전체 세부 (${sn}문제)</option>` +
        cu.subs.map(s => `<option value="${esc(s.name)}">${esc(s.name)} (${s.n}문제)</option>`).join('');
      if (!cu.subs.some(s => s.name === state.sub)) state.sub = '전체 세부';
      ss.value = state.sub;
    } else {
      ss.style.display = 'none';
      state.sub = '전체 세부';
    }
    ss.onchange = () => { state.sub = ss.value; state.idx = 0; buildSelectors(); rebuild(); };
  }

  const st = document.getElementById('selType');
  if (st && HAS_SHORT) {
    st.value = state.type || 'all';
    st.onchange = () => { state.type = st.value; state.idx = 0; buildSelectors(); rebuild(); };
  }

  const sv = document.getElementById('selView');
  if (sv) {
    const c = counts();
    sv.innerHTML = `<option value="all">전체 문제 (${DATA.filter(matchBase).length})</option>` +
      `<option value="mark">📌 핀 마킹한 문제 (${c.mark})</option>` +
      `<option value="wrong">✗ 틀린 문제 (${c.wrong})</option>` +
      `<option value="fp">⚠ 내가 고른 오답 (${c.fp})</option>` +
      `<option value="num">🔢 숫자 전용 (${c.num})</option>`;
    sv.value = state.view || 'all';
    sv.onchange = () => { state.view = sv.value; state.idx = 0; rebuild(); };
  }
  renderModeTabs();

  sl.onchange = () => { state.part = sl.value; state.unit = '전체 단원'; state.sub = '전체 세부'; state.idx = 0; buildSelectors(); rebuild(); };
  su.onchange = () => { state.unit = su.value; state.sub = '전체 세부'; state.idx = 0; buildSelectors(); rebuild(); };
}

function rebuild(){
  list = DATA.filter(q => baseFilter(q) && matchView(q));
  cur = Math.min(state.idx || 0, Math.max(0, list.length - 1));
  state.idx = cur;
  if (state.view === 'fp') renderWrongList();
  else if (state.view === 'num') renderNumList();
  else render();
  renderGrid(); renderScore();
}

/* ── 상단 보기 탭 (전체 / 핀 마킹 / 틀린 문제 / 내가 고른 오답 / 숫자 전용) ── */
const VIEWS = [
  {v:'all',   ic:'📚', lb:'전체',          cls:''},
  {v:'mark',  ic:'📌', lb:'핀 마킹',        cls:''},
  {v:'wrong', ic:'✗',  lb:'틀린 문제',      cls:''},
  {v:'fp',    ic:'⚠',  lb:'내가 고른 오답', cls:'viewfp '},
  {v:'num',   ic:'🔢', lb:'숫자 전용',      cls:'viewnum '}
];
function renderModeTabs(){
  const box = document.getElementById('modeTabs');
  if (!box) return;
  const c = counts();
  const num = {all: DATA.filter(matchBase).length, mark: c.mark, wrong: c.wrong, fp: c.fp, num: c.num};
  box.innerHTML = VIEWS.map(o =>
    `<button type="button" class="mtab ${o.cls}${state.view === o.v ? 'on' : ''}" data-view="${o.v}">` +
    `<span class="ic">${o.ic}</span><span class="lb">${o.lb}</span><span class="cnt">${num[o.v]}</span></button>`).join('');
  box.querySelectorAll('.mtab').forEach(b => {
    b.onclick = () => {
      if (state.view === b.dataset.view) return;
      state.view = b.dataset.view; state.star = 0; state.idx = 0; save();
      buildSelectors(); rebuild();
      window.scrollTo({top: 0, behavior: 'smooth'});
    };
  });
  renderStarTabs();
}

/* ✗ 틀린 문제 — 자동 별표 개수별 필터 칩 */
function renderStarTabs(){
  const box = document.getElementById('modeTabs');
  if (!box) return;
  let el = document.getElementById('starTabs');
  if (state.view !== 'wrong') { if (el && el.parentNode) el.parentNode.removeChild(el); return; }
  const c = counts();
  if (!el) {
    el = document.createElement('div');
    el.id = 'starTabs'; el.className = 'startabs';
    const host = (box.closest && box.closest('.moderow')) || box;
    host.parentNode.insertBefore(el, host.nextSibling);
  }
  const opts = [{v:0, lb:'전체', n:c.wrong}, {v:1, lb:'★ 1회', n:c.s1}, {v:2, lb:'★★ 2회', n:c.s2}, {v:3, lb:'★★★ 3회+', n:c.s3}];
  el.innerHTML = opts.map(o => `<button type="button" class="stab${state.star === o.v ? ' on' : ''}" data-star="${o.v}">` +
    `<span class="sl">${o.lb}</span><span class="sn">${o.n}</span></button>`).join('');
  el.querySelectorAll('.stab').forEach(b => {

/* ── 🔢 숫자 전용: 핵심 숫자가 들어 있는 지문만 ──────────────────────────
   기간·비율·면적·금액 같은 함정 숫자만 '핵심 숫자'로 본다.
   조문번호(제12조)·회차(제29회)·항목번호(1))·단위 없는 한 자리 숫자는 세지 않는다. */
const NUM_UNIT = '제곱미터|평방미터|킬로미터|퍼센트|개월|시간|세대|만원|미터|㎡|평|년|월|일|회|층|호|명|km|cm|mm|%|배|원|억|만|천|점|개|곳|대|종|도|주|초|분|톤|kg|리터|ℓ';
const NUM_RE = new RegExp('(\\d[\\d,.]*(?:\\s*분의\\s*\\d[\\d,.]*)?)(\\s*)(' + NUM_UNIT + ')?', 'g');
const NUMCACHE = {};
function numSpans(t){
  const out = [];
  if (!t) return out;
  const re = new RegExp(NUM_RE.source, 'g');
  let m;
  while ((m = re.exec(t))) {
    const tok = m[0].replace(/\s+$/, ''), start = m.index, unit = m[3] || '';
    const digits = m[1].replace(/[^0-9]/g, '');
    const prev = start > 0 ? t.charAt(start - 1) : '';
    const next = t.charAt(start + tok.length);
    if (!digits) continue;
    if (prev === '제') continue;                       // 제12조 · 제29회
    if (!unit && /[조항목]/.test(next)) continue;       // 12조 · 1항
    if (/[.,]\s*$/.test(m[0])) continue;                // 날짜·목록 구분자(2020. 3. 2.)
    if (/^[.,)]/.test(next)) continue;                  // 1) 항목번호
    if (!unit && next === '번') continue;               // 1번
    if (!unit && digits.length < 2) continue;           // 단위 없는 한 자리
    out.push({s: start, e: start + tok.length, tx: tok});
  }
  return out;
}
function hasKeyNum(t){ return numSpans(t).length > 0; }
/* 그 문항에서 '숫자가 든 지문'만 골라낸다(선지 → 없으면 단답 답안) */
function numRows(q){
  if (!q) return [];
  if (NUMCACHE[q.id]) return NUMCACHE[q.id];
  const out = [];
  (q.choices || []).forEach(c => {
    if (c.text && hasKeyNum(c.text))
      out.push({n: c.n, tx: c.text, mk: c.mark || (c.ans ? 'O' : 'X'), ans: !!c.ans});
  });
  if (!out.length && (q.blanks || []).length) {
    q.blanks.forEach((b, i) => {
      if (b && hasKeyNum(b))
        out.push({n: q.blanks.length > 1 ? '빈칸' + (i + 1) : '답', tx: b, mk: '정답', ans: true});
    });
  }
  if (!out.length) {                       // 선지에 숫자가 없으면 해설 핵심 문장에서
    [q.core].concat(q.paras || []).forEach(p => {
      if (p && hasKeyNum(p)) out.push({n: '해설', tx: p, mk: '', ans: false});
    });
  }
  NUMCACHE[q.id] = out;
  return out;
}
function renderNumList(){
  const card = document.getElementById('card');
  card.classList.add('plain');
  let rows = 0;
  list.forEach(q => { rows += numRows(q).length; });
  if (!list.length) {
    card.innerHTML = `<div class="empty">핵심 숫자가 들어 있는 문제가 없습니다.<br>위의 단원·유형 조건을 바꿔 보세요.</div>`;
  } else {

      `<span class="d">핵심 숫자(기간·비율·면적·금액)가 든 지문만 모았습니다 · ${list.length}문항 ${rows}지문</span></div>` +
      `<div class="wrongwrap">` + list.map(numCard).join('') + `</div>` +
      `<div class="wfoot">회색 상자를 누르면 숫자가 열립니다 · 각 문항의 ‘정답 보기’로 O·X와 해설을 확인하세요.</div>`;
    applyNumMask(card);
    card.querySelectorAll('.nbtn').forEach(b => {
      b.onclick = () => {

function numCard(q){
  const lv = starLv(q.id);
  const rs = numRows(q);

  const rows = rs.map((r, i) =>

/* 숫자를 회색 상자로 덮는다 — 이 화면(🔢 숫자 전용)에서만 쓴다 */
const MASK_SKIP = 'span.n,mark.user-hl,.b,.mtab,#progtxt,.num,.wtop,.nbtn,.ox,.wlab,.wfoot,.fphead';
function maskOneNode(node){
  const t = node.nodeValue;
  const hits = numSpans(t);
  if (!hits.length) return;
  const frag = document.createDocumentFragment();
  let pos = 0;
  hits.forEach(h => {
    if (h.s > pos) frag.appendChild(document.createTextNode(t.slice(pos, h.s)));
    const b = document.createElement('span');
    b.className = 'n'; b.textContent = h.tx;
    frag.appendChild(b);
    pos = h.e;
  });
  if (pos < t.length) frag.appendChild(document.createTextNode(t.slice(pos)));
  node.parentNode.replaceChild(frag, node);
}
function applyNumMask(root){
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let nd;
  while ((nd = w.nextNode())) {
    const p = nd.parentElement;
    if (!p || p.closest(MASK_SKIP)) continue;
    if (!nd.nodeValue || !/\d/.test(nd.nodeValue)) continue;
    nodes.push(nd);
  }
  nodes.forEach(maskOneNode);
}
