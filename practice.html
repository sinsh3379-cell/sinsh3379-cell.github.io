<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<title>주택관리사 2차 공동주택관리실무 CBT — 19~29회 11개년 437제</title>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --navy:#123a63; --navy2:#1d4f80;
  --line:#dfe4ec; --muted:#6b7787; --green:#1f6b41; --greenbg:#eaf7ef; --greenline:#bfe3cc;
  --red:#a8382f; --redbg:#fdeeec; --redline:#f3c9c4;
  --sel:#dbe7f6; --gold:#b8860b; --goldbg:#fff7e0;
  --sang:#a8382f; --jung:#8a6100; --ha:#1f6b41;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#151c28;
  font-family:'Noto Sans KR','Noto Sans CJK KR',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:30;background:#f7f9fc;border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font-weight:800;color:var(--navy);font-size:16px;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.progwrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.progtxt{font-size:13px;color:#33405a;white-space:nowrap;font-variant-numeric:tabular-nums}
.progbar{flex:1;height:9px;background:#dfe4ee;border-radius:99px;overflow:hidden;min-width:40px}
.progfill{height:100%;width:0;background:var(--navy2);border-radius:99px;transition:width .2s}
.tbtn{appearance:none;border:1px solid #cfd6e2;background:#fff;color:#22314c;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tbtn:active{background:#eef2f8}
.selrow{position:sticky;top:53px;z-index:25;background:#e9edf4;border-bottom:1px solid var(--line)}
.selin{max-width:1120px;margin:0 auto;display:flex;gap:8px;padding:8px 18px;align-items:center;flex-wrap:wrap}
select{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:10px;padding:9px 30px 9px 12px;
  font-size:14px;font-weight:600;color:#22314c;max-width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7787' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}
.shell{display:flex;align-items:flex-start;justify-content:center;max-width:1500px;margin:0 auto}
.shell > .wrap{flex:1 1 auto;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px;
  box-shadow:0 1px 2px rgba(18,58,99,.05)}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qno{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.35}
.qmain{flex:1;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.b{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:800}
.b.round{background:#123a63;color:#fff}
.b.new{background:#7a3d00;color:#fff}
.b.diff{border:1px solid}
.b.d-sang{color:var(--sang);background:#fdeeec;border-color:#f0c8c3}
.b.d-jung{color:var(--jung);background:#fff6dd;border-color:#ecd9a3}
.b.d-ha{color:var(--ha);background:#eaf7ef;border-color:#bfe3cc}
.b.miss{color:var(--red);background:#fdeeec;border-color:#f0c8c3}
.star{margin-left:auto;appearance:none;border:1px solid #e2d2a4;background:#fffdf5;color:#c9a227;
  width:48px;height:44px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer}
.star.on{background:var(--goldbg);border-color:#e0bd52;color:#d29b00}
.qtools{display:flex;gap:8px;align-items:flex-start;flex:0 0 auto;margin-left:auto}
.hlbtn{appearance:none;border:1px solid #e3d3a6;background:#fffdf5;color:#8a6100;height:44px;
  padding:0 13px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.hlbtn:active{background:#fdf3cf}
.hlbtn.on{background:#fff0a0;border-color:#d9a800;color:#6b4f00;box-shadow:0 0 0 2px rgba(255,214,0,.22)}
body.hlmode .opt{cursor:text}
.hlz{-webkit-user-select:text;user-select:text}
mark.user-hl{background:#ffe95c;color:inherit;padding:0;border-radius:2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
body.hlmode mark.user-hl{cursor:pointer}
body.hlmode .hlz ::selection,body.hlmode .hlz::selection{background:#bcd8ff}
.hlfloat{position:fixed;left:0;top:0;z-index:70;display:none;appearance:none;border:none;
  background:#2a2205;color:#fff;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800;
  box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.hlfloat.show{display:inline-flex;align-items:center;gap:6px}
.stem{font-size:25px;line-height:1.5;font-weight:700;letter-spacing:-.2px}
.intro{font-size:21px;line-height:1.6;color:#1b2536;margin:10px 0 0}
.bogi{margin:16px 0 4px;border:1px solid #dbe2ee;background:#f7f9fd;border-radius:14px;padding:16px 18px}
.bogi .bi{display:flex;gap:10px;font-size:23px;line-height:1.55;padding:5px 0}
.bogi .bi + .bi{border-top:1px dashed #e2e8f2}
.bogi .k{flex:0 0 auto;font-weight:800;color:var(--navy2);min-width:22px}
.bogi.law{background:#fbfbf7;border-color:#e6e2d2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:780px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #dbe2ee;background:#fff;border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:#f6f9ff}
.opt .num{flex:0 0 auto;font-weight:800;color:var(--navy2);font-size:21px;line-height:1.4}
.opt .txt{font-size:22px;line-height:1.5}
.opt.selected{border-color:var(--navy2);background:var(--sel)}
.opt.correct{border-color:var(--green);background:var(--greenbg)}
.opt.wrongpick{border-color:var(--red);background:var(--redbg)}
.opt .tag{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--green);white-space:nowrap;padding-top:4px}
.opt.wrongpick .tag{color:var(--red)}
.tblwrap{overflow:auto;margin:12px 0}
.tblwrap table{border-collapse:collapse;width:100%;font-size:18px}
.tblwrap th,.tblwrap td{border:1px solid #dbe2ee;padding:7px 10px;text-align:center}
.tblwrap th{background:#f2f5fa;font-weight:800}
.qimg{max-width:100%;height:auto;display:block;margin:12px auto;border:1px solid #e2e8f2;border-radius:10px}
.shortbox{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px}
.srow .lab{font-weight:800;color:var(--navy2);font-size:17px;min-width:52px}
.sinput{flex:1;border:1.5px solid #cfd6e2;border-radius:12px;padding:12px 14px;font-size:20px;font-family:inherit}
.sinput:focus{outline:none;border-color:var(--navy2);background:#f6f9ff}
.sbtn{align-self:flex-start}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:12px;padding:12px 22px;
  font-size:16px;font-weight:700;color:#22314c;cursor:pointer}
.actions .btn:active{background:#eef2f8}
.actions .btn.primary{border-color:var(--navy2);background:var(--navy2);color:#fff}
.result{margin-top:16px;border-radius:12px;padding:14px 18px;font-size:20px;font-weight:800;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.result.ok{background:var(--greenbg);border:1px solid var(--greenline);color:var(--green)}
.result.no{background:var(--redbg);border:1px solid var(--redline);color:var(--red)}
.result.warn{background:#fff7e0;border:1px solid #ecd9a3;color:#8a6100}
.retry{margin-left:auto;appearance:none;border:1px solid currentColor;background:transparent;color:inherit;
  border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;opacity:.85}
.exp{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.core{font-size:20px;line-height:1.68;color:#1b2536;margin:8px 0}
.notes{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:19px;line-height:1.6;padding:10px 12px;
  border-radius:10px;background:#f8fafd;border:1px solid #e6ecf5}
.note.on{background:var(--greenbg);border-color:var(--greenline)}
.note .no{flex:0 0 auto;font-weight:800;color:var(--navy2)}
.note .mk{flex:0 0 auto;font-weight:900;font-size:17px;width:20px;text-align:center}
.note .mk.O{color:var(--green)} .note .mk.X{color:var(--red)}
.note .tx{flex:1;min-width:0}
.note .rd{color:#7b8798;font-size:15px;font-weight:700;white-space:nowrap;margin-left:4px}
.cites{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cites .lab{font-size:14px;font-weight:800;color:var(--muted)}
.chip{display:inline-block;border:1px solid #d7dfea;background:#f2f5fa;border-radius:8px;padding:5px 10px;
  font-size:15px;font-weight:700;color:#2a3a52}
.keybox{margin-top:14px;border:1px solid #e5d8b0;background:var(--goldbg);border-radius:12px;padding:12px 14px;
  font-size:18px;line-height:1.6}
.keybox b{color:#8a6100}
.termbox{margin-top:12px;border:1px solid #dbe2ee;background:#f7f9fd;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.termbox b{color:var(--navy2)}
.termbox div + div{margin-top:4px}
.addbox{margin-top:12px;border:1px solid #d9e2ef;background:#f4f8ff;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.addbox .lab{font-weight:800;color:var(--navy2);margin-bottom:4px;display:block}
.pdfbox{margin-top:12px;border:1px dashed #cfd6e2;background:#fbfcfe;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.pdfbox .h{font-weight:800;color:var(--navy2);margin-bottom:4px}
.amendbox{margin-top:12px;border:1px solid #d9e2ef;background:#f4f8ff;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.amendbox .h{font-weight:800;color:var(--navy2);margin-bottom:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:#fff;border-left:1px solid var(--line);
  box-shadow:-8px 0 24px rgba(18,58,99,.12);transform:translateX(102%);transition:transform .18s ease;z-index:50;
  display:flex;flex-direction:column;padding:14px}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dhead .t{font-weight:800;font-size:16px;color:var(--navy)}
.dclose{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;overflow:auto;padding:2px 2px 10px;flex:1;align-content:start}
.gi{position:relative;border:1px solid #dbe2ee;background:#fff;border-radius:9px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:700;color:#2a3a52;cursor:pointer;font-variant-numeric:tabular-nums}
.gi.done{background:var(--greenbg);border-color:var(--greenline);color:var(--green)}
.gi.bad{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.gi.cur{outline:2.5px solid var(--navy2);outline-offset:1px}
.gi .st{position:absolute;top:-5px;right:-4px;font-size:12px;color:#d29b00}
.gi .mc{position:absolute;bottom:-4px;right:2px;font-size:10.5px;font-weight:900;color:var(--red);background:#fff;border-radius:6px;padding:0 3px}
.today{padding:10px 0 8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13.5px;color:#33405a}
.today .tl{font-weight:800;color:var(--navy)}
.today .tv{font-weight:800;font-size:15px;color:var(--navy2)}
.today .ts{color:var(--muted);font-size:13px}
.score{padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:#33405a;line-height:1.7}
.score b{color:var(--navy)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:17px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2536;color:#fff;padding:11px 18px;
  border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  .brand small{display:none}
  .stem{font-size:21px}
  .intro{font-size:18px}
  .bogi .bi{font-size:19px}
  .opt .txt{font-size:19px}
  .core{font-size:18px}
  .note{font-size:18px}
  .tblwrap table{font-size:16px}
}
@media (max-width:620px){
  .topin{gap:8px;padding:8px 12px}
  .brand{font-size:13.5px}
  .progtxt{font-size:11.5px}
  .progbar{min-width:20px}
  .tbtn{padding:8px 10px;font-size:13px}
  .selrow{top:48px}
  .qhead{flex-wrap:wrap;row-gap:8px}
  .qno{order:1} .qtools{order:2} .qmain{order:3;flex:1 1 100%}
  .hlbtn{padding:0 11px;font-size:14.5px;height:42px}
  .star{height:42px;width:46px;font-size:20px}
  .note{display:grid;grid-template-columns:auto auto 1fr;
        grid-template-areas:"no mk tx" ". . rd";column-gap:8px;row-gap:1px;font-size:17px}
  .note .no{grid-area:no} .note .mk{grid-area:mk} .note .tx{grid-area:tx;flex:none}
  .note .rd{grid-area:rd;text-align:right;padding-top:0;white-space:normal;font-size:13.5px}
  .card{padding:16px}
}
@media (min-width:1000px){
  .stem{font-size:27px}
  .opt .txt{font-size:23px}
  .bogi .bi{font-size:25px}
}
/* ── 태블릿 가로·데스크톱: 오른쪽 사이드바를 상시 고정 ── */
@media (min-width:960px){
  .drawer{position:sticky;top:104px;left:auto;right:auto;bottom:auto;transform:none;
    flex:0 0 322px;width:322px;height:auto;max-height:calc(100vh - 120px);z-index:5;
    margin:16px 18px 40px 0;padding:16px;border:1px solid var(--line);border-radius:16px;
    background:#fff;box-shadow:0 1px 2px rgba(18,58,99,.05);overflow:hidden}
  .drawer .dclose{display:none}
  #btnList{display:none}
  .drawer .today{order:-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 9px;
    border-top:none;border-bottom:1px solid var(--line);padding:0 2px 12px;margin:0 0 12px}
  .drawer .today .tl{font-size:15.5px;font-weight:800;color:var(--navy)}
  .drawer .today .tv{font-size:33px;font-weight:800;color:var(--navy2);line-height:1.1;
    font-variant-numeric:tabular-nums}
  .drawer .today .tv small{font-size:15px;font-weight:800;margin-left:3px}
  .drawer .today .ts{font-size:13px;color:var(--muted);width:100%}
  .drawer .dhead{margin-bottom:10px}
  .drawer .dhead .t{font-size:16.5px}
  .drawer .grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .drawer .gi{height:44px;font-size:15px}
}
@media (max-width: 768px) {
  html, body { font-size: 13px !important; }
  .wrap { padding: 6px 10px 40px !important; }
  .card { padding: 12px 14px 10px !important; border-radius: 12px !important; }
  .topin { padding: 6px 12px !important; gap: 8px !important; }
  .brand { font-size: 13px !important; }
  .brand small { display: none !important; }
  .selin { padding: 6px 12px !important; gap: 4px !important; }
  select { padding: 6px 26px 6px 8px !important; font-size: 12px !important; border-radius: 8px !important; }
  .qhead { gap: 8px !important; margin-bottom: 8px !important; }
  .qno { font-size: 18px !important; line-height: 1.2 !important; }
  .qmeta { margin-bottom: 4px !important; gap: 4px !important; }
  .b { padding: 2px 6px !important; font-size: 11px !important; }
  .stem { font-size: 15px !important; line-height: 1.35 !important; letter-spacing: -0.3px !important; }
  .hlbtn, .star { height: 32px !important; padding: 0 8px !important; font-size: 13px !important; border-radius: 8px !important; }
  .star { width: 36px !important; font-size: 16px !important; }
  .opts { grid-template-columns: 1fr !important; gap: 6px !important; margin-top: 10px !important; }
  .opt { padding: 8px 10px !important; border-radius: 10px !important; gap: 8px !important; }
  .opt .num { font-size: 15px !important; line-height: 1.2 !important; }
  .opt .txt { font-size: 14px !important; line-height: 1.35 !important; }
  .actions { margin-top: 10px !important; gap: 6px !important; }
  .actions .btn { padding: 8px 14px !important; font-size: 13px !important; border-radius: 8px !important; }
  .exp { margin-top: 10px !important; padding-top: 10px !important; }
  .core { font-size: 14px !important; line-height: 1.4 !important; margin: 4px 0 !important; }
  .note { font-size: 13px !important; padding: 6px 8px !important; margin-top: 6px !important; }
}
@media (max-width: 768px) {
  .intro { font-size: 14px !important; line-height: 1.4 !important; margin: 6px 0 0 !important; }
  .bogi { margin: 8px 0 4px !important; padding: 8px 10px !important; border-radius: 10px !important; }
  .bogi .bi { font-size: 14px !important; line-height: 1.35 !important; padding: 3px 0 !important; gap: 6px !important; }
  .bogi .k { min-width: 14px !important; }
  .tblwrap { margin: 6px 0 !important; }
  .tblwrap table { font-size: 12px !important; }
  .tblwrap th, .tblwrap td { padding: 4px 6px !important; }
  .keybox { font-size: 13px !important; padding: 8px 10px !important; margin-top: 8px !important; }
}


/* ☁️ 기기 간 동기화 상태 표시 (아주 작게) */
.syn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  color:#4a5a72;background:#eef2f8;border:1px solid #dbe2ee;border-radius:99px;padding:3px 9px;
  white-space:nowrap;cursor:pointer;user-select:none;line-height:1.45;font-family:inherit}
.syn.ok{color:#1f6b41;background:#eaf7ef;border-color:#bfe3cc}
.syn.wait{color:#8a6100;background:#fff7e0;border-color:#ecd9a3}
.syn.err{color:#a8382f;background:#fdeeec;border-color:#f3c9c4}
@media (max-width:768px){.syn{font-size:10px;padding:2px 6px;gap:2px}}
@media (max-width:430px){.syn{padding:2px 5px}.syn.ok .synt{display:none}}

/* ═══ 4대 기능: 📌 핀 마킹 · ⭐ 자동 별표 · ⚠ 내가 고른 오답 · 🔢 숫자 전용 ═══ */
.b.auto{letter-spacing:1.5px;border:1px solid #e7c96a;background:#fff8e1;color:#a2700a}
.b.auto.s3{border-color:#e8a49c;background:#fdeeec;color:#a8382f}
.b.auto.s2{border-color:#eccf92;background:#fffaf0;color:#8a6100}

/* ── 상단 보기 탭 (전체 / 핀 마킹 / 틀린 문제 / 내가 고른 오답 / 숫자 전용) ── */
.selin.moderow{padding-top:0 !important;padding-bottom:7px !important;gap:0 !important}
.modetabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.mtab{appearance:none;border:1px solid #cfd6e2;background:#fff;color:#22314c;border-radius:99px;
  padding:7px 12px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;line-height:1.2;font-variant-numeric:tabular-nums}
.mtab:active{background:#eef2f8}
.mtab.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.mtab .cnt{font-size:12px;font-weight:800;opacity:.62}
.mtab.on .cnt{opacity:.88}
.mtab.viewfp{border-color:#e8c9c4;color:#a8382f;background:#fdf3f1}

하는 데 동의한 연도에는 회계감사를 받지 아니할 수 있다.","ans":true,"mark":"X","note":"면제 요건은 3분의 1이 아니라 입주자등 과반수의 서면동의다(500세대 미만에 한함).","rnd":[],"art":""},{"n":"④","text":"관리주체는 다음 회계연도에 관한 관리비등의 사업계획 및 예산안을 매 회계연도 개시 1개월 전까지 입주자대표회의에 제출하여 승인을 받아야 한다.","ans":false,"mark":"O","note":"예산안은 회계연도 개시 1개월 전까지 제출해 승인을 받는다.","rnd":[],"art":""},{"n":"⑤","text":"관리주체는 관리비등을 입주자대표회의가 지정하는 금융기관에 예치하여 관리하되, 장기수선충당금은 별도의 계좌로 예치ㆍ관리하여야 한다.","ans":false,"mark":"O","note":"장기수선충당금은 별도 계좌로 예치·관리한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"300세대 이상 공동주택은 회계감사 대상이지만, 500세대 미만 단지에서 입주자등 과반수가 서면동의한 연도에는 감사를 받지 않을 수 있다. '3분의 1 이상 동의'라고 한 ③이 틀렸다. 관리비 부담, 관리비예치금 정산, 예산안 제출, 별도 계좌 예치에 관한 설명은 옳다.","paras":[],"cites":["공동주택관리법 제23조 · 제26조 · 제27조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"감사 면제는 '500세대 미만 + 입주자등 과반수 서면동의'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제19회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"19-31","round":19,"num":31,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"공동주택의 행위허가와 신고(용도변경·파손·철거)","type":"mc","stem":"주택법령상 공동주택의 행위허가 또는 신고의 기준 중 허가기준을 정하고 있지 않는 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"입주자 공유가 아닌 복리시설의 용도변경","ans":true,"mark":"X","note":"용도변경은 신고 대상이어서 허가기준이 없다.","rnd":[],"art":""},{"n":"②","text":"입주자 공유가 아닌 복리시설의 철거","ans":false,"mark":"O","note":"철거는 허가 대상이다.","rnd":[],"art":""},{"n":"③","text":"입주자 공유가 아닌 복리시설의 대수선","ans":false,"mark":"O","note":"대수선은 허가 대상이다.","rnd":[],"art":""},{"n":"④","text":"부대시설 및 입주자 공유인 복리시설의 대수선","ans":false,"mark":"O","note":"부대시설·입주자 공유 복리시설의 대수선은 허가 대상이다.","rnd":[],"art":""},{"n":"⑤","text":"공동주택의 대수선","ans":false,"mark":"O","note":"공동주택의 대수선은 허가 대상이다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"입주자 공유가 아닌 복리시설의 용도변경은 '신고' 대상이므로 허가기준이 없다. 공동주택의 대수선, 부대시설·입주자 공유인 복리시설의 대수선, 복리시설의 철거는 허가기준이 정해져 있다.","paras":[],"cites":["공동주택관리법 제20조(행위허가 및 신고) · 같은 법 시행령 제22조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"허가 = 대수선·증축·개축·철거 / 신고 = 용도변경·용도폐지 등.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제19회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"19-32","round":19,"num":32,"part":"관리·법령","unit":"관리비와 회계관리","sub":"관리비등과 관리비예치금(비목·구분징수·사용료 대행 납부)","type":"mc","stem":"주택법령상 의무관리대상 공동주택의 관리비등에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리주체는 장기수선충당금에 대하여 관리비와 구분하여 징수하여야 한다.","ans":false,"mark":"O","note":"장기수선충당금은 관리비와 구분해 징수한다.","rnd":[],"art":""},{"n":"②","text":"관리주체는 주민운동시설, 인양기 등 공용시설물의 사용료를 해당 시설의 사용자에게 따로 부과할 수 있다.","ans":false,"mark":"O","note":"주민공동시설·인양기 등 사용료는 이용자에게 따로 부과할 수 있다.","rnd":[],"art":""},{"n":"③","text":"관리주체는 보수를 요하는 시설이 2세대 이상의 공동사용에 제공되는 것인 경우에는 이를 직접 보수하고, 당해 입주자등에게 그 비용을 따로 부과할 수 있다.","ans":false,"mark":"O","note":"2세대 이상이 공동사용하는 시설은 직접 보수하고 비용을 따로 부과할 수 있다.","rnd":[],"art":""},{"n":"④","text":"관리주체는 입주자 및 사용자가 납부하는 가스사용료 등을 입주자 및 사용자를 대행하여 그 사용료 등을 받을 자에게 납부할 수 있다.","ans":false,"mark":"O","note":"가스사용료 등은 대행하여 받을 자에게 납부할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"관리주체는 모든 거래 행위에 관하여 장부를 월별로 작성하여 그 증빙서류와 함께 해당 회계연도 종료일부터 3년간 보관하여야 한다.","ans":true,"mark":"X","note":"보관기간은 3년이 아니라 5년이다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"장부와 증빙서류의 보관기간은 회계연도 종료일부터 5년이다. '3년'이라고 한 ⑤가 틀렸다. 장기수선충당금의 구분 징수, 공용시설 사용료 부과, 2세대 이상 공동사용 시설의 보수·비용 부과, 사용료 대행 납부는 옳다.","paras":[],"cites":["공동주택관리법 제23조 · 제27조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"장부·증빙 보관은 5년 — 3년·1년으로 바꾼 지문이 단골.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제19회 32번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"19-33","round":19,"num":33,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"관리비등의 집행을 위한 사업자 선정과 사업계획·예산","type":"mc","stem":"주택법령상 입주자대표회의가 사업자를 선정하고 집행하는 사항은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"ㄱ.","tx":"청소, 경비, 소독, 승강기유지, 지능형 홈네트워크 등을 위한 용역 및 공사"},{"mk":"ㄴ.","tx":"주민운동시설의 만원 이하 과태료다(2026.6.3. 시행, 제102조제4항제9호). 제19회 당시에는 500만원이었다.","rnd":[],"art":""},{"n":"⑤","text":"의무관리대상 공동주택의 관리주체가 주택관리업자 또는 사업자와 계약을 체결한 후 1개월 이내에 그 계약서를 공개하지 아니하거나 거짓으로 공개한 경우","ans":false,"mark":"X","note":"계약서 미공개도 ②보다 낮은 금액이다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"하자보수보증금을 법원의 재판 결과에 따른 하자보수비용 외의 목적으로 사용한 경우는 과태료 금액이 가장 무거운 위반행위다. 장기수선계획에 따른 교체·보수 불이행, 장기수선충당금 미적립, 교육 미이수, 계약서 미공개는 이보다 낮은 과태료가 부과된다. 교육 미이수 과태료는 2026.6.3. 시행 개정으로 500만원에서 300만원으로 낮아졌다.","paras":[],"cites":["공동주택관리법 제98조(과태료) · 같은 법 시행령 별표"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"과태료 최고액은 '하자보수보증금 목적 외 사용'.","terms":[],"extra":[],"pdf":[],"boxes":[{"head":"[올해(2026) 시행] 법령 변경 유의","body":"<b>2026.6.3. 시행</b> 「공동주택관리법」 개정(법률 제21166호)으로 교육 미이수 과태료가 500만원 이하에서 <b>300만원 이하</b>(제102조제4항제9호)로 낮아졌습니다. ④에 적힌 '500만원'은 제19회 당시 기준이고, 정답 ②(하자보수보증금 목적 외 사용)는 그대로입니다.","html":true}],"diff":"하","roundLabel":"제19회 34번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"19-35","round":19,"num":35,"part":"관리·법령","unit":"공동주거관리 이론과 공동주택의 이해","sub":"공동주거관리의 의의와 필요성(공동주거자산관리·주민참여)","type":"mc","stem":"공동주거관리에서 주민참여의 기능에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리사안 결정 및 수행에 주민의 참여가 이루어질 때 입주자대표회의와 관리주체의 업무처리에 대한 신뢰 구축에 긍정적인 영향을 미친다.","ans":false,"mark":"O","note":"참여는 대표회의·관리주체의 업무처리에 대한 신뢰를 높인다.","rnd":[],"art":""},{"n":"②","text":"주민참여는 의결결정권자인 입주자대표회의를 감독하고 관리업무수행의 주체인 관리주체에 대하여 견제할 수 있다.","ans":false,"mark":"O","note":"의결기구를 감독하고 관리주체를 견제하는 기능이 있다.","rnd":[],"art":""},{"n":"③","text":"모든 관리사안 결정에 주민이 참여하는 경우에는 운영과정상의 효율성이 증대된다.","ans":true,"mark":"X","note":"모든 사안에 참여하면 의사결정이 지체되어 운영의 효율성이 저하된다.","rnd":[],"art":""},{"n":"④","text":"주민참여는 주민들간의 이해관계가 보다 쉽게 조정될 수 있는 기회를 부여하기도 한다.","ans":false,"mark":"O","note":"주민 간 이해관계를 조정하는 기회를 준다.","rnd":[],"art":""},{"n":"⑤","text":"주민의 개인적 견해와 자기중심적인 이해가 지나치게 반영될 경우, 주민 전체의 이익과 객관성에 문제가 생길 수 있다.","ans":false,"mark":"O","note":"개인적 견해가 과도하게 반영되면 전체 이익 ":""},{"n":"②","text":"ㄷ, ㅁ","ans":false,"mark":"X","note":"ㄷ, ㅁ은 조합이 틀렸다.","rnd":[],"art":""},{"n":"③","text":"ㄴ, ㄷ, ㄹ","ans":false,"mark":"X","note":"ㄱ이 빠졌다.","rnd":[],"art":""},{"n":"④","text":"ㄱ, ㄴ, ㄷ, ㄹ","ans":true,"mark":"O","note":"ㄱ, ㄴ, ㄷ, ㄹ이 감사 대상 재무제표다.","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ, ㄹ, ㅁ","ans":false,"mark":"X","note":"현금흐름표(ㅁ)는 제외된다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"회계감사 대상 재무제표는 재무상태표, 운영성과표, 이익잉여금처분계산서(결손금처리계산서), 주석이다. 현금흐름표는 포함되지 않는다.","paras":[],"cites":["공동주택관리법 제26조 · 시행령 제27조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"4대 재무제표(재무상태표·운영성과표·이익잉여금처분계산서·주석) — 현금흐름표 없음.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 33번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"20-34","round":20,"num":34,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품·위수탁계약)","type":"mc","stem":"민간임대주택에 관한 특별법령상 민간임대주택의 관리 및 주택임대관리업 등에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"임대사업자는 민간임대주택이 300세대 이상의 공동주택의 경우에는 공동주택관리법에 따른 주택관리업자에게 관리를 위탁하여야 하며, 자체관리할 수 없다.","ans":false,"mark":"X","note":"300세대 이상도 자체관리할 수 있다.","rnd":[],"art":""},{"n":"②","text":"주택임대관리업은 주택의 소유자로부터 주택을 임차하여 자기책임으로 전대하는 형태의 위탁관리형 주택임대관리업과 주택의 소유자로부터 수수료를 받고 임대료 부과․징수 및 시설물 유지ㆍ관리 등을 대행하는 형태의 자기관리형 주택임대관리업으로 구분한다.","ans":false,"mark":"X","note":"위탁관리형·자기관리형의 설명이 뒤바뀌었다.","rnd":[],"art":""},{"n":"③","text":"지방공기업법에 따라 설립된 지방공사가 주택임대관리업을 하려는 경우 신청서에 대통령령으로 정하는 서류를 첨부하여 시장ㆍ군수ㆍ구청장에게 제출하여야 한다.","ans":false,"mark":"X","note":"지방공사는 시·도지사에게 신청한다.","rnd":[],"art":""},{"n":"④","text":"민간임대주택에 관한 특별법에 위반하여 주택임대관리업의 등록이 말소된 후 2년이 지나지 아니한 자는 주택임대관리업의 등록을 할 수 없다.","ans":true,"mark":"O","note":"등록 말소 후 2년이 지나지 않으면 등록할 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"주택임대관리업자는 주택임대관리업자의 현황 중 전문인력의 경우 1개월마다 시장․군수․구청장에게 신고하여야 한다.","ans":false,"mark":"X","note":"현황 신고는 1개월이 아니라 분기마다 한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"주택임대관리업의 등록이 말소된 후 2년이 지나지 않은 자는 다시 등록할 수 없다는 ④가 옳다. 300세대 이상도 자체관리할 수 있고(①), 주택임대관리업은 위탁관리형과 자기관리형으로 구분되며(②의 방향이 반대), 지방공사는 시장·군수·구청장이 아니라 시·도지사에게 신청하고, 현황 신고는 1개월이 아니라 분기마다 한다.","paras":[],"cites":["민간임대주택에 관한 특별법 제7조 · 제10조 · 제14조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"등록 말소 후 2년, 현황 신고는 분기 — 숫자 두 개가 핵심.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 34번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"20-35","round":20,"num":35,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"임대주택분쟁조정위원회(구성·조정 대상·조정의 효력)","type":"mc","stem":"민간임대주택에 관한 특별법령상 임대주택분쟁조정위원회에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"위원회는 위원장 1명을 포함하여 20명 이내로 구성한다.","ans":false,"mark":"X","note":"위원 정원은 20명이 아니라 10명 이내다.","rnd":[],"art":""},{"n":"②","text":"분쟁조정은 임대사업자와 임차인대표회의의 신청 또는 위원회의 직권으로 개시한다.","ans":false,"mark":"X","note":"임대료 증액 등 일부는 직권 조정이 아니라 신청에 따라 개시한다.","rnd":[],"art":""},{"n":"③","text":"공공임대주택의 임차인대표회의는 공공주택사업자와 분양전환승인에 관하여 분쟁이 있는 경우 위원회에 조정을 신청할 수 있다.","ans":false,"mark":"X","note":"분양전환승인에 관한 분쟁은 조정 신청 대상이 아니다.","rnd":[],"art":""},{"n":"④","text":"위원회의 위원장은 위원 중에서 호선한다.","ans":false,"mark":"X","note":"위원장은 위원 중 호선이 아니라 위촉권자가 임명한다.","rnd":[],"art":""},{"n":"⑤","text":"공무원이 아닌 위원의 임기는 2년으로 하되, 두 차례만 연임할 수 있다.","ans":true,"mark":"O","note":"공무원이 아닌 위원의 임기는 2년, 두 차례 연임 가능이다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"공무원이 아닌 위원의 임기는 2년이고 두 차례만 연임할 수 있다는 ⑤가 옳다. 위원 정원은 10명 이내이고, 분쟁조정은 신청 또는 직권으로 개시하되 '하여야' 하는 것은 아니며, 위원장은 위원 중 호선이 아니라 시장·군수·구청장이 임명·위촉한다.","paras":[],"cites":["민간임대주택에 관한 특별법 제54조 · 제55조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"임기 2년·2회 연임, 정원 10명 이내.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 35번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"20-36","round":20,"num":36,"part":"관리·법령","unit":"인사·노무관리","sub":"최저임금","type":"mc","stem":"최저임금법령상 최저임금의 적용과 효력에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"신체장애로 근로능력이 현저히 낮은 자에 대해서는 사용자가 고용노동부장관의 인가를 받은 경우 최저임금의 효력을 적용하지 아니한다.","ans":false,"mark":"O","note":"신체장애로 근로능력이 현저히 낮으면 인가를 받아 최저임금을 적용하지 않는다.","rnd":[],"art":""},{"n":"②","text":"임금이 도급제나 그 밖에 이와 비슷한 형태로 정해진 경우에 근로시간을 파악하기 어렵다고 인정되면 해당 근로자의 생산고(生産高) 또는 업적의 일정단위에 의하여 최저임금액을 정한다.","ans":false,"mark":"O","note":"도급·생산고 기준으로 임금을 정하면 생산고 단위로 최저임금액을 정한다.","rnd":[],"art":""},{"n":"③","text":"최저임금의 적용을 받는 근로자와 사용자 사이의 근로계약 중 최저임금액에 미치지 못하는 금액을 임금으로 정한 부분은 무효로 하며, 이 경우 무효로 된 부분은 최저임금법으로 정한 최저임금액과 동일한 임금을 지급하기로 한 것으로 본다.","ans":false,"mark":"O","note":"최저임금에 미달하는 부분은 무효이고 최저임금액과 동일한 임금을 지급하기로 본다.","rnd":[],"art":""},{"n":"④","text":"도급으로 사업을 행하는 경우 도급인이 책임져야 할 사유로 수급인이 근로자에게 최저임금액에 미치지 못하는 임금을 지급한 경우 도급인은 해당 수급인과 연대(連帶)하여 책임을 진다.","ans":false,"mark":"O","note":"도급인의 책임 사유가 있으면 수급인과 연대해 책임진다.","rnd":[],"art":""},{"n":"⑤","text":"최저임금의 적용을 받는 근로자가 자기의 사정으로 소정의 근로일의 근로를 하지 아니한 경우 근로하지 아니한 일에 대하여 사용자는 최저임금액의 2분의 1에 해당하는 임금을 지급하여야 한다.","ans":true,"mark":"X","note":"결근일에 최저임금의 1/2을 지급하도록 정한 규정은 없다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"근로자가 자기 사정으로 소정근로일의 근로를 하지 않은 경우 그 일에 대해 최저임금액의 2분의 1을 지급하도록 정한 규정은 없다(결근일은 최저임금 산정에서 제외). 장애인 인가, 도급·생산고 기준, 무효 부분의 효력, 도급인의 연대책임은 옳다.","paras":[],"cites":["최저임금법 제5조~제7조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"최저임금은 실제 근로한 시간에 적용 — 결근일은 산정 제외.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제20회 36번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"20-37","round":20,"num":37,"part":"시설·설비","unit":"설비 기초와 배관","sub":"배관재료·이음·밸브와 지지장치(스트레이너·역환수 방식)","type":"mc","stem":"공조설비의 냉온수 공급관과 환수관의 양측 압력을 동시에 감지하여 압력 균형을 유지시키는 용도의 밸브는?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"온도조절밸브","ans":false,"mark":"X","note":"온도조절밸브는 온도에 따라 유량을 조절한다.","rnd":[],"art":""},{"n":"②","text":"차압조절밸브","ans":true,"mark":"O","n ·법령","unit":"공동주거관리 이론과 공동주택의 이해","sub":"공동주거관리의 의의와 필요성(공동주거자산관리·주민참여)","type":"mc","stem":"공동주거관리의 의의와 내용에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"지속적인 커뮤니티로부터의 주거문화 계승 측면에서 공동주거관리 행위가 바람직하게 지속적으로 이루어져야 된다.","ans":false,"mark":"O","note":"지속적인 커뮤니티를 통한 주거문화 계승 측면이다.","rnd":[],"art":""},{"n":"②","text":"자연재해로부터의 안전성 확보 측면에서 주민들이 생활변화에 대응하면서 쾌적하게 오랫동안 살 수 있는 주택 스톡(stock) 대책으로 공동주택이 적절히 유지관리되어야 한다.","ans":true,"mark":"X","note":"주택 스톡 대책은 지속가능한 주거환경·주거문화 계승의 측면이고, 자연재해로부터의 안전성 확보와는 다르다.","rnd":[],"art":""},{"n":"③","text":"공동주거관리 시스템은 물리적 지원 시스템의 구축, 주민의 자율적 참여유도를 위한 인프라의 구축, 관리주체의 전문성 체계의 구축 측면으로 전개되어야 한다.","ans":false,"mark":"O","note":"물리적 시스템, 참여 인프라, 관리주체의 전문성 체계로 전개된다.","rnd":[],"art":""},{"n":"④","text":"자원낭비로부터의 환경 보호 측면에서 지속가능한 주거환경을 정착시키기 위해서는 재건축으로 인한 단절보다는 주택의 수명을 연장시키고 오랫동안 이용하고 거주할 수 있는 관리의 모색이 요구되고 있다.","ans":false,"mark":"O","note":"재건축에 의한 단절보다 수명 연장과 장기 이용을 모색한다.","rnd":[],"art":""},{"n":"⑤","text":"공동주거관리는 주민들의 다양한 삶을 담고 있는 공동체를 위하여 휴먼웨어 관리, 하드웨어 관리, 소프트웨어 관리라는 메커니즘 안에서 거주자가 중심이 되어 관리주체 와의 상호 신뢰와 협조를 바탕으로 관리해 나가는 능동적 관리이다.","ans":false,"mark":"O","note":"휴먼웨어·하드웨어·소프트웨어 관리의 틀에서 거주자 중심의 능동적 관리다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"주민들이 생활변화에 대응하며 오랫동안 살 수 있도록 하는 '주택 스톡(stock) 대책'은 지속가능한 주거환경 정착과 주거문화 계승의 측면이다. 자연재해로부터의 안전성 확보는 구조·방재 성능 유지의 문제로 설명되어야 한다.","paras":[],"cites":["공동주거관리 이론(공동주거관리의 의의)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"'주택 스톡 대책'은 지속가능한 주거환경·주거문화 계승 쪽 개념으로 묶는다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제21회 25번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-26","round":21,"num":26,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"입주자대표회의의 임원과 의결사항(회의 소집·운영교육)","type":"mc","stem":"공동주택관리법령상 입주자대표회의의 구성에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"선거구는 2개 동 이상으로 묶거나 통로나 층별로 구획하여 관리규약으로 정할 수 있다.","ans":false,"mark":"O","note":"선거구는 2개 동 이상 묶거나 통로·층별로 구획해 관리규약으로 정할 수 있다.","rnd":[],"art":""},{"n":"②","text":"입주자대표회의는 3명 이상으로 구성하되, 동별 세대수에 비례하여 관리규약으로 정한 선거구에 따라 선출된 대표자로 구성한다.","ans":true,"mark":"X","note":"3명 이상이 아니라 4명 이상으로 구성한다.","rnd":[],"art":""},{"n":"③","text":"입주자대표회의의 구성원은 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ자치구청장이 실시하는 입주자대표회의의 운영과 관련하여 필요한 교육 및 윤리교육을 성실히 이수하여야 한다.","ans":false,"mark":"O","note":"구성원은 운영 및 윤리교육을 성실히 이수해야 한다.","rnd":[],"art":""},{"n":"④","text":"하나의 공동주택단지를 수 개의 공구로 구분하여 순차적으로 건설하는 경우(임대주택은 분양전환된 경우를 말한다) 먼저 입주한 공구의 입주자등은 입주자대표회의를 구성할 수 있으며, 다음 공구의 입주예정자의 과반수가 입주한 때에는 다시 입주자대표회의를 구성하여야 한다.","ans":false,"mark":"O","note":"먼저 입주한 공구의 입주자등이 대표회의를 구성할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"동별 대표자 선출공고에서 정한 각종 서류 제출 마감일을 기준으로 「공동주택관리법」을 위반한 범죄로 금고 이상의 실형 선고를 받고 그 집행이 끝난 날(집행이 끝난 것으로 보는 경우를 포함한다)부터 2년이 지나지 아니한 사람은 동별 대표자가 될 수 없으며 그 자격을 상실한다.","ans":false,"mark":"O","note":"금고 이상 실형 집행 종료 후 2년이 지나지 않으면 결격이다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"입주자대표회의는 4명 이상으로 구성하므로 '3명 이상'이라고 한 ②가 틀렸다. 선거구를 관리규약으로 정할 수 있고, 구성원은 운영·윤리교육을 이수해야 하며, 공구별 순차 건설 단지의 구성과 결격사유에 관한 설명은 옳다.","paras":[],"cites":["공동주택관리법 제14조 · 시행령 제15조·제16조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"구성 인원은 '4명 이상' — 3명·5명으로 바꾼 지문에 주의.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제21회 26번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-27","round":21,"num":27,"part":"관리·법령","unit":"관리방법과 주택관리업","sub":"관리방법의 결정과 관리의 이관(의무관리대상 전환·공동관리·혼합주택단지)","type":"mc","stem":"공동주택관리법령상 공동주택관리에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리사무소는 공동주택 공용부분인 부대시설에 해당된다.","ans":false,"mark":"O","note":"관리사무소는 부대시설에 해당한다.","rnd":[],"art":""},{"n":"②","text":"100세대인 지역난방방식 공동주택은 의무관리대상 공동주택에 해당되지 않는다.","ans":false,"mark":"O","note":"100세대 지역난방방식은 150세대 이상 요건에 미달해 의무관리대상이 아니다.","rnd":[],"art":""},{"n":"③","text":"일반인에게 분양되는 복리시설은 공동주택관리의 대상인 공동주택에서 제외된다.","ans":false,"mark":"O","note":"일반인에게 분양되는 복리시설은 관리대상 공동주택에서 제외된다.","rnd":[],"art":""},{"n":"④","text":"입주자대표회의는 자치관리기구 관리사무소장이 해임되거나 그 밖의 사유로 결원이 되었을 때에는 그 사유가 발생한 날부터 30일 이내에 새로운 자치관리기구 관리사무소장을 선임하여야 한다.","ans":false,"mark":"O","note":"자치관리기구 관리사무소장 결원 시 30일 이내 선임한다.","rnd":[],"art":""},{"n":"⑤","text":"입주자대표회의 또는 관리주체는 공동주택 전유부분과 공용부분의 유지ㆍ보수 및 관리 등을 위하여 공동주택관리기구를 구성하여야 한다.","ans":true,"mark":"X","note":"관리기구를 구성하는 주체는 관리주체이며, 입주자대표회의가 구성 의무를 지는 것은 아니다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"공동주택의 관리기구(관리사무소 등)를 구성하는 주체는 관리주체다. 입주자대표회의는 관리주체를 선정·감독하고 주요 사항을 의결하는 기구이지 관리기구를 직접 구성하는 주체가 아니다. 나머지 지문은 모두 현행 규정과 같다.","paras":[],"cites":["공동주택관리법 제2조 · 제6조 · 같은 법 시행령 제3조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"관리기구 구성 주체는 관리주체, 대표회의는 선정·감독·의결의 주체.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 27번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-28","round":21,"num":28,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"선거관리위원회(구성·위원 결격사유·선거관리)","type":"mc","stem":"공동주택관리법령상 동별 대표자를 선출하기 위한 선거관리위원회 위원이 될 수 있는 사람은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사용자","ans":true,"mark":"O","note":"사용자는 선거관리위원회 위원이 될 수 있다.","rnd":[],"art":""},{"n":"②","text":"동별 대표자","ans":false,"mark":"X","note":"동별 대표자는 위원이 될 수 없다.","rnd":[],"art":""},{"n":"③","text":"피한정후견인","ans":false,"mark":"X","note":"피한정후견인은 위원이 될 수 없다.","rnd":[],"art":""},{"n":"④","text":"동별 대표자 후보자의 직계존비속","ans":false,"mark":"X","note":"후보자의 직계존비속은 위원이 될 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"동별 대표자에서 해임된 사람으로서 그 남은 임기 중에 있는 사람","ans":false,"mark":"X","note":"해임된 자로서 남은 임기 중이면 위원이 될 수 없다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"선거관리위원회 위원이 될 수 있는 사람은 사용자다. 동별 대표자, 피한정후견인, 후보자의 직계존비속, 해임된 동별 대표자로서 남은 임기 중인 사람은 위원이 될 수 없다.","paras":[],"cites":["공동주택관리법 시행령 제15조(선거관리위원회 위원의 결격)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"입주자등(사용자 포함)은 가능, 대표자·후보자 가족·피성년후견인은 불가.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 28번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-29","round":21,"num":29,"part":"관리·법령","unit":"사회보험","sub":"건강보험·국민연금의 가입자와 급여(피부양자·자격 상실·보험료)","type":"mc","stem":"국민건강보험법령에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"고용기간이 3개월 미만인 일용근로자나「병역법」에 따른 현역병(지원에 의하지 아니하고 임용된 하사를 포함한다), 전환복무된 사람 및 군간부후보생은 직장가입자에서 제외된다.","ans":false,"mark":"X","note":"일용근로자 제외 기준은 3개월이 아니라 1개월 미만이다.","rnd":[],"art":""},{"n":"②","text":"가입자는 국적을 잃은 날, 직장가입자의 피부양자가 된 날, 수급권자가 된 날 건강보험자격을 상실한다.","ans":false,"mark":"X","note":"피부양자가 된 날 등 상실 사유 서술이 조문과 다르다.","rnd":[],"art":""},{"n":"③","text":"국내에 거주하는 피부양자가 있는 직장가입자가 국외에서 업무에 종사하고 있는 경우에는 보험료를 면제한다.","ans":false,"mark":"X","note":"국외 업무 종사 시 보험료 면제 규정은 없다.","rnd":[],"art":""},{"n":"④","text":"국민건강보험료는 가입자의 자격을 취득한 날이 속하는 달의 다음 달부터 가입자의 자격을 잃은 날의 전날이 속하는 달까지 징수하며, 가입자의 자격을 매월 1일에 취득한 경우에는 그 달부터 징수한다.","ans":true,"mark":"O","note":"보험료 징수 기간에 관한 설명이 옳다.","rnd":[],"art":""},{"n":"⑤","text":"과다납부된 본인일부부담금을 돌려받을 권리는 5년 동안 행사하지 아니하면 시효로 소멸한다.","ans":false,"mark":"X","note":"과다납부금 반환청구권의 소멸시효는 5년이 아니라 3년이다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"보험료는 자격 취득일이 속하는 달의 다음 달부터 자격을 잃은 날의 전날이 속하는 달까지 징수하고, 1일 취득 시 그 달부터 징수한다는 ④가 옳다. 일용근로자·현역병의 직장가입자 제외는 3개월이 아니라 1개월 기준이고, 자격상실 사유와 보험료 면제, 시효(3년)에 관한 설명은 틀렸다.","paras":[],"cites":["국민건강보험법 제5조·제8조·제69조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"건강보험 자격·보험료는 '월 단위'로 계산한다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-30","round":21,"num":30,"part":"관리·법령","unit":"인사·노무관리","sub":"근로계약·해고·부당해고 구제","type":"mc","stem":"근로기준법령상 부당해고등의 구제절차에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사용자가 근로자에게 부당해고등을 하면 근로자 및 노동조합은 노동위원회에 구제를 신청할 수 있다.","ans":false,"mark":"X","note":"구제신청은 근로자가 하며 노동조합이 대신할 수 없다.","rnd":[],"art":""},{"n":"②","text":"부당해고등에 대한 구제신청은 부당해고등이 있었던 날부터 6개월 이내에 하여야 한다.","ans":false,"mark":"X","note":"신청기간은 6개월이 아니라 3개월이다.","rnd":[],"art":""},{"n":"③","text":"노동위원회의 구제명령, 기각결정 또는 재심판정은 중앙노동위원회에 대한 재심신청이나 행정소송 제기에 의하여 그 효력이 정지되지 아니한다.","ans":true,"mark":"O","note":"구제명령 등의 효력은 정지되지 않는다.","rnd":[],"art":""},{"n":"④","text":"노동위원회는 이행강제금을 부과하기 40일 전까지 이행강제금을 부과․징수한다는 뜻을 사용자에게 미리 문서로써 알려주어야 한다.","ans":false,"mark":"X","note":"사전 통지는 40일이 아니라 30일 전까지다.","rnd":[],"art":""},{"n":"⑤","text":"노동위원회는 구제명령을 받은 자가 구제명령을 이행하면 새로운 이행강제금을 부과하지 아니하되, 구제명령을 이행하기 전에 이미 부과된 이행강제금은 징수하지 아니한다.","ans":false,"mark":"X","note":"이행 후에도 이미 부과된 이행강제금은 징수한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"구제명령·기각결정·재심판정은 재심신청이나 행정소송으로 효력이 정지되지 않으므로 ③이 옳다. 구제신청 주체에 노동조합은 포함되지 않고(근로자 본인), 신청기간은 3개월, 이행강제금 사전통지는 30일 전, 이행 시에도 이미 부과된 금액은 징수한다.","paras":[],"cites":["근로기준법 제28조 · 제31조 · 제33조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"신청 3개월 · 사전통지 30일 · 효력 정지 없음.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-31","round":21,"num":31,"part":"관리·법령","unit":"인사·노무관리","sub":"퇴직급여·퇴직연금","type":"mc","stem":"근로자퇴직급여 보장법령상 퇴직급여제도에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사용자는 근로자가 퇴직한 경우에는 그 지급사유가 발생한 날부터 14일 이내에 퇴직금을 지급하여야 하며, 특별한 사정이 있는 경우에도 당사자 간의 합의로 그 지급기일을 연장할 수 없다.","ans":false,"mark":"X","note":"당사자 합의로 지급기일을 연장할 수 있다.","rnd":[],"art":""},{"n":"②","text":"확정급여형 퇴직연금제도의 설정 전에 해당 사업에서 제공한 근로기간에 대하여도 퇴직금을 미리 정산한 기간을 포함하여 가입기간으로 할 수 있다.","ans":false,"mark":"X","note":"DB 설정 전 근로기간 중 '미리 정산한 기간'은 가입기간에서 제외된다.","rnd":[],"art":""},{"n":"③","text":"확정급여형 퇴직연금제도의 가입자는 적립금의 운용방법을 스스로 선정할 수 있고, 반기마다 1회 이상 적립금의 운용방법을 변경할 수 있다.","ans":false,"mark":"X","note":"운용방법을 스스로 정하는 것은 DC 가입자다.","rnd":[],"art":""},{"n":"④","text":"확정기여형 퇴직연금제도에 가입한 근로자는 중도인출을 신청한 날부터 역산하여 5년 이내에「채무자 회생 및 파산에 관한 법률」에 따라 파산선고를 받은 경우 적립금을 중도인출할 수 있다.","ans":true,"mark":"O","note":"파산선고를 받은 경우 DC 적립금을 중도인출할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"퇴직급여제도의 일시금을 수령한 사람은 개인형 퇴직연금제도를 설정할 수 없다.","ans":false,"mark":"X","note":"일시금을 받은 사람도 개인형 퇴직연금(IRP)을 설정할 수 있다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"확정기여형(DC) 가입자는 파산선고 등 법정 사유가 있으면 적립금을 중도인출할 수 있고, 중도인출 신청일부터 역산해 5년 이내 파산선고가 그 사유다. 퇴직금은 14일 이내 지급하되 합의로 연장할 수 있고, DB 가입자는 운용방법을 스스로 정하지 않으며, 일시금 수령자도 IRP를 설정할 수 있다.","paras":[],"cites":["근로자퇴직급여 보장법 제8조 · 제17조 · 제19조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"중도인출은 DC의 권리, 운용지시도 DC — DB와 혼동을 노린다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-32","round":21,"num":32,"part":"관리·법령","unit":"사회보험","sub":"산재보험 보험급여(요양·휴업·장해·유족·상병보상연금)와 심사청구","type":"mc","stem":"산업재해보상보험법령상 보험급여 결정등에 대한 심사 청구 및 재심사 청구에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"근로복지공단의 보험급여 결정등에 불복하는 자는 그 보험급여 결정등을 한 근로복지공단의 소속 기관을 거쳐 산업재해보상보험 심사위원회에 심사 청구를 할 수 있다.","ans":true,"mark":"X","note":"심사청구의 청구 경로·절차 서술이 조문과 다르다.","rnd":[],"art":""},{"n":"②","text":"근로복지공단이 심사 청구에 대한 결정을 연장할 때에는 최초의 결정기간이 끝나기 7일 전까지 심사 청구인 및 보험급여 결정등을 한 근로복지공단의 소속 기관에 알려야 한다.","ans":false,"mark":"O","note":"결정기간 연장 시 7일 전까지 알려야 한다.","rnd":[],"art":""},{"n":"③","text":"근로복지공단의 보험급여 결정에 대하여 심사 청구기간이 지난 후에 제기된 심사 청구는 산업재해보상보험 심사위원회의 심의를 거치지 아니할 수 있다.","ans":false,"mark":"O","note":"청구기간이 지난 청구는 심의를 거치지 않을 수 있다.","rnd":[],"art":""},{"n":"④","text":"산업재해보상보험 심사위원회는 위원장 1명을 포함하여 150명 이내의 위원으로 구성하되, 위원 중 2명은 상임으로 한다.","ans":false,"mark":"O","note":"심사위원회는 위원장 1명 포함 150명 이내, 2명 상임이다.","rnd":[],"art":""},{"n":"⑤","text":"업무상질병판정위원회의 심의를 거친 보험급여에 관한 결정에 불복하는 자는 심사 청구를 하지 아니하고 재심사 청구를 할 수 있다.","ans":false,"mark":"O","note":"업무상질병판정위원회를 거친 결정은 심사를 건너뛰고 재심사 청구가 가능하다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"산재보험 심사청구의 청구 절차(경유 기관)에 관한 ①의 서술이 조문과 다르다. 결정기간 연장 시 7일 전 통지, 청구기간 경과 후 청구의 심의 생략, 심사위원회 구성(150명 이내·2명 상임), 업무상질병판정위원회를 거친 결정의 재심사 청구는 옳다.","paras":[],"cites":["산업재해보상보험법 제103조~제108조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"업무상질병 사건은 '심사 생략 → 재심사' 경로.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 32번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-33","round":21,"num":33,"part":"관리·법령","unit":"하자관리와 분쟁조정","sub":"하자심사·분쟁조정위원회와 공동주택관리 분쟁조정위원회","type":"mc","stem":"공동주택관리법령상 공동주택관리의 분쟁조정에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리비ㆍ사용료 및 장기수선충당금 등의 징수ㆍ사용 등에 관한 사항은 공동주택관리 분쟁조정위원회의 심의ㆍ조정사항에 해당된다.","ans":false,"mark":"O","note":"관리비·사용료·장기수선충당금의 징수·사용에 관한 사항은 심의·조정 대상이다.","rnd":[],"art":""},{"n":"②","text":"분쟁당사자가 쌍방이 합의하여 중앙 공동주택관리 분쟁조정위원회에 조정을 신청하는 분쟁은 중앙 공동주택관리 분쟁조정위원회의 심의ㆍ조정사항에 해당된다.","ans":false,"mark":"O","note":"쌍방 합의로 중앙위원회에 신청한 분쟁도 심의·조정 대상이다.","rnd":[],"art":""},{"n":"③","text":"지방 공동주택관리 분쟁조정위원회는 해당 특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ자치구의 관할 구역에서 발생한 분쟁 중 중앙 공동주택관리 분쟁조정위원회의 심의ㆍ조정 대상인 분쟁 외의 분쟁을 심의ㆍ조정한다.","ans":false,"mark":"O","note":"지방위원회는 중앙위원회 대상 외의 분쟁을 심의·조정한다.","rnd":[],"art":""},{"n":"④","text":"조정안을 제시받은 당사자는 그 제시를 받은 날부터 60일 이내에 그 수락 여부를 중앙 공동주택관리 분쟁조정위원회에 서면으로 통보하여야 하며, 60일 이내에 의사표시가 없는 때에는 수락한 것으로 본다.","ans":true,"mark":"X","note":"수락 여부 통보 기간은 60일이 아니라 30일이다.","rnd":[],"art":""},{"n":"⑤","text":"공동주택관리 분쟁(공동주택의 하자담보책임 및 하자보수 등과 관련한 분쟁을 제외한다)을 조정하기 위하여 국토교통부에 중앙 공동주택관리 분쟁조정위원회를 두고, 특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ자치구에 지방 공동주택관리 분쟁조정위원회를 둔다. 다만, 공동주택 비율이 낮은 특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ자치구로서 국토교통부장관이 인정하는 특별자치시ㆍ특별자치도ㆍ시ㆍ군ㆍ자치구의 경우에는 지방 공동주택관리 분쟁조정위원회를 두지 아니할 수 있다.","ans":false,"mark":"O","note":"중앙위원회는 국토교통부에, 지방위원회는 시·군·구에 둔다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"조정안을 제시받은 당사자는 30일 이내에 수락 여부를 통보하여야 하고, 그 기간에 의사표시가 없으면 수락한 것으로 본다. '60일'이라고 한 ④가 틀렸다. 심의사항 범위, 중앙·지방위원회의 관할에 관한 설명은 옳다.","paras":[],"cites":["공동주택관리법 제41조(조정안의 수락)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"조정안 수락 통보는 30일 — 무응답은 수락으로 본다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제21회 33번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-34","round":21,"num":34,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"민간임대주택의 종류와 정의(장기일반·공공지원·준주택·다른 법률과의 관계)","type":"mc","stem":"민간임대주택에 관한 특별법령상 용어에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"“민간임대주택”이란 임대 목적으로 제공하는 주택으로서 임대사업자가 「민간임대주택에 관한 특별법」제5조에 따라 등록한 주택을 말하며, 민간건설임대주택과 민간매입임대주택으로 구분한다.","ans":false,"mark":"O","note":"민간임대주택은 민간건설임대주택과 민간매입임대주택으로 구분된다.","rnd":[],"art":""},{"n":"②","text":"“장기일반민간임대주택”이란 임대사업자가 공공지원민간임대주택이 아닌 주택을 8년 이상 임대할 목적으로 취득하여 임대하는 민간임대주택을 말한다.","ans":false,"mark":"O","note":"장기일반민간임대주택은 8년 이상 임대 목적의 주택이다(현행 10년).","rnd":[],"art":""},{"n":"③","text":"“단기민간임대주택”이란 임대사업자가 2년 이상 임대할 목적으로 취득하여 임대하는 민간임대주택을 말한다.","ans":true,"mark":"X","note":"단기민간임대주택은 2년이 아니라 6년 이상 임대 목적의 주택이다.","rnd":[],"art":""},{"n":"④","text":"“임대사업자”란「공공주택 특별법」제4조제1항에 따른 공공주택사업자가 아닌 자로서 1호(戶) 이상의 민간임대주택을 취득하여 임대하는 사업을 할 목적으로 「민간임대주택에 관한 특별법」제5조에 따라 등록한 자를 말한다.","ans":false,"mark":"O","note":"임대사업자는 공공주택사업자가 아닌 자로서 1호 이상 취득·임대하는 사업자다.","rnd":[],"art":""},{"n":"⑤","text":"임대사업자가 임대를 목적으로 건설하여 임대하는 민간임대주택은 민간건설임대주택에 해당된다.","ans":false,"mark":"O","note":"임대 목적으로 건설해 임대하는 주택은 민간건설임대주택이다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"단기민간임대주택은 2년이 아니라 6년 이상 임대할 목적으로 취득해 임대하는 민간임대주택이다. 민간임대주택의 구분, 임대사업자의 정의, 건설임대주택의 분류에 관한 설명은 옳다(장기일반민간임대주택의 임대기간은 이후 10년으로 개정되었다).","paras":[],"cites":["민간임대주택에 관한 특별법 제2조(정의)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"단기 6년 / 장기일반 8년 → 현행 10년으로 개정.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 34번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-35","round":21,"num":35,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품·위수탁계약)","type":"mc","stem":"민간임대주택에 관한 특별법령상 주택임대관리업의 결격사유에 해당하지 않는 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"피성년후견인","ans":false,"mark":"O","note":"피성년후견인은 결격사유다.","rnd":[],"art":""},{"n":"②","text":"파산선고를 받고 복권되지 아니한 자","ans":false,"mark":"O","note":"파산선고 후 복권되지 않은 자도 결격이다.","rnd":[],"art":""},{"n":"③","text":"「민간임대주택에 관한 특별법」을 위반하여 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람","ans":false,"mark":"O","note":"집행유예 기간 중이면 결격이다.","rnd":[],"art":""},{"n":"④","text":"「민간임대주택에 관한 특별법」제10조에 따라 주택임대관리업의 등록이 말소된 후 2년이 지나지 아니한 자. 이 경우 등록이 말소된 자가 법인인 경우에는 말소 당시의 원인이 된 행위를 한 사람과 대표자를 포함한다.","ans":false,"mark":"O","note":"등록 말소 후 2년이 지나지 않으면 결격이다.","rnd":[],"art":""},{"n":"⑤","text":"「민간임대주택에 관한 특별법」을 위반하여 금고 이상의 실형을 선고받고 집행이 종료(집행이 종료된 것으로 보는 경우를 포함한다)되거나 그 집행이 면제된 날부터 3년이 지난 사람","ans":true,"mark":"X","note":"실형 집행 종료 후 3년이 지났으므로 결격사유가 아니다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"민간임대주택법을 위반해 금고 이상의 실형을 선고받고 집행이 종료·면제된 날부터 3년이 '지난' 사람은 결격사유에 해당하지 않는다. 피성년후견인, 파산 미복권자, 집행유예 기간 중인 자, 등록 말소 후 2년 미경과자는 결격이다.","paras":[],"cites":["민간임대주택에 관한 특별법 제7조(결격사유)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"실형은 '3년 경과'로 결격 해소, 등록 말소는 '2년'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 35번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-36","round":21,"num":36,"part":"관리·법령","unit":"장기수선계획","sub":"장기수선충당금(적립·사용·요율)","type":"mc","stem":"공동주택관리법령상 공동주택의 장기수선충당금에 관한 설명으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[{"mk":"ㄱ.","tx":"관리주체는 장기수선계획에 따라 공동주택의 주요 시설의 교체 및 보수에 필요한 장기수선충당금을 해당 주택의 소유자로부터 징수하여 적립하여야 한다."},{"mk":"ㄴ.","tx":"해당 공동주택의 입주자 과반수의 서면동의가 있더라도 장기수선충당금을 하자진단 및 감정에 드는 비용으로 사용할 수 없다."},{"mk":"ㄷ.","tx":"공동주택 중 분양되지 아니한 세대의 장기수선충당금은 사업주체가 부담하여야 한다."},{"mk":"ㄹ.","tx":"장기수선충당금은 관리주체가「공동주택관리법 시행령」제31조제4항 각 호의 사항이 포함된 장기수선충당금 사용계획서를 장기수선계획에 따라 작성 하고 입주자대표회의의 의결을 거쳐 사용한다."},{"mk":"ㅁ.","tx":"장기수선충당금은 건설임대주택에서 분양전환된 공동주택의 경우에는 임대사업자가 관리주체에게 공동주택의 관리업무를 인계한 :"보수율·균제도가 아니다.","rnd":[],"art":""},{"n":"④","text":"조도, 보수율, 조명률","ans":false,"mark":"X","note":"균제도가 빠졌다.","rnd":[],"art":""},{"n":"⑤","text":"조도, 보수율, 균제도","ans":true,"mark":"O","note":"조도, 보수율, 균제도가 맞다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"정답은 조도, 보수율, 균제도이다. 입사하는 단위면적당 광속이 조도, 경년 감광·오손을 보정하는 계수가 보수율, 최저조도를 최고조도로 나눈 값이 균제도다.","paras":[],"cites":["조명설비(조도·보수율·균제도)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"보수율은 경년·오손 보정, 균제도는 최저/최고.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 42번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-43","round":21,"num":43,"part":"시설·설비","unit":"난방·냉동·환기설비","sub":"급수펌프와 수격작용(양정·동력·상사법칙·공동현상·서징)","type":"mc","stem":"히트펌프에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"겨울철 온도가 낮은 실외로부터 온도가 높은 실내로 열을 끌어들인다는 의미에서 열펌프라고도 한다.","ans":false,"mark":"O","note":"열을 끌어온다는 의미에서 열펌프라 한다.","rnd":[],"art":""},{"n":"②","text":"운전에 소비된 에너지보다 대량의 열에너지가 얻어져 일반적으로 성적계수(COP)가 1이하의 값을 유지한다.","ans":true,"mark":"X","note":"COP는 1보다 크다.","rnd":[],"art":""},{"n":"③","text":"한 대의 기기로 냉방용 또는 난방용으로 사용할 수 있다.","ans":false,"mark":"O","note":"한 대로 냉방·난방이 가능하다.","rnd":[],"art":""},{"n":"④","text":"공기열원 히트펌프는 겨울철 난방부하가 큰 날에는 외기온도도 낮으므로 성적계수(COP)가 저하될 우려가 있다.","ans":false,"mark":"O","note":"공기열원은 외기온도가 낮으면 COP가 저하된다.","rnd":[],"art":""},{"n":"⑤","text":"히트펌프의 열원으로는 일반적으로 공기, 물, 지중(땅속)을 많이 이용한다.","ans":false,"mark":"O","note":"열원은 공기·물·지중을 주로 이용한다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"히트펌프는 투입한 에너지보다 많은 열을 얻으므로 성적계수(COP)가 1보다 크다. '1 이하'라고 한 ②가 틀렸다. 열펌프라 불리는 이유, 냉·난방 겸용, 공기열원의 COP 저하, 열원의 종류는 옳다.","paras":[],"cites":["히트펌프(성적계수)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"히트펌프 COP > 1 — 1 이하라는 서술은 오답.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 43번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-44","round":21,"num":44,"part":"시설·설비","unit":"급수·급탕설비","sub":"급수방식과 급수설비(고가수조·수도직결·크로스커넥션)","type":"mc","stem":"급배수 위생설비에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"탱크가 없는 부스터방식은 펌프의 동력을 이용하여 급수하는 방식으로 저수조가 필요 없다.","ans":true,"mark":"X","note":"부스터방식에 관한 서술이 기준과 다르다.","rnd":[],"art":""},{"n":"②","text":"수격작용이란 급수전이나 밸브 등을 급속히 폐쇄했을 때 순간적으로 급수관 내부에 충격압력이 발생하여 소음이나 충격음, 진동 등이 일어나는 현상을 말한다.","ans":false,"mark":"O","note":"수격작용 설명이 옳다.","rnd":[],"art":""},{"n":"③","text":"매시 최대 예상급수량은 일반적으로 매시 평균 예상급수량의 1.5 ～ 2.0배 정도로 산정한다.","ans":false,"mark":"O","note":"시간최대 예상급수량은 평균의 1.5~2.0배다.","rnd":[],"art":""},{"n":"④","text":"배수수평주관의 관경이 125 mm일 경우 원활한 배수를 위한 배관 최소구배는 1/150로 한다.","ans":false,"mark":"O","note":"125mm 배수수평주관의 최소구배 1/150은 옳다.","rnd":[],"art":""},{"n":"⑤","text":"결합통기관은 배수수직관과 통기수직관을 접속하는 것으로 배수수직관 내의 압력변동을 완화하기 위해 설치한다.","ans":false,"mark":"O","note":"결합통기관은 배수수직관과 통기수직관을 잇는다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"'탱크가 없는 부스터방식'이라는 서술 자체가 교재·기준의 구분과 다르다. 부스터방식은 저수조와 가압펌프로 필요한 수압을 확보하는 방식으로 설명된다. 수격작용, 시간최대 급수량(1.5~2.0배), 배수수평주관 구배, 결합통기관은 옳다.","paras":[],"cites":["급배수 위생설비(급수방식·통기)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"부스터방식의 정의와 급수량 배수(1.5~2.0배)를 구분.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 44번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-45","round":21,"num":45,"part":"시설·설비","unit":"전기·가스·승강기·에너지설비","sub":"자동화재탐지·비상방송설비와 유도등·피난기구","type":"mc","stem":"지능형 홈네트워크 설비 설치 및 기술기준에서 ‘감지기’에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"가스누설이나 주거침입 상황 등 세대내의 상황을 감지하는데 필요한 기기를 말한다.","ans":false,"mark":"O","note":"세대 내 상황을 감지하는 기기다.","rnd":[],"art":""},{"n":"②","text":"화재감지기(화재수신반 연동), 가스감지기, 개폐감지기, 동체감지기, 환경감지기(VOC, 온․습도, CO₂ 감지) 등을 말한다.","ans":false,"mark":"O","note":"화재·가스·개폐·동체·환경 감지기 등이 있다.","rnd":[],"art":""},{"n":"③","text":"가스감지기는 사용하는 가스가 LNG인 경우에는 바닥 쪽에, LPG인 경우에는 천장 쪽에 설치하여야 한다.","ans":true,"mark":"X","note":"LNG는 천장, LPG는 바닥에 설치한다.","rnd":[],"art":""},{"n":"④","text":"개폐감지기는 현관출입문 상단에 설치하며 단독배선하여야 한다.","ans":false,"mark":"O","note":"개폐감지기는 현관문 상단에 단독배선한다.","rnd":[],"art":""},{"n":"⑤","text":"동체감지기는 유효감지반경을 고려하여 설치하여야 한다.","ans":false,"mark":"O","note":"동체감지기는 유효감지반경을 고려해 설치한다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"가스감지기는 LNG(천연가스, 공기보다 가벼움)는 천장 쪽, LPG(공기보다 무거움)는 바닥 쪽에 설치해야 한다. 'LNG는 바닥, LPG는 천장'이라고 한 ③이 틀렸다.","paras":[],"cites":["지능형 홈네트워크 설비 설치 및 기술기준(감지기)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"가벼운 LNG는 위, 무거운 LPG는 아래.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 45번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-46","round":21,"num":46,"part":"시설·설비","unit":"소방시설과 소방안전관리","sub":"자동화재탐지·비상방송설비와 유도등·피난기구","type":"mc","stem":"국가화재안전기준(NFSC 303)상 유도등 및 유도표지의 화재안전기준에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"복도통로유도등은 복도에 설치하며, 구부러진 모퉁이 및 보행거리 20 m마다 설치하여야 한다.","ans":true,"mark":"O","note":"복도통로유도등은 20m마다 설치한다.","rnd":[],"art":""},{"n":"②","text":"피난구유도등은 피난통로를 안내하기 위한 유도등으로 복도통로유도등, 거실통로유도등, 계단통로유도등을 말한다.","ans":false,"mark":"X","note":"복도·거실·계단통로유도등은 '통로유도등'에 속한다.","rnd":[],"art":""},{"n":"③","text":"계단통로유도등은 각층의 경사로 참 또는 계단참마다(1개층에 경사로 참 또는 계단참이 2 이상 있는 경우에는 2개의 계단참마다) 설치하며, 바닥으로부터 높이 1.5 m 이하의 위치에 설치하여야 한다.","ans":false,"mark":"X","note":"계단통로유도등의 설치기준·높이 서술이 조문과 다르다.","rnd":[],"art":""},{"n":"④","text":"피난구유도등은 바닥면적이 1,000 m² 미만인 층으로서 옥내로부터 직접 지상으로 통하는 출입구(외부의 식별이 용이한 경우에 한한다)에 설치하여야 한다.","ans":false,"mark":"X","note":"피난구유도등 설치대상 서술이 조문과 다르다.","rnd":[],"art":""},{"n":"⑤","text":"피난구유도표지는 출입구 상단에 설치하고, 통로유도표지는 바닥으로부터 높이 1.5 m 이하의 위치에 설치하여야 한다.","ans":false,"mark":"X","note":"유도표지의 설치 높이 기준이 조문과 다르다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"복도통로유도등은 복도에 설치하고 구부러진 모퉁이 및 보행거리 20m마다 설치한다(①). 피난구유도등은 통로유도등과 구분되는 설비이고, 계단통로유도등 설치기준·피난구유도등 설치대상·유도표지 높이에 관한 나머지 설명은 조문과 다르다.","paras":[],"cites":["NFSC 303(유도등 및 유도표지)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"복도 20m마다 — 가장 확실한 숫자.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 46번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-47","round":21,"num":47,"part":"시설·설비","unit":"주택건설기준과 건축설비기준","sub":"건축설비 기준(피뢰설비·개별난방설비·배관설비·전기 배전공간)","type":"mc","stem":"건축물의 설비기준 등에 관한 규칙상 피뢰설비의 설치기준에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"피뢰설비의 재료는 최소 단면적이 피복이 없는 동선을 기준으로 수뢰부, 인하도선 및 접지극은 50제곱밀리미터 이상이거나 이와 동등 이상의 성능을 갖출 것","ans":false,"mark":"O","note":"수뢰부·인하도선·접지극은 50㎟ 이상이어야 한다.","rnd":[],"art":""},{"n":"②","text":"접지(接地)는 환경오염을 일으킬 수 있는 시공방법이나 화학 첨가물 등을 사용하지 아니할 것","ans":false,"mark":"O","note":"접지는 환경오염을 일으키는 방법·화학첨가물을 쓰지 않는다.","rnd":[],"art":""},{"n":"③","text":"피뢰설비는 한국산업표준이 정하는 피뢰레벨 등급에 적합한 피뢰설비일 것. 다만, 위험물저장 및 처리시설에 설치하는 피뢰설비는 한국산업표준이 정하는 피뢰시스템레벨 II 이상이어야 할 것","ans":false,"mark":"O","note":"피뢰레벨 등급에 적합해야 하고 위험물시설은 기준이 강화된다.","rnd":[],"art":""},{"n":"④","text":"급수ㆍ급탕ㆍ난방ㆍ가스 등을 공급하기 위하여 건축물에 설치하는 금속배관 및 금속재 설비는 전위(電位)가 균등하게 이루어지도록 전기적으로 접속할 것","ans":false,"mark":"O","note":"금속배관·금속재 설비는 전위가 균등하도록 접속한다.","rnd":[],"art":""},{"n":"⑤","text":"전기설비의 접지계통과 건축물의 피뢰설비 및 통신설비 등의 접지극을 공용하는 통합접지공사를 하는 경우에는 낙뢰 등으로 인한 과전압으로부터 전기설비 등을 보호하기 위하여 한국산업표준에 적합한 배선용 차단기를 설치할 것","ans":true,"mark":"X","note":"통합접지 시의 요구사항 서술이 조문과 다르다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"전기설비 접지계통과 피뢰·통신설비 접지극을 공용하는 통합접지공사를 할 때의 요구사항을 서술한 ⑤가 조문과 다르다. 재료 단면적(50㎟ 이상), 접지 시공방법, 피뢰레벨 등급, 금속배관의 전위 균등 접속은 옳다.","paras":[],"cites":["건축물의 설비기준 등에 관한 규칙 제20조(피뢰설비)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"피뢰설비 숫자(50㎟, 25cm 돌출)와 통합접지 요건을 구분.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제21회 47번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"21-48","round":21,"num":48,"part":"시설·설비","unit":"소방시설과 소방안전관리","sub" "},{"n":"④","text":"관리규약의 개정은 전체 입주자등의 10분의 1 이상이 제안하고 투표자의 과반수가 찬성하는 방법에 따른다.","ans":true,"mark":"X","note":"개정은 전체 입주자등 과반수의 찬성이 필요하고, 투표자 과반수로는 부족하다.","rnd":[],"art":""},{"n":"⑤","text":"사업주체는 시장ㆍ군수ㆍ구청장에게 관리규약의 제정을 신고하는 경우 관리규약의 제정 제안서 및 그에 대한 입주자등의 동의서를 첨부하여야 한다.","ans":false,"mark":"O","note":"관리규약 제정 신고 시 제정 제안서와 동의서를 첨부한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"관리규약의 개정은 전체 입주자등의 10분의 1 이상이 제안하는 것은 맞지만, 찬성 요건은 '투표자의 과반수'가 아니라 전체 입주자등의 과반수의 찬성이다. 나머지 관리규약·관리규약준칙에 관한 설명은 옳다.","paras":[],"cites":["공동주택관리법 제18조·제19조(관리규약의 제정·개정)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"관리규약 개정은 '10분의 1 제안 + 전체 입주자등 과반수 찬성'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 26번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-27","round":22,"num":27,"part":"관리·법령","unit":"인사·노무관리","sub":"최저임금","type":"mc","stem":"최저임금법상 최저임금에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"최저임금액을 일ㆍ주 또는 월을 단위로 하여 최저임금액을 정할 때에는 시간급(時間給)으로도 표시하여야 한다.","ans":true,"mark":"O","note":"일·주·월 단위로 정할 때 시간급 표시가 필요하다.","rnd":[],"art":""},{"n":"②","text":"사용자는 「최저임금법」에 따른 최저임금을 이유로 종전의 임금수준을 낮출 수 있다.","ans":false,"mark":"X","note":"최저임금을 이유로 종전 임금수준을 낮출 수 없다.","rnd":[],"art":""},{"n":"③","text":"최저임금의 사업 종류별 구분은 최저임금위원회가 정한다.","ans":false,"mark":"X","note":"사업 종류별 구분은 고용노동부장관이 정한다.","rnd":[],"art":""},{"n":"④","text":"사용자를 대표하는 자는 고시된 최저임금안에 대하여 이의를 제기할 수 없다.","ans":false,"mark":"X","note":"사용자 대표도 이의를 제기할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"고시된 최저임금은 다음 연도 3월 1일부터 효력이 발생하나, 고용노동부장관은 사업의 종류별로 임금교섭시기 등을 고려하여 필요하다고 인정하면 효력발생 시기를 따로 정할 수 있다.","ans":false,"mark":"X","note":"효력발생일은 다음 연도 1월 1일이다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"일·주·월 단위로 최저임금액을 정할 때에는 시간급으로도 표시해야 한다. 최저임금을 이유로 종전 임금수준을 낮출 수 없고, 사업 종류별 구분은 최저임금위원회 심의를 거쳐 고용노동부장관이 정하며, 사용자 대표도 고시된 최저임금안에 이의를 제기할 수 있고, 효력은 다음 연도 1월 1일부터 발생한다.","paras":[],"cites":["최저임금법 제5조 · 제4조 · 제9조 · 제10조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"최저임금 효력은 1월 1일, 인상 후 감액 금지.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 27번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-28","round":22,"num":28,"part":"관리·법령","unit":"사회보험","sub":"실업급여(구직급여·취업촉진 수당)와 육아휴직 급여","type":"mc","stem":"고용보험법상의 실업급여에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"구직급여는 실업급여에 포함된다.","ans":false,"mark":"O","note":"구직급여는 실업급여에 포함된다.","rnd":[],"art":""},{"n":"②","text":"취업촉진 수당에는 이주비는 포함되지만 조기재취업수당은 포함되지 않는다.","ans":true,"mark":"X","note":"조기재취업수당도 취업촉진 수당에 포함된다.","rnd":[],"art":""},{"n":"③","text":"실업급여수급계좌의 해당 금융기관은 「고용보험법」에 따른 실업급여만이 실업급여수급계좌에 입금되도록 관리하여야 한다.","ans":false,"mark":"O","note":"수급계좌 관리 의무가 있다.","rnd":[],"art":""},{"n":"④","text":"실업급여를 받을 권리는 양도할 수 없다.","ans":false,"mark":"O","note":"실업급여를 받을 권리는 양도할 수 없다.","rnd":[],"art":""},{"n":"⑤","text":"실업급여로서 지급된 금품에 대하여는 국가나 지방자치단체의 공과금(「국세기본법」또는「지방세기본법」에 따른 공과금을 말한다)을 부과하지 아니한다.","ans":false,"mark":"O","note":"실업급여로 지급된 금품에는 공과금을 부과하지 않는다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"취업촉진 수당에는 조기재취업수당, 직업능력개발 수당, 광역 구직활동비, 이주비가 모두 포함된다. '조기재취업수당은 포함되지 않는다'고 한 ②가 틀렸다.","paras":[],"cites":["고용보험법 제65조·제66조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"취업촉진 수당 4종 — 조기재취업·직업능력개발·광역구직활동비·이주비.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 28번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-29","round":22,"num":29,"part":"관리·법령","unit":"사회보험","sub":"건강보험·국민연금의 가입자와 급여(피부양자·자격 상실·보험료)","type":"mc","stem":"국민연금법상 연금급여에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"「국민연금법」상 급여의 종류는 노령연금, 장애연금, 유족연금의 3가지로 구분된다.","ans":false,"mark":"X","note":"급여 종류는 반환일시금 등도 포함되어 3가지로 단정할 수 없다.","rnd":[],"art":""},{"n":"②","text":"유족연금등의 수급권자가 될 수 있는 자를 고의로 사망하게 한 유족에게는 사망에 따라 발생되는 유족연금등의 일부를 지급하지 아니할 수 있다.","ans":false,"mark":"X","note":"고의로 사망하게 한 유족에게는 유족연금을 지급하지 않는다.","rnd":[],"art":""},{"n":"③","text":"수급권자의 청구가 없더라도 급여원인이 발생하면 공단은 급여를 지급한다.","ans":false,"mark":"X","note":"급여는 수급권자의 청구에 따라 지급한다.","rnd":[],"art":""},{"n":"④","text":"연금액은 지급사유에 따라 기본연금액과 부양가족연금액을 기초로 산정한다.","ans":true,"mark":"O","note":"연금액은 기본연금액 + 부양가족연금액으로 산정한다.","rnd":[],"art":""},{"n":"⑤","text":"장애연금의 수급권자가 정당한 사유 없이 「국민연금법」에 따른 공단의 진단요구에 응하지 아니한 때에는 급여의 전부의 지급을 정지한다.","ans":false,"mark":"X","note":"진단요구 불응 시 전부 또는 일부의 지급을 정지한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"연금액은 지급사유에 따라 기본연금액과 부양가족연금액을 기초로 산정한다(④). 급여는 노령·장애·유족 연금 외에 일시금 등이 있고, 고의로 사망하게 한 유족에게는 급여를 '지급하지 아니한다'(일부가 아님), 급여는 청구가 있어야 지급하며, 진단요구 불응 시 '전부 또는 일부'를 정지한다.","paras":[],"cites":["국민연금법 제49조·제56조·제66조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"연금액 = 기본연금액 + 부양가족연금액.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-30","round":22,"num":30,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"관리규약과 관리규약준칙(제정·개정·신고)","type":"mc","stem":"공동주택관리법령상 공동주택의 관리규약준칙에 포함되어야 할 공동주택의 어린이집 임대계약에 대한 임차인 선정기준에 해당하지 않는 것은? (단, 그 선정기준은 「영유아보육법」에 따른 국공립어린이집 위탁제 선정관리 기준에 준하여야 함)","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"임차인의 신청자격","ans":false,"mark":"O","note":"임차인의 신청자격은 포함된다.","rnd":[],"art":""},{"n":"②","text":"임대기간","ans":false,"mark":"O","note":"임대기간은 포함된다.","rnd":[],"art":""},{"n":"③","text":"임차인 선정을 위한 심사기준","ans":false,"mark":"O","note":"임차인 선정 심사기준은 포함된다.","rnd":[],"art":""},{"n":"④","text":"어린이집을 이용하는 입주자등 중 어린이집 임대에 동의하여야 하는 비율","ans":false,"mark":"O","note":"입주자등의 동의 비율은 포함된다.","rnd":[],"art":""},{"n":"⑤","text":"시장ㆍ군수ㆍ구청장이 입주자대표회의가 구성되기 전에 어린이집 임대계약을 체결하려 할 때 입주예정자가 동의하여야 하는 비율","ans":true,"mark":"X","note":"입주예정자의 동의 비율은 관리규약준칙에 정하는 사항이 아니다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"관리규약준칙에 포함되어야 하는 어린이집 임대계약 관련 사항은 임차인의 신청자격, 임대기간, 임차인 선정을 위한 심사기준, 입주자등의 동의 비율이다. 시장·군수·구청장이 대표회의 구성 전에 계약할 때의 입주예정자 동의 비율은 준칙에 두는 사항이 아니다.","paras":[],"cites":["공동주택관리법 시행령 제29조의3 · 관리규약준칙"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"준칙에는 '입주자등' 동의 비율까지, 입주예정자 동의 비율은 별개.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-31","round":22,"num":31,"part":"관리·법령","unit":"입주자대표회의와 관리규약","sub":"관리규약과 관리규약준칙(제정·개정·신고)","type":"mc","stem":"공동주택관리법령상 선거관리위원회에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"500세대 이상인 공동주택의 선거관리위원회는 입주자등 중에서 위원장을 포함하여 5명 이상 9명 이하의 위원으로 구성한다.","ans":false,"mark":"O","note":"500세대 이상은 5명 이상 9명 이하로 구성한다.","rnd":[],"art":""},{"n":"②","text":"선거관리위원회 위원장은 위원 중에서 호선한다.","ans":false,"mark":"O","note":"위원장은 위원 중에서 호선한다.","rnd":[],"art":""},{"n":"③","text":"500세대 미만인 공동주택은 「선거관리위원회법」에 따른 선거관리위원회 소속 직원 1명을 관리규약으로 정하는 바에 따라 위원으로 위촉한다.","ans":true,"mark":"X","note":"선관위 직원을 위촉하는 규정은 없고, 500세대 미만도 입주자등 중 3~9명으로 구성한다.","rnd":[],"art":""},{"n":"④","text":"선거관리위원회 위원장은 동별 대표자 후보자에 대하여 동별 대표자의 자격요건 충족 여부와 결격사유 해당 여부를 확인하여야 한다.","ans":false,"mark":"O","note":"위원장은 후보자의 자격요건과 결격사유를 확인한다.","rnd":[],"art":""},{"n":"⑤","text":"선거관리위원회의 위원장은 동별 대표자의 결격사유 확인에 관한 사무를 수행하기 위하여 불가피한 경우 「개인정보 보호법 시행령」에 따른 주민등록번호가 포함된 자료를 처리할 수 있다.","ans":false,"mark":"O","note":"결격사유 확인에 필요한 경우 주민등록번호가 포함된 자료를 처리할 수 있다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"500세대 미만 단지도 입주자등 중에서 3명 이상 9명 이하의 위원으로 선거관리위원회를 구성하며, 선거관리위원회법 소속 직원을 위원으로 위촉하는 규정은 없다. 따라서 ③이 틀렸다.","paras":[],"cites":["공동주택관리법 제15조 · 시행령 제15조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"선관위 구성은 500세대 기준 5명/3명 이상, 상한은 9명.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"22-32","round":22,"num":32,"part":"관리·법령","unit":"주택임대관리와 임대주택 관리","sub":"주택임대관리업(등록·결격·말소·업무·보증상품 noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-25","round":23,"num":25,"part":"관리·법령","unit":"인사·노무관리","sub":"최저임금","type":"mc","stem":"최저임금법령상 벌금이나 과태료 부과 사유가 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"사용자가 최저임금에 매월 1회 이상 정기적으로 지급하는 임금을 포함시키기 위하여 1개월을 초과하는 주기로 지급하는 임금을 총액의 변동 없이 매월 지급하는 것으로 취업규칙을 변경하면서 해당 사업 또는 사업장에 근로자의 과반수로 조직된 노동조합의 의견을 듣지 아니한 경우","ans":false,"mark":"O","note":"최저임금 회피를 위한 취업규칙 변경은 제재 대상이다.","rnd":[],"art":""},{"n":"②","text":"최저임금의 적용을 받는 사용자가 최저임금의 효력발생 연월일을 법령이 정하는 방법으로 근로자에게 널리 알리지 아니한 경우","ans":false,"mark":"O","note":"효력발생일을 알리지 않으면 과태료 대상이다.","rnd":[],"art":""},{"n":"③","text":"고용노동부장관이 임금에 관한 사항의 보고를 하게 하였으나 보고를 하지 아니하거나 거짓으로 보고한 경우","ans":false,"mark":"O","note":"보고를 하지 않거나 거짓 보고하면 제재 대상이다.","rnd":[],"art":""},{"n":"④","text":"근로감독관의 장부제출 요구 또는 물건에 대한 검사를 거부․방해 또는 기피하거나 질문에 대하여 거짓 진술을 하는 경우","ans":false,"mark":"O","note":"검사 거부·방해·기피도 제재 대상이다.","rnd":[],"art":""},{"n":"⑤","text":"고용노동부장관이 고시하는 최저임금안이 근로자의 생활안정에 미치지 못함에도 불구하고 사용자가 고시된 날부터 10일 이내에 이의를 제기하지 아니한 경우","ans":true,"mark":"X","note":"이의를 제기하지 않은 것은 제재 사유가 아니다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"고시된 최저임금안에 대해 사용자가 이의를 제기하지 않은 것은 벌칙·과태료 사유가 아니다. 취업규칙 변경을 통한 최저임금 회피, 효력발생일 미고지, 보고의무 위반, 감독관 검사 거부는 벌칙·과태료 대상이다.","paras":[],"cites":["최저임금법 제28조~제31조(벌칙·과태료)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"이의제기 포기는 벌칙 사유가 아니다.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 25번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-26","round":23,"num":26,"part":"관리·법령","unit":"사회보험","sub":"실업급여(구직급여·취업촉진 수당)와 육아휴직 급여","type":"mc","stem":"고용보험법령상 정해진 기간에 대통령령으로 정하는 사유로 육아휴직 급여를 신청할 수 없었던 사람은 그 사유가 끝난 후 30일 이내에 신청하여야 한다. 대통령령으로 정하는 사유가 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"천재지변","ans":false,"mark":"O","note":"천재지변은 연장 사유다.","rnd":[],"art":""},{"n":"②","text":"「병역  대표회의·관리주체에 제출하고 공개한다.","rnd":[],"art":""},{"n":"②","text":"동별 대표자가 임기 중에 동별 대표자의 결격사유에 해당하게 된 경우에는 당연히 퇴임한다.","ans":false,"mark":"O","note":"임기 중 결격사유에 해당하면 당연히 퇴임한다.","rnd":[],"art":""},{"n":"③","text":"입주자대표회의는 의결사항을 의결할 때 입주자등이 아닌 자로서 해당 공동주택의 관리에 이해관계를 가진 자의 권리를 침해해서는 안 된다.","ans":false,"mark":"O","note":"의결 시 관리에 이해관계가 있는 비입주자의 권리를 침해할 수 없다.","rnd":[],"art":""},{"n":"④","text":"사용자인 동별 대표자는 회장이 될 수 없으나, 입주자인 동별 대표자 중에서 회장후보자가 없는 경우로서 선출 전에 전체 입주자등의 과반수의 동의를 얻은 경우에는 회장이 될 수 있다.","ans":true,"mark":"X","note":"요건은 '전체 입주자 과반수의 서면동의'이지 입주자등 과반수 동의가 아니다.","rnd":[],"art":""},{"n":"⑤","text":"입주자대표회의는 그 회의를 개최한 때에는 회의록을 작성하여 관리주체에게 보관하게 하고, 관리주체는 입주자등이 회의록의 열람을 청구하거나 자기의 비용으로 복사를 요구하는 때에는 관리규약으로 정하는 바에 따라 이에 응하여야 한다.","ans":false,"mark":"O","note":"회의록은 관리주체가 보관하고 열람·복사 요구에 응해야 한다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"사용자인 동별 대표자가 회장이 되려면 '전체 입주자(소유자) 과반수의 서면동의'가 필요하다. '입주자등의 과반수 동의'로 서술한 ④가 틀렸다. 감사보고서 작성·공개, 결격 시 당연퇴임, 비입주자 권리 보호, 회의록 보관·열람은 옳다.","paras":[],"cites":["공동주택관리법 시행령 제17조 · 제18조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"사용자 대표자의 회장 취임은 '입주자 과반수 서면동의'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"중","roundLabel":"제23회 29번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-30","round":23,"num":30,"part":"관리·법령","unit":"관리비와 회계관리","sub":"관리비등과 관리비예치금(비목·구분징수·사용료 대행 납부)","type":"mc","stem":"공동주택관리법령상 관리비등의 집행을 위한 사업자 선정과 사업계획 및 예산안 수립에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"의무관리대상 공동주택의 관리주체는 회계연도마다 사업실적서 및 결산서를 작성하여 회계연도 종료후 3개월 이내에 입주자대표회의에 제출하여야 한다.","ans":false,"mark":"X","note":"사업실적서·결산서 제출 기한은 3개월이 아니라 2개월이다.","rnd":[],"art":""},{"n":"②","text":"의무관리대상 공동주택의 관리주체는 다음 회계연도에 관한 관리비등의 사업계획 및 예산안을 매 회계연도 개시 2개월 전까지 입주자대표회의에 제출하여 승인을 받아야한다.","ans":false,"mark":"X","note":"예산안은 매 회계연도 개시 1개월 전까지 '승인'까지 받아야 한다(2026.6.2. 시행 개정으로 승인기한임이 분명해졌다). 2개월 전이 아니다.","rnd":[],"art":""},{"n":"③","text":"의무관리대상 공동주택의 관리주체는 관리비, 장기수선충당금을 은행, 상호저축은행, 보험회사 중 입주자대표회의가 지정하는 동일한 계좌로 예치ㆍ관리하여야 한다.","ans":false,"mark":"X","note":"관리비와 장기수선충당금은 동일 계좌가 아니라 별도 계좌로 예치한다.","rnd":[],"art":""},{"n":"④","text":"입주자대표회의는 주민공동시설의 위탁, 물품의 구입과 매각, 잡수입의 취득에 대한 사업자를 선정하고, 관리주체가 이를 집행하여야 한다.","ans":false,"mark":"X","note":"주민공동시설 위탁·물품 구입·매각은 관리주체가 선정하고 집행한다.","rnd":[],"art":""},{"n":"⑤","text":"입주자대표회의는 하자보수보증금을 사용하여 보수하는 공사에 대한 사업자를 선정하고 집행하여야 한다.","ans":true,"mark":"O","note":"하자보수보증금을 사용하는 공사는 대표회의가 선정·집행한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"하자보수보증금을 사용하여 보수하는 공사는 입주자대표회의가 사업자를 선정하고 집행까지 한다. 사업실적서·결산서는 2개월 이내, 예산안은 개시 1개월 전, 관리비와 장기수선충당금은 별도 계좌, 주민공동시설 위탁·물품 구입 등은 관리주체가 선정·집행한다.","paras":[],"cites":["공동주택관리법 제23조 · 제25조 · 시행령 제25조"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"대표회의가 '선정+집행'하는 유일한 항목이 하자보수보증금 공사.","terms":[],"extra":[],"pdf":[],"boxes":[{"head":"[올해(2026) 시행] 법령 변경 유의","body":"<b>2026.6.2. 시행</b> 「공동주택관리법 시행령」 개정(대통령령 제36374호)으로 제26조제1항이 '입주자대표회의에 제출하여 매 회계연도 개시 1개월 전까지 승인을 받아야 한다'로 정비되었습니다. 1개월 전까지는 제출기한이 아니라 승인기한이므로, ②의 '2개월 전'은 지금도 틀린 지문이고 정답 ⑤도 그대로입니다.","html":true}],"diff":"하","roundLabel":"제23회 30번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-31","round":23,"num":31,"part":"안전·환경","unit":"안전관리","sub":"안전관리계획과 안전점검(방범·안전교육·설계도서 보관)","type":"mc","stem":"공동주택관리법령상 의무관리대상 공동주택의 관리주체의 안전관리계획과 안전점검 및 안전진단에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"건축물과 공중의 안전 확보를 위하여 건축물의 안전점검과 재난예방에 필요한 예산을 매년 확보하여야 한다.","ans":false,"mark":"O","note":"안전점검·재난예방 예산을 매년 확보해야 한다.","rnd":[],"art":""},{"n":"②","text":"사용검사일부터 30년이 경과한 15층 이하의 공동주택에 대하여 반기마다 대통령령으로 정하는 자로 하여금 안전점검을 실시하도록 하여야 한다.","ans":false,"mark":"O","note":"사용검사 후 30년 경과 15층 이하 공동주택은 반기마다 안전점검을 받는다.","rnd":[],"art":""},{"n":"③","text":"석축과 옹벽, 법면은 해빙기 진단 연 1회(2월 또는 3월)와 우기진단 연 1회(6월)가 이루어지도록 안전관리계획을 수립하여야 한다.","ans":false,"mark":"O","note":"석축·옹벽·법면은 해빙기(2·3월)와 우기(6월) 연 1회씩 진단한다.","rnd":[],"art":""},{"n":"④","text":"해당 공동주택의 시설물로 인한 안전사고를 예방하기 위하여 대통령령으로 정한 바에 따라 안전관리계획을 수립하고 시설물별로 안전관리자 및 안전관리책임자를 지정하여 이를 시행하여야 한다.","ans":false,"mark":"O","note":"안전관리계획을 수립하고 안전관리자·책임자를 지정해야 한다.","rnd":[],"art":""},{"n":"⑤","text":"변전실, 맨홀(정화조 뚜껑 포함), 펌프실, 전기실, 기계실 및 어린이 놀이터의 안전진단에 대하여 연 3회 이상 실시하도록 안전관리계획을 수립하여야 한다.","ans":true,"mark":"X","note":"해당 시설은 연 3회가 아니라 매 분기 1회 이상 진단한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"변전실·맨홀·펌프실·전기실·기계실·어린이놀이터의 안전진단은 '연 3회 이상'이 아니라 매 분기 1회 이상(연 4회) 실시한다. 예산 확보, 30년 경과 15층 이하 공동주택의 반기별 안전점검, 석축·옹벽·법면의 해빙기·우기 진단, 안전관리자 지정은 옳다.","paras":[],"cites":["공동주택관리법 시행령 별표(안전관리계획)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"변전실·기계실·놀이터는 '매 분기 1회 이상'.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 31번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-32","round":23,"num":32,"part":"관리·법령","unit":"관리사무소장·주택관리사와 경비원","sub":"관리주체의 업무와 관리사무소장의 업무·배치(경비원 업무 포함)","type":"mc","stem":"공동주택관리법령상 관리사무소장의 업무와 손해배상책임에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관리사무소장은 하자의 발견 및 하자보수의 청구, 장기수선계획의 조정, 시설물 안전관리계획의 수립 및 안전점검업무가 비용지출을 수반하는 경우 입주자대표회의의 의결 없이 이를 집행할 수 있다.","ans":true,"mark":"X","note":"비용지출을 수반하면 반드시 입주자대표회의의 의결을 거쳐야 한다.","rnd":[],"art":""},{"n":"②","text":"관리사무소장은 안전관리계획의 조정을 3년마다 하되, 관리여건상 필요하여 입주자대표회의 구성원 과반수의 서면동의를 받은 경우에는 3년이 지나가기 전에 조정할 수 있다.","ans":false,"mark":"O","note":"안전관리계획은 3년마다 조정하고, 구성원 과반수 서면동의 시 조기 조정할 수 있다.","rnd":[],"art":""},{"n":"③","text":"주택관리사등은 관리사무소장의 업무를 집행하면서 고의 또는 과실로 입주자등에게 재산상의 손해를 입힌 경우에는 그 손해를 배상할 책임이 있다.","ans":false,"mark":"O","note":"고의·과실로 재산상 손해를 입히면 배상책임이 있다.","rnd":[],"art":""},{"n":"④","text":"관리사무소장은 관리비, 장기수선충당금의 관리업무에 관하여 입주자대표회의를 대리하여 재판상 또는 재판외의 행위를 할 수 있다.","ans":false,"mark":"O","note":"관리비·장기수선충당금 관리업무에 관해 대표회의를 대리할 수 있다.","rnd":[],"art":""},{"n":"⑤","text":"관리사무소장은 입주자대표회의에서 의결하는 공동주택의 운영ㆍ관리ㆍ유지ㆍ보수ㆍ교체ㆍ개량에 대한 업무를 집행한다.","ans":false,"mark":"O","note":"대표회의 의결사항의 집행이 관리사무소장의 note":"압력탱크방식은 압력차가 커 급수압이 불안정하다.","rnd":[],"art":""},{"n":"⑤","text":"고가수조방식은 펌프직송방식에 비해 수질 오염 측면에서 불리하다.","ans":false,"mark":"O","note":"고가수조방식은 수질 오염에 불리하다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"압력탱크방식은 최고·최저 압력차가 커서 급수압이 일정하지 않다. 중간수조·감압밸브 방식, 크로스커넥션의 오염 위험, 시간최대 급수량 1.5~2.0배, 고가수조방식의 수질상 불리함은 옳다.","paras":[],"cites":["급수방식의 비교(압력탱크·고가수조)"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"압력탱크 — 압력변동이 크고 수질·소음에 불리.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 42번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-43","round":23,"num":43,"part":"시설·설비","unit":"급수·급탕설비","sub":"급수펌프와 수격작용(양정·동력·상사법칙·공동현상·서징)","type":"mc","stem":"펌프에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"펌프의 회전수를 1.2배로 하면 양정은 1.73배가 된다.","ans":false,"mark":"X","note":"1.2배 회전 시 양정은 1.44배다(1.73은 √3 관계).","rnd":[],"art":""},{"n":"②","text":"펌프의 회전수를 1.2배로 하면 양수량은 1.44배가 된다.","ans":false,"mark":"X","note":"양수량은 1.2배다.","rnd":[],"art":""},{"n":"③","text":"동일한 배관계에서는 순환하는 물의 온도가 낮을수록 서징(surging)의 발생 가능성이 커진다.","ans":false,"mark":"X","note":"수온이 높을수록 서징 가능성이 커진다.","rnd":[],"art":""},{"n":"④","text":"동일 성능의 펌프 2대를 직렬운전하면 1대 운전 시보다 양정은 커지나 배관계 저항때문에 2배가 되지는 않는다.","ans":true,"mark":"O","note":"직렬운전 시 양정은 커지나 2배가 되지는 않는다.","rnd":[],"art":""},{"n":"⑤","text":"펌프의 축동력을 산정하기 위해서는 양정, 양수량, 여유율이 필요하다.","ans":false,"mark":"X","note":"축동력에는 양정·양수량 외에 효율·여유율 등이 필요하다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"동일 성능 펌프 2대를 직렬운전하면 양정은 커지지만 배관 저항 때문에 1대의 2배가 되지는 않는다. 회전수 1.2배 시 양수량은 1.2배, 양정은 1.44배이고, 수온이 '높을수록' 서징 발생 가능성이 크다.","paras":[],"cites":["펌프의 상사법칙·운전방식"],"citeLabel":"관련 기준/법령","citeFirst":false,"key":"직렬 = 양정 증가(2배 미만), 병렬 = 유량 증가.","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 43번","noAns":false,"stemBr":false,"tableRows":[]},{"id":"23-44","round":23,"num":44,"part":"시설·설비","unit":"급수·급탕설비","sub":"급수방식과 급수설비
