ms":[],"extra":["①) 지붕재료 한 개의 크기가 클수록, 재료의 강도·내수성·수밀성이 클수록 물매를 작게(완경사) 한다. 강우량과 적설량이 많 은 지방일수록 물매를 크게 한다.","②) 지붕 재료별 최소 물매는 평잇기 금속지붕 1/2 이상, 기와 및 아스팔트 싱글지붕 1/3 이상, 금속기와지붕 1/4 이상, 합성고분자 시트지붕 1/50 이상이다.","③) 모임지붕은 네 방향으로 경사진 지붕이다 아스팔트 글지붕 시공 시 아연제 못을 싱글 한 장당 4개씩 박으며, 공장에서 접착제가 도포된 부분에는 못질을 하지 않는다","⑤) 우수의 흐름 순서는 처마홈통→ 깔때기홈통→ 장식홈통→ 선홈통→ 낙수받이통 순이다 깔때기홈통과 선홈통 연결 부의 겹침길이는 최소 100mm 이상으로 한다. 공통) 처마홈통의 물매는 1/200 이상, 이음부 겹침은 30mm 이상으로 하며 15m 간격으로 신축이음을 설치한다 선홈통 최장길이는 3000mm 이하 벽면 이격거리는 30mm 이상으로 하고 하단 배수구는 45° 경사로 건물 바깥쪽을 향하게 설 치한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 59번","noAns":false,"stemBr":false},{"id":"29-58","round":29,"num":58,"part":"건축구조","unit":"지붕 및 홈통공사","sub":"홈통공사","type":"mc","stem":"지붕 및 홈통공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"지붕재료는 열전도율이 크고, 습도에 의한 신축이 작아야 한다.","ans":false,"mark":"X","note":"지붕재료는 건축물의 단열 성능 확보를 위하여 열전도율이 작아야 하며, 온도 및 습도 변화에 의한 변형이나 균열을 방 지하기 위하여 신축이 작아야 한다.","rnd":[22,23,27],"art":""},{"n":"②","text":"맨사드지붕이란 지붕위에 작은 지붕을 설치하여 채광, 통풍을 위해 만든 지붕이다.","ans":false,"mark":"X","note":"맨사드지붕은 지붕의 경사면을 상부 완경사 하부 급경사의 2단계 경사로 구성하여 다락방 등의 내부 공간을 크게 활용 하도록 만든 지붕이다 채광이나 통풍을 위해 지붕 위에 작은 지붕을 설치하는 것은 솟을지붕이다","rnd":[],"art":""},{"n":"③","text":"지붕물매란 수평거리 10 cm에 대한 수직높이를 의미하며 경사 60'의 물매는 된물매이다","ans":true,"mark":"O","note":"지붕물매는 수평거리 10 cm에 대한 수직높이의 비율로 산정하며 경사각 45도(10 m 물매)를 초과하는 경사인 60도 물 매는 된물매로 분류한다","rnd":[24,27],"art":""},{"n":"④","text":"동판은 알칼리에 강하고 수명이 길어 화장실이나 암모니아 가스가 발생하는 곳에 유용하게 사용된다.","ans":false,"mark":"X","note":"동판은 내후성과 내구성이 뛰어나지만 산, 알칼리, 암모니아 성분에 약해 부식이 잘 일어나므로 화장실이나 암모니아 가스가 발생하는 장소의 배관이나 지붕재로는 부적합하다","rnd":[20,21,22,23,24,25,27],"art":""},{"n":"⑤","text":"선홈통은 최장 길이 3,000mm 이하로 제작 설치하되 벽면에 이격없이 밀착하여 설치한다","ans":false,"mark":"X","note":"선홈통은 배수 시 이음부 누수로 인한 외벽면 오염을 방지하고 배관 고정을 원활하게 하기 위하여 벽체 표면에서 일정 거리를 이격하여 설치한다","rnd":[20,22,27],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 지붕재료는 열전도율과 신축이 작아야 할 뿐만 아니라 내수적이어야 하며, 흡수율이 작아 동해에 안전하고 불연재이어 야 한다","②) 지붕마루에서 양쪽으로 경사진 지붕은 박공지붕(맞배지붕)이라 하고, 네 방향으로 경사진 지붕은 모임지붕이라 한다.","③) 수평거리와 수직높이가 같은 경사 45°의 물매는 되물매라 한다 지붕면적이 클수록, 강우량과 적설량이 많을수록 물매를 크게 하고, 지붕재료 한 개의 크기가 클수록, 재료의 강도·내수성·수밀성이 클수록 물매를 작게 한다.","⑤) 선홈통은 벽면과 최소 30mm 이상의 이격거리를 유지하며 하단부 배수구는 45° 경사로 건물 바깥쪽을 향하게 설치하여 우배수관에 직접배수되도록 연결한다. 공통) 우수의 흐름 순서는 처마홈통→ 깔때기홈통→ 장식홈통→ 선홈통→ 낙수받이통 순이다. 지붕물매는 별도 지정이 없으면 1/50 이상으로 하며, 금속지붕 및 금속기와지붕은 1/4 이상, 기와지붕 및 아스팔트싱글지 붕은 1/3 이상, 평잇기 금속지붕은 1/2 이상으로 한다. 처마홈통의 물매는 1/200 이상으로 하고, 이음부는 최소 30mm 이상 겹치도록 제작하며 신축이음은 매 15m 간격으로 설치 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 58번","noAns":false,"stemBr":false},{"id":"20-93","round":20,"num":93,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"알루미늄 창호는 강재에 비해 비중이 낮고 내알칼리성이 우수하다","ans":false,"mark":"X","note":"","rnd":[21,22,23,24,25,26,27,28,29],"art":""},{"n":"②","text":"갑종 방화문은 강제틀에 두께 0.3 mm 이상의 강판을 한쪽 면에 붙인 것이다. (학습불가)","ans":false,"mark":"X","note":"","rnd":[29],"art":""},{"n":"③","text":"여임대는 미닫이 또는 여닫이 문짝이 서로 맞닿는 선대를 말한다","ans":false,"mark":"X","note":"","rnd":[24,27],"art":""},{"n":"④","text":"나이트 래치는 미닫이창호의 선대에 달아 잠그는데 사용되는 철물이다","ans":false,"mark":"X","note":"","rnd":[23],"art":""},{"n":"⑤","text":"오르내리 꽃이쇠는 여닫이창호에 상하 고정용으로 달아서 개폐상태를 유지하는데 사용한다 ※ 과거 갑종 방화문 삭제. 현행 용어 60분 방화문","ans":true,"mark":"O","note":"","rnd":[29],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["※ 과거 갑종 방화문 삭제. 현행 용어 60분 방화문","알루미뉴은 비중이 강재에 비해 가볍지만 산이나 알칼리에 약하여 시멘트 모르타르나 콘크리트의 알칼리 성분과 접촉하 면 침식되기 쉬우므로 내알칼리성이 낮다","60분+ 방화문은 화염을 차단하는 차염성능이 60분 이상, 열을 차단하는 차열성능 30분 이상을 확보한 방화문이며 60분 방화문 (과거용어 갑종 방화문) 은 차염성능 60분 이상을 확보한 방화문을 의미한다 30분 방화문 (과거용어 을종 방화문) 은 차염성능 30분 이상을 확보한 방화문을 의미한다.","여임대는 미서기 또는 미닫이 문짝이 서로 맞닿거나 겹쳐지는 세로 선대를 의미하며, 여닫이 문짝이 맞닿는 선대에는 적 용되지 않는다","나이트 래치는 여닫이문의 내측에 부착하여 내부에서는 손잡이로 외부에서는 열쇠로 개폐하는 자물쇠이다 미닫이창호 의 선대에 달아 잠그는 데 사용하는 철물은 크레센트이다.","오르내리 꽃이쇠는 여닫이 문짝이나 창호의 한쪽 문짝 상하에 달아 문을 고정함으로써 개폐 상태를 유지하는 데 사용되는 철물이다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"오르내리 꽃이쇠는 여닫이 문짝이나 창호의 한쪽 문짝 상하에 달아 문을 고정함으로써 개폐 상태를 유지하는 데 사용되는 철물이다","terms":[],"extra":["①) 알루미늄창호는 비중이 가볍고 기밀성과 수밀성이 우수하다 그러나 알칼리에 약하여 모르타르나 콘크리트와의 직접 접촉을 피해야 하며, 이질 금속재와 접촉 시 전기화학작용으로 부식된다","③) 서로 여며지는 선대는 여임대(미서기, 오르내리기창)라 하고, 서로 맞닿는 선대는 마중대(미닫이, 여닫이문)라 한다. 방풍 을 목적으로 마중대와 여임대에 턱솔 등을 두어 접하는 부분에 틈새가 발생하지 않도록 한 것을 풍소란이라 한다.","④) 크레센트는 미서기창이나 오르내리창의 잠금장치이다 창호의 잠금장치 종류에는 크레센트 외에도 실린더자물쇠 나이트 래치, 도어체인이 있다.","⑤) 오르내리꽃이쇠는 여닫음 조정기에 속한다 주요 지지철물로는 가장 무거운 중량 여닫이문에 사용하는 피봇힌지, 바닥에 스프링장치를 묻어 사용하는 중량 자재문용 플로어힌지 문이 저절로 닫히되 10~15cm 정도 열려있도록 하는 레버토리힌지 가 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 93번","noAns":false,"stemBr":false},{"id":"21-93","round":21,"num":93,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"저절로 문은 닫히지만 15 cm 정도는 열려있도록 하기 위해 사용되는 창호철물은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"레버토리 힌지(lavatory hinge)","ans":true,"mark":"O","note":"창호철물 분류 중 레버토리 힌지는 내부에 경사면과 스프링 구조가 내장되어 있어 문을 연 후 놓으면 자중과 복원력에 의해 자동으로 문이 닫히되 약 15 cm 정도의 간격을 남겨두고 멈추는 특성을 가진다 주로 공중화장실 문 등에 적용되어 내부 사용 여부를 외부에서 쉽게 식별할 수 있도록 한다.","rnd":[22,23,24,27],"art":""},{"n":"②","text":"도어 클로저(door closer)","ans":false,"mark":"X","note":"도어 클로저는 문 상부와 문틀 사이에 설치하여 문을 열었다가 놓았을 때 유압 감쇄 피스톤과 내장 스프링의 복원력을 통해 문이 충격 없이 정숙하게 완전히 닫히도록 제어하는 유압식 창호철물이다.","rnd":[22],"art":""},{"n":"③","text":"크레센트(crescent)","ans":false,"mark":"X","note":"크레센트는 미세기 창문 또는 미세기 문 등의 선대에 설치되어 반달형 레버를 회전시킴으로써 창문의 밀착 및 잠금 상태 를 유지하는 잠금철물이다","rnd":[23,26,29],"art":""},{"n":"④","text":"실린더자물쇠(cylinder lock)","ans":false,"mark":"X","note":"실린더 자물쇠는 원통형 자물쇠 몸체 내부에 핀 덤블러 장치가 내장되어 있어 열쇠를 삽입 및 회전시켜 문을 잠그거나 개방하는 문용 잠금 장치이다","rnd":[],"art":""},{"n":"⑤","text":"피봇 힌지(pivot hinge)","ans":false,"mark":"X","note":"피봇 힌지는 문틀과 문짝의 상하부에 회전축을 설치하여 중량이 큰 여닫이문이나 강화유리문 등의 하중을 수직으로 지지 하면서 원활하게 개폐되도록 하는 경첩 철물이다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"창호철물 분류 중 레버토리 힌지는 내부에 경사면과 스프링 구조가 내장되어 있어 문을 연 후 놓으면 자중과 복원력에 의해 자동으로 문이 닫히되 약 15 cm 정도의 간격을 남겨두고 멈추는 특성을 가진다 주로 공중화장실 문 등에 적용되어 내부 사용 여부를 외부에서 쉽게 식별할 수 있도록 한다","terms":[],"extra":["①) 레버토리힌지는 지지철물 중 자유경첩의 일종이다. 공통) 지지철물 중 플로어힌지는 바닥에 스프링장치를 묻어 중량 자재문에 사용한다. 여닫음 조정기에는 도어클로저 도어스톱 창개폐조정기, 오르내리꽃이쇠가 포함된다. 잠금장치에는 크레센트, 실린더자물쇠, 나이트래치, 도어체인이 포함된다. 여임대는 미서기 및 오르내리기창의 서로 여며지는 선대이고, 마중대는 미닫이 및 여닫이문에서 서로 맞닿는 선대이다 풍소란은 마중대와 여임대가 접하는 부분에 방풍 목적으로 설치한다 멀리온은 창 면적이 클 때 강판을 중공형으로 접어 대는 수직 중간선틀이다 세팅블록은 유리의 자중을 지지하기 위해 창호 하단부 폭의 1/4 지점에 각각 1개씩 설치한다. 현장에서 절단이 불가능한 유리에는 강화유리, 복층유리 로이유리, 유리블록 배강도유리가 해당된다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 93번","noAns":false,"stemBr":false},{"id":"22-48","round":22,"num":48,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"문 위틀과 문짝에 설치하여 문을 열면 자동으로 조용히 닫히게 하는 장치로 피스톤 장치가 있어 개폐 속도를 조절 할 수 있는 창호 철물은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"도어 체크※ 문제 내 현행 기준 상 과거 용어: 도어 체크(현행 용어: 도어 클로저)","ans":true,"mark":"O","note":"도어 클로저는 문 위틀과 문짝 상단에 설치하여 문을 열었다가 놓으면 내부 피스톤 및 유압 장치에 의해 자동으로 조용 하 닫히게 하며 개폐 속도를 조절하는 창호 철물이다","rnd":[21],"art":""},{"n":"②","text":"플로어 힌지","ans":false,"mark":"X","note":"플로어 힌지는 바닥면에 힌지 박스를 묻어 문짝의 상하 축으로 지지하는 장치로 자중이 중량인 강화유리문이나 대형 출 입문의 자동 닫힘 및 개폐 제어에 사용된다.","rnd":[24,29],"art":""},{"n":"③","text":"레버토리 힌지","ans":false,"mark":"X","note":"레버토리 힌지는 스프링 작용에 의해 문을 열어두었을 때 자동으로 일정한 각도로 열려 있거나 안쪽으로 닫히도록 조절 하는 힌지로 주로 공중화장실 문 등에 사용된다","rnd":[21,23,24,27],"art":""},{"n":"④","text":"도어 스톱","ans":false,"mark":"X","note":"도어 스톱은 문을 열었을 때 문 손잡이나 문짝이 벽체에 직접 부딪쳐 발생하는 손상을 방지하고 문을 정지·고정하기 위 해 바닥이나 벽체, 문짝 하단에 설치하는 정지 장치이다","rnd":[],"art":""},{"n":"⑤","text":"크리센트","ans":false,"mark":"X","note":"크리센트는 오르내리창이나 슬라이딩 미서기창 등의 창문 여닫이선에 설치하여 밀착·잠금 상태를 유지하는 초승달 모양 의 잠금 철물이다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 도어클로저(도어체크)는 도어스톱 창개폐조정기, 오르내리꽃이쇠와 함께 여닫음 조정기에 속한다","②) 플로어힌지는 바닥에 스프링장치를 묻어 경첩으로 지탱하기 힘든 중량 자재문에 사용하는 지지철물이다","③) 레버토리힌지는 자유경첩의 일종으로 열려진 여닫이문이 저절로 닫히지만 10~15cm 정도 열려있도록 한 지지철물이다","④) 도어스톱(도어스테이, 문버팀쇠)은 여닫음 조정기에 해당한다","⑤) 크레센트는 실린더자물쇠 나이트래치, 도어체인 등과 함께 잠금장치에 속하며 오르내리창이나 미서기창에 사용한다 공통) 지지철물에는 경첩, 자유경첩, 피봇힌지, 플로어힌지 레버토리힌지 도어행거가 있으며 피봇힌지는 가장 무거운 중량 여닫이문에 사용한다 여임대는 미서기·오르내리기창의 서로 여며지는 선대이고, 마중대는 미닫이·여닫이문의 서로 맞닿는 선대이다 풍소란은 마중대와 여임대에 턱솔 등을 두어 틈새를 방지하는 방풍 목적의 부재이다 창호철물류 설치 시 앵커간격은 모서리 150mm 내외, 중앙 500mm 내외로 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 48번","noAns":false,"stemBr":false},{"id":"23-53","round":23,"num":53,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"외부에서는 열쇠로 내부에서는 작은 손잡이를 돌려서 열 수 있는 창호철물은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"도어체크(door check)","ans":false,"mark":"X","note":"","rnd":[26,27],"art":""},{"n":"②","text":"크레센트(crescent)","ans":false,"mark":"X","note":"","rnd":[21,26,29],"art":""},{"n":"③","text":"패스너(fastener)","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"나이트 래치(night latch)","ans":true,"mark":"O","note":"","rnd":[20],"art":""},{"n":"⑤","text":"레버토리 힌지(lavatory hinge) ※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","ans":false,"mark":"X","note":"","rnd":[21,22,24,26,27],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","도어클로저는 문을 열었을 때 피스톤과 스프링의 작용에 의해 문이 자동으로 천천히 닫히도록 제어하는 장치이다","크레센트는 미서기 창문이나 여닫이 창문의 잠금을 위해 창틀과 문짝 상호 간에 설치하는 초승달 모양의 잠금장치이다","패스너는 창호나 커튼월 등의 구조 부재를 건축물 골조에 안전하게 고정하기 위해 사용하는 연결 고정철물이다","나이트 래치는 외부에서는 열쇠를 사용하여 잠금을 해제하고, 내부에서는 작은 손잡이(노브 또는 래치 손잡이)를 돌려서 열 수 있는 창호철물이다","레버토리 힌지는 공중화장실 문 등에 사용되는 힌지로 평상시에는 스프링 작용에 의해 문이 약간 열려 있고 내부에서 잠그면 닫힌 상태가 유지되는 정원 힌지의 일종이다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 도어클로저는 유압 작용을 이용하여 문이 닫히는 속도를 조절한다","⑤) 레버토리힌지는 공중화장실 문 등에 설치하며 스프링 작용에 의해 평상시 10~15cm 정도 정방향으로 열려 있고 사용 시 내부에서 잠그면 폐쇄 상태가 유지된다. 공통) 피봇힌지(지도리)는 경첩 대신 축을 중심으로 회전하며 모멘트를 받는 중량 철제문 및 자유문에 사용하고 플로어힌지는 바닥에 유압 스프링을 매설하여 자중이 큰 중량 여닫이문이나 유리문에 설치한다 창호철물 중 벽과 문고리의 충돌을 방지하는 것은 도어스톱(도어쿠션)이고, 열린 문을 정지 상태로 고정하는 것은 도어홀더 이다. 문틀 없이 벽체나 구조체에 창틀을 직접 고정하는 부속철물에는 패스너가 포함된다. 창호 성능평가 항목에는 기밀성, 수밀성, 내풍압성, 단열성, 차음성(음향차단성) 등이 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 53번","noAns":false,"stemBr":false},{"id":"24-59","round":24,"num":59,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호공사에 관한 설명으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[{"mk":"ㄱ","tx":"알루미늄 창호는 알칼리에 약하므로 모르타르와의 직접 접촉을 피한다."},{"mk":"ㄴ","tx":"여닫이 창호철물에는 플로어 힌지, 피벗 힌지, 도어 클로저 도어 행거 등이 있다."},{"mk":"ㄷ","tx":"멀리온은 창 면적이 클 때, 스틸바(steel bar) 만으로는 부족하여 이를 보강하기 위해 강판을 중공형으로 접어 가로 또는 세로로 대는 것이다"},{"mk":"ㄹ","tx":"레버토리 힌지는 자유정첩(경첩)의 일종으로 저절로 닫히지만 10~15 cm 정도 열려 있도록 만든 철물이다"}],"letters":true,"combo":false,"choices":[{"n":"①","text":"ㄱ, ㄴ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄱ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"ㄴ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄷ, ㄹ","ans":true,"mark":"O","note":"","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["창호공사에 사용되는 재료와 철물은 각각의 구조적 특성과 내식성을 고려하여 설치해야 한다.","ㄱ. 알루미늄 창호는 산 및 알칼리에 약하므로 시멘트 모르타르와의 직접 접촉 시 부식이 발생할 수 있어 내알칼리성 도료 를 바르거나 절연재를 두어 직접 접촉을 피해야 한다.","ㄴ. 플로어 힌지, 피벗 힌지, 도어 클로저는 여닫이 창호철물에 해당하나, 도어 행거는 미닫이 문짝 상부 레일에 문을 걸어 움직이게 하는 미닫이 창호용 철물이다.","ㄷ. 멀리온은 창 면적이 클 때 단면 강도를 확보하기 위해 설치하는 중간선대로 스틸바만으로는 부족할 경우 강판을 중공 형으로 접어 가로 또는 세로로 대어 보강한다","ㄹ. 레버토리 힌지는 화장실 문 등에 사용되는 자유정첩의 일종으로, 내부에 사람이 없을 때 10~15 cm 정도 열려 있어 사 용 여부를 외부에서 확인하도록 만든 철물이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ, ㄷ, ㄹ","terms":[],"extra":["ㄱ.) 알루미늄은 비중이 철의 1/3 정도로 가볍고 공작이 자유로우며 기밀성과 수밀성이 우수하다 이질 금속재와 접촉할 때 전기화학작용에 의한 부식이 발생한다","ㄴ. ) 피봇힌지는 가장 무거운 중량 여닫이문에 사용하며 플로어힌지는 바닥에 스프링장치를 묻어 중량 자재문에 사용한다. 여닫음 조정기에는 도어클로저 도어스톱 창개폐조정기 등이 있고, 미서기창이나 오르내리창의 잠금장치로는 크레센트를 사 용한다","ㄷ. ) 강제창호공사의 멀리온은 풍압이나 여닫음 진동으로 인한 유리 파손을 방지하고 보강 및 미관을 위해 대는 수직 중간 선틀이다","ㄹ. ) 레버토리힌지는 경첩, 피봇힌지 플로어힌지 도어행거 등과 함께 창호의 지지철물에 속한다 미서기창호에서 방풍을 목적으로 마중대와 여임대에 턱솔 등을 두어 틈새를 방지하는 부속은 풍소란이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 59번","noAns":false,"stemBr":false},{"id":"25-52","round":25,"num":52,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"문틀을 짜고 문틀 양면에 합판을 붙여서 평평하게 제작한 문은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"플러시문","ans":true,"mark":"O","note":"플러시문은 울거미(뼈대)를 짜고 양면에 합판, MDF, 치장재 등을 붙여 표면을 평평하게 제작한 문이다. 무게가 가볍고 변형이나 비틀림이 적어 실내 여닫이문으로 주로 사용된다.","rnd":[],"art":""},{"n":"②","text":"양판문","ans":false,"mark":"X","note":"양판문은 울거미를 짜고 그 안쪽 공간에 널판(양판)을 끼워 넣어 만든 문이다.","rnd":[],"art":""},{"n":"③","text":"도듬문","ans":false,"mark":"X","note":"도듬문은 널판의 가장자리를 얇게 도듬 가공하여 울거미 홈에 끼워 맞춘 문이다.","rnd":[],"art":""},{"n":"④","text":"널문","ans":false,"mark":"X","note":"널문은 널판을 나란히 맞대고 뒤편에 띠장을 대어 못을 박아 고정한 문이다","rnd":[],"art":""},{"n":"⑤","text":"합판문","ans":false,"mark":"X","note":"합판문은 표면 재료로 합판을 사용한 문을 통칭하는 일반적 명칭이며 울거미 양면에 합판을 대어 표면을 평평하게 제작 한 특정 형태의 문은 플러시문으로 분류한다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"플러시문은 울거미(뼈대)를 짜고 양면에 합판, MDF, 치장재 등을 붙여 표면을 평평하게 제작한 문이다. 무게가 가볍고 변형이나 비틀림이 적어 실내 여닫이문으로 주로 사용된다","terms":[],"extra":["①) 플러시문은 울거미 뼈대 양면에 합판을 대어 제작하므로 변형이나 뒤틀림이 적다. 내부 수분 배출과 공기 순환을 위해 울거미 상하 부재에 공기구명(숨구명)을 설치한다","②) 양판문은 울거미 내부에 널판(양판)을 끼워 넣은 구조이다 목재의 수축·팽창에 따른 균열을 방지하기 위해 널판을 울거미 홈에 완전히 접착 고정하지 않고 여유를 둔다.","③) 도듬문은 널판의 가장자리를 얇게 깎아 도듬 가공한 후 울거미 홈에 맞물리게 끼우는 구조이다 목재 가공 시 변형을 줄이기 위해 울거미를 먼저 조립한 후 널판을 제작한다.","④) 널문은 널판을 나란히 맞대고 뒤편에 띠장을 대어 못을 박아 만든 가장 단순한 형식의 문이다. 기밀성, 방음성, 방화성 이 떨어져 주로 창고나 가설물 출입문에 사용한다","⑤) 합판문 및 일반 목재문 시공 시 피벗힌지는 중량문 상하에 설치하여 하중을 받치고, 도어클로저는 열린 문을 자동으로 닫히게 한다. 미서기창 및 이중창의 잠금장치로는 크레센트를 적용한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 52번","noAns":false,"stemBr":false},{"id":"25-54","round":25,"num":54,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호철물에서 경첩(hinge)에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"경첩은 문짝을 문틀에 달 때, 여닫는 축이 되는 역할을 한다.","ans":false,"mark":"O","note":"경첩은 문짝과 문틀을 연결하여 문이 회전하며 여닫힐 수 있도록 중심축 역할을 하는 대표적인 창호 철물이다","rnd":[],"art":""},{"n":"②","text":"경첩의 축이 되는 것은 핀(pin)이고, 핀을 보호하기 위해 둘러감은 것이 행거(hanger)이다.","ans":true,"mark":"X","note":"경첩의 회전축을 이루는 중심 핀(pin)을 감싸서 지지하는 원통형 부분의 명칭은 너클(knuckle)이다. 행거(hanger)는 문 을 상부 레일에 걸어 슬라이딩 방식으로 이동시키는 철물 등을 의미하므로 옳지 않다.","rnd":[],"art":""},{"n":"③","text":"자유경첩(spring hinge)은 경첩에 스프링을 장치하여 안팎으로 자유롭게 여닫게 해주는 철물이다.","ans":false,"mark":"O","note":"자유경첩(스프링 힌지)은 경첩 내부의 스프링 반발력을 이용하여 문이 안팎 양방향으로 자유롭게 여닫히며 열린 후 자동 으로 닫히도록 해주는 철물이다.","rnd":[21,22,23,29],"art":""},{"n":"④","text":"플로어힌지(floor hinge)는 바닥에 설치하여 한쪽에서 열고나면 저절로 닫혀지는 철물로 중량이 큰 자재문에 사용된다.","ans":false,"mark":"O","note":"플로어힌지(바닥 힌지)는 바닥면에 힌지 박스를 매립하여 중량이 큰 강화유리문이나 자재문의 하중을 지지하고, 개폐 후 유압에 의해 저절로 닫히도록 제어하는 철물이다","rnd":[26],"art":""},{"n":"⑤","text":"피봇힌지(pivot hinge)는 암수 돌쩌귀를 서로 끼워 회전으로 여닫게 해주는 철물이다","ans":false,"mark":"O","note":"피봇힌지(지도리)는 문 상하단 외곽의 암수 돌쩌귀 핀 구조를 바닥 및 문틀 상부에 끼워 회전축으로 작동하게 하는 철물이다.","rnd":[27,29],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"경첩의 회전축을 이루는 중심 핀(pin)을 감싸서 지지하는 원통형 부분의 명칭은 너클(knuckle)이다.","terms":[],"extra":["①) 창호 철물은 기능별로 지지철물(경첩, 자유경첩, 피봇힌지, 플로어힌지 레버토리힌지, 도어행거), 여닫음 조정기(도어클 로저 도어스톱 창개폐조정기), 잠금장치(크레센트 실린더자물쇠, 나이트래치)로 분류한다","②) 슬라이딩문 상부에 설치되어 문을 매다는 철물은 도어행거이다 오르내리창이나 미서기창의 잠금장치로는 크레센트를 사용하며 방풍을 위해 마중대와 여임대에 턱솔을 두는 부재는 풍소란이다","③) 레버토리힌지는 자유경첩의 일종으로 공중화장실 등에 적용하며 열려진 여닫이문이 저절로 닫히되 10~15cm 정도 열려 있도록 제작된 지지철물이다","④) 플로어힌지는 바닥에 스프링장치를 매립하여 경첩으로 지탱하기 힘든 중량 자재문에 사용하는 지지철물이다","⑤) 피봇힌지(지도리)는 문 상하단 외곽에 설치하여 주로 중량 여닫이문에 사용하는 지지철물이다 창 면적이 클 때 보강 및 미관을 위해 대어주는 수직 중간선틀은 멀리온이라 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 54번","noAns":false,"stemBr":false},{"id":"26-56","round":26,"num":56,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"피봇 힌지(pivot hinge)는 문을 자동으로 닫히게 하는 경첩으로 중량의 자재문에 사용한다","ans":true,"mark":"X","note":"","rnd":[25],"art":""},{"n":"②","text":"알루미늄 창호는 콘크리트나 모르타르에 직접적인 접촉을 피하는 것이 좋다.","ans":false,"mark":"O","note":"","rnd":[20,21,22,23,24,25,27,28,29],"art":""},{"n":"③","text":"도어스톱(door stop)은 벽 또는 문을 파손으로부터 보호하기 위하여 사용한다.","ans":false,"mark":"O","note":"","rnd":[29],"art":""},{"n":"④","text":"크레센트(crescent)는 미서기창과 오르내리창의 잠금장치이다","ans":false,"mark":"O","note":"","rnd":[20,21,22,23,28,29],"art":""},{"n":"⑤","text":"도어체크(door check)는 문짝과 문 위틀에 설치하여 자동으로 문을 닫히게 하는 장치이다 ※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","ans":false,"mark":"O","note":"","rnd":[23,27],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","피봇 힌지(피벗 힌지)는 문 상부와 하부 축을 중심으로 문을 회전시켜 개폐하는 철물로 중량의 여닫이문이나 자재문의 하 중을 지지하기 위해 사용된다. 자체에 문을 자동으로 닫히게 하는 유압이나 스프링 제어 기능이 없으므로 문을 자동으로 닫히게 하는 경첩이 아니다 문을 자동으로 닫히게 하는 장치로는 플로어 힌지, 도어클로저(도어체크). 스프링 힌지 등이 있다.","알루미늄은 알칼리성에 약한 금속이므로 강알칼리성을 띠는 콘크리트, 모르타르 회반죽 등에 직접 접촉하면 화학 반응 에 의해 부식될 위험이 크다. 따라서 직접 접촉을 피하거나 접촉면에 아스팔트계 도료를 바르는 등 절연 처리를 해야 한다.","도어스톱은 문을 개방할 때 문손잡이나 문짝이 벽에 직접 부딪쳐 파손되는 것을 방지하고, 문짝 및 벽체를 보호하기 위해 바닥이나 벽에 설치하는 충격 완화 및 정지 장치이다","크레센트는 미서기창이나 오르내리창에서 창짝이 서로 겹치는 부위에 설치하여 반달 모양의 회전 고리를 돌려 창짝을 밀 착시키고 잠그는 철물이다","도어클로저는 문짝 상부와 문틀 상부에 설치되어, 문을 열었다가 놓았을 때 내부 스프링과 유압 제어를 통해 문이 자동 으로 천천히 닫히도록 하는 장치이다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"피봇 힌지(피벗 힌지)는 문 상부와 하부 축을 중심으로 문을 회전시켜 개폐하는 철물로 중량의 여닫이문이나 자재문의 하 중을 지지하기 위해 사용된다.","terms":[],"extra":["①) 피봇힌지는 지도리철물이라고도 하며 주로 중량 여닫이문에 사용한다 바닥에 스프링장치를 묻어 중량 자재문에 사용하는 철물은 플로어힌지이다","②) 알루미늄창호는 철 비중의 1/3 정도로 가볍고 기밀·수밀성이 우수하나 알칼리에 약하여 콘크리트나 모르타르 접촉을 피 해야 하고, 이질 금속 접촉 시 전기화학작용으로 부식된다","③) 여닫음 조정기에는 도어클로저(도어체크), 도어스톱(도어스테이 문버팀쇠), 창개폐조정기, 오르내리꽃이쇠가 속한다 창 면적이 클 때 풍압으로 인한 유리 파손을 방지하는 수직 중간선틀은 멀리온이다","④) 잠금장치에는 크레센트 실린더자물쇠 나이트래치, 도어체인이 속한다 미서기창호에서 방풍을 목적으로 마중대와 여임대에 턱솔 등을 두어 접하는 부분의 틈새를 막는 부재는 풍소란이다","⑤) 레버토리힌지는 자유경첩의 일종으로 문이 저절로 닫히지만 10~15cm 정도 열려있도록 한 지지철물이다 창호철물 설치 시 앵커간격은 모서리 150mm 내외, 중앙 500mm 내외로 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 56번","noAns":false,"stemBr":false},{"id":"27-41","round":27,"num":41,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호 및 부속철물에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"풍소란은 마중대와 여임대가 서로 접하는 부분에 방풍 등의 목적으로 사용한다","ans":false,"mark":"O","note":"","rnd":[20,28],"art":""},{"n":"②","text":"레버토리 힌지는 문이 저절로 닫히지만 15 cm 정도 열려있도록 하는 철물이다.","ans":false,"mark":"O","note":"","rnd":[21,22,23,24],"art":""},{"n":"③","text":"주름문은 도난방지 등의 방범목적으로 사용한다","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"피봇힌지는 주로 중량문에 사용한다.","ans":false,"mark":"O","note":"","rnd":[25,29],"art":""},{"n":"⑤","text":"도어체크는 피스톤장치가 있지만 개폐속도는 조절할 수 없다 ※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","ans":true,"mark":"X","note":"","rnd":[23,26,29],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 도어체크(현행 용어: 도어클로저)","풍소란은 미세기문이나 여닫이문의 마중대와 여임대가 서로 접하는 부분에 틈새바람을 막고 방풍, 차음 및 먼지 유입 방지를 목적으로 대어주는 부속재이다","레버토리 힌지는 경사면이나 내장된 스프링의 작용에 의해 문을 열고 난 후 저절로 닫히거나 약 15 cm 정도 안쪽으로 열린 상태를 유지하도록 하는 화장실용 철물이다.","주름문은 방범 및 도난 방지 목적이나 공간 구획 및 출입 통제를 위해 주로 사용하는 개폐 철물이다","피봇힌지는 문 상하단과 문틀에 축을 설치하여 문을 회전시키는 철물로 지지력이 뛰어나 방화문이나 중량문에 주로 사용 한다.","도어클로저는 유압 피스톤 장치를 내장하여 문이 자동으로 조용히 닫히도록 하는 장치이며 피스톤 내 유량 조절 벨브를 통해 문이 닫히는 개폐 속도를 자유롭게 조절할 수 있다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"도어클로저는 유압 피스톤 장치를 내장하여 문이 자동으로 조용히 닫히도록 하는 장치이며 피스톤 내 유량 조절 벨브를 통해 문이 닫히는 개폐 속도를 자유롭게 조절할 수 있다","terms":[],"extra":["①) 여임대는 미서기 및 오르내리기창의 서로 여며지는 선대이며 마중대는 미닫이 및 여닫이문에서 서로 맞닿는 선대이다","②) 레버토리힌지는 지지철물 중 자유경첩의 일종이다. 플로어힌지는 바닥에 스프링장치를 묻어 경첩으로 지탱하기 힘든 중 량 자재문에 사용한다.","③) 창호 구성에 따른 분류에는 주름문 외에 양판문 플러시문 비늘살창호(갤러리창호), 무테문 아코디언도어 등이 속한다","④) 피봇힌지는 지지철물에 속하며 가장 무거운 중량 여닫이문에 사용한다","⑤) 도어클로저는 여닫음 조정기에 속하며, 여닫음 조정기에는 도어스톱(도어스테이), 창개폐조정기, 오르내리꽃이쇠 등이 함 께 포함된다 공통) 창호철물류 설치 시 모서리 앵커간격은 150mm 내외, 중앙 앵커간격은 500mm 내외로 한다 잠금장치 중 크레센트는 오 르내리창이나 미서기창에 사용하며 창 면적이 클 때 풍압 및 진동 보강용 수직 중간선틀은 멀리온이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 41번","noAns":false,"stemBr":false},{"id":"28-54","round":28,"num":54,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"목재 창호공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"수장용 집성재의 두께 및 너비에 대한 치수의 허용치는 ±2.0 mm 이하이다.","ans":true,"mark":"X","note":"","rnd":[20],"art":""},{"n":"②","text":"창호철물류의 설치에서 모서리의 앵커간격은 150 mm 내외, 중앙의 앵커간격은 500 mm 내외로 한다.","ans":false,"mark":"O","note":"","rnd":[21,24,25,26,27,29],"art":""},{"n":"③","text":"문틀은 위틀, 선틀 믿틀 등으로 구성되며 고창 및 옆문 등이 있을 때에는 중간틀 중간선틀이 추가로 구성된다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"합판, 집성재가 아닌 목재의 건조 정도에 따른 함수율은 설계도서에 정한 바가 없는 경우에 18% 이하로 한다.","ans":false,"mark":"O","note":"","rnd":[20,25,27],"art":""},{"n":"⑤","text":"풍소란은 방풍을 목적으로 미서기 창호의 마중대에 턱솔 등을 두어 서로 접하는 부분에 틈새가 발생하지 않도록 하는 것 이다.","ans":false,"mark":"O","note":"","rnd":[20,22,23,24,25,26,27,29],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["수장용 집성재의 두께 및 너비에 대한 치수 허용차는 ± 1.0 mm 이하로 규정되어 있다. 길이에 대한 치수 허용차가 ± 2.0 mm 이하이다.","창호 고정용 앵커 및 창호철물류 설치 시 모서리의 앵커 간격은 150 mm 내외, 중앙부의 앵커 간격은 500 mm 내외로 시공한다.","문틀은 기본적으로 위틀 선틀 밑틀 등으로 구성되며 고창이나 옆문 등이 결합되는 경우에는 중간틀과 중간선틀이 추가 로 구성된다.","합판이나 집성재가 아닌 일반 목재 창호재의 건조 정도에 따른 함수율은 설계도서에 별도로 정한 바가 없는 경우 18% 이하를 적용한다","풍소란은 방풍 및 기밀성 확보를 목적으로 미서기 창호의 마중대에 턱솔 등을 두어 서로 접하는 부위에 틈새가 발생하지 않도록 처리하는 구조이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"수장용 집성재의 두께 및 너비에 대한 치수 허용차는 ± 1.0 mm 이하로 규정되어 있다. 길이에 대한 치수 허용차가 ± 2.0 mm 이하이다","terms":[],"extra":["⑤) 여임대는 미서기 및 오르내리기창의 서로 여며지는 선대이며 마중대는 미닫이 및 여닫이문에서 서로 맞닿는 선대이다 공통) 강제창호의 멀리온은 창 면적이 클 때 풍압이나 여닫음 진동에 의한 유리 파손을 방지하고 보강 및 미관을 위해 대는 수직 중간선틀이다 알루미늄창호는 알칼리에 약하므로 모르타르나 콘크리트와의 직접 접촉을 피하고, 이질 금속재와 접촉 시 전기화학작용으로 부식이 발생한다 피봇힌지는 중량 여닫이문 플로어힌지는 중량 자재문, 레버토리힌지는 저절로 닫히되 10~15cm 정도 열려있도록 한 철물이 며, 크레센트는 오르내리창이나 미서기창의 잠금장치이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 54번","noAns":false,"stemBr":false},{"id":"29-53","round":29,"num":53,"part":"건축구조","unit":"창호 및 유리공사","sub":"창호공사 및 창호철물","type":"mc","stem":"창호철물에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"레버토리힌지(Lavatory Hinge)는 자유정첩(경첩)의 일종으로 문이 저절로 완전히 닫혀진다.","ans":false,"mark":"X","note":"레버토리힌지는 공중화장실 문 등에 주로 사용되며 문을 열면 저절로 살짝 열려 있거나 닫히도록 유도하는 철물이다 문이 자동으로 완전히 닫히게 하는 정첩은 스프링 힌지이다","rnd":[24],"art":""},{"n":"②","text":"크레센트(Crescent)는 오르내리창이나 미서기창의 잠금장치이다.","ans":true,"mark":"O","note":"크레센트는 오르내리창이나 미서기창의 선대 접합부에 설치하여 창문이 닫혔을 때 걸어 잠그는 초승달 모양의 회전식 잠금장치이다.","rnd":[20,21,22,23,26,28],"art":""},{"n":"③","text":"나이트래치(Night Latch)는 피스톤 장치가 있어 문의 개폐속도를 조절할 수 있다.","ans":false,"mark":"X","note":"나이트래치는 안에서는 손잡이로 열고 밖에서는 열쇠로 여는 자물쇠의 일종이다. 유압 피스톤 장치가 있어 문의 개폐 속도를 조절하는 철물은 도어 클로저이다","rnd":[21,22,27,28],"art":""},{"n":"④","text":"피봇힌지(Pivot Hinge)는 경량문에 사용한다.","ans":false,"mark":"X","note":"피봇힌지(지도리)는 문 상하단과 문틀 바닥 및 상부에 축을 설치하여 회전시키는 힌지로 하중을 크게 받는 중량문(강화 유리문 방화문 등)에 주로 사용된다.","rnd":[25,27],"art":""},{"n":"⑤","text":"도어스톱(Door Stop)은 여닫이문이 자동으로 조용히 닫히게 하는 철물이다.","ans":false,"mark":"X","note":"도어스톱은 문을 열었을 때 문손잡이나 문짝이 벽체에 직접 부딪혀 손상되는 것을 방지하는 철물이다 여닫이문이 자동 으로 조용히 닫히게 하는 철물은 도어 클로저이다","rnd":[21,25,26],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"크레센트는 오르내리창이나 미서기창의 선대 접합부에 설치하여 창문이 닫혔을 때 걸어 잠그는 초승달 모양의 회전식 잠금장치이다","terms":[],"extra":["①) 레버토리힌지는 자유경첩의 일종으로 열려진 여닫이문이 저절로 닫히지만 10~15cm 정도 열려있도록 한 철물이다.","④) 피봇힌지는 가장 무거운 중량 여닫이문에 사용하는 지지철물이다 공통) 플로어힌지는 바닥에 스프링장치를 묻어 경첩으로 지탱하기 힘든 중량 자재문에 사용하는 지지철물이다 창호철물 중 지지철물에는 경첩, 자유경첩, 피봇힌지, 플로어힌지 레버토리힌지, 도어행거가 있다. 여닫음 조정기에는 도어클로저 도어스톱 창개폐조정기, 오르내리꽃이쇠가 있고, 잠금장치에는 실린더자물쇠, 나이트래치 크레센트 도어체인이 있다. 강제창호에서 창 면적이 클 때 풍압이나 여닫음 진동으로 인한 유리 파손을 방지하고 보강 및 미관을 위해 대는 수직 중간 선틀을 멀리온이라 한다. 미서기창호에서 방풍을 목적으로 마중대와 여임대에 턱솔 등을 두어 서로 접하는 부분에 틈새가 발생하지 않도록 한 부재를 풍소란이라 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 53번","noAns":false,"stemBr":false},{"id":"20-94","round":20,"num":94,"part":"건축구조","unit":"창호 및 유리공사","sub":"유리공사","type":"mc","stem":"유리가 파괴되어도 중간막(합성수지)에 의해 파편이 비산되지 않도록 한 안전유리는?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"강화유리","ans":false,"mark":"X","note":"강화유리는 판유리를 고온으로 가열한 후 급랭시켜 표면에 압축응력을 형성한 유리이다 일반 유리에 비해 강도가 높으 며 파손 시 날카롭지 않은 작은 입자 형태로 부서진다","rnd":[22,24,26,27,29],"art":""},{"n":"②","text":"배강도유리","ans":false,"mark":"X","note":"배강도유리는 판유리를 고온 가열 후 강화유리보다 천천히 냉각시켜 제작한 유리이다 휨강도가 일반 유리의 2배 이상이 며, 파손 시 방사상 균열이 발생한다","rnd":[22,24,27],"art":""},{"n":"③","text":"복층유리","ans":false,"mark":"X","note":"복층유리는 2장 이상의 판유리 사이에 건조 공기층이나 가스층을 두고 테두리를 밀봉한 유리이다 열전도를 차단하여 단 열 및 결로 방지 성능을 높인 재료이다","rnd":[23,25,26,28],"art":""},{"n":"④","text":"접합유리","ans":true,"mark":"O","note":"접합유리는 2장 이상의 판유리 사이에 폴리비닐부티랄(PVB) 등의 합성수지 중간막을 끼워 넣고 고온·고압으로 접합한 안 전유리이다. 유리가 파괴되더라도 중간막에 의해 파편이 튀거나 떨어지지 않고 그대로 붙어 있어 비산 방지 및 충격 관통 방지 효과가 뛰어나다","rnd":[22,24,26,27],"art":""},{"n":"⑤","text":"망입유리","ans":false,"mark":"X","note":"망입유리는 판유리 내부에 금속망을 입혀 제조한 유리이다 유리가 깨지더라도 철망이 파편을 잡아주며 주로 방화 및 도 난 방지용으로 활용된다.","rnd":[22,23,29],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","c s":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["②) 로이유리는 가시광선 투과율을 높이고 단열효과를 극대화한 유리로 현장가공 및 절단이 불가능하다","④) 복층유리는 두 장 이상의 판유리 사이에 건조공기를 봉입하여 결로방지 효과를 높인 것으로 현장가공 및 절단이 불가능 하며, 20매 이상 겹쳐서 적치하지 않는다. 공통) 로이유리, 복층유리 강화유리, 배강도유리 유리블록은 현장가공 및 절단이 불가능한 유리이다 유리공사는 항상 4°C 이상의 기온에서 시공하며 상대습도가 90% 이상인 경우에는 실란트 작업을 중지한다. 세팅블록은 창호 하단부에 유리의 자중을 지지하기 위해 유리 폭의 1/4 지점에 각각 1개씩 설치하며 창호 배수구멍은 직 경 5mm 이상으로 2개 이상 설치한다. 접합유리는 유리 사이에 접합필름을 삽입하여 파손 시 파편 비산을 방지하고 열선흡수유리는 소량의 금속산화물을 첨가하 여 적외선 투과를 차단한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 54번","noAns":false,"stemBr":false},{"id":"24-60","round":24,"num":60,"part":"건축구조","unit":"창호 및 유리공사","sub":"유리공사","type":"mc","stem":"유리공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"방탄유리는 접합유리의 일종이다","ans":true,"mark":"O","note":"","rnd":[20,22,26,27],"art":""},{"n":"②","text":"가스켓은 유리의 간격을 유지하며 흡습제의 용기가 되는 재료를 말한다","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"로이(Low-E)유리는 특수금속 코팅막을 실외측 유리의 외부면에 두어 단열효과를 극대화한 것이다","ans":false,"mark":"X","note":"","rnd":[22,26],"art":""},{"n":"④","text":"강화유리는 판유리를 연화점 이하의 온도에서 열처리한 후 급랭시켜 유리 표면에 강한 압축응력 층을 만든 것이다","ans":false,"mark":"X","note":"","rnd":[20,21,22,23,25,26,27,28,29],"art":""},{"n":"⑤","text":"배강도유리는 판유리를 연화점 이상의 온도에서 열처리한 후 서냉하여 유리 표면에 압축응력 층을 만든 것으로 내풍압이 우수하다","ans":false,"mark":"X","note":"","rnd":[20,21,22,23,25,26,27,28,29],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["방탄유리는 2장 이상의 판유리 사이에 PVB 필름이나 특수 수지 등의 중간막을 삽입하여 일체화한 접합유리의 일종으로, 외부 충격이나 탄환 관통에 저항하도록 가공한 특수 유리에 해당한다","유리의 간격을 유지하며 흡습제의 용기 역할을 하는 재료는 스페이서(간봉)이다. 가스켓은 유리와 창틀 사이의 틈새에 끼 워 수밀성 기밀성 및 완충성을 확보하는 성형재이다","로이(Low-E)유리는 단열 성능 향상을 위해 방사율이 낮은 특수금속 코팅막(은막 등)을 복층유리의 내부 중공층에 면한 유리 표면에 둔다. 실외측 유리의 외부면에 두면 오염 및 산화, 긁힘 현상 등으로 코팅막이 손상된다","강화유리는 판유리를 연화점 이상의 온도로 가열한 후 표면에 냉각 공기를 불어넣어 급랭시켜 유리 표면에 강한 압축응 력층을 형성한 유리이다 연화점 이하의 온도가 아니라 연화점 이상까지 가열 후 급랭 note":"시멘트 모르타르 바름의 두께를 산정할 때 라스 바탕 등에 시공하는 라스먹임의 바름두께는 바탕의 공극을 채우는 용도 이므로 전체 바름두께에 포함하지 않고 제외한다","rnd":[21],"art":""},{"n":"②","text":"테라조 바름 재료는 초벌바름이나 정벌바름 모두 된비빔으로 혼합한다","ans":false,"mark":"O","note":"테라조 바름 시 현장에서 비빔하여 사용하는 테라조 바름 재료는 시멘트와 종석의 분리를 막고 밀실한 마감을 얻기 위해 초벌바름 및 정벌바름 모두 된비빔으로 혼합하여 사용한다","rnd":[23,26,27],"art":""},{"n":"③","text":"재료의 배합은 원칙적으로 바탕에 가까운 바름층일수록 부배합으로 한다.","ans":false,"mark":"O","note":"미장재료의 배합비는 바탕과의 부착력을 높이고 건조수축에 따른 균열을 방지하기 위해 바탕에 가까운 바름층일수록 시 멘트 비율이 높은 부배합으로 하고 정벌바름으로 갈수록 빈배합으로 한다.","rnd":[21,23,28],"art":""},{"n":"④","text":"재료의 비빔 시 액체상태의 혼화재료 등은 미리 물과 섞어둔다","ans":false,"mark":"O","note":"미장재료 비빔 시 방수제나 착색제 등 액체 상태의 혼화재료는 재료 전체에 균일하게 분산되도록 미리 비빔물과 섞어서 사용한다","rnd":[],"art":""},{"n":"⑤","text":"단열 모르타르 바름의 바름두께는 별도의 시방이 없는 한 1회에 10mm 이하로 한다.","ans":false,"mark":"O","note":"단열 모르타르 바름 공사 시 처짐과 균열을 방지하기 위하여 1회 바름두께는 별도의 지정이 없는 한 10 mm 이하로 시 공한다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 마감두께는 바름층 전체의 두께를 의미하며 시멘트 모르타르 바름의 부위별 총 바름두께는 외벽 및 바닥 24mm 이하, 내벽 18mm 이하, 천장 및 차양 15mm 이하를 적용한다","③) 미장 흙손바름 작업 시에는 나무흙손으로 먼저 작업한 후 쇠흙손으로 마무리하며, 미장바름 주변 온도가 5°C 이하일 때는 원칙적으로 공사를 중단하거나 난방을 하여 5°C 이상으로 유지해야 한다. 공통) 미장재료 중 수경성 재료에는 시멘트 모르타르 석고플라스터, 인조석(테라조)이 있으며 경화시간이 짧고 강도가 크다. 기경성 미장재료에는 진흙, 회반죽, 돌로마이트플라스터가 있으며 공기 중의 이산화탄소와 반응하여 경화하고 수축균열이 크게 발생한다 초벌바름 전에 마감두께를 균등하게 할 목적으로 미리 요철을 조정하는 것을 손질바름이라 하고, 바름두께가 두꺼울 때 초 벌바름 위에 발라 붙여주는 바름층을 고름질이라 한다. 기둥이나 벽체 모서리면의 미장 마감 및 보호를 위해 코너비드를 설치하며 온수온돌 바닥 모르타르 바르기의 미장마감 횟 수는 최소 3회 이상으로 시공한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 51번","noAns":false,"stemBr":false},{"id":"20-92","round":20,"num":92,"part":"건축구조","unit":"미장 및 타일공사","sub":"타일공사","type":"mc","stem":"표면이 거친 석기질 타일로 주로 외부바닥이나 옥상 등에 사용되는 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"테라코타(terra cotta) 타일","ans":false,"mark":"X","note":"테라코타(terra cotta) 타일은 양질의 점토를 소성하여 만든 타일로, 표면이 다공질이며 흡수성이 비교적 높고 주로 건축 물의 외벽 마감이나 장식재로 사용된다.","rnd":[],"art":""},{"n":"②","text":"클링커(clinker) 타일","ans":true,"mark":"O","note":"클링커(clinker) 타일은 점토류를 고온으로 강하게 소성하여 만든 석기질 타일로 표면이 거칠고 내마모성, 미끄럼 방지 성, 내구성이 우수하다 표면 마찰력이 커서 미끄러짐 방지가 필요한 외부 바닥 옥상, 계단 등의 바닥 마감재로 주로 사용 된다.","rnd":[],"art":""},{"n":"③","text":"모자이크(mosaic) 타일","ans":false,"mark":"X","note":"모자이크(mosaic) 타일은 1개의 크기가 50 mm 이하인 소형 타일을 종이나 그물망에 붙여 한 판으로 제작한 타일로, 욕 실이나 주방의 벽체, 곡면 부위 마감에 주로 사용된다","rnd":[24,29],"art":""},{"n":"④","text":"폴리싱(polishing) 타일","ans":false,"mark":"X","note":"폴리싱(polishing) 타일은 자기질 타일의 표면을 기계적으로 연마하여 광택을 낸 타일로, 외관이 부드럽고 고급스러워 실 내 바닥이나 내벽 마감재로 주로 사용된다","rnd":[],"art":""},{"n":"⑤","text":"파스텔(pastel) 타일","ans":false,"mark":"X","note":"파스텔(pastel) 타일은 파스텔 계열의 은은한 색상을 도포한 타일로, 주로 실내 벽면이나 의장성 향상을 위한 장식용 타 일로 사용된다","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"클링커(clinker) 타일은 점토류를 고온으로 강하게 소성하여 만든 석기질 타일로 표면이 거칠고 내마모성, 미끄럼 방지 성, 내구성이 우수하다 표면 마찰력이 커서 미끄러짐 방지가 필요한 외부 바닥 옥상, 계단 등의 바닥 마감재로 주로 사용 된다","terms":[],"extra":["①) 도기질 및 토기질 타일은 소성온도와 강도가 상대적으로 낮으며 흡수율이 크고, 도기질 타일은 두드리면 탁음이 난다","②) 클링커타일을 포함한 무유타일은 표면에 유약을 바르지 않아 바닥용 미끄럼방지 타일로 주로 사용하며 적산 시 3%의 재료 할증률을 적용한다.","③) 모자이크타일은 적산 수량 산출 시 줄눈을 고려하지 않고 산출하며 3%의 재료 할증률을 적용한다.","④) 자기질 타일은 소성온도와 강도가 가장 크고 흡수율이 가장 작으며 두드리면 청음이 나는 특성이 있다. 공통) 벽체타일을 먼저 붙인 후 바닥타일을 시공하며 시공 후 4주 이상 경과 시 실시하는 타일 접착력 시험의 인장부착강도는 0.39N/mmi 이상이어야 한다. 모르타르는 건비빔 후 3시간 이내, 물 반죽 후 1시간 이내에 사용한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 92번","noAns":false,"stemBr":false},{"id":"21-92","round":21,"num":92,"part":"건축구조","unit":"미장 및 타일공사","sub":"타일공사","type":"mc","stem":"타일공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"치장줄눈파기는 타일을 붙이고 3시간이 경과한 후 실시한다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"②","text":"타일의 접착력 시험결과 인장 부착강도는 0.39 MPa 이상이어야 한다." alse,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"개량압착붙임공법","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"개량떠붙임공법 ※ 문제 내 현행 기준 상 과거 용어: 밀착공법(현행 용어: 밀착붙임공법), 접착제공법(현행 용어: 접착붙임공법)","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 밀착공법(현행 용어: 밀착붙임공법), 접착제공법(현행 용어: 접착붙임공법)","밀착붙임공법은 바탕 모르타르 위에 붙임 모르타르를 바른 후 전용 전동공구(vibrator)의 진동을 이용해 타일을 눌러 붙 여 면을 고르고, 줄눈 부분으로 배어나온 모르타르를 줄눈봉으로 눌러 마감하는 공법이다","떠붙임공법은 타일 뒷면에 붙임 모르타르를 얹어 바탕에 대고 망치 자루 등으로 두들겨 위치를 잡으며 붙이는 공법으로 타일 뒷면에 모르타르가 충실히 채워지도록 시공하는 수작업 공법이다.","접착붙임공법은 바탕면에 합성수지계 등 전용 접착제를 도포한 후 타일을 눌러 붙이는 공법으로, 주로 내장 타일 시공이나 건식 바탕에 적용된다.","개량압착붙임공법은 바탕면에 붙임 모르타르를 바르는 것뿐만 아니라 타일 뒷면에도 붙임 모르타르를 얇게 도포하여 두 들겨 눌러 붙이는 공법으로 압착붙임공법의 부착력 부족 및 접착면 공극 발생을 보완한 방식이다","개량떠붙임공법은 바탕면에도 붙임 모르타르를 평탄하게 바르고 타일 뒷면에도 모르타르를 얹어 붙이는 공법으로 떠붙 임공법에서 발생할 수 있는 백화 현상 및 부착 불량을 줄이기 위해 개량된 방식이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["②) 떠붙임공법은 내벽타일 시공에 주로 사용하며 아래에서 위로 붙여 올라간다 붙임 모르타르는 건비빔 후 3시간 이내, 물 반죽 후 1시간 이내에 사용한다","③) 접착붙임공법에 쓰이는 내장타일은 주로 도기질이며 바닥용 미끄럼방지 타일에는 무유타일을 사용한다 타일 1장의 기 준치수는 타일치수와 줄눈치수를 합한 값이다","④) 개량압착붙이기의 1회 바름면적은 1.5m 이하, 붙임시간은 30분 이내이고, 압착붙이기의 1회 붙임면적은 1.2m² 이하, 붙임시간은 15분 이내로 한다.","⑤) 동시줄눈붙이기의 1회 붙임면적은 1.5m² 이하 붙임시간은 20분 이내로 한다 공통) 벽체타일과 바닥타일을 함께 시공할 때는 벽체타일을 먼저 붙인 후 바닥타일을 시공하며 외벽타일은 위에서 아래로 붙인다. 타일 접착력 시험은 시공 후 4주 이상 경과 후 실시하며 인장부착강도는 0.39N/mm² 이상이어야 하고 시험 수량은 타일면적 200m²당 1장이다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 52번","noAns":false,"stemBr":false},{"id":"24-45","round":24,"num":45,"part":"건축구조","unit":"미장 및 타일공사","sub":"타일공사","type":"mc","stem":"타일의 줄눈너비로 옳지 않은 것은? (단, 도면 또는 공사시방서에 타일 줄눈너비에 대하여 정한 바가 없을 경우)","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"개구부 둘레와 설비 기구류와의 마무리 줄눈: 10 mm","ans":false,"mark":"O","note":"개구부 둘레와 설비 기구류와의 마무리 줄눈 너비는 10 mm를 적용한다","rnd":[21,22,25,27,28,29],"art":""},{"n":"②","text":" s":[],"citeLabel":"관련 조문","citeFirst":false,"key":"징크로메이트 도료는 주로 알루미늄 및 알루미늄 합금, 아연도금면 등의 녹막이(방청) 용도로 사용된다. 일반 철재의 녹 막이 도장에는 주로 광명단 방청페인트 등이 적용된다","terms":[],"extra":["④) 징크로메이트와 광명단은 녹막이도료에 속한다 유성페인트는 내후성은 좋으나 알칼리에 약해 콘크리트나 모르타르 바 탕에는 사용하지 않으며, 내외부 벽체에는 에멀션페인트를 사용한다","⑤) 녹막이 도장을 하지 않는 부분에는 도금된 금속표면, 고장력볼트 접합부 마찰면, 현장 용접 부위, 콘크리트 매입부 등이 있다. 부득이 조립 후 도장 시 밀착면은 1회, 도장이 곤란한 면은 1~2회씩 조립 전 도장한다. 공통) 도료 및 희석제의 배합비율은 질량비로 표시하며 도료 견본 크기는 철재 바탕 300×300mm, 목재 바탕 100×200mm이다. 주위 기온 5°C 미만, 상대습도 85% 초과, 강재 표면온도 50°C 이상이거나 눈·비, 안개가 낄 때는 도장작업을 중지해야 한 다. 도료 보관창고는 독립된 단층건물로 주위 건물에서 1.5m 이상 이격하여 설치한다. 안료는 도료의 색채 표현과 표면 은폐, 희석제는 점도 조절, 가소제는 건조 도막의 내구력 증가 역할을 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 97번","noAns":false,"stemBr":false},{"id":"22-59","round":22,"num":59,"part":"건축구조","unit":"도장·수장 및 기타 공사","sub":"도장공사","type":"mc","stem":"도장공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"유성페인트는 내화학성이 우수하여 콘크리트용 도료로 널리 사용된다.","ans":false,"mark":"X","note":"유성페인트는 콘크리트나 모르타르 바탕의 알칼리 성분과 반응하여 감화(비누화) 작용을 일으키고 도막이 분해되므로 알 칼리성에 약해 콘크리트 바탕 도장용으로 적합하지 않다. 콘크리트면에는 주로 수성도료나 합성수지도료 등을 사용한다","rnd":[],"art":""},{"n":"②","text":"철재면 바탕만들기는 일반적으로 가공장소에서 바탕재 조립 전에 한다.","ans":true,"mark":"O","note":"철재면의 바탕만들기는 부재 조립 후 구석진 부분이나 접합 부위의 녹 제거 및 바탕 처리가 어려워지므로 가공장소에서 바탕재를 조립하기 전에 수행하는 것을 원칙으로 한다","rnd":[21],"art":""},{"n":"③","text":"기온이 10°C 미만이거나 상대습도가 80 %를 초과할 때는 도장작업을 피한다","ans":false,"mark":"X","note":"도장작업 시 기온이 5°C 미만이거나 상대습도가 85 %를 초과할 때, 또는 바탕재의 표면 온도가 이슬점보다 3°C 이상 높지 않아 이슬이 맺힐 우려가 있을 때 도장작업을 중지해야 한다.","rnd":[21,28],"art":""},{"n":"④","text":"뿜칠 시공 시 약 40 cm 정도의 거리를 두고 뿜칠넓이의 1/4 정도가 겹치도록 한다.","ans":false,"mark":"X","note":"뿜칠 도장 시 뿜칠 건과 도장면 사이의 거리는 30 cm 정도를 유지하며 뿜칠 너비의 1/3 내지 1/2 정도가 겹치도록 평행하게 이동하며 칠한다","rnd":[],"art":""},{"n":"⑤","text":"롤러도장은 붓도장보다 도장속도가 빠르며 일정한 도막두께를 유지할 수 있다","ans":false,"mark":"X","note":"롤러도장은 붓도장에 비해 도장 작업 속도가 빠르고 큰 면적에 효율적이지만 일정한 도막 두께를 유지하기 어렵고 평탄 성과 밀착성이 붓도장에 비해 다소 떨어지는 특성이 있다.","rnd":[21,27],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["②) 부득이하게 조립 후 도장할 때에는 조립하면 밀착되는 면은 1회, 도장이 곤란하게 되는 면은 1~2회씩 조립 전에 도장한 다.","③) 녹막이 도장을 해서는 안 되는 경우는 기온이 5°C 미만이거나 상대습도가 85%를 초과할 때, 강재 표면온도가 50°C 이상이 될 때, 눈·비가 올 때 및 안개가 끼었을 때 등이다. 공통) 도료의 배합비율 및 희석제의 배합비율은 질량비로 표시한다 도료 견본의 크기는 철재 바탕 300×300mm, 목재 바탕 100×200mm로 한다. 도료 보관창고는 독립된 단층건물로서 주위 건물에서 1.5m 이상 떨어져야 한다. 하도, 중도, 상도 공정의 각 도막층별로 가능하면 색상을 다르게 하여 시공 구분을 용이하게 한다. 광명단과 징크로메이트는 대표적인 방청도료(녹막이페인트)이다. 고장력볼트 접합부 마찰면 현장 용접 부위, 콘크리트에 매입되는 부분 등에는 녹막이 도장을 하지 않는다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 59번","noAns":false,"stemBr":false},{"id":"23-56","round":23,"num":56,"part":"건축구조","unit":"도장·수장 및 기타 공사","sub":"도장공사","type":"mc","stem":"도장공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"녹막이도장의 첫 번째 녹막이칠은 공장에서 조립 후에 도장함을 원칙으로 한다.","ans":true,"mark":"X","note":"","rnd":[20,21,22,24,27],"art":""},{"n":"②","text":"뿜칠 공사에서 건(spray gun)은 도장면에서 300mm 정도 거리를 두어서 시공하고, 도장면과 평행 이동하여 뿜칠한다.","ans":false,"mark":"O","note":"","rnd":[22],"art":""},{"n":"③","text":"롤러칠은 평활하고 큰 면을 칠할 때 사용한다","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"뿜칠은 압력이 낮으면 거칠고, 높으면 칠의 유실이 많다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"솔질은 일반적으로 위에서 아래로, 왼쪽에서 오른쪽으로 칠한다 ※ 문제 내 현행 기준 상 과거 용어: 녹막이칠(현행 용어: 방청도장)","ans":false,"mark":"O","note":"","rnd":[21],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 녹막이칠(현행 용어: 방청도장)","강재의 녹막이도장 시 첫 번째 방청도장은 조립 후 손이 닿지 않거나 간섭이 발생하는 부위가 생기는 것을 방지하기 위해 공장에서 가공 및 조립 전에 도장하는 것을 원칙으로 한다.","뿜칠 시 뿜칠 건과 도장면 사이의 거리는 300 mm 정도를 유지하며 도장면과 수직을 유지한 채 평행하게 이동하여 시공한다","롤러칠은 작업 효율이 뛰어나므로 평활하고 넓은 바탕면을 도장할 때 사용한다","뿜칠 시 분사 압력이 낮으면 도료 입자가 굵어지며 도막이 거칠어지고, 압력이 너무 높으면 도료의 비산으로 인한 유실 이 많아진다","솔질은 도료의 흘러내림을 방지하고 균일한 피복을 위해 일반적으로 위에서 아래로 왼쪽에서 오른쪽으로 진행한다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"강재의 녹막이도장 시 첫 번째 방청도장은 조립 후 손이 닿지 않거나 간섭이 발생하는 부위가 생기는 것을 방지하기 위해 공장에서 가공 및 조립 전에 도장하는 것을 원칙으로 한다","terms":[],"extra":["①) 1회째 방청도장은 가공장소에서 조립 전에 도장함을 원칙으로 하며, 화학처리를 하지 않은 것은 표면처리 직후 도장한다. 부득이 조립 후 도장 시 밀착면은 1회, 도장이 곤란한 면은 1~2회씩 조립 전에 미리 도장한다 녹막이도장을 하지 않는 부위에는 고장력볼트 접합 마찰면, 현장 용접부위 콘크리트 매입부, 도금 금속표면 등이 있다. 공통) 도장작업은 기온 5°C 미만, 상대습도 85% 초과(강재 녹막이도장은 80% 이상), 강재 표면온도 50°C 이상일 때 중지한다. 도료 및 희석제 배합비율은 질량비로 표기한다. 도료 보관창고는 독립된 단층건물로 주위 건물에서 1.5m 이상 띄운다. 도료 견본 크기는 철재 바탕 300×300mm, 목재 바탕 100×200mm 기준이다 스프레이 뿜칠 시 뿜칠 너비의 1/3 정도를 겹쳐 뿜고, 각 도막층별(하도 중도, 상도)로 색상을 다르게 하여 시공 구분을 용 이하게 한다. 유성페인트는 알칼리에 약하여 콘크리트나 모르타르 바탕에는 사용하지 않으며, 방청도료에는 광명단과 징크로메이트가 포 함된다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 56번","noAns":false,"stemBr":false},{"id":"24-51","round":24,"num":51,"part":"건축구조","unit":"도장·수장 및 기타 공사","sub":"도장공사","type":"mc","stem":"도장공사의 하자가 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"은페불량","ans":false,"mark":"O","note":"은페불량은 도막의 두께 부족이나 도료 자체의 은폐력 부족으로 바탕색이 비쳐 보이는 도장 결함이다.","rnd":[],"art":""},{"n":"②","text":"백화","ans":false,"mark":"O","note":"백화는 수분이나 수용성 염류의 이동으로 인해 도막 표면에 흰색 가루나 반점이 생기는 도장 결함이다.","rnd":[],"art":""},{"n":"③","text":"기포","ans":false,"mark":"O","note":"기포는 도료 시공 후 내부 용제의 급격한 증발이나 공기 혼입으로 인해 표면에 방울 모양이 발생하는 도장 결함이다","rnd":[],"art":""},{"n":"④","text":"핀홀","ans":false,"mark":"O","note":"핀홀은 도장 후 가스 유출이나 작업 부주의 등으로 인해 도막 표면에 바늘구멍 모양의 작은 구멍이 생기는 도장 결함이 다.","rnd":[],"art":""},{"n":"⑤","text":"피트","ans":true,"mark":"X","note":"피트는 용접 시 용접부 표면에 생기는 작고 오목한 구멍을 의미하는 용접 결함에 해당한다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"피트는 용접 시 용접부 표면에 생기는 작고 오목한 구멍을 의미하는 용접 결함에 해당한다","terms":[],"extra":["⑤) 피트, 크랙, 공기구명(기공), 슬래그함입 크레이터, 언더컷, 오버랩, 피시아이 등은 강구조 용접 작업 시 발생하는 용접 결함에 해당한다 공통) 도장공사 시 도료 및 희석제의 배합비율은 질량비로 표시한다 주위 기온이 5°C 미만이거나 상대습도가 85%를 초과할 때, 강재 표면온도가 50°C 이상일 때, 눈·비·안개 등으로 기상이 악 화된 때에는 도장작업을 중지한다. 도료 보관창고는 독립된 단층건물로서 주위 건물에서 1.5m 이상 떨어져 설치한다. 도료 견본 크기는 철재 바탕 300×300mm, 목재 바탕 100×200mm를 기준으로 한다. 스프레이 도장의 도장거리는 300mm를 표준으로 하고, 너비의 1/3 정도를 겹쳐 뿜칠한다 유성페인트는 알칼리에 약하므로 콘크리트나 모르타르 바탕에는 사용하지 않으며, 방청도료로는 광명단과 징크로메이트를 사용한다 안료는 도료의 색채를 나타내고 표면을 은폐하는 역할을 하며, 가소제는 건조된 도막의 내구력을 증가시킨다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 51번","noAns":false,"stemBr":false},{"id":"26-52","round":26,"num":52,"part":"건축구조","unit":"도장·수장 및 기타 공사","sub":"도장공사","type":"mc","stem":"도료의 사용목적이 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"단면증가","ans":true,"mark":"X","note":"도료는 바탕재 표면에 도막을 형성하여 부재를 보호하거나 미관을 향상시키는 재료로 구조 부재의 치수나 단면적을 넓 히는 단면증가는 도료의 사용목적에 해당하지 않는다 단면증가는 구조적 보강을 위한 단면증설공법 등의 목적에 해당한다","rnd":[],"art":""},{"n":"②","text":"내화","ans":false,"mark":"O","note":"내화도료는 화재 발생 시 열에 의해 도막이 팽창하여 단열 피복층을 형성함으로써 철골 부재의 온도가 상승하는 것을 방지하는 내화 목적으로 사용된다.","rnd":[],"art":""},{"n":"③","text":"방수","ans":false,"mark":"O","note":"방수도료는 바탕면에 불투수성 피막을 형성하여 빗물이나 수분의 침투를 차단하는 방수 목적으로 사용된다.","rnd":[],"art":""},{"n":"④","text":"방청","ans":false,"mark":"O","note":"방청도료는 철재 등 금속 표면의 산화 및 부식을 방지하는 방청 목적으로 사용된다","rnd":[],"art":""},{"n":"⑤","text":"광택","ans":false,"mark":"O","note":"도료는 건축물 내·외관의 광택, 색채, 질감 등을 다듬어 미관을 높이고 장식하는 목적으로 사용된다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 도료는 바탕 표면에 얇은 도막을 형성하므로 단면증가 목적으로는 사용되지 않는다. 도료의 할증률은 2%이며, 도료 보 관창고는 독립된 단층건물로서 주위 건물에서 1.5m 이상 이격하여 설치한다","②) 강재는 500~600°C에서 상온강도의 1/2로 저하되고 800°C 이상에서 강도가 0에 가깝게 되므로 내화피복이 필수적이다. 내화피복 공법 중 습식공법에는 뿜칠, 타설, 미장, 조적공법이 있고 건식공법에는 성형판붙임공법이 속한다.","③) 도막방수는 내수성 액상 방수재를 바르거나 뿜칠하여 이음매 없는 피막을 형성한다 도포 시 핀홀 방지를 위해 치켜올 림 부위를 먼저 바른 후 평면 부위 순으로 시공하며 벽체 스프레이 시공은 위에서 아래 순서로 실시한다.","④) 방청도료(녹막이페인트)에는 광명단, 징크로메이트가 속한다 기온 5°C 미만, 상대습도 85% 초과 강재 표면온도 50°C 이상 시 도장을 중지하며 고장력볼트 마찰면, 현장 용접부 콘크리트 매입부는 방청도장을 하지 않는다","⑤) 도료 배합비율 및 희석비율은 질량비로 표기한다. 안료는 색채 및 은폐력, 희석제는 작업성, 가소제는 도막 내구력을 높 인다. 도료 견본 크기는 철재 바탕 300×300mm, 목재 바탕 100×200mm를 적용한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 52번","noAns":false,"stemBr":false},{"id":"27-45","round":27,"num":45,"part":"건축구조","unit":"도장·수장 및 기타 공사","sub":"도장공사","type":"mc","stem":"도장공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"바니시(varnish)는 입체무늬 등의 도막이 생기도록 만든 에나멜이다","ans":false,"mark":"X","note":"바니시는 수지 등을 용제에 녹여 만든 투명한 피막 형성 도료로서 입체무늬 도막을 형성하는 도료가 아니다 입체무늬 등의 도막이 생기도록 만드는 도료는 무늬코트 등 입체무늬 도료 또는 특수 도료에 해당한다.","rnd":[],"art":""},{"n":"②","text":"롤러도장은 붓도장보다 도장 속도가 느리지만 일정한 도막두께를 유지할 수 있다.","ans":false,"mark":"X","note":"롤러도장은 붓도장에 비해 작업 속도가 빠르지만, 일정한 도막 두께를 유지하거나 구석진 부위를 도장하는 정밀성은 붓도장에 비해 떨어진다","rnd":[20,21,22,23,24],"art":""},{"n":"③","text":"도료의 견본품 제출 시 목재 바탕일 경우 100mm× 200mm 크기로 제출한다","ans":true,"mark":"O","note":"도료의 견본품 제출 시 목재 바탕인 경우 100 mm× 200 mm 크기의 견본판을 제출한다. ※ 참고: 금속 바탕인 경우 150 mm× 150 mm 또는 300 mm× 300 mm 크기로 제출한다","rnd":[],"art":""},{"n":"④","text":"수지는 물이나 용체에 녹지 않는 무채 또는 유채의 분말이다.","ans":false,"mark":"X","note":"물이나 용제에 녹지 않는 무채 또는 유채의 분말은 안료에 대한 설명이다. 수지는 도료의 주요 성분으로서 도막을 형성 하는 결합재 역할을 한다.","rnd":[],"art":""},{"n":"⑤","text":"철재면 바탕 만들기는 일반적으로 가공 장소에서 바탕재 조립 후에 한다.","ans":false,"mark":"X","note":"철재면 바탕 만들기는 가공 장소에서 바탕재를 조립하기 전에 실시한다 조립을 완료한 후에는 틈새나 겹침부의 녹 제거 및 바탕 처리가 용이하지 않기 때문이다","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 유성페인트는 내후성과 내마모성이 양호하지만 알칼리에 약하여 콘크리트나 모르타르 바탕에는 사용하지 않으며, 에멀 션페인트는 내수성과 내후성이 좋아 내외부 벽체에 사용한다","②) 스프레이 도장의 도장거리는 300mm를 표준으로 하고 스프레이 너비의 1/3 정도를 겹쳐 뿜는다 시공 구분을 용이하게 하기 위해 하도 중도, 상도 공정의 각 도막층별 색상을 가능하면 다르게 한다.","③) 도료 및 희석제의 배합비율은 질량비로 표시한다 도료 보관창고는 독립된 단층건물로서 주위 건물에서 1.5m 이상 떨어 져야 한다.","④) 안료는 착색분말제로 도료의 색채를 나타내고 표면을 은폐하는 역할을 하며, 희석제는 도료의 점도를 낮추어 작업성을 좋게 하는 휘발 :false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"13.0","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["1. 물의 초당 체적유량(Q) 산정 물 1 kg의 부피는 1 L(0.001m³)이므로 시간당 3,000 kg의 물은 시간당 3m³의 부피와 같다. 1시간은 3,600초이므로 초당 체적유량 Q는 다음과 같이 산정한다 Q= 3m³/h÷ 3,600 s/h= 1/1,200m³/s= 약 0.0008333m³/s","2. 배관의 단면적(A) 산정 관경(지름) D= 50 mm= 0.05 m이므로 반지름 r= 0.025 m이다. 원주율 3.14를 적용하여 배관의 단면적 A를 산정한다. A= 3.14× (0.025 m)²= 3.14× 0.000625m²= 0.0019625m²","3. 배관 내 유속(v) 산정 유량 공식 Q= A× v0 따라 유속 v 초당 체적유량을 배관의 단면적으로 나누어 산정한다 V= Q÷ A= (1/1,200m³/s)÷ 0.0019625m²= 약 0.4246 m/s (약 0.42 m/s)"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"0.42","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 118번","noAns":false,"stemBr":false},{"id":"21-101","round":21,"num":101,"part":"건축설비","unit":"설비총론","sub":"설비 기본사항 및 유체역학","type":"mc","stem":"배관에 흐르는 유체의 마찰손실수두에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관의 길이에 반비례한다.","ans":false,"mark":"X","note":"","rnd":[27],"art":""},{"n":"②","text":"중력가속도에 비례한다.","ans":false,"mark":"X","note":"","rnd":[27,28],"art":""},{"n":"③","text":"유속의 제곱에 비례한다","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"관의 내경이 클수록 커진다","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"관의 마찰(손실)계수가 클수록 작아진다","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["배관 내 유체의 마찰손실수두 산정에는 달시-바이스바하(Darcy-Weisbach) 공식이 적용된다. 마찰손실수두(h_f)= f× (L /i D)× (/ 2g) - h_f: 마찰손실수두 (m)- f: 관 마찰손실계수- ㄴ: 관의 길이 (m) - D: 관의 내경 (m)- V 유체의 평균 유속 (m/s)- g: 중력가속도 (m/s2)","마찰손실수두(h_f)는 관의 길이(ㄴ)에 비례한다 관의 길이가 길어질수록 유체와 관 벽면 사이의 마찰 구간이 길어져 손 실수두가 커진다.","마찰손실수두(h_f)는 분모에 위치한 중력가속도(g)에 반비례한다","마찰손실수두(h_f)는 분자의 유속(v)의 제곱에 비례한다 유속이 2배가 되면 마찰손실수두는 4배로 증가한다","마찰손실수두(h_f)는 분모에 위치한 관의 내경(D)에 반비례한다 관의 내경이 클수록 유동 저항이 줄어들어 마찰손실수두는 작아진다","마찰손실수두(h_f)는 분자에 위치한 관 마찰손실계수(f)에 비례한다. 마찰손실계수가 클수록 마찰손실수두는 커진다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 101번","noAns":false,"stemBr":false},{"id":"22-61","round":22,"num":61,"part":"건축설비","unit":"설비총론","sub":"설비 기본사항 및 유체역학","type":"mc","stem":"건축설비에 관한 내용으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"배관 내를 흐르는 물과 배관 표면과의 마찰력은 물의 속도에 반비례한다","ans":false,"mark":"X","note":"배관 내를 흐르는 물과 배관 표면 사이에서 발생하는 마찰손실 및 마찰력은 유속의 제곱에 비례하여 증가한다. 따라서 물의 속도에 반비례하지 않는다.","rnd":[20,21,24,29],"art":""},{"n":"②","text":"물체의 열전도율은 그 물체 1kg을 1°C 올리는 데 필요한 열량을 말한다","ans":false,"mark":"X","note":"물체 1 kg의 온도를 1°C 올리는 데 필요한 열량은 비열을 의미한다. 열전도율은 두께 1 m인 재료의 양면 온도차가 1 C일 때 단위시간당 전달되는 열량을 나타내는 재료 고유의 열 전달 특성치이다","rnd":[23,26,27,29],"art":""},{"n":"③","text":"공기가 가지고 있는 열량 중, 공기의 온도에 관한 것이 잠열, 습도에 관한 것이 현열이다.","ans":false,"mark":"X","note":"공기가 지닌 열량 중 온도의 변화에 직접 관련된 열량은 현열이며, 수증기량 즉 습도의 변화 및 상태 변화에 관련된 열량은 잠열이다.","rnd":[],"art":""},{"n":"④","text":"동일한 양의 물이 배관 내를 흐를 때 배관의 단면적이 2배가 되면 물의 속도는 1/4배가 된다.","ans":false,"mark":"X","note":"연속 방정식에 의해 유량은 배관의 단면적과 유속의 곱으로 산정된다. 유량이 동일할 때 배관의 단면적이 2배로 증가하 면 물의 속도는 1/2배가 된다.","rnd":[20,21,26],"art":""},{"n":"⑤","text":"실외의 동일한 장소에서 기압을 측정하면 절대압력이 게이지압력보다 큰 값을 나타낸다","ans":true,"mark":"O","note":"절대압력은 완전진공 상태를 0으로 기준 삼아 측정한 압력으로 대기압 상태를 0으로 기준 삼아 측정한 게이지압력에 국 소 대기압을 합산하여 산정한다. 따라서 동일한 장소에서 대기압이 존재하는 한 절대압력은 게이지압력보다 대기압만큼 항 상 더 큰 값을 가진다","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"절대압력은 완전진공 상태를 0으로 기준 삼아 측정한 압력으로 대기압 상태를 0으로 기준 삼아 측정한 게이지압력에 국 소 대기압을 합산하여 산정한다.","terms":[],"extra":["①) 마찰손실수두는 관의 길이, 관 내면 마찰계수, 유체 비중량, 유속의 제곱에 비례하고, 관지름과 중력가속도에 반비례한 다.","②) 열전도저항은 두께를 열전도율로 나눈 값(두께/열전도율)이며, 밀도가 낮고 비중이 작은 재료일수록 열전도율이 작아 단 열에 유리하다 열용량은 어떤 재료가 축적하고 있는 열량이다.","③) 현열은 상태 변화 없이 온도 변화에 따라 출입하는 열로 온수난방에 이용하고, 잠열은 온도 변화 "설비 기본사항 및 유체역학","type":"mc","stem":"건축설비의 기초사항에 관한 내용으로 옳은 것을 모두 고른 것은? ㄱ. 순수한 물은 1기압 하에서 4°C일 때 밀도가 가장 작다. ㄴ. 정지해 있는 물에서 임의의 점의 압력은 모든 방향으로 같고 수면으로부터 깊이에 비례한다 ㄷ. 관경이 달라지는 수평관 속에서 물이 정상 흐름을 할 때, 관경이 클수록 유속이 느려진다 ㄹ. 배관에 흐르는 물의 마찰손실수두는 관의 길이와 마찰계수에 비례하고 유속의 제곱에 비례한다.","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"ㄱ, ㄴ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"ㄱ, ㄴ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄷ, ㄹ","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["ㄱ. 순수한 물은 1기압 상태에서 4°C일 때 부피가 가장 작고 밀도가 가장 크다(약 1,000 kg/m³). 따라서 4 C일 때 밀도 가 가장 작다는 설명은 옳지 않다.","ㄴ. 파스칼의 원리 및 유체정역학 기본 법칙에 따라 정지해 있는 물속 임의의 한 점에 작용하는 압력은 모든 방향으로 같 고, 수면으로부터의 깊이에 직접 비례하므로 옳은 설명이다","ㄹ. 달시-바이스바흐(Darcy-Weisbach) 공식(hf= f× (L /i) D)× (v2 /i) 2g))에 따라 배관 내부를 흐르는 유체의 마찰손실수두는 관의 길이(ㄴ)와 마찰계수(f)에 비례하고, 유속(v)의 제곱에 비례하므로 옳은 설명이다","ㄷ. 유체의 연속 방정식(Q= A× v)에 따라 동일 유량이 흐르는 수평관 속에서 정상 흐름이 이루어질 때, 관의 단면적(A)이 클수록 유속(v)은 느려지므로 관경이 클수록 유속이 느려진다는 설명은 옳다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄴ, ㄷ, ㄹ","terms":[],"extra":["ㄱ.) 물은 1기압 하 4°C일 때 밀도(비중)가 최대이고 부피가 최소가 된다. 물의 밀도는 1000kg/m³, 비중량은 1000kgf/m³(9.8kN/m³)이며, 비체적은 체적을 질량으로 나눈 값으로 밀도의 역수이다.","ㄴ. ) 정지 유체 내부 수압은 깊이 1m당 0.01MPa(10kPa= 10,000N/m²)의 압력과 같다. 대기압을 0으로 기준 잡은 게이지 압력에 대기압을 더한 값을 절대압력이라 하며 실외 동일 장소에서 절대압력은 게이지압력보다 크다.","ㄹ. ) 배관의 마찰손실수두는 관의 길이, 관 내면 마찰계수, 유체 비중량, 유속²에 비례하고 관지름 및 중력가속도에 반비례한 다. 직관부 이외의 구부러지는 부분이나 분기부 등에서 발생하는 저항은 국부저항이다 ㄷ.) 배관 유량(m³/s)은 단면적(m²)에 유속(m/s)을 곱하여 산정하므로 유속은 관경의 제곱 및 단면적에 반비례한다 유체의 속도가 빠르면 압력이 낮아지고 속도가 느리면 압력이 높아진다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 63번","noAns":false,"stemBr":false},{"id":"27-70","round":27,"num":70,"part":"건축설비","unit":"설비총론","sub":"설비 기본사항 및 유체역학","type":"mc","stem":"배관에 흐르는 유체의 마찰손실수두에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"배관의 길이에 비례한다","ans":false,"mark":"O","note":"","rnd":[21],"art":""},{"n":"②","text":"배관의 내경에 반비례한다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"중력가속도에 반비례한다","ans":false,"mark":"O","note":"","rnd":[21,28],"art":""},{"n":"④","text":"배관의 마찰계수에 비례한다.","ans":false,"mark":"O","note":"","rnd":[25,26,28],"art":""},{"n":"⑤","text":"유체의 속도에 비례한다","ans":true,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["달시-바이스바하 공식: (hf= f× (L/D)× (v2/2g))","배관 내 유체의 마찰손실수두(hf)는 배관의 길이(ㄴ)에 비례한다","마찰손실수두는 배관의 내경(D)에 반비례한다","마찰손실수두는 중력가속도(g)에 반비례한다","마찰손실수두는 관 내면의 거칠기를 반영하는 배관 마찰계수(f)에 비례한다.","마찰손실수두는 유체 속도(v)의 1승에 비례하는 것이 아니라 유속의 제곱(v2)에 비례한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"마찰손실수두는 유체 속도(v)의 1승에 비례하는 것이 아니라 유속의 제곱(v2)에 비례한다","terms":[],"extra":["⑤) 유속은 관경의 제곱에 반비례하며 관의 단면적과도 반비례한다 공통) 배관 마찰손실수두는 관 속을 흐르는 유체가 관벽의 마찰, 굴곡부 저항, 기구류 저항 등에 의해 압력이 손실되는 현상이다. 배관 마찰손실수두 공식은 (마찰계수× 배관의길이× 유속의제곱) ÷ (2× 중력가속도× 배관직경)이며 유체 비중량에도 비 레한다 배관이나 덕트에서 직관부 이외의 구부러지는 부분과 분기부 등에서는 국부저항에 의한 손실이 발생한다 유체의 속도가 빠르면 압력이 낮아지고 속도가 느리면 압력이 높아지므로 유속이 증가하면 유체의 압력은 감소한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 70번","noAns":false,"stemBr":false},{"id":"27-71","round":27,"num":71,"part":"건축설비","unit":"설비총론","sub":"설비 기본사항 및 유체역학","type":"mc","stem":"20°C의 물 3 kg을 100°C의 증기로 만들기 위해 필요한 열량(kJ)은? (단, 물의 비열은 4.2 kJ/kg, K, 100°C 온수의 증발잠열은 2,257 kJ/kg으로 한다.)","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"3,153","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"3,265","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"6,771","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"7,779","ans":true,"mark":"O","note": xt":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"표면결로는 벽체 실내 측 표면온도가 주변 공기의 노점온도 이하로 떨어질 때 발생한다 따라서 표면결로를 방지하기 위 해서는 벽체의 실내 측 표면온도를 주변 공기의 노점온도보다 높게 유지해야 한다","terms":[],"extra":["④) 표면결로는 건물의 표면온도가 접촉하고 있는 공기의 노점온도보다 낮을 때 발생하므로 표면결로를 방지하기 위해서는 벽체의 실내 측 표면온도를 실내공기의 노점온도보다 높게 설정해야 한다. 공통) 내부결로는 구조체 내부의 온도가 노점온도보다 낮을 때 구조체 내부에 수증기가 발생하는 결로이다 결로현상은 열관류율이 클수록 실내외 온도 차이가 클수록 환기가 부족하거나 실내 습기가 과다할 때 발생한다 결로 방지를 위해 각 실 간의 온도차가 작은 난방방식을 채택하며 벽체의 실내 고온 측에 방습층을 설치한다. 외단열 공법은 실외 측에 단열재를 시공하여 열교현상과 결로현상 방지에 효과적이다 창문의 결로 방지에는 유리의 복층화와 창틀의 단열이 중요하다. 상대습도가 100%인 포화상태에서는 건구온도, 습구온도 노점온도가 모두 같다. 절대습도는 온도 변화에 따라 변하지 않고 감습이나 가습 시에만 변화하며 상대습도는 공기를 가열하면 낮아지고 냉각하면 높아진다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 102번","noAns":false,"stemBr":false},{"id":"23-69","round":23,"num":69,"part":"건축설비","unit":"설비총론","sub":"열관류율 및 결로 방지","type":"mc","stem":"기존 열관류저항이 3.0m²·K/W인 벽체에 열전도율 0.04 W/m·K인 단열재 40 mm를 보강하였다 이 때 단열이 보 강된 벽체의 열관류율(W/m²-K)은 약 얼마인가?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"0.10","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"0.15","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"0.20","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"0.25","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"0.30","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["1. 보강 단열재의 열관류저항 산정 재료의 열관류저항(열저항)은 재료의 두께(m)를 열전도율(W/m·K)로 나누어 산정한다 보강한 단열재의 두께 40 mm는 0.04 m이다 단열재의 열관류저항= 0.04 m i 0.04 W/m·K= 1.0m²·K/W","2. 단열 보강 후 벽체의 총 열관류저항 산정 벽체의 총 열관류저항은 기존 벽체의 열관류저항과 새로 보강한 단열재의 열관류저항을 합하여 산정한다 총 열관류저항= 3.0m²·K/W+ 1.0m²·K/W= 4.0m²·K/W","3. 단열 보강된 벽체의 열관류율 산정 열관류율은 총 열관류저항의 역수로 계산한다 열관류율= 1 i 총 열관류저항= 1 ÷ 4.0m²·K/W= 0.25 W/m².K"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"0.25","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하 t":"ㄱ, ㄴ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄱ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"ㄴ, ㄷ","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["급수배관의 관경 결정 방법에는 기구급수부하단위 및 동시사용량을 기준으로 마찰저항선도를 사용하는 방법, 소규모 건물이 나 분기 배관에 적용하는 관 균등표에 의한 방법, 유속 및 압력손실을 직접 계산하는 방식 등이 적용된다.","ㄱ. 기간부하계산에 의한 방법: 냉난방 및 급탕 설비 등에서 연간 또는 일정 기간 동안 필요한 열량 및 에너지 소비량을 산 정하는 부하 계산 방법으로 급수배관의 관경 결정과는 무관하다는 관 균등표에 의한 방법: 동시사용 기구 수 및 수전 수에 따라 주관과 분기용 관의 상당관경을 간편하게 산정할 수 있는 급수배관 관경 결정 방법이다","ㄷ. 마찰저항선도에 의한 방법: 동시사용 급수량 허용 마찰손실수두, 유속 등을 기반으로 마찰저항선도(관경 계산도)를 이용 하여 가장 합리적으로 급수관경을 결정하는 표준적인 방법이다","ㄹ. 기구배수부하단위에 의한 방법: 배수 설비에서 각 위생기구의 배수 유량을 기준으로 배수관 및 통기관의 관경을 결정할 때 적용하는 기구배수부하단위(DFU) 방식이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄴ, ㄷ","terms":[],"extra":["ㄴ. ) 관 균등표에 의한 급수관경 결정 시 위생기기의 개수가 증가할수록 동시사용률은 작아진다","ㄹ. ) 옥내 배수관의 관경은 기구배수부하단위(DFU)법으로 결정하며 기구별 사용빈도와 시간을 고려해 세면기(1)를 기준으로 설정한다. 공통) 급수관경 결정방법에는 급수부하단위에 의한 방법, 기구연결관의 관경에 의한 방법, 관 균등표에 의한 방법, 마찰저항선도에 의한 방법이 있다. 마찰저항선도에 의한 급수관경 결정 순서는 기구급수부하단위의 계산→ 동시사용유수량 계산→ 허용마찰손실 계산→ 관 경 결정 순이다 최소 배관 관경은 급수배관 15mm 이상, 급탕배관 20mm 이상, 배수관 32mm 이상이다. 대변기에 연결하는 모든 건물배수수평주관의 관경은 75mm 이상으로 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 103번","noAns":false,"stemBr":false},{"id":"23-63","round":23,"num":63,"part":"건축설비","unit":"급수설비","sub":"급수관 상태검사 및 절수설비 /절수기기","type":"mc","stem":"수도법령상 절수설비와 절수기기에 관한 내용으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[{"mk":"ㄱ","tx":"별도의 부속이나 기기를 추가로 장착하지 아니하고도 일반 제품에 비하여 물을 적게 사용하도록 생산된 수도꼭지 및 변 기를 절수설비라고 한다."},{"mk":"ㄴ","tx":"절수형 수도꼭지는 공급수압 98 kPa에서 최대토수유량이 1분당 6.0 리터 이하인 것. 다만, 공중용 화장실에 설치하는 수도꼭지는 1분당 5 리터 이하인 것이어야 한다."},{"mk":"ㄷ","tx":"절수형 대변기는 공급수압 98 kPa에서 사용수량이 8 리터 이하인 것이어야 한다."},{"mk":"ㄹ","tx":"절수형 소변기는 물을 사용 true,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ: 3, ㄴ: 1","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["급수관의 수질 상태를 관리하기 위한 일반검사의 실시 주기 및 기준은 다음과 같다.","1. 최초 일반검사: 해당 건축물 또는 시설의 준공검사(급수관의 갱생 또는 교체 등의 조치를 한 경우 포함)를 실시한 날부터 5년이 경과한 날을 기준으로 6개월 이내에 실시해야 하므로 (ㄱ)에 들어갈 수치는 5이다.","2. 2회 이후의 일반검사: 최근 일반검사를 받은 날부터 2년이 되는 날까지 매 2년마다 실시해야 하므로 (ㄴ)에 들어갈 수치는 2이다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ: 5, ㄴ: 3","terms":[],"extra":["ㄱ.) 최초 일반검사는 준공검사일 외에 급수관의 갱생이나 교체 등의 조치를 시행한 날도 적용 기준일에 포함한다 L.) 2회 이후의 일반검사는 최근 일반검사를 받은 날부터 2년이 되는 날까지 매 2년마다 주기적으로 진행한다. 공통) 상수의 정수 단계는 채수→ 침전→ 폭기→ 여과→ 소독 순으로 진행된다. 먹는물의 수질기준은 총대장균군 100mL 내 미검출, 탁도 0.5NTU 이하, 색도 5도 이하, 수소이온농도 pH 5.8 이상 8.5 이 하, 경도 300mg/L 이하를 적용한다. 급수설비 수질오염 방지를 위해 저수조는 지표 아래 설치 시 분뇨 및 쓰레기 등 유해물질로부터 5m 이상 이격한다. 저수조 내 물 정체를 막기 위해 유입구와 유출구는 대각선 방향으로 배치하고, 단수 시 부압에 의한 역류 방지를 위해 토수 구공간 확보 또는 역류방지기를 설치한다 급수관 내 오수가 역류하는 크로스커넥션이 발생하지 않도록 배관한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 62번","noAns":false,"stemBr":false},{"id":"20-117","round":20,"num":117,"part":"건축설비","unit":"급수설비","sub":"급수방식 및 급수조닝","type":"mc","stem":"급수설비에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"수도직결방식은 상수도관의 공급압력에 의해 급수하는 방식으로 주로 대규모 및 고층건물에 사용된다.","ans":false,"mark":"X","note":"수도직결방식은 상수도 본관의 공급 수압을 직접 이용하여 급수하는 방식으로 상수도 배관망의 압력 한계로 인해 주로 소규모 소층 주택이나 소형 건물에 적용된다. 대규모 및 고층 건물은 높은 위치까지 수압이 전달되지 못하므로 수도직결방 식을 적용하기 어렵다","rnd":[22,24,26,27,29],"art":""},{"n":"②","text":"펌프직송방식은 기계실내 저수조 설치가 필요없다.","ans":false,"mark":"X","note":"펌프직송방식(부스터 펌프 방식)은 상수도관의 물을 건물 내 지하 또는 기계실의 저수조에 우선 저장한 후, 가압 펌프를 이용하여 각 세대 및 위생기구로 직접 송수하는 방식이다. 따라서 기계실 또는 지하 등에 저수조 설치가 필수적이다","rnd":[22,24,25,26,27],"art":""},{"n":"③","text":"고가수조방식은 건물의 옥상이나 높은 곳에 양수하여 하향식으로 급수한다.","ans":true,"mark":"O","note":"고가수조방식은 상수도 직관 또는 저수조의 물을 양수 펌프를 통해 건물의 옥상이나 높은 위치에 설치된 고가수조로 올 린 후, 중력에 의한 낙차를 이용하여 하향식으로 각 수전에 급수하는 방식이다.","rnd":[22,24,26,27],"art":""},{"n":"④","text":"수도직결방식은 건물 내 정전 시 급수가 불가능하다","ans":false,"mark":"X","note":"수도직결방식은 건물의 가압 펌프 등 전기 설비를 사용하지 않고 상수도 본관의 수압만으로 급수하므로 건물 내부가 정 전되더라도 상수도 공급이 유지되는 한 차단 없이 지속적인 급수가 가능하다","rnd":[26,27],"art":""},{"n":"⑤","text":"수도직결 계통의 수압시험은 배관의 최저부에서 최소 7.5 kg/cm² 압력으로 실시한다.","ans":false,"mark":"X","note":"급수 배관 계통의 수압시험은 배관의 최저부에서 최소 1.0 MPa(약 10 kgf/cm²) 이상의 압력으로 1시간 이상 가압하여 ㄴ 수 및 이상 유무를 확인해야 한다. 최소 7.5 kgf/cm 압력으로 실시한다는 설명은 현행 기준 규격에 부합하지 않는다.","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"고가수조방식은 상수도 직관 또는 저수조의 물을 양수 펌프를 통해 건물의 옥상이나 높은 위치에 설치된 고가수조로 올 린 후, 중력에 의한 낙차를 이용하여 하향식으로 각 수전에 급수하는 방식이다","terms":[],"extra":["①) 수도직결방식은 수압 변동에 영향을 받으며 급수 오염 가능성이 가장 낮다. 관경 결정 시 급수부하단위 기구연결관경 관균등표, 마찰저항선도법 등을 적용한다","②) 부스터방식(펌프직송방식)은 지하 저수조 설치가 필수적이며 정속(대수제어) 및 변속(회전수제어)방식으로 제어한다. 옥상 하중 부담이 없고 최상층 수압을 높게 유지할 수 있다.","③) 고가수조방식의 하향배관 시 수평주관은 선하향 구배, 각 층 수평지관은 선상향 구배로 시공한다 수조 수위면과 수전의 낙차로 급수압이 결정되며 정지수압은 높이차 1m당 0.01MPa을 적용한다.","④) 수도직결방식은 전기장치 없이 본관 수압으로 급수하여 정전 시에도 급수가 가능하나 단수 시에는 급수가 불가능하다","⑤) 수도직결방식 배관 수압시험은 최저부에서 최소 1MPa 압력으로 실시한다. 고가수조방식 배관 내구성은 0.75MPa 이상 압력에 견디어야 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 117번","noAns":false,"stemBr":false},{"id":"22-64","round":22,"num":64,"part":"건축설비","unit":"급수설비","sub":"급수방식 및 급수조닝","type":"mc","stem":"다음 중 고층건물에서 급수조닝을 하는 이유와 관련 있는 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"엔탈피","ans":false,"mark":"X","note":"","rnd":[21,26,29],"art":""},{"n":"②","text":"쇼트서킨","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"캐비테이션","ans":false,"mark":"X","note":"","rnd":[21,24,25,26],"art":""},{"n":"④","text":"수격작용","ans":true,"mark":"O","note":"","rnd":[20,21,23,24,25],"art":""},{"n":"⑤","text":"유인작용","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["고층 건축물에서는 수직 고도차에 의한 하층부의 과대수압을 방지하고 적정 급수압을 유지하기 위해 구획을 나누는 급수조닝을 실시한다.","엔탈피는 물질이 보유하고 있는 전체 열량을 나타내는 열역학적 상태량으로 공기조화 및 열원 설비 등에서 활용되는 개 념이다 급수 배관의 수압을 제어하는 급수조닝과는 직접적인 관련이 없다.","쇼트서킨은 저수조 내부에서 입력된 물이 체류하지 않고 출구로 곧바로 빠져나가는 단회로 현상이나 공기조화에서 급기 된 공기가 실내에 확산되지 않고 환기구로 배출되는 현상 등을 의미한다.","캐비테이션은 펌프 흡입관 내부 유체의 압력이 해당 온도의 증기압 이하로 낮아질 때 기포가 발생하여 펌프 임펠러 등을 손상시키는 공동현상이다 이는 펌프의 흡입 양정 및 설치 조건과 관련된다.","수격작용은 배관 내를 흐르던 유체의 속도가 급격히 변할 때 충격파가 발생하여 배관 및 기구에 높은 급폐 압력이 작용 하는 현상이다. 고층건물 하층부의 과대수압은 벨브 개폐 시 심한 수격작용과 소음, 배관 파손을 유발하므로 이를 방지하기 위한 급수조닝의 주요 목적이 된다.","유인작용은 고속 노즐에서 분사되는 일차 공기의 유속에 의해 주변의 이차 공기를 끌어들이는 공기조화 관련 현상 또는 배수 수직관 내 유체 흐름에 따른 기류 유도 현상이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"수격작용은 배관 내를 흐르던 유체의 속도가 급격히 변할 때 충격파가 발생하여 배관 및 기구에 높은 급폐 압력이 작용 하는 현상이다.","terms":[],"extra":["①) 엔탈피는 건조공기의 현열량과 수증기의 잠열량의 합으로 나타내며 현열비는 현열량을 전열량(엔탈피변화량)으로 나눈 값이다","③) 캐비테이션(공동현상) 방지대책은 펌프 설치위치와 흡입양정을 낮추고 임펠러 회전수와 흡입수온을 낮추며, 흡입관경을 크게 하고 부속류를 줄여 마찰손실수두를 감소시킨다","④) 수격작용 대책으로는 수압을 감소시키고 유속을 2m/s 이내로 제어하며 기구 가까이에 공기실(에어챔버)이나 수격방지 기를 설치하고 급수관경을 크게 하여 가능하면 직선배관으로 시공한다 공통) 급수조닝방식에는 중간수조방식 감압밸브방식, 중간수조와 감압벨브 병용방식이 있다 급수조닝은 각 층별 급수압력을 균등하게 하고 기구의 부속품 파손을 방지한다 최고 급수압력 기준은 병원, 호텔, 아파트는 0.3~0.4MPa 이하, 사무소 및 일반건물은 0.4~0.5MPa 이하로 설정한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 64번","noAns":false,"stemBr":false},{"id":"26-61","round":26,"num":61,"part":"건축설비","unit":"급수설비","sub":"급수방식 및 급수조닝","type":"mc","stem":"급수방식에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"고가수조방식은 건물 내 모든 층의 위생기구에서 압력이 동일하다","ans":true,"mark":"X","note":"고가수조방식은 수조의 설치 위치 높이와 각 층 위생기구 간의 수두차에 의해 급수압력이 결정된다. 수조와 가까운 상층 부는 급수압력이 낮고 하층부로 갈수록 수두차가 커져 급수압력이 높아지므로 건물 내 모든 층의 위생기구에서 압력이 동 일하지 않다","rnd":[20,22,24,27],"art":""},{"n":"②","text":"펌프직송방식은 단수 시에도 저수조에 남은 양만큼 급수가 가능하다","ans":false,"mark":"O","note":"펌프직송방식은 지하시설의 저수조에 물을 저장한 후 부스터 펌프로 각 세대에 가압 급수하는 방식이다 외부 단수가 발 생하더라도 저수조에 저장된 잔여 수량만큼은 급수가 가능하다","rnd":[20,22,24],"art":""},{"n":"③","text":"펌프직송방식은 급수설비로 인한 옥상층의 하중을 고려할 필요가 없다.","ans":false,"mark":"O","note":"펌프직송방식은 건물 옥상에 고가수조를 설치하지 않으므로 옥상 구조물에 작용하는 수조 하중을 고려할 필요가 없다.","rnd":[20,24],"art":""},{"n":"④","text":"고가수조방식은 타 급수방식에 비해 수질오염 가능성이 높다","ans":false,"mark":"O","note":"고가수조방식은 지하저수조와 옥상고가수조를 거치는 과정에서 체류시간이 길어지고 이물질 유입 가능성이 생기므로 타 급수방식에 비해 수질오염 발생 위험이 높다.","rnd":[20,22,24,27],"art":""},{"n":"⑤","text":"수도직결방식은 수도 본관의 압력에 따라 급수압이 변한다","ans":false,"mark":"O","note":"수도직결방식은 상수도 본관의 수압을 직접 이용해 급수하는 방식이므로 수도 본관의 공급 압력 변동에 따라 각 기구의 급수압이 직접적인 영향을 받아 변한다","rnd":[20,24,27],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"고가수조방식은 수조의 설치 위치 높이와 각 층 위생기구 간의 수두차에 의해 급수압력이 결정된다.","terms":[],"extra":["①) 고가수조방식은 하층부의 과대 수압에 의한 워터해머 및 소음을 방지하기 위해 감압벨브를 설치하거나 급수구역을 나누는 급수조닝을 실시한다. 고가수조의 필요한 설치 높이는 최상층 기구의 최저 필요수두에 배관의 마찰수두손실을 더하여 결 정한다.","②) 펌프직송(부스터)방식은 펌프의 대수제어 및 회전수제어(인버터 제어)를 통해 부하 변동에 따라 급수량을 효율적으로 조 절한다. 옥상수조가 없어 건축물 구조체의 하중을 경감시키고 공간 활용도가 높다.","③) 펌프직송방식과 압력수조방식은 정전 시 급수가 즉시 중단되는 단점이 있으며 옥상수조방식에 비해 초기 자동제어 설 비비와 유지관리비가 많이 듣다.","④) 수질오염 우려가 가장 큰 고가수조방식은 저수조 및 고가수조의 위생관리를 위해 반기 1회 이상 청소를 실시해야 한다. 수조의 용량 산정 시 저수조는 1일 예상 급수량의 1/2을, 고가수조는 1시간 분의 예상 최대소비량을 기준으로 한다.","⑤) 수도직결방식은 연속 급수 신뢰성이 낮으나 설비비가 저렴하고 기경성 오염원이 없어 가장 위생적이다 급수관 내 유속 은 동결 방지와 소음·수격작용 방지를 위해 1.5~2.0m/s 이하로 유지한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 61번","noAns":false,"stemBr":false},{"id":"29-64","round":29,"num":64,"part":"건축설비","unit":"급수설비","sub":"급수방식 및 급수조닝","type":"mc","stem":"급수설비에 관한 내용으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"급수펌프의 양수량을 4배로 증가시키기 위해 회전수를 2배로 증가시킨다","ans":false,"mark":"X","note":"급수펌프의 양수량은 펌프 회전수에 비례하므로 양수량을 4배로 증가시키기 위해서는 회전수를 4배로 증가시켜야 한다. 회전수를 2배로 증가시키면 양수량은 2배가 된다.","rnd":[20,21,23,24,25,26,27],"art":""},{"n":"②","text":"위생기구의 개수가 많을수록 동시사용률은 큰 값을 적용한다.","ans":false,"mark":"X","note":"위생기구의 개수가 많아질수록 모든 기구를 동시에 사용할 확률이 낮아지므로 동시사용률은 작은 값을 적용한다.","rnd":[24,27],"art":""},{"n":"③","text":"고층건물에서는 저층부의 과대 수압 방지를 위해 급수계통의 조닝을 한다.","ans":true,"mark":"O","note":"고층건물에서는 수직 고도차로 인한 하층부의 과대 수압을 방지하고 적정 수압을 유지하기 위하여 급수계통을 구획하는 급수 조닝을 실시한다","rnd":[20,22,24,26,27],"art":""},{"n":"④","text":"펌프를 수조의 수위보다 최대한 높게 설치하여 펌프의 공동현상(cavitation)을 방지한다.","ans":false,"mark":"X","note":"펌프의 공동현상(cavitation)을 방지하기 위해서는 흡입 배관 내부의 부압 형성을 억제해야 하므로 펌프를 수조 수위보다 낮게 설치하거나 흡입 양정을 최소화해야 한다.","rnd":[20,21,23,24,25,26],"art":""},{"n":"⑤","text":"배관이나 보일러 내면의 스케일 발생을 줄이기 위해 보급수의 경도를 높인다.","ans":false,"mark":"X","note":"배관 및 보일러 내부의 스케일은 물속에 용해된 칼슘, 마그네슘 등의 경도 성분이 가열·농축되면서 발생하므로 스케일 발생을 줄이기 위해서는 보급수의 경도를 낮추어야 한다.","rnd":[20,22,24,26,28],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 펌프의 양수량은 회전수에 비례하지만, 전양정은 회전수의 제곱에 비례하고 축동력은 회전수의 세제곱에 비례한다.","④) 공동현상은 수온 상승이나 유속 증가로 유체 압력이 증기압 이하로 떨어져 기포가 발생하는 현상이다 방지를 위해 흡 입양정을 낮추고 펌Ⅱ 회전수와 흡입수온을 낮추며 흡입관경을 크게 하고 부속류를 줄여 마찰손실수두를 감소시킨다.","⑤) 경수는 탄산칼슘 함유량 110ppm 이상인 물로 보일러 사용 시 스케일이 생겨 전열효율 저하, 과열, 수명 단축을 초래한 다. 경수를 끓이면 일시적 연수가 되며 생석회나 소다회를 첨가하면 영구적 연수가 된다. 공통) 급수조닝은 중간수조방식 감압벨브방식 병용방식이 있으며 층별 급수압 균등화 수격작용 방지, 부속품 파손 방지 목적 으로 적용한다. 위생기구 수가 많고 동시사용률이 작아질수록 소요 급수관경은 줄어든다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 64번","noAns":false,"stemBr":false},{"id":"20-102","round":20,"num":102,"part":"건축설비","unit":"급수설비","sub":"급수설비 일반 및 급수펌프","type":"mc","stem":"급수설비에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"관경을 결정하기 위하여 기구급수 부하단위를 이용하여 동시사용 유량을 산정한다","ans":false,"mark":"O","note":"급수관 관경을 결정하기 위해 각 위생기구에 부여된 기구급수 부하단위(FU)를 합산하여 동시사용 유량을 산정한다","rnd":[],"art":""},{"n":"②","text":"초고층 건물에서는 급수압이 최고사용압력을 넘지 않도록 급수조닝을 한다.","ans":false,"mark":"O","note":"초고층 및 고층건물에서는 배관 수격작용, 소음, 기구 손상 및 누수를 방지하기 위해 최하층 급수압이 최고사용압력을 초과하지 않도록 적절한 급수조닝을 실시한다","rnd":[21,22,24,26,27],"art":""},{"n":"③","text":"급 이 함께 커지므로 유량과 양정이 모두 증가하며 증가하는 구체적인 폭은 배관계의 마찰저항 특성 및 조건에 따라 결정된다","terms":[],"extra":["①) 동일한 특성을 갖는 펌Ⅱ 2대를 병렬로 연결하면 이론상 유량은 2배 증가하며 직렬로 연결하면 양정이 2배 증가한다","②) 동일 펌프를 직렬 연결할 경우 전양정이 2배로 증가하여 고층 급수나 높은 양정이 필요한 배관계통에 적합하다","③) 펌프의 양수량은 회전수에 비례하고, 전양정은 회전수의 제곱에 비례하며 축동력은 회전수의 세제곱에 비례하여 변동한 다.","④) 펌프의 성능곡선은 유량, 양정, 효율 필요흡입수두의 상관관계를 나타낸다 펌프의 축동력(kW)은 (1000× 전양정× 분 당 양수량)÷ (6120× 효율)로 산정한다","⑤) 펌프 운전 시 유량과 양정이 주기적으로 변동하는 현상은 서징현상(맥동현상)이며, 물의 압력이 증기압 이하로 떨어져 기포가 발생하는 공동현상(캐비테이션) 방지를 위해 흡입양정을 낮추고 흡입관경을 크게 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 61번","noAns":false,"stemBr":false},{"id":"24-62","round":24,"num":62,"part":"건축설비","unit":"급수설비","sub":"급수설비 일반 및 급수펌프","type":"mc","stem":"급수설비에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"기구급수부하단위는 같은 종류의 기구일 경우 공중용이 개인용보다 크다","ans":false,"mark":"O","note":"기구급수부하단위(FU)는 사용 빈도, 동시사용률 토출량 등을 고려하여 설정된다. 따라서 동일한 종류의 위생기구라 하더 라도 불특정 다수가 연속적으로 사용하는 공중용(대중용) 기구의 급수부하단위가 개인용(가정용) 기구보다 크게 적용된다.","rnd":[23,26,27],"art":""},{"n":"②","text":"벽을 관통하는 배관의 위치에는 슬리브를 설치하는 것이 바람직하다","ans":false,"mark":"O","note":"배관이 벽이나 슬래브 등 구조체를 관통하는 위치에는 배관의 신축 흡수, 구조체 보호 및 배관 수리·교체의 용이성을 위 하여 슬리브를 설치해야 한다.","rnd":[20,21,22,26,27],"art":""},{"n":"③","text":"고층건물에서는 급수계통을 조닝하는 것이 바람직하다.","ans":false,"mark":"O","note":"고층건물에서는 하층부 수전류 및 배관에 과도한 수압이 걸려 수격작용 소음, 벨브 마모 등이 발생하는 것을 방지하고 적정 급수압(0.3~0.4 MPa 이하)을 유지하기 위하여 급수계통을 수직 방향으로 구획하는 조닝을 실시해야 한다.","rnd":[20,22,26,27,29],"art":""},{"n":"④","text":"펌프의 공동현상(cavitation)을 방지하기 위하여 펌프의 설치 위치를 수조의 수위보다 높게 하는 것이 바람직하다","ans":true,"mark":"X","note":"펌프의 캐비테이션(공동현상)을 방지하기 위해서는 펌프 흡입측의 유효흡입수두(NPSHa)를 크게 확보해야 한다. 이를 위 해 펌프의 설치 위치를 수조의 수위보다 낮게 배치하여 눌러붙이는 방식(압입 수두)으로 시공하거나 흡입양정을 최소화해 야 한다 펌프의 설치 위치가 수조 수위보다 높으면 흡입 양정이 길어져 관 내 부압이 발생하고 캐비테이션이 발생하기 쉬 워진다.","rnd":[21,23,25,26,29],"art":""},{"n":"⑤","text":"보급수의 경도가 높을수록 보일러 내면에 스케일 발생 가능성이 커진다","ans":false,"mark":"O","note":"보급수로 사용되는 물의 경도(칼슘, 마그네슘 등의 함유량)가 높을수록 가열 및 농축 과정에서 전열면과 보일러 내면에 난용성 염인 스케일이 부착 및 생성될 가능성이 커진다.","rnd":[20,22,26,28,29],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"펌프의 캐비테이션(공동현상)을 방지하기 위해서는 펌프 흡입측의 유효흡입수두(NPSHa)를 크게 확보해야 한다.","terms":[],"extra":["①) 기구급수부하단위(FU)는 세면기의 급수량을 기준(1.0)으로 산정하며 건물 종류 및 기구 수에 따른 동시사용률을 적용하 여 최종 급수관경과 급수량을 결정한다.","②) 슬리브 배관 시 배관과 슬리브 사이의 틈새는 방수 및 차음 재료로 밀실하게 채워야 하며, 콘크리트 타설 전 구조체에 미리 매설하여 관의 신축과 변형에 대비한다.","③) 급수조닝 시 건물 하층부의 수전류 최고 수압은 0.3~0.4MPa 정도가 적당하다 조닝 방식에는 고가수조 분할방식 감압 벨브 설치방식, 부스터 펌프 구획방식 등이 있다.","④) 공동현상 발생 시 펌프의 임펠러 부식, 소음 및 진동, 양수불능이 발생한다 방지대책으로 펌프의 회전수를 낮추고, 흡입관경을 확대하며 마찰저항을 줄이기 위해 부속품 사용을 최소화한다.","⑤) 경수에 포함된 칼슘과 마그네슘은 보일러 가열 시 내벽에 난용성 스케일을 형성하여 열효율을 저하시키고 국부과열을 유발하므로 보급수로 연수장치를 거친 단물을 사용해야 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 62번","noAns":false,"stemBr":false},{"id":"24-66","round":24,"num":66,"part":"건축설비","unit":"급수설비","sub":"급수설비 일반 및 급수펌프","type":"mc","stem":"급수설비에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"급수펌프의 회전수를 2배로 하면 양정은 8배가 된다.","ans":false,"mark":"X","note":"펌프의 회전수(N)가 2배로 증가하면 유량(Q)은 회전수에 비례하여 2배, 양정(H)은 회전수의 제곱에 비례하여 4배(22배), 축동력(ㄴ)은 회전수의 세제곱에 비례하여 8배(23배)로 증가한다 따라서 회전수를 2배로 할 경우 양정은 8배가 아닌 4배가 된다.","rnd":[20,21,23,25,26,27,29],"art":""},{"n":"②","text":"펌프의 흡입양정이 작을수록 서징현상 방지에 유리하다","ans":false,"mark":"X","note":"펌프의 흡입양정이 작을수록(흡입 수두가 높고 흡입 관로가 단축될수록) 관 내 부압 발생이 차단되어 방지되는 것은 서 징이 아니라 공동현상(캐비테이션)이다. 서징(맥동현상)은 펌프의 H-Q 산형 특성곡선, 배관 내 공기 체류, 토출 벨브 조절 등에 의해 주기적으로 압력과 유량이 변동하는 현상이다.","rnd":[21,23,25,26],"art":""},{"n":"③","text":"펌프직송방식은 정전이 될 경우 비상발전기가 없어도 일정량의 급수가 가능하다","ans":false,"mark":"X","note":"펌프직송방식(부스터 방식)은 전력에 의한 펌피 구동에 직접 의존하므로 정전 발생 시 비상발전기 전력 공급이 없으면 펌프가 정지되어 급수가 완전히 중단된다. 정전 시에도 일정량 급수가 가능한 방식은 고가수조방식이나 수도직결방식이다","rnd":[20,26],"art":""},{"n":"④","text":"고층건물의 급수 조닝방법으로 안전벨브를 설치하는 것이 있다","ans":false,"mark":"X","note":"고층건물의 급수 조닝방법으로는 수조 분할 방식, 감압벨브 설치 방식, 부스 t":"서징현상(surging)을 방지하기 위해 관로에 있는 불필요한 잔류 공기를 제거한다","ans":true,"mark":"O","note":"서징현상(맥동현상)은 펌프 운전 중 유량과 압력이 주기적으로 변형 및 축적되면서 관로 내 유체가 주기적으로 변동하는 현상이다. 배관 관로 내 잔류 공기가 존재하면 공기의 압축성으로 인해 서징이 유발되거나 심화되므로 관로의 불필요한 잔 류 공기를 제거하여 서징현상을 방지한다","rnd":[24],"art":""},{"n":"④","text":"펌프의 전양정은 펌프의 회전수에 반비례한다","ans":false,"mark":"X","note":"펌프의 상사칙에 따르면 펌프의 전양정은 회전수의 제곱에 비례한다","rnd":[20,21,22,23,24,25,27,29],"art":""},{"n":"⑤","text":"펌프의 회전수를 2배로 하면 펌프의 축동력은 4배가 된다.","ans":false,"mark":"X","note":"펌프의 상사칙에 따르면 유량은 회전수에 비례하고, 전양정은 회전수의 제곱에 비례하며 펌프의 축동력은 회전수의 세 제곱에 비례한다 따라서 회전수를 2배로 올리면 펌프의 축동력은 8배(2의 3제곱)가 된다.","rnd":[20,21,22,23,24,25,27,29],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"서징현상(맥동현상)은 펌프 운전 중 유량과 압력이 주기적으로 변형 및 축적되면서 관로 내 유체가 주기적으로 변동하는 현상이다.","terms":[],"extra":["①) 캐비테이션(공동현상)은 펌Ⅱ 내부 압력이 수증기압 이하로 떨어질 때 기포가 발생하는 현상이다 방지책으로는 펌Ⅱ 회전수를 낮추고, 흡입관 직경을 크게 하여 마찰손실을 줄이며 회전차를 물속에 잠기게 시공하는 방법 등이 있다.","②) 실양정은 흡입양정과 토출양정의 수직거리 합이다. 양정 높이에 따라 20m 이하 단양정에는 가이드베인이 없는 볼류트 찜프를, 20m 초과 고양정에는 가이드베인이 있는 터빈 펌프를 사용한다","③) 서징현상은 유량과 양정이 주기적으로 변하는 맥동현상이다 수격작용(워터해머)은 벨브를 갑자기 닫을 때 유속 급변으 로 관로 내 압력이 급상승하는 현상이며 이를 방지하기 위해 배관 내 수격방지기(에어챔버)나 밀폐식 부속을 설치한다","④) 펌프 비례법칙(상사칙)에 따르면 회전수가 변화할 때 유량(Q)은 회전수비(N)에 비례하고, 전양정(H)은 회전수비의 제곱 (N²)에 비례한다","⑤) 펌프 축동력 P(kW)= (1000× 전양정× 분당 양수량) ÷ (6120× 효율) 공식으로 구하며 축동력은 회전수비의 세제곱 (N3)에 비례한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 62번","noAns":false,"stemBr":false},{"id":"27-62","round":27,"num":62,"part":"건축설비","unit":"급수설비","sub":"급수설비 일반 및 급수펌프","type":"mc","stem":"급수설비에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"고가수조방식은 타 급수방식에 비해 수질오염 가능성이 낮다.","ans":false,"mark":"X","note":"고가수조방식은 지하저수조 및 옥상 고가수조를 거쳐 급수하는 방식으로 수조 내 수분의 체류 시간이 길고 외부 오염물 질 유입 가능성이 있어 수도직결방식 등 다른 급수방식에 비해 수질오염 가능성이 높다.","rnd":[20,22,24,26],"art":""},{"n":"②","text":"수도직결방식은 건물 내 정전 시 급수가 불가능하다","ans":false,"mark":"X","note":"수도직결방식은 상수도 본관의 수압을 직접 이용해 급수하는 방식이므로 건물 내에 정전이 발생하더라도 상수도 본관의 수압이 유지되는 한 급수가 가능하다","rnd":[20,26],"art":""},{"n":"③","text":"초고층건물의 급수조닝 방식으로 감압벨브 방식이 있다.","ans":true,"mark":"O","note":"초고층 건축물의 하부 배관 및 수전류에 걸리는 과대 정수압을 제어하기 위해 급수조닝을 실시하며 수조 분할 방식, 펌 Ⅱ 분할 방식과 함께 감압벨브 방식이 대표적인 조닝 방식으로 적용된다.","rnd":[20,22,24,26,29],"art":""},{"n":"④","text":"배관의 크로스커넥션을 통해 수질오염을 방지한다.","ans":false,"mark":"X","note":"크로스커넥션(교차연결)은 음용수 배관과 비음용수 배관 또는 오수 배관이 직접 연결되어 음용수가 오염되는 현상으로 수질오염의 주요 원인이 된다. 따라서 수질오염을 방지하기 위해서는 크로스커넥션을 차단 및 금지해야 한다","rnd":[20,22,26],"art":""},{"n":"⑤","text":"동시사용률은 위생기기의 개수가 증가할수록 커진다","ans":false,"mark":"X","note":"급수관경 산정 시 적용하는 위생기기의 동시사용률은 설치된 위생기기의 총 수량이 많아질수록 모든 기기가 동시에 사용 될 확률이 낮아지므로 기기 수가 증가할수록 감소한다","rnd":[24,29],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"초고층 건축물의 하부 배관 및 수전류에 걸리는 과대 정수압을 제어하기 위해 급수조닝을 실시하며 수조 분할 방식, 펌 Ⅱ 분할 방식과 함께 감압벨브 방식이 대표적인 조닝 방식으로 적용된다","terms":[],"extra":["①) 고가수조방식은 급수방식 중 수압이 가장 일정하며 정전이나 단수 시에도 일정 시간 급수가 가능하다 정지수압은 수조 와 수전의 높이차(m)× 0.01MPa로 산정하며 지하저수조는 분뇨·쓰레기 등 유해물질과 5m 이상 이격한다","②) 수도직결방식은 기계실과 옥상수조가 불필요하여 설비비가 저렴하다. 급수배관 수압시험은 배관 최저부에서 최소 1MPa 압력으로 실시한다.","③) 급수조닝은 초고층·고층건물에서 과대 수압에 의한 수격작용 소음·진동 및 부속품 파손을 방지하기 위해 실시하며 감 압벨브방식 외에 중간수조방식 및 병용방식이 있다.","④) 수질오염 방지를 위해 크로스커넥션 금지 외에도 세면기 토수구공간 확보, 진공방지기(버큐브레이커) 설치, 저수조 유입 구와 유출구의 대각선 배치를 적용한다.","⑤) 급수관경 결정방법에는 관 균등표법 외에 급수부하단위법 기구연결관경법 마찰저항선도법이 있으며, 급수관의 최소 관경은 15mm 이상으로 한다. 공통) 수전류를 급격히 개폐하거나 유속이 빠를 때 발생하는 수격작용을 방지하기 위해 기구 근처에 공기실(에어챔버) 또는 수격방지기를 설치하고, 유속은 2m/s 이내로 제어한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 62번","noAns":false,"stemBr":false},{"id":"27-64","round":27,"num":64,"part":"건축설비","unit":"급수설비","sub":"급수설비 일반 및 급수펌프","type":"mc","stem":"급수펌프의 회전수를 증가시켜 양수량을 10% 증가시켰을 때, 펌프의 양정과 축동력의 변화로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"양정은 10% 증가하고, 축동력은 21% 증가한다","ans":false,"mark":"X"," 해 강관 30m, 동관 20m마다 신축 이음을 설치한다.","④) 개별식의 순간온수기는 가열온도가 60~70°C로 비등점 부근의 온수를 얻지 못하며 저탕형 탕비기는 서모스탠을 사용하 고, 기수혼합식은 스팀사일런서를 설치한다.","⑤) 단관식은 급탕원과 기구 간 거리가 15m 이하일 때 적용하며 복관식의 급탕환수관 관경은 최소 20mm 이상으로 급탕관 의 2/3 정도로 시공한다 공통) 팽창관 도중에는 절대로 벨브를 설치해서는 안 되며 관경은 25mm 이상으로 한다. 급탕배관 구배는 중력순환식 1/150 이상, 강제순환식 1/200 이상을 적용한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 65번","noAns":false,"stemBr":false},{"id":"23-62","round":23,"num":62,"part":"건축설비","unit":"급탕설비","sub":"급탕방식 및 배관","type":"mc","stem":"급탕설비에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"간접가열식이 직접가열식보다 열효율이 좋다","ans":true,"mark":"X","note":"직접가열식은 보일러에서 물을 직접 가열하므로 열효율이 높고 설치 비용이 저렴하다 반면 간접가열식은 열교환기 코일 을 통해 물을 간접 가열하므로 열효율이 직접가열식보다 낮다","rnd":[20,22,24,25,27,29],"art":""},{"n":"②","text":"팽창관의 도중에는 벨브를 설치해서는 안 된다.","ans":false,"mark":"O","note":"팽창관은 온수 가열에 따른 체적 팽창 압력을 팽창탱크로 방출하여 배관 및 장치의 파열을 방지하는 안전 배관이므로 도중에 벨브를 설치하여 폐쇄될 경우 폭발 위험이 발생하므로 벨브 설치를 금지한다","rnd":[20,27],"art":""},{"n":"③","text":"일반적으로 급탕관의 관경을 환탕관(반탕관)의 관경보다 크게 한다.","ans":false,"mark":"O","note":"급탕 배관 계통에서 환탕관(반탕관)을 통해 회수되는 순환 유량은 전체 급탕 공급량보다 적으므로 일반적으로 급탕관의 관경을 환탕관의 관경보다 크게 설정한다.","rnd":[20,21,22],"art":""},{"n":"④","text":"자동온도조절기(Thermostat)는 저탕탱크에서 온수온도를 적절히 유지하기 위해 사용하는 것이다","ans":false,"mark":"O","note":"자동온도조절기(Thermostat)는 저탕탱크 내 온수의 온도를 감지하여 열원의 공급량을 자동으로 제어함으로써 지정된 온 수 온도를 적절하게 유지시키는 장치이다","rnd":[25,29],"art":""},{"n":"⑤","text":"급탕배관을 복관식(2관식)으로 하는 이유는 수전을 열었을 때, 바로 온수가 나오게 하기 위해서이다","ans":false,"mark":"O","note":"복관식(2관식) 급탕배관은 급탕관과 환탕관을 이용하여 온수를 지속적으로 순환시키는 방식으로 수전을 열었을 때 식은 물이 나오지 않고 즉시 온수가 나오도록 한다.","rnd":[22,27,29],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 직접가열식은 소규모 건물에 적합하나 스케일(관석)이 잘 생기고 보일러 수명이 짧다 간접가열식은 대규모 건물 및 고 층 건물에 적합하며 난방과 급탕 겸용이 가능하고 스케일 발생이 적다.","②) 개방식 팽창탱크는 최상층 급탕 수전보다 1m 이상 높은 곳에 설치하며 팽창관에는 도중 벨브 설치를 절대 금지한다. 밀폐식 팽창탱크는
