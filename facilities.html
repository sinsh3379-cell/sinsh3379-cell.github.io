및 봉수파괴 원인","type":"mc","stem":"배수트랩의 구비조건에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"자기사이편 작용이 원활하게 일어나야 한다.","ans":true,"mark":"X","note":"자기사이펀 작용(자기사이폰 현상)은 기구 배수 시 관 내 만류 흐름에 의해 발생하는 수두차와 감압 작용으로 트랩 내 봉수를 함께 배출시켜 봉수파괴를 유발하는 현상이다 따라서 배수트랩은 자기사이편 작용이 발생하지 않도록 방지하는 구조이어야 한다.","rnd":[],"art":""},{"n":"②","text":"하수 가스, 냄새의 역류를 방지하여야 한다.","ans":false,"mark":"O","note":"배수트랩은 트랩 내 봉수를 유지하여 배수관 하부로부터 유입되는 하수가스 악취, 위생해충 등의 옥내 침입 및 역류를 차단해야 한다.","rnd":[29],"art":""},{"n":"③","text":"포집기류를 제외하고는 오수에 포함된 오물 등이 부착 및 침전하기 어려워야 한다.","ans":false,"mark":"O","note":"배수트랩은 내면이 평활하여 오수에 포함된 오물 찌꺼기 등이 부착되거나 정체하지 않고 자체 유속에 의해 세척되는 자 화작용을 가져야 한다. 단, 오물이나 유분을 정체시켜 분리·포집하는 포집기류는 예외로 한다.","rnd":[],"art":""},{"n":"④","text":"봉수 깊이가 항상 유지되는 구조이어야 한다.","ans":false,"mark":"O","note":"배수트랩의 봉수깊이는 증발 및 유출을 고려하여 50 mm 이상 100 mm 이하의 적정 봉수깊이를 항상 유지할 수 있는 구조이어야 한다.","rnd":[],"art":""},{"n":"⑤","text":"간단한 구조이어야 한다.","ans":false,"mark":"O","note":"배수트랩은 내부 구조가 단순하여 유체 흐름 저항을 최소화하고 손쉽게 청소 및 점검을 할 수 있는 구조이어야 한다.","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"자기사이펀 작용(자기사이폰 현상)은 기구 배수 시 관 내 만류 흐름에 의해 발생하는 수두차와 감압 작용으로 트랩 내 봉수를 함께 배출시켜 봉수파괴를 유발하는 현상이다 따라서 배수트랩은 자기사이편 작용이 발생하지 않도록 방지하는 구조이어야 한다","terms":[],"extra":["①) 트랩의 봉수파괴 원인에는 자기사이편작용, 유인사이편작용 토출작용 모세관현상, 증발, 관성작용이 있다. 통기관 설치 로 사이펀 및 토출작용을 방지하며 S트랩에서 자기사이편작용이 자주 발생한다.","②) 트랩은 가동 부분이 없어야 하며 내식성·내구성 재료를 사용한다 봉수면은 디프보다 높은 위치를 유지해야 하며, 배수 흐름 저하를 막기 위해 이중트랩 설치를 금지한다.","③) 포집기는 유해물질을 분리·포집하는 기구로 주방용 그리스포집기 차고·주유소용 오일포집기 미용실용 헤어포집기 치 과·정형외과용 플라스터포집기 등이 있다.","④) 봉수 깊이는 디프에서 위어까지의 수직 거리로 50~100mm이다 장기간 미사용으로 인한 증발은 기름을 흘려보내 방지하 고, 모세관현상은 이물질을 제거하여 방지한다","⑤) 트랩의 종류 중 사이펀트랩에는 S트랩(대·소변기), P트랩(세면기), U트랩(건물트랩)이 있고, 비사이펀트랩에는 드럼트랩 (주방 싱크대)과 벨트랩(바닥 배수)이 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 70번","noAns":false,"stemBr":false},{"id":"25-61","round":25,"num":61,"part":"건축설비","unit":"배수통기 및 위생기구 설비","sub":"배수트랩 및 봉수파괴 원인","type":"mc","stem":"트랩의 봉수파괴 원인이 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"수격작용","ans":true,"mark":"X","note":"수격작용(Water Hammering)은 급수 및 급탕 배관에서 수전이나 벨브를 급격히 닫을 때 관 내 유체의 운동에너지가 압 력에너지로 변하면서 배관 벽면을 때려 진동과 소음을 발생시키는 현상이며 배수트랩의 봉수파괴 원인에 해당하지 않는다","rnd":[20,21,22,23,24],"art":""},{"n":"②","text":"모세관현상","ans":false,"mark":"O","note":"모세관현상은 트랩 내에 머리카락, 천 조각 등의 이물질이 걸려 있어 이를 타고 트랩 내 봉수가 모세관 작용으로 외부 배수관 쪽으로 조금씩 유출되어 봉수가 파괴되는 현상이다.","rnd":[],"art":""},{"n":"③","text":"증발작용","ans":false,"mark":"O","note":"증발작용은 기구를 장기간 사용하지 않을 경우 실내 공기 중으로 트랩 내 봉수가 자연 증발하여 봉수가 파괴되는 현상이 다.","rnd":[],"art":""},{"n":"④","text":"분출작용","ans":false,"mark":"O","note":"분출작용(토출작용)은 배수 수직관 상부에서 다량의 오수가 떨어질 때 하부 곡부 부근에 정압이 형성되어 배수관 내 고 압의 공기가 트랩 내 봉수를 옥내 측으로 밀어 올려 파괴하는 현상이다","rnd":[],"art":""},{"n":"⑤","text":"자기사이편작용","ans":false,"mark":"O","note":"자기사이편작용은 기구에서 한 번에 다량의 물을 배수할 때 배수관 내에 만류 흐름이 형성되면서 발생하는 감압 및 수두 차로 인해 트랩 내의 봉수가 함께 유출되어 파괴되는 현상이다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 수격작용은 배관의 수전이나 패킹, 와셔 등에 손상을 유발한다. 방지대책으로 기구 가까이에 공기실(에어챔버)이나 수격 방지기를 설치하고, 유속을 2m/s 이내로 유지하며 급수관경을 크게 설정한다","②) 모세관현상에 의한 봉수파괴는 트랩 출구 쪽에 걸린 걸레조각이나 모발 등 고형물질을 제거하여 방지한다.","③) 증발에 의한 봉수파괴는 장기간 사용하지 않는 위생기구 트랩 내에 기름을 조금 흘려보내 방지할 수 있다.","④) 토출작용과 유인사이편작용(흡인작용) 등 배수관 내 압력변동에 의한 봉수파괴는 통기관을 설치하여 배수 흐름을 원활하게 함으로써 방지한다","⑤) 자기사이편작용은 S트랩에서 발생하기 쉬우며, 봉수파괴 원인에는 이 외에도 강풍이나 지진 등 큰 충격에 의해 봉수면 이 상하 동요하는 관성작용이 있다. 봉수의 깊이는 50~100mm이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 61번","noAns":false,"stemBr":false},{"id":"28-64","round":28,"num":64,"part":"건축설비","unit":"배수통기 및 위생기구 설비","sub":"배수트랩 및 봉수파괴 원인","type":"mc","stem":"다음 트랩의 단면에서 (ㄱ), (ㄴ)의 명칭으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"ㄱ: 벤트(vent), ㄴ: 디프(dip)","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄱ: 디프(dip), ㄴ: 웨어(weir)","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"ㄱ: 웨어(weir), ㄴ: 벤트(vent)","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"ㄱ: 웨어(weir), ㄴ: 디프(dip)","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ: 디프(dip), ㄴ: 벤트(vent)","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["트랩의 (ㄱ)은 봉수를 형성하는 상부 굴곡부 턱인 디프(dip)이며, (ㄴ)은 배수가 배수관으로 넘쳐흐르는 출구 턱인 웨어(weir) 이다. 벤트(vent)는 트랩 자체의 부위 명칭이 아니라 배수관 내부의 기압을 조절하여 트랩의 봉수 파괴를 방지하기 위한 통 기관 또는 통기방식을 의미한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ: 디프(dip), ㄴ: 웨어(weir)","terms":[],"extra":["②) 봉수 깊이는 50mm~ 100mm를 표준으로 하며, 봉수수면이 디프보다 높은 위치에 유지되어야 하수가스의 실내 침입을 차단할 수 있다. 공통) 트랩은 배수관 속의 악취, 유독가스, 벌레 등의 실내 유입을 방지하는 기구로, 유속 저하 및 침전을 방지하기 위해 이중 설 치를 금지한다 트랩의 종류 중 P트랩은 세면기에 주로 쓰이고, 드럼트랩은 주방 싱크대 배수용으로 봉수가 안전하지만 자정작용이 없으며 벨트랩은 바닥 배수용으로 쓰인다 봉수파괴 원인 중 자기사이펀, 유인사이펀, 토출작용은 통기관 설치로 방지하고 모세관현상은 이물질 제거, 증발은 기름 투 입, 관성작용은 관말에 격자석쇠를 설치하여 방지한다 통기관은 트랩 봉수 보호, 관 내 압력변동 흡수 및 배수 흐름 원활화 신선한 외기 유통을 통한 배수관 청결 유지를 목적으 로 설치한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 64번","noAns":false,"stemBr":false},{"id":"29-66","round":29,"num":66,"part":"건축설비","unit":"배수통기 및 위생기구 설비","sub":"배수트랩 및 봉수파괴 원인","type":"mc","stem":"배수설비에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"하수 가스, 냄새의 역류를 방지하기 위하여 이중으로 트랩을 설치한다.","ans":true,"mark":"X","note":"배수 계통에 트랩을 이중으로 설치(이중트랩)하면 배수 흐름 저항이 대폭 증가하여 오물이 체류하기 쉽고 통기 장애 및 봉수 파괴가 유발되므로 이중트랩 시공은 금지한다","rnd":[24],"art":""},{"n":"②","text":"트랩에서 사이펀 작용을 방지하기 위하여 통기관을 설치한다","ans":false,"mark":"O","note":"트랩 내부의 봉수가 사이편 작용이나 배출 압력에 의해 파괴되는 것을 방지하고 배수를 원활하게 유도하기 위하여 통기 관을 설치한다","rnd":[20,21,22,23,24,25,26,27],"art":""},{"n":"③","text":"청소구는 건물 배수관과 부지 하수관이 접속하는 곳에 설치한다.","ans":false,"mark":"O","note":"배수관 관로 내부의 이물질 제거 및 점검을 위하여 건물 배수관과 부지 하수관이 접속하는 지점, 배수 가로관의 기점, 관경이 변하는 곳, 방향을 전환하는 곳 등에 청소구를 설치한다","rnd":[20,22,23,27],"art":""},{"n":"④","text":"배수수직관 내의 압력변동을 방지하기 위해 배수수직관과 통기수직관을 연결하는 통기관은 결합통기관이다.","ans":false,"mark":"O","note":"배수수직관 내부의 공기 압력 변동을 완화하여 봉수를 보호하고 통기를 원활하게 하기 위하여 배수수직관과 통기수직관 을 상호 연결하는 통기관은 결합통기관이다","rnd":[20,22,23,26,27],"art":""},{"n":"⑤","text":"배수수직관은 배수가 흐르는 방향으로 관경을 축소하지 않는다.","ans":false,"mark":"O","note":"배수수직관 및 배수관은 하류로 갈수록 배수 흐름이 정체되는 것을 방지하고 통수 능력을 유지하기 위하여 배수가 흐르는 방향으로 관경을 축소하지 않는다","rnd":[20,22,23,24,26,27],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 트랩의 유효 봉수깊이는 50~100mm이다 봉수파괴 원인에는 자기사이편작용 유인사이편작용 토출작용 모세관현상, 증 발, 관성작용이 있다.","②) 각개통기관은 기구의 물넘침선 위 150mm 이상 높은 곳에서 통기수평지관에 접속하며 최소 관경은 32mm 이상 및 담당 배수관 지름의 1/2 이상이다. 루프통기관 1개가 담당하는 위생기구는 최대 8개이다","③) 청소구는 관지름 100mm 이하 시 15m 이내, 100mm 초과 시 30m 이내마다 설치하며 배수 흐름의 반대 또는 직각으로 열 수 있도록 설치한다.","④) 결합통기관 관경은 연결하는 통기수직관 관지름과 같게 하고, 브랜치간격 11 이상인 배수수직관은 브랜치 10 이내마다 설치한다 통기수직관은 우수수직관과 연결을 금한다","⑤) 배수관 관경 크기는 위생기구배수관≤ 배수수평지관≤ 배수수직주관 순이다 배수수평관 구배는 관경 65mm 이하 시 1/50 이상, 80~150mm 시 1/100 이상을 적용한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 66번","noAns":false,"stemBr":false},{"id":"20-119","round":20,"num":119,"part":"건축설비","unit":"배수통기 및 위생기구 설비","sub":"배수설비 및 청소구","type":"mc","stem":"배수설비에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"배수는 기구배수, 배수수평주관 배수수직주관의 순서로 이루어지며, 이 순서대로 관경은 작아져야 한다.","ans":false,"mark":"X","note":"배수 계통은 위생기구 배수관에서 시작하여 배수수평지관 배수수직관 배수수평주관을 거쳐 부지 하수도로 배출된다. 배 수 흐름이 하류로 진행될수록 합류하는 배수량이 누적되어 증가하므로 배관 관경은 흐름 방향에 따라 같거나 순차적으로 커 져야 하며 작아져서는 안 된다.","rnd":[27],"art":""},{"n":"②","text":"청소구는 배수수평지관의 최하단부에 설치해야만 한다.","ans":false,"mark":"X","note":"배관 내부의 청소 및 점검을 위한 청소구(cleanout)는 배수 오물이 정체되거나 막히기 쉬운 배수수평지관 및 배수수평주 관의 기점(최상단부), 배수수직관의 최하단부 관경이 변하는 곳, 45도를 초과하여 방향이 변하는 굴곡 ntro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"플러시벨브의 2차측(하류측)에는 버큠 브레이커(vacuum breaker)를 설치한다","ans":false,"mark":"O","note":"플러시벨브(세정벨브)를 설치할 때 세정 후 세정관 내의 음압 형성으로 인한 오수의 역류를 방지하기 위해 플러시벨브의 2차측(하류측)에 버큼 브레이커(진공파쇄기)를 설치해야 한다.","rnd":[20,21],"art":""},{"n":"②","text":"버큼 브레이커(vacuum breaker)의 역할은 이미 사용한 물의 자기사이편 작용에 의해 상수계통(급수관)으로 역류하는 것을 방지하기 위한 기구이다","ans":true,"mark":"X","note":"버큼 브레이커는 급수관 내에 순간적인 음압(진공)이 발생할 때 공기를 흡입하여 역사이편 작용(back-siphonage)에 의 해 이미 사용한 물이나 오수가 상수계통(급수관)으로 역류하는 것을 방지하는 장치이다. 자기사이편작용은 위생기구 배수 시 유수의 견인력에 의해 트랩 내부의 봉수가 파괴되는 현상을 의미하므로 역류의 원인 설명으로 올바르지 않다.","rnd":[20,21,22,28,29],"art":""},{"n":"③","text":"플러시벨브에는 핸들식, 전자식, 절수형 등이 있다.","ans":false,"mark":"O","note":"플러시벨브는 조작 방식 및 세정 방식에 따라 손으로 레버를 누르는 핸들식, 감지기 센서로 작동하는 전자식(자동식), 절 수 성능을 갖춘 절수형 등 다양한 종류가 적용된다","rnd":[],"art":""},{"n":"④","text":"소음이 크고, 단시간에 다량의 물을 필요로 하는 문제점 등으로 인해 일반 가정용으로는 거의 사용하지 않는다","ans":false,"mark":"O","note":"플러시벨브는 수압이 높고 단시간에 다량의 급수가 필요하며 작동 시 배관 소음 및 워터해머(수격작용) 발생 가능성이 크다. 따라서 수압 및 관경 확보가 어렵고 소음 민원이 발생하는 일반 주택(가정용)에는 거의 사용하지 않고, 공공건물이나 상업시설의 화장실에 주로 사용된다","rnd":[21,24,29],"art":""},{"n":"⑤","text":"급수관의 관경은 25mm 이상 필요하다","ans":false,"mark":"O","note":"플러시벨브의 인입 급수관 관경은 순간적인 대량 급수를 위해 최소 25 mm 이상으로 배관해야 한다.","rnd":[20,21,22,28,29],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"버큼 브레이커는 급수관 내에 순간적인 음압(진공)이 발생할 때 공기를 흡입하여 역사이편 작용(back-siphonage)에 의 해 이미 사용한 물이나 오수가 상수계통(급수관)으로 역류하는 것을 방지하는 장치이다.","terms":[],"extra":["①) 세정벨브식 대변기는 최소 급수압력이 0.1MPa(100kPa) 이상 필요하며 이는 세면기 수전의 최저필요압력(0.055MPa)보 다 크다","②) 상수계통으로의 역류를 방지하는 대책으로는 버큐브레이커(진공방지기) 설치 외에 세면기 등의 토수구공간 확보가 있으며, 급수관과 오수·배수관이 직접 연결되는 크로스커넥션을 방지해야 한다. 자기사이펀작용은 S트랩에 주로 발생하며 통기관 을 설치하여 방지한다.","⑤) 대변기 세정급수방식별 최소 급수관경 크기는 세정벨브식(25mm)> 하이탱크식(10mm)= 로우탱크식(10mm) 순이며, 최소 세정관경 크기는 로우탱크식(50mm)> 하이탱크식(32mm)> 세정벨브식(25mm) 순이다. 공통) 대변기 세정방식 중 사이펀제트식은 유수면이 넓고 봉수가 깊어 가장 우수한 방식이며 주택·호텔에 쓰인다 수의 여과과정에서 고형물 또는 이형물을 제거하기 위함이다 ※ 문제 내 현행 기준 상 과거 용어: 없음","ans":false,"mark":"O","note":"","rnd":[23,25],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 없음","SS(Suspended Solids)는 오수 중에 부유하고 있는 부유물질(부유성 고형물)의 양을 나타낸다 오수 내에 용해되어 있는 산소의 양인 용존산소량을 나타내는 용어는 DO(Dissolved Oxygen)이다.","합류식 하수관로는 오수와 하수도로 유입되는 빗물 및 지하수가 단일 관로를 통해 함께 흐르도록 시공된 하수관로를 의 미한다.","부패탱크방식 정화조의 산화조에서는 살수여상 등의 방식을 적용하여 호기성 미생물(호기성균)의 작용으로 오수 중의 유 기물을 분해 및 정화한다.","BOD(생화학적 산소요구량)는 오수 중의 유기물질이 호기성 미생물에 의해 생화학적으로 산화 및 분해될 때 소비되는 산 소의 양을 나타낸다","오수처리시설 전처리 단계에 설치되는 스크린은 오수의 여과 과정에서 협잡물 대형 고형물 또는 이형물을 제거하여 후 속 이송 펌Ⅱ 및 기계 설비의 막힘과 고장을 방지한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"SS(Suspended Solids)는 오수 중에 부유하고 있는 부유물질(부유성 고형물)의 양을 나타낸다 오수 내에 용해되어 있는 산소의 양인 용존산소량을 나타내는 용어는 DO(Dissolved Oxygen)이다","terms":[],"extra":["①) SS는 오수 중 함유된 입자지름 2mm 이하의 불용성 부유물질을 나타내며 SS 중 가벼워서 표면 위로 떠오르는 오물 찌 꺼기를 스컴이라 한다","②) 분류식 하수관로는 오수와 빗물·지하수가 각각 구분되어 흐르도록 설치하는 하수관로이다","③) 산화조 용량은 부패조 용량의 1/2 이상으로 하고, 밑면은 소독조를 향해 1/100 내림구배를 둔다.","④) BOD제거율은 (유입수BOD– 유출수BOD) /i 유입수BOD 공식으로 산정하며 제거율이 높을수록 정화조 성능이 우수하다. 공통) 부패탱크식 정화조의 처리순서는 부패조(험기성균)→ 여과조→ 산화조(호기성균)→ 소독조 순이다. 오수처리시설의 처리순서는 스크린→ 유량조정조→ 폭기조→ 침전조→ 방류 순이다 COD는 화학적 산소요구량으로 미생물이 살 수 없어 BOD 측정이 불가능한 공장폐수의 유기물 농도를 측정할 때 사용한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 68번","noAns":false,"stemBr":false},{"id":"23-66","round":23,"num":66,"part":"건축설비","unit":"오수정화설비","sub":"하수도법령상 하수관로","type":"mc","stem":"하수도법령상 용어의 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"\"하수\"라 함은 사람의 생활이나 경제활동으로 인하여 액체성 또는 고체성의 물질이 섞이어 오염된 물(이하 \"오수\"라 한 다)을 말하며, 건물, 도로 그 밖의 시설물의 부지로부터 하수도로 유입되는 빗물, 지하수는 제외한다.","ans":true,"mark":"X","note":"","rnd":[20,24,25,28,29],"art":""},{"n":"②","text":"\"하수도\"라 함은 하수와 분뇨를 유출 또는 처리하기 위하여 설치되는 하수관로, 공공하수처리시설 등 공작물, 시설의 총 체를 말한다","ans":false,"mark":"O","note":"","rnd":[20,24,28],"art":""},{"n":"③","text":"“분류식하수관로\"라 함은 오 22,26,27],"art":""},{"n":"④","text":"\"유류화재(B급 화재)\"란 인화성 액체, 가연성 액체, 석유 그리스, 타르, 오일, 유성도료 솔벤트, 래커, 알코올 및 인화성 가스와 같은 유류가 타고 나서 재가 남지 않는 화재를 말한다","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"\"주방화재(C급 화재)\"란 주방에서 동식물유를 취급하는 조리기구에서 일어나는 화재를 말한다 주방화재에 대한 소화기 의 적응 화재별 표시는 'C'로 표시한다","ans":true,"mark":"X","note":"","rnd":[27],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["의 적응 화재별 표시는 'C'로 표시한다","대형소화기는 화재 시 사람이 운반할 수 있도록 운반대와 바퀴가 설치되어 있고 능력단위가 A급 10단위 이상, B급 20단 위 이상인 소화기를 의미한다.","소형소화기는 능력단위가 1단위 이상이고 대형소화기의 능력단위 미만인 소화기를 의미한다","주거용 주방자동소화장치는 주거용 주방에 설치된 열발생 조리기구의 사용으로 인한 화재 발생 시 열원(전기 또는 가스) 을 자동으로 차단하며 소화약제를 방출하는 소화장치를 의미한다","유류화재(B급 화재)는 인화성 액체, 가연성 액체, 석유 그리스, 타르, 오일, 유성도료 솔벤트, 래커, 알코올 및 인화성 가 스와 같은 유류가 타고 나서 재가 남지 않는 화재를 의미한다.","주방에서 동식물유를 취급하는 조리기구에서 일어나는 화재는 K급 화재(주방화재)이며, 주방화재에 대한 소화기의 적응 화재별 표시는 K로 표시한다. C급 화재는 전류가 흐르고 있는 전기기기 등에서 발생하는 전기화재를 의미한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"주방에서 동식물유를 취급하는 조리기구에서 일어나는 화재는 K급 화재(주방화재)이며, 주방화재에 대한 소화기의 적응 화재별 표시는 K로 표시한다.","terms":[],"extra":["①) 수동식 소화기는 바닥으로부터 높이 1.5m 이하에 설치하며 특정소방대상물의 각 부분으로부터 소형소화기는 보행거리 20m 이내, 대형소화기는 보행거리 30m 이내가 되도록 배치한다 공동주택의 소화기 설치기준은 바닥면적 100m²마다 1단위 이상의 능력단위를 기준으로 설치한다.","③) 주거용 주방자동소화장치의 가스 탐지부는 공기보다 가벼운 가스(LNG) 사용 시 천장면으로부터 30cm 이하, 공기보다 무거운 가스(LPG) 사용 시 바닥면으로부터 30cm 이하의 위치에 설치하고, 수신부는 사용자가 상시 볼 수 있는 장소에 설치 한다 공통) 화재 종류별 표시 색상은 A급(일반화재) 백색, B급(유류화재) 황색, C급(전기화재) 청색, D급(금속화재) 회색 또는 은 색이다 자동소화장치에는 주거용 주방자동소화장치 가스자동소화장치 분말자동소화장치 등이 있다. 소방시설 자체점검 시 점검인력 1단위가 하루 동안 점검할 수 있는 아파트 세대수는 종합점검과 작동점검에 관계없이 250 세대이다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 68번","noAns":false,"stemBr":false},{"id":"24-78","round":24,"num":78,"part":"건축설비","unit":"소방설비","sub":"소방시설의 분류 및 경보/소화설비","type":"mc","stem":"옥내소화전설비의 화재안전기준상 옥내소화전설비에 관한 내용으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[{"mk":"ㄱ","tx":"옥내소화전설비의 수원은 그 저수량이 옥내소화전의 설치개수가 가장 많은 층의 설치개수(2개 이상 설치된 경우에는 2 개)에 2.6m³(호스릴옥내소화전설비를 포함한다)를 곱한 양 이상이 되도록 하여야 한다."},{"mk":"ㄴ","tx":"옥내소화전 송수구의 설치높이는 바닥으로부터의 높이 1.5 m에 설치하여야 한다."},{"mk":"ㄷ","tx":"고가수조란 소화용수와 공기를 채우고 일정압력 이상으로 가압하여 그 압력으로 급수하는 수조를 말한다."},{"mk":"ㄹ","tx":"옥내소화전함의 상부 또는 그 직근에 설치하는 가압송수장치의 기동을 표시하는 표시등은 적색등으로 한다."}],"letters":true,"combo":false,"choices":[{"n":"①","text":"ㄴ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄱ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"ㄱ, ㄹ","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["옥내소화전설비 설치 기준은 다음과 같다.","ㄱ. 옥내소화전설비의 수원은 옥내소화전이 가장 많이 설치된 층의 설치 개수(2개 이상인 경우 2개)에 2.6m³를 곱한 양 이 상 확보해야 하므로 옳은 내용이다.","ㄴ. 옥내소화전 송수구의 설치 높이는 바닥으로부터 높이 0.5 m 이상 1 m 이하의 위치에 설치해야 하므로 1.5 m에 설치 해야 한다는 설명은 옳지 않다.","ㄷ. 소화용수와 공기를 채우고 일정 압력 이상으로 가압하여 그 압력으로 급수하는 수조는 압력수조이다 고가수조는 구조 물이나 지형지물 등에 설치하여 고저차에 따른 낙차압력으로 급수하는 수조를 의미하므로 옳지 않다.","ㄹ. 옥내소화전함의 상부 또는 그 직근에 설치하여 가압송수장치의 작동 여부를 나타내는 기동표시등은 적색등으로 설치해야 하므로 옳은 내용이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ, ㄹ","terms":[],"extra":["ㄱ.) 옥내소화전 수원의 저수량은 20분간 방사량 기준이며 호스 구경 및 가지배관 구경은 40mm(호스릴 25mm), 수직주배관 구경은 50mm(호스릴 32mm) 이상으로 한다. 연결송수관설비 배관과 겸용 시 주배관 구경은 100mm 이상, 방수구 연결 가지관 은 65mm 이상이어야 한다.","ㄴ. ) 옥내소화전 방수구 높이는 바닥으로부터 1.5m 이하이며 특정소방대상물의 각 부분으로부터 하나의 방수구까지의 수평 거리는 25m 이하가 되도록 설치한다. 표준방수량은 130L/min 이상, 방수압력은 0.17MPa 이상 0.7MPa 이하를 유지해야 한다","ㄷ. ) 가압송수장치에는 고가수조 압력수조, 가압수조 펌프방식이 있다. 기동용수압개폐장치인 압력챔비 용량은 100L 이상 이어야 하며 배관 내 압력변동을 감지하여 펌프를 자동 기동·정지시킨다. 충압펌프는 배관 내 압력손실 시 주펌프의 빈번한 기동을 방지한다.","ㄹ. ) 기동표시등과 발신기 위치표시등은 적색으로 설치한다 옥내소화전 펌Ⅱ 성능은 체절운전 시 정격토출압력의 140%를 초과하지 않고, 정격토출량 150% 운전 시 정격토출압력의 65% 이상이어야 하며 수온 상승 방지를 위해 순환배관을 설치한 다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 78번","noAns":false,"stemBr":false},{"id":"25-74","round":25,"num":74,"part":"건축설비","unit":"소방설비","sub":"소방시설의 분류 및 경보/소화설비","type":"mc","stem":"다음은 옥내소  및 수원 확보 기준은 다음과 같다. 폐쇄형스프링클러헤드를 사용하는 아파트 등의 경우 헤드 1개당 방수량 80 L/min에 20분간 방수할 수 있는 방수량 1.6 m³를 적용한다 아파트 등의 세대 내 스프링클러헤드 기준개수는 10개로 규정되어 있으므로, 필요한 수원의 양은 기준개수 10개에 1.6m³를 곱한 16m³ 이상이어야 한다. 다만, 아파트 등의 각 동이 지하주차장 등으로 서로 연결된 구조인 경우, 화재 확산 가능성이 높은 해당 주차장 부분에 적 용하는 스프링클러헤드의 기준개수는 30개이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ: 10, ㄴ: 1.6, ㄷ: 30","terms":[],"extra":["ㄱ.) 공동주택 세대 내 거실에는 신속한 감지와 방수를 위하여 조기반응형 스프링클러헤드를 설치한다 L.) 스프링클러 방수압력은 0.1MPa 이상 1.2MPa 이하 기준을 적용한다 C.) 스프링클러헤드까지의 수평거리는 아파트 세대 내 2.6m 이하, 내화구조 건축물 2.3m 이하를 적용한다. 공통) 옥내소화전설비 수원의 유효저수량은 최다 설치 층 설치개수(최대 2개)에 2.6m³를 곱하여 산정한다 드렌처설비 수원의 저수량은 설치개수에 1.6m³를 곱하여 산정하며 인접 건물 화재 시 수막을 형성하여 연소를 방지한다. 스프링클러 배관 방식 중 건식은 2차측 배관에 압축공기 또는 질소가스를 충수하여 동파를 방지하며 준비작동식은 2차측에 대기압 공기를 채우고 감지기 신호로 벨브를 개방한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 72번","noAns":false,"stemBr":false},{"id":"29-69","round":29,"num":69,"part":"건축설비","unit":"소방설비","sub":"소방시설의 분류 및 경보/소화설비","type":"mc","stem":"공동주택의 화재안전기술기준상 소방시설에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"거실에 설치하는 스프링클러설비는 표준반응형 스프링클러헤드를 설치해야 한다.","ans":false,"mark":"X","note":"","rnd":[22,26,27,28],"art":""},{"n":"②","text":"복층형 구조인 경우에는 출입구가 없는 층에 자동화재탐지설비의 감지기를 설치하지 아니할 수 있다.","ans":false,"mark":"X","note":"","rnd":[20,22,23,24,25,26],"art":""},{"n":"③","text":"갓복도식 공동주택에는 피난기구를 설치하지 않을 수 있다.","ans":true,"mark":"O","note":"","rnd":[20,21,22,24,25],"art":""},{"n":"④","text":"아파트등의 용도로 사용되는 층의 연결송수관설비 방수구는 쌍구형으로만 설치한다.","ans":false,"mark":"X","note":"","rnd":[20,21,22,23,25,26,27,28],"art":""},{"n":"⑤","text":"아파트등의 세대 내 스프링클러헤드를 설치하는 천장, 반자, 천장과 반자사이, 덕트, 선반등의 각 부분으로부터 하나의 스프링클러헤드까지의 수평거리는 3.6m 이하로 해야 한다.","ans":false,"mark":"X","note":"","rnd":[20,21,23,24,25,26,27,28],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["스프링클러헤드까지의 수평거리는 3.6m 이하로 해야 한다.","공동주택의 거실(침실 포함)에 설치하는 스프링클러헤드는 화재 초기 신속한 감지 및 소화를 위하여 조기반응형 스프링 클러헤드로 설치해야 한다.","복층형 구조인 공동주택의 경우에는 화재 감지의 실효성을 확보하기 위해 출입구가 없는 층이라 하더라도 각 층마다 감 지기를 설치해야 한다.","갓복도식 공동주택은 외부로 개방된 복도를 통해 수평 피난 및 연기 배출이 원활한 구조적 특성이 있어 피난기구 설치 면제 대상에 해당한다","아파트등의 용도로 사용되는 층에 설치하는 연결송수관설비의 방수구는 소화 활동 시의 편의성을 고려하여 단구형으로 설치할 수 있다.","아파트등 세대 내에 설치하는 스프링클러헤드는 천장·반자 등의 각 부분으로부터 하나의 헤드까지의 수평거리를 2.6 m 이하로 시공해야 한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["⑤)아파트 세대 내 스프링클러헤드까지의 수평거리는 2.6m 이하이다 단, 유효반경에 대한 소방청 인정 또는 성능인증을 받 은 헤드를 사용하는 경우 3.2m 이하이다. 공통) 공동주택 세대 내 거실에는 조기반응형 스프링클러헤드와 함께 연기감지기를 설치한다. 스프링클러설비의 방수압력은 0.1MPa 이상 1.2MPa 이하이고, 표준방수량은 80L/min 이상이다. 공동주택 폐쇄형 스프링클 러의 수원은 기준개수 10개(주차장 연결 구조 시 해당 주차장은 30개)에 1.6m³를 곱한 양 이상으로 확보한다 연결송수관설비의 송수구 위치는 지면으로부터 0.5m 이상 1m 이하에 구경 65mm 쌍구형으로 설치하고 주배관 구경은 100 mm 이상으로 한다. 펌프 토출량은 2400L/min 이상이어야 하며, 계단식 아파트는 1200L/min 이상으로 한다. 공동주택의 소화기 설치기준은 바닥면적 100m마다 1단위 이상이며 자체점검 시 점검인력 1단위의 1일 점검 아파트 세대 수는 250세대이다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 69번","noAns":false,"stemBr":false},{"id":"29-70","round":29,"num":70,"part":"건축설비","unit":"소방설비","sub":"소방시설의 분류 및 경보/소화설비","type":"mc","stem":"소방시설 설치 및 관리에 관한 법령상 경보설비에 해당하지 않는 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"화재알림설비","ans":false,"mark":"O","note":"화재알림설비는 화재 발생 시 생성되는 열, 연기 또는 불꽃을 감지하여 감지기, 발신기, 수신기 등을 통해 화재 발생 사 실을 관계인이나 건물 거실자에게 알리거나 소방관서에 통보하는 경보설비로 분류된다","rnd":[22],"art":""},{"n":"②","text":"통합감시시설","ans":false,"mark":"O","note":"통합감시시설은 주요 소방시설의 작동 상태, 감지 신호, 수신기 정보 등을 중앙 제어 공간에서 통합적으로 모니터링하고 제어할 수 있는 시스템으로 경보설비로 분류된다","rnd":[],"art":""},{"n":"③","text":"무선통신보조설비","ans":true,"mark":"X","note":"무선통신보조설비는 화재 발생 시 지하시설물 터널, 고층건물의 무선통신 음영지역에서 소방대원의 원활한 소화활동 및 인명구조활동을 지원하기 위한 누설동축케이블, 무선기기 접속단자 등으로 구성된 소화활동설비로 분류된다.","rnd":[22,26],"art":""},{"n":"④","text":"자동화재탐지설비","ans":false,"mark":"O","note":"자동화재탐지설비는 화재 초기에 발생하는 열, 연기, 불꽃 등을 감지하여 수신기에 전송하고 벨이나 사이렌 등의 음향장 치 및 시각경보기를 통해 화재 발생을 즉시 경보하는 대표적인 경보설비로 분류된다","rnd":[20,22],"art":""},{"n":"⑤","text":"자동화재속보설비","ans":false,"mark":"O","note":"자동화재속보설비는 자동화재탐지설비 등과 연동되어 화재 발생 신호를 감지했을 때 관계인의 개입 없이 소방관서에 화 재 발생 위치 및 상황을 통신망을 통해 자동으로 통보하는 경보설비로 분류된다","rnd":[22],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"무선통신보조설비는 화재 발생 시 지하시설물 터널, 고층건물의 무선통신 음영지역에서 소방대원의 원활한 소화활동 및 인명구조활동을 지원하기 위한 누설동축케이블, 무선기기 접속단자 등으로 구성된 소화활동설비로 분류된다","terms":[],"extra":["③) 무선통신보조설비는 소화활동설비에 해당하며 소화활동설비의 종류에는 제연설비 연결송수관설비 연결살수설비, 연소방지설비, 비상콘센트설비, 무선통신보조설비가 있다.","④) 경보설비인 자동화재탐지설비의 감지기는 열감지기(정온식, 차동식, 보상식)와 연기감지기(광전식, 이온화식)로 구분한다. 발신기는 층마다 수평거리 25m 이하가 되도록 설치하고, 조작스위치 높이는 바닥으로부터 0.8m 이상 1.5m 이하로 한다. 발신기의 적색 위치표시등은 부착면으로부터 15° 이상 범위 안에서 10m 이내의 어느 곳에서도 식별 가능해야 한다. 공통) 경보설비에는 자동화재탐지설비, 자동화재속보설비, 비상경보설비, 비상방송설비, 가스누설경보기, 누전경보기, 단독경 보형감지기, 시각경보기가 있다. 누전경보기는 경계전로 정격전류가 60A를 초과할 때 1급을 설치한다. 비상방송설비 확성기 음성입력은 3W 이상(실내의 경우 1W, 공동주택 실내의 경우 2W 이상)으로 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 70번","noAns":false,"stemBr":false},{"id":"29-71","round":29,"num":71,"part":"건축설비","unit":"소방설비","sub":"소방시설의 분류 및 경보/소화설비","type":"mc","stem":"옥외소화전이 3개 설치되어 있는 경우, 옥외소화전설비 수원의 최소 저수량(m³)은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"2.6","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"5.2","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"7.0","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"7.8","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"14.0","ans":true,"mark":"O","note":"","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["1. 옥외소화전설비 수원의 최소 저수량 산정 기준 옥외소화전설비 수원의 최소 저수량은 옥외소화전 설치 개수에 7m³를 곱하여 산정하되 설치 개수가 3개 이상인 경우에는 최대 2개를 적용한다 옥외소화전 1개당 표준 토출량 350 L/min으로 20분 동안 방수할 수 있는 수량인 7,000 L(7m³)를 기준으로 한다.","2. 최소 저수량 산정 옥외소화전이 3개 설치되어 있으므로 산정 기준에 따라 최대 개수인 2개를 적용한다. 따라서 수원의 최소 저수량은 다음과 같이 계산한다 최소 저수량= 2개× 7m³= 14m³(14.0m³)"],"cites":[],"citeLabel":"관련 조문","citeFirs ":"송풍기, 환기설비 및 실내공기질","type":"mc","stem":"150세대인 신축공동주택에 기계환기설비를 설치하고자 한다. 설치기준에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"적정 단계의 필요 환기량은 세대를 시간당 0.5회로 환기할 수 있는 풍량을 확보하여야 한다.","ans":false,"mark":"O","note":"","rnd":[25,28],"art":""},{"n":"②","text":"기계환기설비의 환기기준은 시간당 실내공기 교환횟수로 표시하여야 한다.","ans":false,"mark":"O","note":"","rnd":[25,28],"art":""},{"n":"③","text":"기계환기설비는 주방 가스대 위의 공기배출장치, 화장실의 공기배출 송풍기 등 급속 환기 설비와 함께 설치할 수 있다.","ans":false,"mark":"O","note":"","rnd":[24,25,28],"art":""},{"n":"④","text":"기계환기설비의 각 부분의 재료는 충분한 내구성 및 강도를 유지하여 작동되는 동안 구조 및 성능에 변형이 없도록 하여 야 한다.","ans":false,"mark":"O","note":"","rnd":[25,28],"art":""},{"n":"⑤","text":"하나의 기계환기설비로 세대 내 2 이상의 실에 바깥공기를 공급할 경우의 필요 환기량은 각 실에 필요한 환기량의 평균 이상이 되도록 하여야 한다.","ans":true,"mark":"X","note":"","rnd":[25,28],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["신축 공동주택에 설치하는 기계환기설비는 세대를 시간당 0.5회로 환기할 수 있는 필요 환기량을 확보해야 한다.","기계환기설비의 환기기준은 시간당 실내공기 교환횟수로 나타낸다","기계환기설비는 주방 가스대 위의 공기배출장치, 화장실의 공기배출 송풍기 등 급속 환기 설비와 함께 설치할 수 있다","기계환기설비의 각 부분에 사용되는 재료는 충분한 내구성 및 강도를 유지하여 작동하는 동안 구조 및 성능에 변형이 없어야 한다.","하나의 기계환기설비로 세대 내 2개 이상의 실에 바깥공기를 공급할 경우 필요 환기량은 각 실에 필요한 환기량의 합계 이상이 되도록 설치해야 한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"하나의 기계환기설비로 세대 내 2개 이상의 실에 바깥공기를 공급할 경우 필요 환기량은 각 실에 필요한 환기량의 합계 이상이 되도록 설치해야 한다","terms":[],"extra":["⑤) 하나의 기계환기설비로 세대 내 2 이상의 실에 바깥공기를 공급할 경우의 필요 환기량은 각 실에 필요한 환기량의 합계 이상이어야 한다. 공통) 신축 또는 리모델링하는 30세대 이상의 공동주택 등은 시간당 0.5회 이상의 환기가 이루어지도록 환기설비를 설치해야 한 다. 환기설비의 정격풍량은 3단계(최소, 적정, 최대)로 조절할 수 있는 체계를 갖추어야 하며, 적정답계의 필요환기량은 세대를 시간당 0.5회로 환기할 수 있는 풍량이다 기계환기설비의 환기기준은 시간당 실내공기 교환횟수로 표시하고 24시간 가동되어야 한다 기계환기설비의 소음은 대표길이 1m에서 측정하여 40dB 이하이어야 한다. 외부에 면하는 공기흡입구와 배기부는 교차오염을 방지하기 위하여 1.5m 이상의 이격거리를 확보하거나 방향이 90° 이상이 되도록 해야 한다. 열회수형 환기장치를 설치할 경우 유효환기량이 표시용량의 90% 이상이어야 한다. 신축공동주택 실내공기질 권고기준은 폼알데하이드 210ug/m³ 이하, 벤젠 30µg/m³ 이하, 톨루엔 1000ug/m³ 이하, 라돈 148Bq/m³ 이하이다."],"pdf":[],"boxes":[],"d  대한 최대수요전력의 백분율을 수용률이라 한다","④) 교류의 전압구분은 저압이 1,000V 이하, 고압은 1,000V 초과 7,000V 이하, 특고압은 7,000V 초과이다.","⑤) 역률개선용 콘덴서를 부하와 병렬로 설치하면 전압강하 경감, 전기요금 경감, 설비용량의 여유분 증가, 배전선 및 변압기의 전력손실 경감 효과가 얻어진다 공통) 전선의 굵기 결정 요소는 허용전류, 전압강하 기계적 강도이다 주택용 분전반은 신발장 등 은폐된 장소를 제외하고 노출된 장소에 시설하며 분기회로 1개의 길이는 30m 이하, 회선수는 예비회로 포함 40회선 이내로 한다. 간선 배선방식 중 수지상식은 시설비가 경제적이나 말단 전압강하가 크고, 평행식은 전압강하가 평균화되나 배선이 복잡하고 설비비가 비싸다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 72번","noAns":false,"stemBr":false},{"id":"23-61","round":23,"num":61,"part":"건축설비","unit":"전기 및 수송설비","sub":"수변전설비 용량 및 전기설비 기초","type":"mc","stem":"전기설비기술기준의 판단기준상 전기설비에 관한 내용으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"저압 옥내간선은 손상을 받을 우려가 없는 곳에 시설한다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"②","text":"주택용 분전반은 노출된 장소(신발장, 옷장 등의 은폐된 장소는 제외한다)에 시설한다.","ans":false,"mark":"O","note":"","rnd":[20,21,24,28],"art":""},{"n":"③","text":"전력용 반도체소자의 스위칭 작용을 이용하여 교류전력을 직류전력으로 변환하는 장치를 \"인버터\"라고 한다.","ans":true,"mark":"X","note":"","rnd":[20,28],"art":""},{"n":"④","text":"“분산형전원\"이란 중앙급전 전원과 구분되는 것으로서 전력소비지역 부근에 분산하여 배치 가능한 전원(상용전원의 정전 시에만 사용하는 비상용 예비전원을 제외한다)을 말하며, 신, 재생에너지 발전설비, 전기저장장치 등을 포함한다","ans":false,"mark":"O","note":"","rnd":[20,22,27],"art":""},{"n":"⑤","text":"\"단순 병렬운전\"이란 자가용 발전설비를 배전계통에 연계하여 운전하되 생산한 전력의 전부를 자체적으로 소비하기 위 한 것으로서 생산한 전력이 연계계통으로 유입되지 않는 병렬 형태를 말한다.","ans":false,"mark":"O","note":"","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["한 것으로서 생산한 전력이 연계계통으로 유입되지 않는 병렬 형태를 말한다.","저압 옥내간선은 점검이 용이하고 전선이 기계적 외상이나 기타 손상을 받을 우려가 없는 안전한 장소에 시설한다","주택용 분전반은 화재 발생 시 신속한 조작 및 점검이 가능하도록 노출된 장소에 시설해야 하며, 신발장, 옷장 등 은폐된 장소나 습기가 많은 장소에는 시설하지 않는다","전력용 반도체소자의 스위칭 작용을 이용하여 교류전력을 직류전력으로 변환하는 장치는 컨버터(또는 정류기)이다 인버 터는 직류전력을 교류전력으로 변환하는 장치를 의미한다.","분산형전원은 중앙급전 전원과 구분되어 전력소비지역 부근에 분산하여 배치 가능한 전원을 말하며 신·재생에너지 발전 설비, 전기저장장치(ESS) 등을 포함한다 단, 비상용 예비전원은 제외된다.","단순 병렬운전은 자가용 발전설비를 배전계통에 연계하여 운전하되, 생산한 전력의 전부를 자체적으로 소비하여 생산한 전력이 연계계통으로 역송전(유입)되지 않는 병렬 형태를 의미한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"전력용 반도체소자의 스위칭 작용을 이용하여 교류전력을 직류전력으로 변환하는 장치는 컨버터(또는 정류기)이다 인버 터는 직류전력을 교류전력으로 변환하는 장치를 의미한다","terms":[],"extra":["③) 교류를 직류로 변환할 때 리플성분의 실효값이 10% 이하로 포함된 직류를 리플프리직류라 한다. 상용전원 정전 시 안 정된 교류전력을 공급하는 장치는 무정전전원장치(UPS)이다. 공통) 전압 구분에서 교류는 저압 1000V 이하, 고압 1000V 초과 7000V 이하, 특고압 7000V 초과이며 직류는 저압 1500V 이 하, 고압 1500V 초과 7000V 이하, 특고압 7000V 초과이다 분전반 분기회로 1개의 길이는 30m 이하, 분기회로 수는 20회선 이하(예비회로 포함 40회선 이내)로 한다. 세대별 전기시 설 용량은 세대당 3kW 이상(60m² 초과 시 초과 10m마다 0.5kW 가산)으로 한다. 전선의 굵기 결정 요소에는 허용전류 전압강하 기계적 강도가 있다. 역률을 개선하기 위해 콘덴서를 부하와 병렬로 설치한 다. 간선 배선방식 중 수지상식은 경제적이나 말단 전압강하가 크고, 평행식은 전압강하가 평균화되나 설비비가 비싸다. 대용량 간선공사에는 버스덕트공사를 적용한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 61번","noAns":false,"stemBr":false},{"id":"22-79","round":22,"num":79,"part":"건축설비","unit":"전기 및 수송설비","sub":"수변전설비 용량 및 전기설비 기초","type":"mc","stem":"공동주택에서 난방설비, 급수설비 등의 제어 및 상태감시를 위해 사용되는 현장제어 장치는?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"SPD","ans":false,"mark":"X","note":"SPD(Surge Protective Device, 서지보호장치)는 낙뢰나 전력 계통 개폐 시 발생하는 이상 과전압으로부터 자동제어 및 전기 전자 기기를 보호하는 장치이다.","rnd":[],"art":""},{"n":"②","text":"PID","ans":false,"mark":"X","note":"PID(Proportional Integral Derivative, 비례적분유도제어)는 제어 목표값과 현재값의 편차를 비례, 적분 미분 연산하여 설비의 온습도 압력, 유량 등을 정밀하게 제어하는 연산 제어 방식이다.","rnd":[],"art":""},{"n":"③","text":"VAV","ans":false,"mark":"X","note":"VAV(Variable Air Volume, 가변풍량장치)는 실내 부하 변동에 맞춰 공급되는 풍량을 조절하여 실내 온습도를 제어하는 공기조화 설비 유낫이다","rnd":[],"art":""},{"n":"④","text":"DDC","ans":true,"mark":"O","note":"DDC(Direct Digital Controller, 직접디지털제어기)는 마이크로프로세서를 내장하여 기계실이나 전기실 등 현장에 설치 되며, 난방 및 급수 설비 등의 센서 신호를 받아 상태를 감시하고 조작기를 직접 제어하는 현장제어장치이다","rnd":[],"art":""},{"n":"⑤","text":"VVVF","ans":false,"mark":"X","note":"VVVF(Variable Voltage Variable Frequency, 가변전압가변주파수)는 교류 전동기에 공급되는 전압과 주파수를 변환시 켜 모터의 회전 속도를 효율적으로 제어하는 제어 방식이다.","rnd":[],"art":""}],"short":fal ":"①","text":"금속관 공사는 철근콘크리트 구조의 매립공사에 사용된다","ans":false,"mark":"O","note":"금속관 공사는 기계적 강도가 높고 내화성이 우수하여 철근콘크리트 구조의 매립공사 및 노출공사에 광범위하게 적용된 다.","rnd":[20,22,23,26,27,29],"art":""},{"n":"②","text":"합성수지관 공사는 옥내의 점검할 수 없는 은폐장소에도 사용이 가능하다","ans":false,"mark":"O","note":"합성수지관 공사는 절연성이 우수하고 내식성이 높아 건조한 장소, 습기가 있는 장소뿐만 아니라 옥내의 점검할 수 없는 은폐장소(벽체 내부, 천장 속 매립 등)에도 설치할 수 있다.","rnd":[],"art":""},{"n":"③","text":"버스 덕트 공사는 공장, 빌딩 등에서 비교적 큰 전류가 통하는 간선을 시설하는 경우에 사용된다.","ans":false,"mark":"O","note":"버스덕트 공사는 대용량 전력 전송에 적합한 구조로 제작되어 공장, 대형 빌딩, 백화점 등에서 비교적 큰 전류가 흐르는 간선을 시설하는 경우에 사용된다","rnd":[20,25,26,28],"art":""},{"n":"④","text":"금속 몰드 공사는 매립공사용으로 적합하고 기계실 등에서 전동기로 배선하는 경우에 사용된다.","ans":true,"mark":"X","note":"금속몰드 공사는 점검이 가능한 노출장소의 건조한 장소에 주로 사용되며 매립공사에는 사용할 수 없다. 또한 기계실 등 진동이 발생하거나 전동기 연결부와 같이 굴곡성이 요구되는 배선에는 금속제 가요전선관 공사 등이 적용된다.","rnd":[20,22,25,26,27,28,29],"art":""},{"n":"⑤","text":"라이팅 덕트 공사는 화랑의 벽면조명과 같이 광원을 이동시킬 필요가 있는 경우에 사용된다.","ans":false,"mark":"O","note":"라이팅덕트 공사는 덕트 내부 전도체에 라이팅 플러그를 연결하여 전력을 공급하는 방식으로 화랑, 미술관 쇼원도 등 조명기구(광원)의 위치를 수시로 이동 및 변경해야 하는 장소에 사용된다","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"금속몰드 공사는 점검이 가능한 노출장소의 건조한 장소에 주로 사용되며 매립공사에는 사용할 수 없다.","terms":[],"extra":["①) 금속관공사는 전선의 인입 및 교체가 용이하고 기계적 충격에 강하다 전선의 굵기를 결정하는 3대 요소는 허용전류, 전압강하 기계적 강도이다","②) 합성수지관공사는 절연성과 내식성이 우수하나 열과 기계적 충격에 약하다 옥내 점검할 수 없는 은폐장소에는 사용이 불가능하다","③) 간선의 배선방식 중 수지상식은 시설비가 경제적이나 말단 전압강하와 사고 파급효과가 크고, 평행식은 전압강하가 평균화되나 배선이 복잡하고 설비비가 비싸다","④) 건조한 콘크리트 바닥에 매입하여 사용하는 배선공사에는 플로어덕트공사가 쓰인다 배선 중 발생하는 전력손실은 전압강하의 제곱에 비례한다","⑤) 건축화조명 중 코브라이트는 천장면에 반사시키는 간접조명 방식이며, 코니스라이트는 벽면으로 빛을 보내는 방식이다. 광원 효율은 나트륨등이 가장 높고 백열등이 가장 낮다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 76번","noAns":false,"stemBr":false},{"id":"26-80","round":26,"num":80,"part":"건축설비","unit":"전기 및 수송설비","sub":"배선공사, 접지/피뢰 및 도시기호","type":"mc","stem":"전기 배선 기호 중 지중매설 배선을 나타낸 것은? (그림 ①~⑤는 배선 기호를 나타낸다)","intro":[],"tables":[],"img":"data:image/ :"X","note":"실선(————)은 천장 내부에 배선을 숨겨 시공하는 천장은폐배선을 나타낸다.","rnd":[],"art":""},{"n":"②","text":"점선 (········)","ans":false,"mark":"X","note":"점선(········)은 바닥 마감재 내부나 슬래브 내부에 배선을 숨겨 시공하는 바닥은폐배선을 나타낸다.","rnd":[],"art":""},{"n":"③","text":"파선 (--------- -)","ans":false,"mark":"X","note":"파선(- - - -)은 천장이나 벽체 표면에 배선 및 배관을 노출시켜 시공하는 천장노출배선을 나타낸다.","rnd":[],"art":""},{"n":"④","text":"일점쇄선 (—·—·—)","ans":true,"mark":"O","note":"일점쇄선(—·—·—)은 지중에 배선관을 매설하여 전력을 공급하는 지중매설배선을 나타낸다.","rnd":[],"art":""},{"n":"⑤","text":"이점쇄선 (—··—··—)","ans":false,"mark":"X","note":"이점쇄선(—··—··—)은 신호용 배선, 제어용 배선, 바닥 용선용 배선 등 특수 목적의 배선을 나타낸다.","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"일점쇄선(—·—·—)은 지중에 배선관을 매설하여 전력을 공급하는 지중매설배선을 나타낸다","terms":[],"extra":["①) 천장은폐 등에 적용되는 금속관공사는 매립공사에 적합하며 전선 인입 및 교체가 용이하고 기계적 충격에 강하다","②) 바닥은폐 시 활용되는 플로어덕트공사는 건조한 콘크리트 바닥에 매입하여 사용하는 배선공사이다","③) 노출배선 등에 쓰이는 합성수지관공사는 절연성과 내식성이 우수하나 열과 기계적 충격에 약하며 옥내 점검할 수 없는 은폐장소에는 사용이 불가능하다","⑤) 대용량 전류가 통하는 간선공사에는 버스덕트공사를 사용한다 공통) 간선의 배선방식 중 수지상식은 시설비가 경제적이나 말단 전압강하가 크고, 평행식은 전압강하가 평균화되나 설비비 가 비싸다 전선 굵기 결정 요소는 허용전류 전압강하 기계적 강도이며 분전반 분기회로 1개 길이는 30m 이하로 한다."],"pdf":[],"boxes":[{"head":"검수 보완","body":"지중매설 배선은 일점쇄선(—·—·—)으로 표시합니다(정답 ④).","html":false}],"diff":"하","roundLabel":"제26회 80번","noAns":false,"stemBr":false},{"id":"28-77","round":28,"num":77,"part":"건축설비","unit":"전기 및 수송설비","sub":"배선공사, 접지/피뢰 및 도시기호","type":"mc","stem":"옥내 배선 설비의 명칭과 도시 기호의 연결로 옳은 것은? (그림 ①~⑤는 명칭과 그 도시기호의 연결을 나타낸다)","intro":[],"tables":[],"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAB1BLADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZ ],"short":false,"ansText":"③","blanks":[],"core":"","paras":["광도는 특정 방향으로 발산되는 빛의 세기를 의미하며 단위는 칸델라(cd)를 사용한다 광원에서 발산하는 빛의 총량은 광속이며 단위는 루멘(lm)이다.","연색지수(Ra)는 태양광 아래에서 물체의 색이 보이는 충실도를 나타내는 지표로 물체의 색깔이 태양광 아래에서 보이는 색과 동일하게 인식될 경우 연색지수는 Ra 100이다.","밝은 곳에서 어두운 곳으로 들어갈 때 동공이 확대되고 망막의 감광도가 점차 높아져 시각이 적응하는 현상을 암순응이 라고 한다.","메탈할라이드등은 수은등의 발광관 내에 금속 할로겐 화합물을 첨가하여 개선한 광원으로 수은등에 비해 발광효율과 연 색성이 모두 크게 높다.","코브조명은 광원을 천장이나 벽체 상부의 건축적 구조물 내부에 숨겨 천장면으로 빛을 투사한 뒤 반사광으로 실내를 밝 히는 대표적인 간접조명 방식이다. [추가학습]",") 조도 단위는 lx, 휘도 단위는 cd/m, 광속발산도 단위는 lm/m를 사용한다",") 광원별 효율 크기는 나트륨등> 메탈할라이드등> 형광등> 수은등> 할로겐등> 백열등 순이다",") 건축화조명 중 코니스라이트는 벽면으로 빛을 보내는 조명 방식이다 공통) 감광보상률은 보수율(유지율)의 역수인 1/ 보수율이다 조도 계산식은 (조명를× 조명개수× 광속)÷ (감광보상률× 면적)을 적용한다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"밝은 곳에서 어두운 곳으로 들어갈 때 동공이 확대되고 망막의 감광도가 점차 높아져 시각이 적응하는 현상을 암순응이 라고 한다","terms":[],"extra":[],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 80번","noAns":false,"stemBr":false},{"id":"28-76","round":28,"num":76,"part":"건축설비","unit":"전기 및 수송설비","sub":"조명설비 및 광속법 계산","type":"mc","stem":"조명에 관한 내용으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"상시인공보조조명(PSALI)은 전반조명과 국부조명을 조합하여 조명 효율성을 높인 방식이다.","ans":false,"mark":"X","note":"상시인공보조조명(PSALI)은 주광(자연채광)에 의한 실내 조도가 부족한 주간 작업 공간에 인공조명을 보조적으로 상시 병용하여 적정 조도를 확보하는 방식이다. 전반조명과 국부조명을 조합하여 조명 효율을 높인 방식은 국부보조 전반조명방 식(TAL) 또는 조합조명 방식이다.","rnd":[20,26],"art":""},{"n":"②","text":"광원이 발광하는 빛의 색을 온도로 나타낸 것이 색온도이며 빨간색은 파란색에 비해 색온도가 높다.","ans":false,"mark":"X","note":"색온도는 광원이 발광하는 빛의 색을 절대온도(K)로 나타낸 지표이다 붉은색 계열의 빛은 색온도가 낮고, 푸른색 계열의 빛은 색온도가 높다. 따라서 빨간색은 파란색에 비해 색온도가 낮다.","rnd":[20],"art":""},{"n":"③","text":"광원의 연색성이 낮을수록 태양광선에 더욱 가까운 분광분포를 갖는다","ans":false,"mark":"X","note":"광원의 연색성은 물체의 색을 본래 모습대로 재현하는 성질이다. 연색성이 높을수록 태양광선(자연광)에 가까운 분광분포 를 가지며 물체 본래의 색을 정확히 나타낸다","rnd":[20,27],"art":""},{"n":"④","text":"조명률은 광원의 총광속을 조명 작업면에 도달하는 광속으로 나눈 것이다","ans":false,"mark":"X","note":"조명률은 광원에서 방출되는 총광속 중 작업면에 실제로 도달하는 유효 광속의 비율을 의미한다. 즉, 작업면에 도달하는 광속을 광원의 총광속으로 나누어 산정한다","rnd":[20,24,26,29],"art":""},{"n":"⑤","text":"눈부심(glare)은 높은 휘도의 광원에 의해 시각적 불쾌감 등이 유발되는 현상이다","ans":true,"mark":"O","note":"눈부심(glare)은 시야 내에 한계 이상의 높은 휘도를 가진 광원이나 반사면이 존재할 때 시각적 불쾌감이나 피로감 등을 유발하는 현상이다.","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"눈부심(glare)은 시야 내에 한계 이상의 높은 휘도를 가진 광원이나 반사면이 존재할 때 시각적 불쾌감이나 피로감 등을 유발하는 현상이다","terms":[],"extra":["④) 조도는 작업면에 도달하는 빛의 밝기를 의미하며 단위는 lx를 사용한다 조도는 조명률 조명개수 광속의 곱을 감광보 상률과 면적의 곱으로 나누어 산정한다 공통) 광속은 광원으로부터 방출되는 빛의 총량이며 단위는 lm을 사용한다 광도는 광원에서 특정 방향으로 나오는 빛의 세기이며 단위는 cd를 사용한다 휘도는 표면의 밝기를 나타내며 단위는 cd/mㄹ 사용한다 광속발산도는 단위면적당 발산하는 광속이며 단위는 lm/m를 사용한다 감광보상률은 보수율의 역수이다 광원별 효율 크기는 나트륨등, 메탈할라이드등 형광등, 수은등 할로겐등, 백열등 순이다. 건축화조명 중 코브라이트는 천장면에 반사시키는 간접조명 방식이고 코니스라이트는 벽면으로 빛을 보내는 방식이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 76번","noAns":false,"stemBr":false},{"id":"29-76","round":29,"num":76,"part":"건축설비","unit":"전기 및 수송설비","sub":"조명설비 및 광속법 계산","type":"mc","stem":"조명설비에 관한 내용으로 옳은 것을 모두 고른 것은? ㄱ. 광속은 빛의 세기이며 단위는 칸델라(cd)를 사용한다. ㄴ. 코브조명은 간접조명을 이용하는 건축화조명의 일종이다. ㄷ. 조명률은 작업면에 도달하는 광속을 광원의 총광속으로 나눈 것이다 ㄹ. 연색지수 Ra가 0에 가까울수록 태양광 아래에서 보이는 색을 재현할 수 있다.","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"ㄱ, ㄴ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄴ, ㄷ","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"ㄱ, ㄴ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄷ, ㄹ","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["ㄱ. 광속은 광원으로부터 방출되는 빛의 총량을 의미하며 단위는 루멘(lm)을 사용한다 빛의 세기를 나타내는 단위는 광도로 서 칸델라(cd)를 사용한다","ㄴ. 코브조명은 천장이나 벽체 상부의 오목한 공간에 광원을 숨기고 천장면이나 벽면으로 빛을 반사시켜 조명하는 대표적인 간접조명 방식의 건축화조명이다","ㄷ. 조명률은 광원에서 발산되는 총 광속에 대하여 실제 작업면에 도달하여 유효 ":["※ 문제 내 현행 기준 상 과거 용어: 과속조절기(현행 용어: 조속기)","완충기는 카, 균형추 또는 평형추가 정해진 행정 범위를 넘어 피트에 하강 충돌할 때 그 충격을 스프링의 탄성력이나 유 체의 저항 등을 이용하여 흡수 및 완화하기 위해 설치하는 안전장치이다","파이널 리미트 스위치는 카가 최상층 또는 최하층의 정지 위치를 넘어 초과 운행하는 것을 방지하기 위해 주회로의 전원을 직접 차단하는 기계적 안전장치이다 전자식으로 운전 중에는 항상 개방되어 있고 정지 시 전원이 차단됨과 동시에 작동 하여 카를 감속 정지시키고 정지 상태를 유지하는 장치는 전자기계 브레이크이다","과부하감지장치는 카 내 적재하중이 정격하중을 초과할 때 경보를 울리고 문이 닫히지 않도록 하여 카의 운행을 정지시 키는 장치이다 정전이나 고장 등으로 승객이 갇혔을 때 외부와 연락을 취하기 위한 장치는 비상통화장치이다.","조속기는 카의 운행 속도가 정격속도를 초과하여 유해한 과속 상태에 도달했을 때 이를 감지하여 전원을 차단하고 비상 지제장치를 작동시키는 장치이다 승강기가 최상층 이상 및 최하층 이하로 운행되지 않도록 초과운행을 방지하는 장치는 리미트 스위치 및 파이널 리미트 스위치이다.","전자기계 브레이크는 동력이 차단되었을 때 카를 감속 정지시키고 정지 상태를 유지하는 브레이크 장치이다 승강기 문 에 승객이나 물건이 끼었을 때 자동으로 다시 열리게 하는 장치는 문닫힘 안전장치(세이프티 슈 또는 도어 센서 등)이다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["②) 파이널리미트스위치는 승강기가 정지 위치를 넘어 초과 운행하는 것을 방지하기 위해 주회로를 차단하는 2차 안전장치 이고, 리미트스위치는 최상층 및 최하층 초과운행을 방지하는 1차 안전장치이다","③) 비상호출장치는 승객 갇힘 시 외부와 연락을 위한 장치이며 도어스위치 및 도어인터록은 승강기 문이 열린 상태에서 카의 운행을 방지하는 안전장치이다","④) 조속기는 승강기 운행 속도가 정격속도를 초과할 때 작동하며 비상정지장치를 작동시켜 카를 강제로 정지시킨다","⑤) 세이프티슈(문닫힘안전장치)는 문에 승객이나 물건이 끼였을 때 자동으로 다시 열리게 하는 장치이다 공통) 승용승강기는 연면적 2,000m² 이상 및 6층 이상 건축물에 설치하고, 높이 31m 초과 시 비상용승강기를 추가 설치한다 비 상용승강기 승강장 바닥면적은 1대당 6m² 이상, 출입구에서 공지까지의 거리는 30m 이하로 한다 승강기의 1인당 하중 기준은 75kg이다. 직류 엘리베이터는 착상오차가 1mm 이하로 고속에 적합하고 교류 엘리베이터는 기동토크가 작고 착상오차가 수mm 이상이 다. 에스컬레이터는 경사도 30° 이하 속도 30m/min 이하로 설치한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 75번","noAns":false,"stemBr":false},{"id":"25-70","round":25,"num":70,"part":"건축설비","unit":"전기 및 수송설비","sub":"수송설비","type":"mc","stem":"승강기, 승강장 및 승강로에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"비상용승강기의 승강로 구조는 각층으로부터 피난층까지 이르는 승강로를 단일구조로 연결하여 설치한다","ans":false,"mark":"O","note":"비상용승강기의 승강로는 각 층으로부터 피난층에 이르는 승강로를 단일구조로 연결하여 설치해야 한다.","rnd":[20,22,24,26],"art":""},{"n":"②","text":"옥내에 설치하는 피난용승강기의 승강장 바닥면적은 승강기 1대당 5m² 이상으로 해야 한다.","ans":true,"mark":"X", /* 자동 별표는 '누적 오답 횟수'에서 바로 계산한다(최대 ★★★).

/* ── 형광펜 ───────────────────────────────────────────────────────── */

/* 형광펜 모드가 켜진 채 선지를 눌렀을 때 — 왜 답이 안 골라지는지 알려 준다 */

function hlStore(id){
  const s = HLS[id];
  return (s && typeof s === 'object' && !Array.isArray(s)) ? s : {};
}
function hlSave(){ writeJSON(LSH, HLS); }
function mergeHL(arr0){
  const a = (arr0 || []).map(r => [Math.max(0, Math.round(Number(r[0]))), Math.max(0, Math.round(Number(r[1])))])
    .filter(r => isFinite(r[0]) && isFinite(r[1]) && r[1] > r[0])
    .sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const out = [];
  a.forEach(r => {
    const last = out[out.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);

    if (offset <= acc + len) return {node: n, off: Math.max(0, offset - acc)};
    acc += len;

}
function unwrapMarks(zone){

  for (let i = rs.length - 1; i >= 0; i--) {
    const s = rs[i][0], e = rs[i][1];
    const a = locateText(zone, s), b = locateText(zone, e);
    if (!a || !b) continue;
    const rg = document.createRange();
    try { rg.setStart(a.node, a.off); rg.setEnd(b.node, b.off); } catch (err) { continue; }

}
function paintAllHL(){

function repaintKey(key){

function addRange(key, s, e){

function hlZoneOf(node){

function hideFloat(){

/* 🖍️ 칠하기 버튼 처리 — touchend 와 click 이 겹쳐도 한 번만 실행한다 */

/* ── 선택·필터 ─────────────────────────────────────────────────────── */
function unitsOfPart(){

function baseFilter(q){
  if (state.part !== '전체' && q.part !== state.part) return false;
  if (state.unit && state.unit !== '전체 단원' && q.unit !== state.unit) return false;
  if (HAS_SUB && state.sub && state.sub !== '전체 세부' && q.sub !== state.sub) return false;

  if (state.view === 'mark') return !!marks[q.id];

    const m = mistakes[q.id] || 0;

    if (m > 0 && !w2(q.id).g) { wrong++; const lv = Math.min(3, m); if (lv === 1) s1++; else if (lv === 2) s2++; else s3++; }

function buildSelectors(){

/* ── 🔢 숫자 전용: 핵심 숫자가 들어 있는 지문만 ──────────────────────────
   기간·비율·면적·금액 같은 함정 숫자만 '핵심 숫자'로 본다.
   조문번호(제12조)·회차(제29회)·항목번호(1))·단위 없는 한 자리 숫자는 세지 않는다. */
const NUM_UNIT = '제곱미터|평방미터|킬로미터|퍼센트|개월|시간|세대|만원|미터|㎡|평|년|월|일|회|층|호|명|km|cm|mm|%|배|원|억|만|천|점|개|곳|대|종|도|주|초|분|톤|kg|리터|ℓ';
const NUM_RE = new RegExp('(\\d[\\d,.]*(?:\\s*분의\\s*\\d[\\d,.]*)?)(\\s*)(' + NUM_UNIT + ')?', 'g');
const NUMCACHE = {};
function numSpans(t){
  const out = [];
  if (!t) return out;
  const re = new RegExp(NUM_RE.source, 'g');
  let m;
  while ((m = re.exec(t))) {
    const tok = m[0].replace(/\s+$/, ''), start = m.index, unit = m[3] || '';
    const digits = m[1].replace(/[^0-9]/g, '');
    const prev = start > 0 ? t.charAt(start - 1) : '';
    const next = t.charAt(start + tok.length);
    if (!digits) continue;
    if (prev === '제') continue;                       // 제12조 · 제29회
    if (!unit && /[조항목]/.test(next)) continue;       // 12조 · 1항
    if (/[.,]\s*$/.test(m[0])) continue;                // 날짜·목록 구분자(2020. 3. 2.)
    if (/^[.,)]/.test(next)) continue;                  // 1) 항목번호
    if (!unit && next === '번') continue;               // 1번
    if (!unit && digits.length < 2) continue;           // 단위 없는 한 자리
    out.push({s: start, e: start + tok.length, tx: tok});
  }
  return out;
}
function hasKeyNum(t){ return numSpans(t).length > 0; }
/* 그 문항에서 '숫자가 든 지문'만 골라낸다(선지 → 없으면 단답 답안) */
function numRows(q){
  if (!q) return [];
  if (NUMCACHE[q.id]) return NUMCACHE[q.id];
  const out = [];
  (q.choices || []).forEach(c => {
    if (c.text && hasKeyNum(c.text))
      out.push({n: c.n, tx: c.text, mk: c.mark || (c.ans ? 'O' : 'X'), ans: !!c.ans});
  });
  if (!out.length && (q.blanks || []).length) {
    q.blanks.forEach((b, i) => {
      if (b && hasKeyNum(b))
        out.push({n: q.blanks.length > 1 ? '빈칸' + (i + 1) : '답', tx: b, mk: '정답', ans: true});
    });
  }
  if (!out.length) {                       // 선지에 숫자가 없으면 해설 핵심 문장에서
    [q.core].concat(q.paras || []).forEach(p => {
      if (p && hasKeyNum(p)) out.push({n: '해설', tx: p, mk: '', ans: false});
    });
  }
  NUMCACHE[q.id] = out;
  return out;
}
function renderNumList(){

  card.classList.add('plain');
  let rows = 0;
  list.forEach(q => { rows += numRows(q).length; });
  if (!list.length) {

      `<div class="wrongwrap">` + list.map(numCard).join('') + `</div>` +

/* 숫자를 회색 상자로 덮는다 — 이 화면(🔢 숫자 전용)에서만 쓴다 */
const MASK_SKIP = 'span.n,mark.user-hl,.b,.mtab,#progtxt,.num,.wtop,.nbtn,.ox,.wlab,.wfoot,.fphead';
function maskOneNode(node){
  const t = node.nodeValue;
  const hits = numSpans(t);
  if (!hits.length) return;
  const frag = document.createDocumentFragment();
  let pos = 0;
  hits.forEach(h => {
    if (h.s > pos) frag.appendChild(document.createTextNode(t.slice(pos, h.s)));
    const b = document.createElement('span');
    b.className = 'n'; b.textContent = h.tx;
    frag.appendChild(b);
    pos = h.e;
  });
  if (pos < t.length) frag.appendChild(document.createTextNode(t.slice(pos)));
  node.parentNode.replaceChild(frag, node);
}
function applyNumMask(root){
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = []; let nd;
  while ((nd = w.nextNode())) {
    const p = nd.parentElement;
    if (!p || p.closest(MASK_SKIP)) continue;
    if (!nd.nodeValue || !/\d/.test(nd.nodeValue)) continue;
    nodes.push(nd);
  }
  nodes.forEach(maskOneNode);
}

/* 전체 PART의 단원을 PART 순서대로 이어 붙인 목록 — PART 경계를 넘어 이동한다 */
function unitSeq(){
  const seen = {}, out = [];
  const push = u => {
    const k = u.part + '\u0001' + u.name;
    if (seen[k]) return;
    seen[k] = 1;
    if (DATA.some(q => q.part === u.part && q.unit === u.name)) out.push(u);
  };
  META.parts.forEach(p => META.units.forEach(u => { if (u.part === p.name) push(u); }));
  META.units.forEach(push);                       // META.parts에 없는 PART의 단원도 뒤에 붙인다
  return out;
}
function countInUnit(u){
  const part = (u && u.part) || state.part;
  const nm = (u && u.name) || u;
  return DATA.filter(q => (part === '전체' || q.part === part) && q.unit === nm && matchView(q)).length;
}

  if (state.view !== 'all' && state.view !== 'wrong' && state.view !== 'mark') return false;
  if (state.unit === '전체 단원') return false;
  const seq = unitSeq();
  const i = seq.findIndex(u => u.name === state.unit && (state.part === '전체' || u.part === state.part));
  if (i < 0) return false;
  for (let j = i + dir; j >= 0 && j < seq.length; j += dir) {
    const u = seq[j];
    if (!countInUnit(u)) continue;
    if (state.part !== '전체') state.part = u.part;
    state.unit = u.name; state.sub = '전체 세부'; state.idx = 0;
    buildSelectors(); rebuild();
    if (dir < 0 && list.length) {              // 이전 단원은 그 단원의 마지막 문제로 들어간다
      cur = list.length - 1; state.idx = cur; save();
      render(); renderGrid(); updateProgress();
    } else save();
    const crossed = seq[i].part !== u.part;
    toast((crossed ? u.part + ' · ' : '') + u.name + (dir > 0 ? ' 첫 문제입니다' : ' 마지막 문제입니다'), 2000);
    window.scrollTo({top: 0, behavior: 'smooth'});
    return true;
  }
  return false;
}
function go(d){

    return (ls >= cs) ? l : c;                          // 결정적 tie-break(두 기기 결과 동일)
  }
  function mergeDocs(L, C){
    var out = {v:1, u:Math.max(L.u || 0, C.u || 0), ans:{}, mis:{}, mk:{}, hl:{}, day:{}, fp:{}, ws:{}};
    var set = {};
    keys(L.ans).forEach(function(k){ set[k] = 1; }); keys(C.ans).forEach(function(k){ set[k] = 1; });
    keys(set).forEach(function(k){
      var l = L.ans[k], c = C.ans[k];
      if (!l) out.ans[k] = c.slice();
      else if (!c) out.ans[k] = l.slice();
      else { var w = winAns(l, c); out.ans[k] = w.slice(); }
    });
    var s2 = {};
    keys(L.mis).forEach(function(k){ s2[k] = 1; }); keys(C.mis).forEach(function(k){ s2[k] = 1; });
    keys(s2).forEach(function(k){ out.mis[k] = Math.max(L.mis[k] || 0, C.mis[k] || 0); });
    /* 🎓 오답 졸업 상태는 '더 최근에 손댄 쪽' 기록을 쓴다(같은 시각이면 진행이 더 많은 쪽) */
    var s2w = {};
    keys(L.ws).forEach(function(k){ s2w[k] = 1; }); keys(C.ws).forEach(function(k){ s2w[k] = 1; });
    keys(s2w).forEach(function(k){
      var l = L.ws[k], c = C.ws[k];
      if (!l) out.ws[k] = c.slice();
      else if (!c) out.ws[k] = l.slice();
      else if ((l[2] || 0) > (c[2] || 0)) out.ws[k] = l.slice();
      else if ((c[2] || 0) > (l[2] || 0)) out.ws[k] = c.slice();
      else out.ws[k] = [ Math.max(l[0] | 0, c[0] | 0), Math.max(l[1] | 0, c[1] | 0), l[2] || 0 ];
    });
    var sfp = {};
    keys(L.fp).forEach(function(k){ sfp[k] = 1; }); keys(C.fp).forEach(function(k){ sfp[k] = 1; });
    keys(sfp).forEach(function(k){
      var l = L.fp[k], c = C.fp[k];
      if (!l) out.fp[k] = c.slice();
      else if (!c) out.fp[k] = l.slice();
      else out.fp[k] = ((l[1] || 0) <= (c[1] || 0)) ? l.slice() : c.slice();   // 가장 처음 고른 쪽
    });
    var s3 = {};
    keys(L.mk).forEach(function(k){ s3[k] = 1; }); keys(C.mk).forEach(function(k){ s3[k] = 1; });
    keys(s3).forEach(function(k){
      var l = L.mk[k], c = C.mk[k];
      if (!l) out.mk[k] = c.slice();
      else if (!c) out.mk[k] = l.slice();
      else if (l[1] > c[1]) out.mk[k] = l.slice();
      else if (c[1] > l[1]) out.mk[k] = c.slice();
      else out.mk[k] = [ Math.max(l[0] || 0, c[0] || 0), l[1] ];
    });
    var s4 = {};
    keys(L.hl).forEach(function(q){ s4[q] = 1; }); keys(C.hl).forEach(function(q){ s4[q] = 1; });
    keys(s4).forEach(function(q){
      var l = L.hl[q] || {}, c = C.hl[q] || {}, o = {};
      var ks = {};
      keys(l).forEach(function(k){ ks[k] = 1; }); keys(c).forEach(function(k){ ks[k] = 1; });
      keys(ks).forEach(function(k){
        var a = l[k], b = c[k];
        if (!a) o[k] = b;
        else if (!b) o[k] = a;
        else if ((a.t || 0) > (b.t || 0)) o[k] = a;
        else if ((b.t || 0) > (a.t || 0)) o[k] = b;
        else o[k] = {r: mergeHL((a.r || []).concat(b.r || [])), t: a.t || 0};
      });
      if (keys(o).length) out.hl[q] = o;
    });
    var s5 = {};
    keys(L.day).forEach(function(d){ s5[d] = 1; }); keys(C.day).forEach(function(d){ s5[d] = 1; });
    keys(s5).forEach(function(d){
      var l = L.day[d] || {}, c = C.day[d] || {}, o = {};
      keys(l).forEach(function(k){ o[k] = l[k] ? 1 : 0; });
      keys(c).forEach(function(k){ o[k] = Math.max(l[k] || 0, c[k] || 0) ? 1 : 0; });
      out.day[d] = o;
    });
    var dks = keys(out.day).sort();
    while (dks.length > 2) delete out.day[dks.shift()];     // 날짜 버킷은 최근 2일만 유지
    return out;
  }

  /* ── 병합 결과를 화면·저장소에 반영 ───────────────────────────────── */
  function applyDoc(doc){
    suppress = true;
    var redraw = false;
    try {
      var a = {}, g = {};
      keys(doc.ans).forEach(function(k){
        var e = doc.ans[k]; if (!e) return;
        meta.w[k] = e[2] || 0;
        if (e[1] === -3) return;                    // 지운 문항(tombstone) — 답·채점 모두 없음
        if (e[0] !== null && e[0] !== undefined) a[k] = e[0];
        if (e[1] === 1) g[k] = true;
        else if (e[1] === 0) g[k] = false;
        else if (e[1] === -1) g[k] = null;
      });
      if (!jEq(a, state.answers) || !jEq(g, state.graded)) redraw = true;
      state.answers = a; state.graded = g;

      var mi = {};
      keys(doc.mis).forEach(function(k){ var n = doc.mis[k] | 0; if (n > 0) mi[k] = n; });
      if (!jEq(mi, mistakes)) redraw = true;
      mistakes = mi;

      var wso = {};
      keys(doc.ws).forEach(function(k){
        var e = doc.ws[k] || [];
        wso[k] = {s: Math.max(0, Math.min(2, e[0] | 0)), g: e[1] ? 1 : 0, t: e[2] | 0};
      });
      keys(wrong2).forEach(function(k){                       /* 내 기록이 더 최신이면 그대로 둔다 */
        var cur = wrong2[k], old = wso[k];
        if (!old || (cur.t || 0) > (old.t || 0)) wso[k] = {s: cur.s | 0, g: cur.g ? 1 : 0, t: cur.t | 0};
      });
      if (!jEq(wso, wrong2)) redraw = true;
      wrong2 = wso;

      var fpo = {};
      keys(doc.fp).forEach(function(k){
        var e = doc.fp[k];
        if (Array.isArray(e) && (e[0] || e[2])) fpo[k] = {n: e[0] || '', t: e[1] || 0, s: e[2] || ''};
      });
      keys(firstPick).forEach(function(k){ if (!fpo[k]) fpo[k] = firstPick[k]; });  // 합집합(다른 기기 기록 보존)
      if (!jEq(fpo, firstPick)) redraw = true;
      firstPick = fpo;

      /* 다른 기기에서 처음 열어 내려온 기록만 있어도 '옛 오답'을 되살린다 */
      if (backfillFP()) redraw = true;

      var mk = {};
      keys(doc.mk).forEach(function(k){ var e = doc.mk[k]; if (Array.isArray(e) && e[0]) mk[k] = 1; meta.wm[k] = e[1] || 0; });
      if (!jEq(mk, marks)) redraw = true;
      marks = mk;

      var hl = {};
      meta.wh = meta.wh || {};
      keys(doc.hl).forEach(function(q){
        var o = {}, src = doc.hl[q] || {};
        meta.wh[q] = meta.wh[q] || {};
        keys(src).forEach(function(k){
          var e = src[k] || {};
          var r = mergeHL(e.r || []);
          meta.wh[q][k] = e.t || 0;
          if (r.length) o[k] = r;
        });
        if (keys(o).length) hl[q] = o;
      });
      if (!jEq(hl, HLS)) redraw = true;
      HLS = hl;

      var dk = dayKey();
      if (doc.day && doc.day[dk] && daily.day === dk) {
        var src2 = doc.day[dk];
        keys(src2).forEach(function(k){
          var v = Math.max(daily.ids[k] || 0, src2[k] ? 1 : 0);
          if (daily.ids[k] !== v) redraw = true;
          daily.ids[k] = v;
        });
      }

      origWriteJSON(LS, state);
      origWriteJSON(LSM, mistakes);
      origWriteJSON(LSW, wrong2);
      origWriteJSON(LSK, marks);
      origWriteJSON(LSH, HLS);
      origWriteJSON(LSF, firstPick);
      origSaveDaily();
      saveMeta();
    } catch(e) {
      try { console.warn('[sync] apply 실패', e); } catch(e2){}
    } finally {
      suppress = false;
      snapAns = jclone(state.answers || {}); snapGraded = jclone(state.graded || {});
      snapMis = jclone(mistakes); snapMarks = jclone(marks); snapHL = jclone(HLS);
      snapFP = jclone(firstPick);
      snapW2 = jclone(wrong2);
      dirty = false;
    }
    if (redraw) redrawView();
  }

  function redrawView(){
    try {
      var ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;  // 입력 중이면 건드리지 않음
      buildSelectors(); rebuild();
      if (window.updateProgress) updateProgress();
    } catch(e) { try { console.warn('[sync] 화면 갱신 실패', e); } catch(e2){} }
  }

  /* 같은 브라우저의 다른 탭(예: 회계원리 공개용 페이지)이 쓴 내용을 흡수한다 */
  function absorbExternalEdits(){
    var changed = false;
    try {
      var st = readJSON(LS, null);
      if (st && st.answers) {
        var a = st.answers || {}, g = st.graded || {};
        keys(a).forEach(function(k){
          if (meta.w[k]) return;
          if (!Object.prototype.hasOwnProperty.call(state.answers, k) && !Object.prototype.hasOwnProperty.call(state.graded, k)) {
            state.answers[k] = a[k];
            if (Object.prototype.hasOwnProperty.call(g, k)) state.graded[k] = g[k];
            changed = true;
          }
        });
        keys(g).forEach(function(k){
          if (meta.w[k]) return;
          if (!Object.prototype.hasOwnProperty.call(state.graded, k)) { state.graded[k] = g[k]; changed = true; }
        });
      }
      var mi = readJSON(LSM, {}) || {};
      keys(mi).forEach(function(k){ var v = mi[k] | 0; if (v > (mistakes[k] || 0)) { mistakes[k] = v; changed = true; } });
      var wsl = readJSON(LSW, {}) || {};
      keys(wsl).forEach(function(k){
        var e = wsl[k], cur = wrong2[k];
        if (!e || typeof e !== 'object') return;
        if (!cur || (e.t || 0) > (cur.t || 0)) { wrong2[k] = {s: Math.max(0, Math.min(2, e.s | 0)), g: e.g ? 1 : 0, t: e.t | 0}; changed = true; }
      });
      var mk = readJSON(LSK, {}) || {};
      keys(mk).forEach(function(k){ if (!meta.wm[k] && mk[k] && !marks[k]) { marks[k] = 1; changed = true; } });
      var hl = readJSON(LSH, {}) || {};
      keys(hl).forEach(function(q){ keys(hl[q] || {}).forEach(function(key){
        if (meta.wh[q] && meta.wh[q][key]) return;
        if (!HLS[q] || !HLS[q][key]) { HLS[q] = HLS[q] || {}; HLS[q][key] = hl[q][key]; changed = true; }
      }); });
      var fpL = readJSON(LSF, {}) || {};
      keys(fpL).forEach(function(k){
        var e = fpL[k];
        if (!e) return;
        var ent = Array.isArray(e) ? {n: e[0], t: e[1] || 0} : e;
        if (ent && ent.n && !firstPick[k]) { firstPick[k] = ent; changed = true; }
      });
      var dl = loadDaily();
      if (dl && dl.day === daily.day) keys(dl.ids).forEach(function(k){
        var v = Math.max(daily.ids[k] || 0, dl.ids[k] || 0);
        if (daily.ids[k] !== v) { daily.ids[k] = v; changed = true; }
      });
    } catch(e){}
    return changed;
  }

  /* ── 업로드·내려받기 ─────────────────────────────────────────────── */
  function b64(buf){
    var bytes = new Uint8Array(buf), out = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(out);
  }
  function unb64(str){
    var s = atob(str), arr = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i);
    return arr;
  }
  /* 기록이 커도 64KB 제한에 걸리지 않도록 gzip으로 접어서 보관한다 */
  function pack(doc){
    var text = JSON.stringify(doc);
    if (text.length < 8000 || typeof CompressionStream === 'undefined') {
      return Promise.resolve(JSON.stringify({v:1, raw: doc}));      // 작으면 그대로(사람이 읽을 수 있게)
    }
    try {
      var stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Response(stream).arrayBuffer().then(function(buf){
        return JSON.stringify({v:1, z:1, d:b64(buf)});
      }).catch(function(){ return JSON.stringify({v:1, raw: doc}); });
    } catch(e) { return Promise.resolve(JSON.stringify({v:1, raw: doc})); }
  }
  function normDoc(d){
    if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
    if (!d.ans && !d.hl && !d.mk && !d.mis && !d.day) return null;
    d.ans = (d.ans && typeof d.ans === 'object') ? d.ans : {};
    d.hl  = (d.hl  && typeof d.hl  === 'object') ? d.hl  : {};
    d.mk  = (d.mk  && typeof d.mk  === 'object') ? d.mk  : {};
    d.mis = (d.mis && typeof d.mis === 'object') ? d.mis : {};
    d.day = (d.day && typeof d.day === 'object') ? d.day : {};
    d.fp  = (d.fp  && typeof d.fp  === 'object') ? d.fp  : {};
    d.ws  = (d.ws  && typeof d.ws  === 'object') ? d.ws  : {};
    return d;
  }
  function unpack(obj){
    if (!obj) return Promise.resolve(null);
    if (obj.z && obj.d) {
      if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('no DecompressionStream'));
      try {
        var stream = new Blob([unb64(obj.d)]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text().then(function(t){ return normDoc(JSON.parse(t)); });
      } catch(e) { return Promise.reject(e); }
    }
    var raw = obj.raw;
    if (typeof raw === 'string') {                     // 예전 형식(문자열로 한 번 더 감싼 경우)
      try { raw = JSON.parse(raw); } catch(e) { raw = null; }
    }
    if (raw === undefined || raw === null) raw = obj;
    var d = normDoc(raw);
    return (d || !obj.ans) ? Promise.resolve(d) : Promise.resolve(normDoc(obj));
  }

  function trim(doc){
    var body = JSON.stringify(doc);
    if (body.length <= 60000) return body;
    var pairs = [];
    keys(doc.hl).forEach(function(q){ keys(doc.hl[q]).forEach(function(k){ pairs.push([q, k, doc.hl[q][k].t || 0]); }); });
    pairs.sort(function(a, b){ return a[2] - b[2]; });          // 오래된 형광펜부터 버림
    for (var i = 0; i < pairs.length && body.length > 60000; i++) {
      delete doc.hl[pairs[i][0]][pairs[i][1]];
      if (!keys(doc.hl[pairs[i][0]]).length) delete doc.hl[pairs[i][0]];
      body = JSON.stringify(doc);
    }
    return body;
  }

  function getCloud(tries){
    return fetch(URL_, {cache:'no-store'}).then(function(r){
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('GET ' + r.status);
      return r.json();
    }).then(function(raw){
      return unpack(raw).then(function(doc){
        if (raw && !doc) throw new Error('unreadable cloud doc');   // 해석 실패 시 덮어쓰지 않음
        return doc;
      });
    }).catch(function(err){
      if (tries > 1) {
        setChip('err', '오프라인', '연결을 다시 시도하는 중입니다.');
        return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return getCloud(tries - 1); });
      }
      throw err;
    });
  }

  function performSync(reason){
    if (busy) { again = true; return; }
    busy = true;
    setChip('', '확인 중', '기록을 확인하는 중입니다.');
    if (absorbExternalEdits()) dirty = true;
    getCloud(2)
      .then(function(cloud){
        meta.pull = Date.now();
        var local = buildDoc();
        var cloudHas = !!(cloud && !isEmptyDoc(cloud));
        var merged = cloudHas ? mergeDocs(local, cloud) : local;
        applyDoc(merged);
        var rebuilt = buildDoc();     /* 옛 오답 복원 등 화면에 반영된 결과까지 담아 비교·업로드 */
        rebuilt.day = merged.day;     /* 푼 날짜 버킷(지난 날 포함)은 병합 결과를 그대로 둔다 */
        merged = rebuilt;
        saveMeta();
        if (isEmptyDoc(merged)) { setChip('ok', '동기화됨', '아직 올릴 기록이 없습니다.'); return null; }
        if (!cloudHas) return pushDoc(merged);                       // 첫 올리기(빈 저장소 채우기)
        var localNew = !jEq(merged.ans, cloud.ans) || !jEq(merged.mis, cloud.mis) ||
                       !jEq(merged.mk, cloud.mk) || !jEq(merged.hl, cloud.hl) || !jEq(merged.day, cloud.day) ||
                       !jEq(merged.ws, cloud.ws);
        var beat = (Date.now() - (meta.push || 0)) > HEARTBEAT;      // 저장소 유지용 되살리기
        if (localNew || beat || reason === 'user') return pushDoc(merged);
        setChip('ok', '동기화됨', '마지막 확인 ' + timeLabel());
        return null;
      })
      .catch(function(err){
        try { console.warn('[sync] ' + (err && err.message || err)); } catch(e){}
        setChip('err', '오프라인', '연결되면 다시 올립니다. 기록은 이 기기에 안전하게 저장되어 있습니다.');
        dirty = true;
      })
      .then(function(){ busy = false; if (again) { again = false; setTimeout(function(){ performSync('queued'); }, 400); } });
  }

  function postDoc(body, tries, keepalive){
    var opt = {method:'POST', headers:{'Content-Type':'application/json'}, body: body};
    if (keepalive) opt.keepalive = true;
    return fetch(URL_, opt).then(function(r){
      if (!r.ok) throw new Error('POST ' + r.status);
    }).catch(function(err){
      if (tries > 1) return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return postDoc(body, tries - 1, keepalive); });
      throw err;
    });
  }

  function pushDoc(doc){
    setChip('wait', '저장중', '기록을 올리는 중입니다.');
    return pack(doc).then(function(body){
      return postDoc(body, 2, false);
    }).then(function(){
      meta.push = Date.now(); dirty = false; saveMeta();
      setChip('ok', '동기화됨', '마지막 저장 ' + timeLabel());
    });
  }

  function flush(){
    if (!dirty || suppress) return;
    if (Date.now() - (meta.pull || 0) > 120000) return;   // 오래 안 본 상태로 덮어쓰지 않음
    try {
      var doc = buildDoc();
      if (isEmptyDoc(doc)) return;
      pack(doc).then(function(body){ return postDoc(body, 1, true); }).catch(function(){});
      meta.push = Date.now(); dirty = false; saveMeta();
    } catch(e){}
  }

  function timeLabel(){
    var d = new Date();
    var p = function(n){ return String(n).padStart(2, '0'); };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function scheduleSync(){
    if (suppress) return;
    setChip('wait', '저장중', '곧 올립니다.');
    clearTimeout(timer);
    timer = setTimeout(function(){ performSync('debounce'); }, DEBOUNCE);
  }

  /* ── 로컬 저장을 감시해 바뀐 문항에 시각을 찍는다 ─────────────────── */
  writeJSON = function(k, v){
    origWriteJSON(k, v);
    if (suppress) return;
    var now = Date.now(), touched = false;
    try {
      if (k === LS) {
        var a = (v && v.answers) || {}, g = (v && v.graded) || {};
        var ids = {};
        keys(a).forEach(function(x){ ids[x] = 1; }); keys(g).forEach(function(x){ ids[x] = 1; });
        keys(snapAns).forEach(function(x){ ids[x] = 1; }); keys(snapGraded).forEach(function(x){ ids[x] = 1; });
        keys(ids).forEach(function(x){
          var inA = Object.prototype.hasOwnProperty.call(a, x), inG = Object.prototype.hasOwnProperty.call(g, x);
          var hadA = Object.prototype.hasOwnProperty.call(snapAns, x), hadG = Object.prototype.hasOwnProperty.call(snapGraded, x);
          if (inA !== hadA || inG !== hadG || !jEq(a[x], snapAns[x]) || !jEq(g[x], snapGraded[x])) {
            meta.w[x] = now; touched = true;
          }
        });
        snapAns = jclone(a) || {}; snapGraded = jclone(g) || {};
      } else if (k === LSK) {
        var ids2 = {};
        keys(v).forEach(function(x){ ids2[x] = 1; }); keys(snapMarks).forEach(function(x){ ids2[x] = 1; });
        keys(ids2).forEach(function(x){
          if (!!v[x] !== !!snapMarks[x]) { meta.wm[x] = now; touched = true; }
        });
        snapMarks = jclone(v) || {};
      } else if (k === LSW) {
        if (!jEq(v, snapW2)) { touched = true; snapW2 = jclone(v) || {}; }
      } else if (k === LSF) {
        if (!jEq(v, snapFP)) { touched = true; snapFP = jclone(v) || {}; }
      } else if (k === LSH) {
        var qs = {};
        keys(v).forEach(function(x){ qs[x] = 1; }); keys(snapHL).forEach(function(x){ qs[x] = 1; });
        keys(qs).forEach(function(q){
          var cur = v[q] || {}, old = snapHL[q] || {};
          var ks = {};
          keys(cur).forEach(function(x){ ks[x] = 1; }); keys(old).forEach(function(x){ ks[x] = 1; });
          keys(ks).forEach(function(key){
            if (!jEq(cur[key], old[key])) {
              meta.wh[q] = meta.wh[q] || {};
              meta.wh[q][key] = now; touched = true;
            }
          });
        });
        snapHL = jclone(v) || {};
      }
    } catch(e){}
    if (touched) { saveMeta(); dirty = true; scheduleSync(); }
  };

  saveDaily = function(){
    origSaveDaily();
    if (suppress) return;
    dirty = true; scheduleSync();
  };

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) flush(); else performSync('visible');
  });
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  window.addEventListener('online', function(){ performSync('online'); });
  setInterval(function(){
    if (document.hidden) return;
    if (Date.now() - (meta.pull || 0) > PULL_EVERY) performSync('interval');
  }, 30000);

  if (chip) {
    chip.addEventListener('click', function(){
      if (busy) return;
      toast('기록을 확인합니다…', 900);
      performSync('user');
    });
  }

  window.__syncDebug = {build: buildDoc, merge: mergeDocs, apply: applyDoc, url: URL_, meta: function(){ return meta; }};

  setChip('', '확인 중', '기록을 확인하는 중입니다.');
  performSync('load');
})();

/* ── 상단 두 줄의 실제 높이를 재서 사이드바·여백에 넘긴다 ────────────────
   .topbar 와 .selrow 는 .stickyhead 하나로 묶여 고정되므로 서로 겹치지 않는다.
   오른쪽 사이드바(sticky)는 이 높이(--headh) 아래에 붙는다. */
(function headH(){
  var el = document.querySelector('.stickyhead');
  if (!el) return;
  function set(){ document.documentElement.style.setProperty('--headh', el.offsetHeight + 'px'); }
  set();
  window.addEventListener('resize', set);
  window.addEventListener('orientationchange', function(){ setTimeout(set, 250); });
  if (window.ResizeObserver) { try { new ResizeObserver(set).observe(el); } catch (e) {} }
})();
</script>
