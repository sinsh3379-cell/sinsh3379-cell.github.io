<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3">
<title>주택관리사 1차 시설개론 CBT — 건축구조·건축설비 10개년 400제</title>
<style>
:root{
  --bg:#eef1f6; --card:#fff; --navy:#123a63; --navy2:#1d4f80;
  --line:#dfe4ec; --muted:#6b7787; --green:#1f6b41; --greenbg:#eaf7ef; --greenline:#bfe3cc;
  --red:#a8382f; --redbg:#fdeeec; --redline:#f3c9c4;
  --sel:#dbe7f6; --gold:#b8860b; --goldbg:#fff7e0;
  --sang:#a8382f; --jung:#8a6100; --ha:#1f6b41;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#151c28;
  font-family:'Noto Sans KR','Noto Sans CJK KR',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
button{font-family:inherit}
.stickyhead{position:sticky;top:0;z-index:30}
.topbar{background:#f7f9fc;border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{font-weight:800;color:var(--navy);font-size:16px;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.progwrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.progtxt{font-size:13px;color:#33405a;white-space:nowrap;font-variant-numeric:tabular-nums}
.progbar{flex:1;height:9px;background:#dfe4ee;border-radius:99px;overflow:hidden;min-width:40px}
.progfill{height:100%;width:0;background:var(--navy2);border-radius:99px;transition:width .2s}
.tbtn{appearance:none;border:1px solid #cfd6e2;background:#fff;color:#22314c;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tbtn:active{background:#eef2f8}
.selrow{background:#e9edf4;border-bottom:1px solid var(--line)}
.selin{max-width:1120px;margin:0 auto;display:flex;gap:8px;padding:8px 18px;align-items:center;flex-wrap:wrap}
select{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:10px;padding:9px 30px 9px 12px;
  font-size:14px;font-weight:600;color:#22314c;max-width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7787' stroke-width='1.6' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}
.shell{display:flex;align-items:flex-start;justify-content:center;max-width:1500px;margin:0 auto}
.shell > .wrap{flex:1 1 auto;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 20px;
  box-shadow:0 1px 2px rgba(18,58,99,.05)}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qno{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.35}
.qmain{flex:1;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.b{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:800}
.b.round{background:#123a63;color:#fff}
.b.new{background:#7a3d00;color:#fff}
.b.diff{border:1px solid}
.b.d-sang{color:var(--sang);background:#fdeeec;border-color:#f0c8c3}
.b.d-jung{color:var(--jung);background:#fff6dd;border-color:#ecd9a3}
.b.d-ha{color:var(--ha);background:#eaf7ef;border-color:#bfe3cc}
.b.miss{color:var(--red);background:#fdeeec;border-color:#f0c8c3}
.b.streak{color:#8a5a00;background:#fff6dd;border-color:#ecd9a3}
.b.grad{color:#1f7a48;background:#eaf7ef;border-color:#bfe3cc}
.star{margin-left:auto;appearance:none;border:1px solid #e2d2a4;background:#fffdf5;color:#c9a227;
  width:48px;height:44px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer}
.star.on{background:var(--goldbg);border-color:#e0bd52;color:#d29b00}
.qtools{display:flex;gap:8px;align-items:flex-start;flex:0 0 auto;margin-left:auto}
.hlbtn{appearance:none;border:1px solid #e3d3a6;background:#fffdf5;color:#8a6100;height:44px;
  padding:0 13px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.hlbtn:active{background:#fdf3cf}
.hlbtn.on{background:#fff0a0;border-color:#d9a800;color:#6b4f00;box-shadow:0 0 0 2px rgba(255,214,0,.22)}
body.hlmode .opt{cursor:text}
.hlz{-webkit-user-select:text;user-select:text}
mark.user-hl{background:#ffe95c;color:inherit;padding:0;border-radius:2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
body.hlmode mark.user-hl{cursor:pointer}
body.hlmode .hlz ::selection,body.hlmode .hlz::selection{background:#bcd8ff}
.hlfloat{position:fixed;left:0;top:0;z-index:70;display:none;appearance:none;border:none;
  background:#2a2205;color:#fff;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800;
  box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.hlfloat.show{display:inline-flex;align-items:center;gap:6px}
.stem{font-size:25px;line-height:1.5;font-weight:700;letter-spacing:-.2px}
.intro{font-size:21px;line-height:1.6;color:#1b2536;margin:10px 0 0}
.bogi{margin:16px 0 4px;border:1px solid #dbe2ee;background:#f7f9fd;border-radius:14px;padding:16px 18px}
.bogi .bi{display:flex;gap:10px;font-size:23px;line-height:1.55;padding:5px 0}
.bogi .bi + .bi{border-top:1px dashed #e2e8f2}
.bogi .k{flex:0 0 auto;font-weight:800;color:var(--navy2);min-width:22px}
.bogi.law{background:#fbfbf7;border-color:#e6e2d2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:780px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #dbe2ee;background:#fff;border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:#f6f9ff}
.opt .num{flex:0 0 auto;font-weight:800;color:var(--navy2);font-size:21px;line-height:1.4}
.opt .txt{font-size:22px;line-height:1.5}
.opt.selected{border-color:var(--navy2);background:var(--sel)}
.opt.correct{border-color:var(--green);background:var(--greenbg)}
.opt.wrongpick{border-color:var(--red);background:var(--redbg)}
.opt .tag{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--green);white-space:nowrap;padding-top:4px}
.opt.wrongpick .tag{color:var(--red)}
.tblwrap{overflow:auto;margin:12px 0}
.tblwrap table{border-collapse:collapse;width:100%;font-size:18px}
.tblwrap th,.tblwrap td{border:1px solid #dbe2ee;padding:7px 10px;text-align:center}
.tblwrap th{background:#f2f5fa;font-weight:800}
.qimg{max-width:100%;height:auto;display:block;margin:12px auto;border:1px solid #e2e8f2;border-radius:10px}
.shortbox{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px}
.srow .lab{font-weight:800;color:var(--navy2);font-size:17px;min-width:52px}
.sinput{flex:1;border:1.5px solid #cfd6e2;border-radius:12px;padding:12px 14px;font-size:20px;font-family:inherit}
.sinput:focus{outline:none;border-color:var(--navy2);background:#f6f9ff}
.sbtn{align-self:flex-start}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:12px;padding:12px 22px;
  font-size:16px;font-weight:700;color:#22314c;cursor:pointer}
.actions .btn:active{background:#eef2f8}
.actions .btn.primary{border-color:var(--navy2);background:var(--navy2);color:#fff}
.result{margin-top:16px;border-radius:12px;padding:14px 18px;font-size:20px;font-weight:800;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.result.ok{background:var(--greenbg);border:1px solid var(--greenline);color:var(--green)}
.result.no{background:var(--redbg);border:1px solid var(--redline);color:var(--red)}
.result.warn{background:#fff7e0;border:1px solid #ecd9a3;color:#8a6100}
.retry{margin-left:auto;appearance:none;border:1px solid currentColor;background:transparent;color:inherit;
  border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;opacity:.85}
.exp{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.core{font-size:20px;line-height:1.68;color:#1b2536;margin:8px 0}
.notes{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:19px;line-height:1.6;padding:10px 12px;
  border-radius:10px;background:#f8fafd;border:1px solid #e6ecf5}
.note.on{background:var(--greenbg);border-color:var(--greenline)}
.note .no{flex:0 0 auto;font-weight:800;color:var(--navy2)}
.note .mk{flex:0 0 auto;font-weight:900;font-size:17px;width:20px;text-align:center}
.note .mk.O{color:var(--green)} .note .mk.X{color:var(--red)}
.note .tx{flex:1;min-width:0}
.note .rd{color:#7b8798;font-size:15px;font-weight:700;white-space:normal;margin-left:4px}
.cites{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cites .lab{font-size:14px;font-weight:800;color:var(--muted)}
.chip{display:inline-block;border:1px solid #d7dfea;background:#f2f5fa;border-radius:8px;padding:5px 10px;
  font-size:15px;font-weight:700;color:#2a3a52}
.keybox{margin-top:14px;border:1px solid #e5d8b0;background:var(--goldbg);border-radius:12px;padding:12px 14px;
  font-size:18px;line-height:1.6}
.keybox b{color:#8a6100}
.termbox{margin-top:12px;border:1px solid #dbe2ee;background:#f7f9fd;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.termbox b{color:var(--navy2)}
.termbox div + div{margin-top:4px}
.addbox{margin-top:12px;border:1px solid #d9e2ef;background:#f4f8ff;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.addbox .lab{font-weight:800;color:var(--navy2);margin-bottom:4px;display:block}
.pdfbox{margin-top:12px;border:1px dashed #cfd6e2;background:#fbfcfe;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.pdfbox .h{font-weight:800;color:var(--navy2);margin-bottom:4px}
.amendbox{margin-top:12px;border:1px solid #d9e2ef;background:#f4f8ff;border-radius:12px;padding:12px 14px;font-size:17px;line-height:1.6}
.amendbox .h{font-weight:800;color:var(--navy2);margin-bottom:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:#fff;border-left:1px solid var(--line);
  box-shadow:-8px 0 24px rgba(18,58,99,.12);transform:translateX(102%);transition:transform .18s ease;z-index:50;
  display:flex;flex-direction:column;padding:14px}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dhead .t{font-weight:800;font-size:16px;color:var(--navy)}
.dclose{appearance:none;border:1px solid #cfd6e2;background:#fff;border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;overflow:auto;padding:2px 2px 10px;flex:1;align-content:start}
.gi{position:relative;border:1px solid #dbe2ee;background:#fff;border-radius:9px;height:42px;display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:700;color:#2a3a52;cursor:pointer;font-variant-numeric:tabular-nums}
.gi.done{background:var(--greenbg);border-color:var(--greenline);color:var(--green)}
.gi.bad{background:var(--redbg);border-color:var(--redline);color:var(--red)}
.gi.cur{outline:2.5px solid var(--navy2);outline-offset:1px}
.gi .st{position:absolute;top:-5px;right:-4px;font-size:12px;color:#d29b00}
.gi .mc{position:absolute;bottom:-4px;right:2px;font-size:10.5px;font-weight:900;color:var(--red);background:#fff;border-radius:6px;padding:0 3px}
.today{padding:10px 0 8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13.5px;color:#33405a}
.today .tl{font-weight:800;color:var(--navy)}
.today .tv{font-weight:800;font-size:15px;color:var(--navy2)}
.today .ts{color:var(--muted);font-size:13px}
.score{padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:#33405a;line-height:1.7}
.score b{color:var(--navy)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:17px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2536;color:#fff;padding:11px 18px;
  border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  .brand small{display:none}
  .stem{font-size:21px}
  .intro{font-size:18px}
  .bogi .bi{font-size:19px}
  .opt .txt{font-size:19px}
  .core{font-size:18px}
  .note{font-size:18px}
  .tblwrap table{font-size:16px}
}
@media (max-width:620px){
  .topin{gap:8px;padding:8px 12px}
  .brand{font-size:13.5px}
  .progtxt{font-size:11.5px}
  .progbar{min-width:20px}
  .tbtn{padding:8px 10px;font-size:13px}
  .qhead{flex-wrap:wrap;row-gap:8px}
  .qno{order:1} .qtools{order:2} .qmain{order:3;flex:1 1 100%}
  .hlbtn{padding:0 11px;font-size:14.5px;height:42px}
  .star{height:42px;width:46px;font-size:20px}
  .note{display:grid;grid-template-columns:auto auto 1fr;
        grid-template-areas:"no mk tx" ". . rd";column-gap:8px;row-gap:1px;font-size:17px}
  .note .no{grid-area:no} .note .mk{grid-area:mk} .note .tx{grid-area:tx;flex:none}
  .note .rd{grid-area:rd;text-align:right;padding-top:0;white-space:normal;font-size:13.5px}
  .card{padding:16px}
}
@media (min-width:1000px){
  .stem{font-size:27px}
  .opt .txt{font-size:23px}
  .bogi .bi{font-size:25px}
}
/* ── 태블릿 가로·데스크톱: 오른쪽 사이드바를 상시 고정 ── */
@media (min-width:960px){
  .drawer{position:sticky;top:calc(var(--headh, 104px) + 10px);left:auto;right:auto;bottom:auto;transform:none;
    flex:0 0 322px;width:322px;height:auto;max-height:calc(100vh - var(--headh, 104px) - 26px);z-index:5;
    margin:16px 18px 40px 0;padding:16px;border:1px solid var(--line);border-radius:16px;
    background:#fff;box-shadow:0 1px 2px rgba(18,58,99,.05);overflow:hidden}
  .drawer .dclose{display:none}
  #btnList{display:none}
  .drawer .today{order:-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 9px;
    border-top:none;border-bottom:1px solid var(--line);padding:0 2px 12px;margin:0 0 12px}
  .drawer .today .tl{font-size:15.5px;font-weight:800;color:var(--navy)}
  .drawer .today .tv{font-size:33px;font-weight:800;color:var(--navy2);line-height:1.1;
    font-variant-numeric:tabular-nums}
  .drawer .today .tv small{font-size:15px;font-weight:800;margin-left:3px}
  .drawer .today .ts{font-size:13px;color:var(--muted);width:100%}
  .drawer .dhead{margin-bottom:10px}
  .drawer .dhead .t{font-size:16.5px}
  .drawer .grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
  .drawer .gi{height:44px;font-size:15px}
}
@media (max-width: 768px) {
  html, body { font-size: 13px !important; }
  .wrap { padding: 6px 10px 40px !important; }
  .card { padding: 12px 14px 10px !important; border-radius: 12px !important; }
  .topin { padding: 6px 12px !important; gap: 8px !important; }
  .brand { font-size: 13px !important; }
  .brand small { display: none !important; }
  .selin { padding: 6px 12px !important; gap: 4px !important; }
  select { padding: 6px 26px 6px 8px !important; font-size: 12px !important; border-radius: 8px !important; }
  .qhead { gap: 8px !important; margin-bottom: 8px !important; }
  .qno { font-size: 18px !important; line-height: 1.2 !important; }
  .qmeta { margin-bottom: 4px !important; gap: 4px !important; }
  .b { padding: 2px 6px !important; font-size: 11px !important; }
  .stem { font-size: 15px !important; line-height: 1.35 !important; letter-spacing: -0.3px !important; }
  .hlbtn, .star { height: 32px !important; padding: 0 8px !important; font-size: 13px !important; border-radius: 8px !important; }
  .star { width: 36px !important; font-size: 16px !important; }
  .opts { grid-template-columns: 1fr !important; gap: 6px !important; margin-top: 10px !important; }
  .opt { padding: 8px 10px !important; border-radius: 10px !important; gap: 8px !important; }
  .opt .num { font-size: 15px !important; line-height: 1.2 !important; }
  .opt .txt { font-size: 14px !important; line-height: 1.35 !important; }
  .actions { margin-top: 10px !important; gap: 6px !important; }
  .actions .btn { padding: 8px 14px !important; font-size: 13px !important; border-radius: 8px !important; }
  .exp { margin-top: 10px !important; padding-top: 10px !important; }
  .core { font-size: 14px !important; line-height: 1.4 !important; margin: 4px 0 !important; }
  .note { font-size: 13px !important; padding: 6px 8px !important; margin-top: 6px !important; }
}
@media (max-width: 768px) {
  .intro { font-size: 14px !important; line-height: 1.4 !important; margin: 6px 0 0 !important; }
  .bogi { margin: 8px 0 4px !important; padding: 8px 10px !important; border-radius: 10px !important; }
  .bogi .bi { font-size: 14px !important; line-height: 1.35 !important; padding: 3px 0 !important; gap: 6px !important; }
  .bogi .k { min-width: 14px !important; }
  .tblwrap { margin: 6px 0 !important; }
  .tblwrap table { font-size: 12px !important; }
  .tblwrap th, .tblwrap td { padding: 4px 6px !important; }
  .keybox { font-size: 13px !important; padding: 8px 10px !important; margin-top: 8px !important; }
}


/* ☁️ 기기 간 동기화 상태 표시 (아주 작게) */
.syn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  color:#4a5a72;background:#eef2f8;border:1px solid #dbe2ee;border-radius:99px;padding:3px 9px;
  white-space:nowrap;cursor:pointer;user-select:none;line-height:1.45;font-family:inherit}
.syn.ok{color:#1f6b41;background:#eaf7ef;border-color:#bfe3cc}
.syn.wait{color:#8a6100;background:#fff7e0;border-color:#ecd9a3}
.syn.err{color:#a8382f;background:#fdeeec;border-color:#f3c9c4}
@media (max-width:768px){.syn{font-size:10px;padding:2px 6px;gap:2px}}
@media (max-width:430px){.syn{padding:2px 5px}.syn.ok .synt{display:none}}

/* ═══ 4대 기능: 📌 핀 마킹 · ⭐ 자동 별표 · ⚠ 내가 고른 오답 · 🔢 숫자 전용 ═══ */
.b.auto{letter-spacing:1.5px;border:1px solid #e7c96a;background:#fff8e1;color:#a2700a}
.b.auto.s3{border-color:#e8a49c;background:#fdeeec;color:#a8382f}
.b.auto.s2{border-color:#eccf92;background:#fffaf0;color:#8a6100}

/* ── 상단 보기 탭 (전체 / 핀 마킹 / 틀린 문제 / 내가 고른 오답 / 숫자 전용) ── */
.selin.moderow{padding-top:0 !important;padding-bottom:7px !important;gap:0 !important}
.modetabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.mtab{appearance:none;border:1px solid #cfd6e2;background:#fff;color:#22314c;border-radius:99px;
  padding:7px 12px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;line-height:1.2;font-variant-numeric:tabular-nums}
.mtab:active{background:#eef2f8}
.mtab.on{background:var(--navy2);border-color:var(--navy2);color:#fff}

t":"③","blanks":[],"core":"","paras":["지진하중 및 풍하중 산정에 관련되는 요소는 다음과 같다.","ㄱ. 반응수정계수: 등가정적해석법에서 구조물의 비탄성 변형 능력과 소성 변형에 의한 에너지 흡수 효과를 고려하여 지진응답계수 및 지진하중을 산정할 때 적용하는 계수이다","ㄴ. 고도분포계수: 지표면의 거칠기 구분과 높이에 따른 풍속 변화를 반영하는 계수로 풍하중 산정에 사용된다","ㄷ. 중요도계수: 건축물의 용도와 규모에 따른 내진등급에 맞추어 지진하중의 크기를 조절하기 위해 적용하는 계수이다","ㄹ. 가스트영향계수: 바람의 난류 성분으로 인한 구조물의 동적 응답을 고려하기 위한 계수로 풍하중 산정에 사용된다.","ㅁ. 밑면전단력: 지진 작용으로 인해 건축물 최하단 밑면에 작용하는 전체 수평 지진하중으로 이를 바탕으로 각 층별 층지진하중을 산정한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄱ, ㄷ, ㅁ","terms":[],"extra":["ㄱ.) 지진하중 산정 시 반응수정계수가 클수록 지진하중은 감소한다 지진하중은 단기 수평하중에 속하며 지반을 6종으로 분 류한다 우리나라 지진구역계수는 강원북부·제주 0.07, 나머지 행정구역 0.11이며 지반과 구조물의 고유주기가 일치하면 공 진현상이 발생한다 ㄴ.) 풍하중은 주골조설계용, 지붕용 외장재설계용으로 구분하는 수평하중이다 설계속도압은 공기밀도에 비례하고 설계풍속 의 제곱에 비례하며 바람을 받는 수압면적이 클수록 풍하중이 커진다","ㄷ. ) 중요도계수는 지진하중뿐만 아니라 설하중 산정 시에도 기본지붕설하중계수, 노출계수 온도계수 지붕형상계수 등과 함께 고려한다 기본지상설하중은 재현기간 100년 최심적설깊이 기준이며 최소 0.5kN/m²이다. ㄹ.) 주골조설계용 풍하중은 속도압, 가스트영향계수 풍압계수(풍력계수)에 수압면적을 곱하여 산정하며 내압계수의 영향도 고려한다.","ㄷ.) 밑면전단력은 지진응답계수에 유효건물중량을 곱하여 산정한다 이때 골조에 고정된 영구설비의 총하중은 유효건물중량 에 포함된다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 41번","noAns":false,"stemBr":false},{"id":"26-41","round":26,"num":41,"part":"건축구조","unit":"구조총론","sub":"설계하중","type":"mc","stem":"하중과 변형에 관한 용어 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"고정하중은 기계설비 하중을 포함하지 않는다","ans":false,"mark":"X","note":"고정하중은 건축물 자체의 구조체 자중뿐만 아니라 구조물에 고정 장착되어 이동하지 않는 각종 기계설비, 건축설비, 마감재, 고정 칸막이벽 등의 무게를 포함한다","rnd":[20,21,22,23,24,28,29],"art":""},{"n":"②","text":"외력이 작용하는 구조부재 단면에 발생하는 단위면적당 힘의 크기를 응력도라 한다.","ans":true,"mark":"O","note":"외력이 작용할 때 구조부재 내부의 단면에 발생하는 단위면적당 내력의 크기를 응력도라 한다.","rnd":[20,23,25,27,28],"art":""},{"n":"③","text":"외력을 받아 변형한 물체가 그 외력을 제거하면 본래의 모양으로 되돌아가는 성질을 소성이라고 한다.","ans":false,"mark":"X","note":"외력을 받아 변형된 물체가 외력을 제거했을 때 원래의 모양과 크기로 복원되는 성질은 탄성이다. 외력을 제거하더라도 본래의 모양으로 되돌아가지 않고 영구 변형이 남는 성질을 소성이라 한다.","rnd":[],"art":""},{"n":"④","text":"등분포 활하중은 저감해서 사용하면 안된다 :"22-41","round":22,"num":41,"part":"건축구조","unit":"구조총론","sub":"건축구조의 분류 및 구조형식","type":"mc","stem":"건축물의 구조에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"커튼월은 공장생산된 부재를 현장에서 조립하여 구성하는 비내력 외벽이다.","ans":false,"mark":"O","note":"","rnd":[23],"art":""},{"n":"②","text":"조적구조는 벽돌, 석재, 블록 ALC 등과 같은 조적재를 결합재 없이 쌓아 올려 만든 구조이다","ans":true,"mark":"X","note":"","rnd":[26],"art":""},{"n":"③","text":"강구조란 각종 형강과 강판을 볼트, 리벳, 고력볼트, 용접 등의 접합방법으로 조립한 구조이다.","ans":false,"mark":"O","note":"","rnd":[23,24],"art":""},{"n":"④","text":"기초란 건축물의 하중을 지반에 안전하게 전달시키는 구조 부분이다","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"철근콘크리트구조는 철근과 콘크리트를 일체로 결합하여 콘크리트는 압축력, 철근은 인장력에 유효하게 작동하는 구조이다.","ans":false,"mark":"O","note":"","rnd":[20,21,25,26,27,28,29],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["커튼월은 외부 환경으로부터 건물을 보호하기 위해 공장에서 제작된 부재를 현장에서 조립하여 설치하는 대표적인 비내 력 외벽 구조이다 자체 하중과 풍하중 등 외력을 지지 구조체에 전달하지만 상부 구조의 수직하중을 부담하지 않는다","조적구조는 벽돌, 석재, 블록 ALC 등의 조적재를 시멘트 모르타르 등의 결합재를 사용하여 쌓아 올려 벽체 및 구조부를 형성하는 구조이다 결합재 없이 단순히 쌓아 올리는 구조가 아니므로 결합재를 통해 결합력과 응력 전달 성능을 확보해야 한다.","강구조는 형강, 강판 등의 구조용 강재를 볼트, 고장력볼트, 용접, 리벳 등의 접합 방식을 사용하여 일체로 조립·결합한 구조 체계이다","기초는 상부 구조물로부터 전달되는 모든 하중을 하부 지반에 안전하게 분산·전달하여 지반의 전단 파괴나 과도한 침하 를 방지하는 최하부 구조 부분이다","철근콘크리트구조는 압축강도가 높은 콘크리트와 인장강도가 높은 철근을 일체로 결합한 구조이다 콘크리트는 압축력을 부담하고 철근은 인장력을 부담하도록 상호 보완적으로 작동한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"조적구조는 벽돌, 석재, 블록 ALC 등의 조적재를 시멘트 모르타르 등의 결합재를 사용하여 쌓아 올려 벽체 및 구조부를 형성하는 구조이다 결합재 없이 단순히 쌓아 올리는 구조가 아니므로 결합재를 통해 결합력과 응력 전달 성능을 확보해야 한다","terms":[],"extra":["①) 커튼월은 기계화 시공으로 공기 단축 및 거푸집 비용 절감이 가능하고 계절에 관계없이 시공할 수 있으나, 접합부 결함 시 일체화가 곤란하다","②) 조적구조는 개별 재료와 접착제 강도에 의해 전체 강도가 결정되며 지진력이나 풍압력 등 횡력에 약해 고층 건물에 부 적합하다.","③) 강구조는 가구식·건식구조로 고층 및 장스팬 건물에 적합하나 세장하여 좌굴되기 쉽고 500~600°C에서 강도가 50% 저 하되므로 내화피복이 필수적이다","④) 기초는 기초판과 지정으로 구성되며 지정은 지반 내력을 보강하는 자갈, 잡석, 말뚝 등을 말한다 기초는 반드시 동결 선 이하에 설치해야 한다.","⑤) 철근콘크리트구조는 일 ],"art":""},{"n":"⑤","text":"지상으로부터 첫 번째 띠장은 통행을 위해 강관의 좌굴이 발생하지 않는 한도 내에서 2.0 m 이상으로 설치한다","ans":true,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["비계기둥의 간격은 장선 방향으로 1.5 m 이하로 설치해야 한다.","비계기둥의 간격은 띠장 방향으로 1.5 m 이상, 1.8 m 이하로 설치해야 한다. 출제범위인 국토교통부 표준시방서(KCS) 기준으로도 ②는 옳은 설명이다. (산업안전보건 기준의 1.85 m는 단속 상한선일 뿐이므로 함께 외우지 않아도 된다.)","","강관비계의 벽이음 배치간격은 수직방향 5.0 m 이하, 수평방향 5.0 m 이하로 설치해야 한다.","대각으로 설치하는 가새는 수평면에 대하여 40도에서 60도 방향으로 설치해야 한다.","지상으로부터 첫 번째 띠장은 2.0 m 이하의 위치에 설치해야 한다. 첫 번째 띠장의 높이가 2.0 m를 초과하면 기둥의 좌굴 길이가 길어져 비계 전체의 구조적 안정성이 저하된다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①, ②) 강관비계 기둥 높이가 31m를 초과하는 경우 기둥의 최고부에서 하단 쪽으로 31m 높이까지는 강관 1개로 기둥을 설치하고, 31m를 초과하는 하부 부분은 좌굴을 고려하여 강관 2개를 묶어서 기둥을 설치한다. 공통) 낙하물방지망은 높이 10m 이내 또는 3개 층마다 설치하며 내민길이는 비계 또는 구조체의 외측에서 수평거리 2m 이상, 수평면과의 경사도는 20~30'로 설치한다 근로자 보행자 및 차량 등의 통행이 빈번한 곳의 첫 단은 낙하물방지망 대신 방 호선반을 설치한다 공사현장 경계의 가설울타리는 높이 1.8m 이상으로 설치한다. 시멘트창고 바닥은 지반에서 300mm 이상 높이로 하고, 풍화 및 고결 방지를 위해 개구부와 환기창을 최소화하며 포대시멘 ㄷ는 단기간 저장 시 13포대 이하, 장기저장 시 7포대 이상 쌓아 올리지 않는다 공사 중 건축물 높낮이의 기준이 되는 표시를 기준점이라 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 42번","noAns":false,"stemBr":false},{"id":"21-84","round":21,"num":84,"part":"건축구조","unit":"토공사 및 기초구조","sub":"지반 및 지반조사","type":"mc","stem":"표준관입시험에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"점성토 지반에서 실시하는 것을 원칙으로 한다.","ans":false,"mark":"X","note":"표준관입시험(SPT)은 주로 사질토(모래) 지반의 상대밀도 및 지지력을 판정하기 위해 실시하는 것을 원칙으로 한다. 점성토 지반에서는 주로 베인시험이나 일축압축시험 등을 적용한다.","rnd":[23],"art":""},{"n":"②","text":"N값은 로드를 지반에 76 cm 관입시키는 타격 횟수이다.","ans":false,"mark":"X","note":"N값은 질량 63.5 kg의 추를 75 cm 높이에서 자유낙하시켜 샘플러를 지반에 30 Cm 관입시키는 데 필요한 타격 횟수를 의미한다.","rnd":[],"art":""},{"n":"③","text":"N값이 10~ 30인 모래지반은 조밀한 상태이다","ans":false,"mark":"X","note":"N값이 10 이상 30 미만인 모래지반은 보통 상태로 분류하며 조밀한 상태는 N값이 30 이상 50 미만인 경우에 해당한 다.","rnd":[27],"art":""},{"n":"④","  kN/m²) 순서이다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"화성암- 수성암- 자갈- 자갈과 모래의 혼합물- 모래 섞인 점토- 모래","terms":[],"extra":["②) 일반적인 지반의 허용지내력 순서는 화성암> 수성암> 자갈> 자갈모래의 혼합물> 모래섞인 점토> 모래(=점토) 순이다. 다만 지반이 밀실한 경우의 허용지내력 순서는 화성암> 수성암> 자갈> 자갈모래의 혼합물> 모래> 모래섞인 점토 > 점토 순으로 모래가 모래섞인 점토보다 크다 공통) 점성토 지반은 투수성이 작고 압밀속도가 느려 장기침하 및 총침하량이 크며 예민비가 크다. 하중 재하 시 주변에서 압력이 최대가 되며 건물 중앙부에서 침하가 먼저 발생한다 사질토 지반은 투수성이 크고 다짐에 의한 단기침하가 발생하며 액상화 현상이 크다. 하중 재하 시 중앙에서 압력이 최대가 되며 건물 주변부에서 침하가 먼저 발생한다. 지반조사 원위치시험 중 표준관입시험은 사질지반의 상대밀도를 측정하며(63.5kg 추, 76cm 자유낙하 30cm 관입 N값), 베 인시험은 연약 점성토 지반의 전단강도를 측정한다. 지내력시험 중 평판재하시험은 직경 300mm 재하판을 사용하며 24시간 경과 후 0.1mm 이하의 변화를 보인 때의 총침하량이 20mm에 달했을 때까지의 값을 기준으로 단기허용지내력을 산정한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 41번","noAns":false,"stemBr":false},{"id":"27-48","round":27,"num":48,"part":"건축구조","unit":"토공사 및 기초구조","sub":"지반 및 지반조사","type":"mc","stem":"지반특성 및 지반조사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"액상화는 점토지반이 진동 및 지진 등에 의해 압축저항력을 상실하여 액체와 같이 거동하는 현상이다","ans":false,"mark":"X","note":"액상화(liquefaction)는 느슨하고 포화된 사질지반(모래지반)이 지진이나 진동 등의 반복적인 동적 하중을 받아 간극수압 이 급격히 상승하고 유효응력이 0에 도달하여 전단강도를 상실함으로써 액체와 같이 거동하는 현상이다 점토지반이 아닌 사질지반에서 주로 발생한다","rnd":[],"art":""},{"n":"②","text":"사운딩(sounding)은 로드의 선단에 설치된 저항체를 지중에 넣고 관입, 회전, 인발 등을 통해 토층의 성상을 탐사하는 시험이다.","ans":true,"mark":"O","note":"사운딩(sounding)은 로드 선단에 연결된 저항체(콘, 베인 등)를 지중에 관입, 회전, 인발시킬 때 발생하는 저항력으로 토 층의 경연 및 성상을 연속적으로 탐사하는 시험이다","rnd":[],"art":""},{"n":"③","text":"샌드벌킹(sand bulking)은 사질지반의 모래에 물이 배출되어 체적이 축소되는 현상이다","ans":false,"mark":"X","note":"샌드벌킹(sand bulking)은 사질지반의 모래에 5~6% 정도의 적당한 수분이 포함될 때 표면장력으로 인해 모래 입자 간 간격이 넓어지며 체적이 최대 20~30% 정도 부풀어 오르는 현상이다. 수분이 배출되어 체적이 축소되는 현상이 아니다","rnd":[23],"art":""},{"n":"④","text":"간극수압은 모래 속에 포함된 물에 의한 하향수압을 의미한다","ans":false,"mark":"X","note":"간극수압(pore water pressure)은 흙의 간극 속에 채워져 있는 물이 미치는 수압으로 하향수압에 국한되지 않고 모든 방향으로 작용하는 수압이다","rnd":[],"art":""},{"n":"⑤","text":"압밀은 사질  직접 활용된다.","탑 다운(역타) 공법은 지하연속벽 등 외벽 구조체를 먼저 시공한 후 1층 슬래브를 타설하여 이를 작업면 및 버팀대로 활 용하면서 지상과 지하 공사를 동시에 진행하는 공법이다 부지가 협소하고 인접 건물과 밀접한 도심지 현장에 매우 적합하 며, 상부 슬래브를 작업장 및 자재 적치장으로 활용할 수 있다. 해당 지문은 탑 다운 공법이 넓은 작업공간을 필요로 하여 도심지 공사에 적절하지 않다고 반대로 기술되어 있다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"탑 다운(역타) 공법은 지하연속벽 등 외벽 구조체를 먼저 시공한 후 1층 슬래브를 타설하여 이를 작업면 및 버팀대로 활 용하면서 지상과 지하 공사를 동시에 진행하는 공법이다 부지가 협소하고 인접 건물과 밀접한 도심지 현장에 매우 적합하 며, 상부 슬래브를 작업장 및 자재 적치장으로 활용할 수 있다.","terms":[],"extra":["①) RCD 공법은 현장타설 콘크리트 말뚝을 시공하는 대구경 말뚝공법으로, 어스드릴 공법, 베노토 공법과 함께 이에 속한다. 현장타설 콘크리트 말뚝 시공 시에는 굴착 저면의 슬라임 제거에 유의해야 하며, 주철근 이음은 겹침이음을 원칙으로 한다.","②) 점성토 지반의 탈수 지반개량공법에는 샌드드레인 외에 생석회 말뚝공법, 페이퍼드레인 공법이 있으며, 페이퍼드레인은 모래 대신 합성수지 드레인재를 사용한다 사질토 지반개량에는 다짐공법과 웰포인트 공법이 적용된다.","③) 흙막이를 설치하는 굴착공법 중 아일랜드컷 공법은 중앙부를 먼저 굴착하여 지하 구조물을 형성한 뒤 주변부를 굴착하 며, 트렌치컷 공법은 반대로 측벽이나 주열선 부분을 먼저 굴착·축조한 후 중앙부를 파내는 방식이다.","④) 슬러리월은 인접건물 근접시공이 가능하고 무소음·무진동 공법으로 지반조건에 좌우되지 않으나 장비가 고가이다 흙막 이 붕괴 현상으로는 연약 점성토의 히빙, 사질토의 보일링과 파이핑이 있다.","⑤) 탑다운 공법은 지하연속벽으로 외부옹벽과 기둥을 선시공한 후 위에서 아래로 지하층을 완성하는 공법으로 역순환 굴 착공법(RCD)을 활용하여 시공한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 83번","noAns":false,"stemBr":false},{"id":"23-44","round":23,"num":44,"part":"건축구조","unit":"토공사 및 기초구조","sub":"토공사 및 터파기 공법","type":"mc","stem":"흙막이 공사에서 발생하는 현상에 관한 설명으로 옳은 것을 모두 고른 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[{"mk":"ㄱ","tx":"히 빙: 사질지반이 급속 하중에 의해 전단저항력을 상실하고 마치 액체와 같이 거동하는 현상"},{"mk":"ㄴ","tx":"파이핑: 부실한 흙막이의 이음새 또는 구멍을 통한 누수로 인해 토사가 유실되는 현상"},{"mk":"ㄷ","tx":"보일링: 연약한 점성토 지반에서 땅파기 외측의 흙의 중량으로 인하여 땅파기 된 저면이 부풀어 오르는 현상"}],"letters":true,"combo":false,"choices":[{"n":"①","text":"ㄱ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"ㄴ","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"ㄱ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"ㄴ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"⑤","text":"ㄱ, ㄴ, ㄷ","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["흙막이 공사 시 발생하는 지반 변형 및 굴착 저면의 안정성 저해 현상은 다음과 같다.","ㄱ. 히빙(Heaving)은 연약한 점성토 지반에서 흙막이 벽체 배면의 토사 중량 및 상부 하중으로 인하여 굴착 저면의 흙이 부풀어 오르는 현상이다 보기의 설명인 사질지반이 급속 하중에 의해 전단저항력을 상실하고 액체처럼 거동하는 현상은 액상 화(Liquefaction)에 해당한다","ㄴ. 파이핑(Piping)은 부실한 흙막이 벽체의 이음새나 구멍, 지반 내의 수로를 통해 물과 함께 토사가 유실되면서 파이프 모 양의 수로가 형성되는 현상이 맞다.","ㄷ. 보일링(Boiling)은 투수성이 좋은 사질지반에서 지하수위 차에 따른 상향 침투 수압으로 인해 굴착 저면의 모래와 물이 함께 솟구쳐 오르는 현상이다 보기의 설명인 연약한 점성토 지반에서 흙의 중량으로 인하여 저면이 부풀어 오르는 현상은 히빙(Heaving)에 해당한다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"ㄴ","terms":[],"extra":["ㄱ.) 사질지반에 발생하는 액상화는 진동·지진 등에 의한 간극수압 상승으로 유효응력이 감소하여 부등침하 지반이동, 소형 건축물 부상 등을 유발한다 히빙은 흙막이벽의 근입깊이를 깊게 하여 방지한다","ㄴ. ) 파이핑은 흙막이벽의 부실시공으로 뚫린 구멍이나 이음새를 통해 물이 스며드는 현상이며, 차수성이 우수한 지하연속벽 공법을 적용하거나 지반개량공법 등으로 방지한다","ㄷ. ) 보일링은 투수성이 좋은 사질지반에서 발생하므로 웰포인트 공법 등으로 지하수위를 낮추거나 흙막이 벽체 근입깊이를 불투수층까지 깊게 시공하여 방지한다. 공통) 인접 건물의 지반과 기초를 보강하여 히빙, 보일링, 파이핑에 의한 흙막이 붕괴 및 주변 침하를 막는 공법을 언더피닝 공법 이라 한다 지하연속벽(슬러리월)은 흙막이벽 겸 구조벽체로 활용되며 인접건물 근접시공이 가능한 무소음·무진동 공법이다 굴착 공법에는 흙막이 없이 안식각을 고려하는 오픈컷, 중앙부를 먼저 파내는 아일랜드컷, 측벽을 먼저 파내는 트렌치컷, 위 에서 아래로 축조하는 탑다운(역타) 공법이 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 44번","noAns":false,"stemBr":false},{"id":"25-42","round":25,"num":42,"part":"건축구조","unit":"토공사 및 기초구조","sub":"토공사 및 터파기 공법","type":"mc","stem":"기초구조 및 터파기 공법에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"서로 다른 종류의 지정을 사용하면 부등침하를 방지할 수 있다.","ans":false,"mark":"X","note":"동일한 건물에 서로 다른 종류의 지정이나 기초를 함께 사용하는 이종지정 및 이종기초는 지반 반응과 침하 특성이 서로 달라 부등침하를 유발하는 주요 원인이 된다. 따라서 부등침하를 방지하기 위해서는 동일한 종류의 지정 및 기초를 사용해 야 한다","rnd":[22,23,28],"art":""},{"n":"②","text":"지중보는 부등침하 억제에 영향을 미치지 못한다.","ans":false,"mark":"X","note":"지중보(기초보)는 독립기초 상호를 수평으로 연결하여 구조물의 강성을 높이고 부등침하를 억제하는 중요한 역할을 한다.","rnd":[22,23,28],"art":""},{"n":"③","text":"2개의 기둥에서 전달되는 하중을 1개의 기초판으로 지지하는 방식의 기초를 연속기초라고 한다.","ans":false,"mark":"X","note":"2개 이상의 기둥 하중을 하나의 기초판으로 지지하는 기초는 복합기초이 O","note":"오픈 컷 공법은 흙의 휴식각(안정각)을 고려하여 굴착면 사면 경사를 안전하게 확보함으로써 별도의 흙막이 가설 구조물 없이 터파기를 수행하는 공법이다.","rnd":[],"art":""},{"n":"④","text":"아일랜드(island) 공법","ans":false,"mark":"X","note":"아일랜드 공법은 부지 중앙부를 우선 굴착하여 중앙 구체를 설치하고, 이 구체에 버팀대를 대어 주변부 지반을 안전하게 굴착하는 흙막이 지지 공법이다.","rnd":[25,29],"art":""},{"n":"⑤","text":"트랜치 컷(trench cut) 공법","ans":false,"mark":"X","note":"트랜치 컷 공법은 부지 외곽 주변부를 도랑 모양으로 먼저 굴착하여 외벽 구체를 시공한 후, 중앙부 지반을 나중에 굴착 하는 흙막이 지지 공법이다","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"오픈 컷 공법은 흙의 휴식각(안정각)을 고려하여 굴착면 사면 경사를 안전하게 확보함으로써 별도의 흙막이 가설 구조물 없이 터파기를 수행하는 공법이다","terms":[],"extra":["①) 역타(탑다운) 공법은 도심지 내 협소한 공사여건에서 사용하며 역순환 굴착공법(RCD 공법)으로 시공한다 지하연속벽에 의해 지하층 외부옹벽과 기둥을 토공에 앞서 선시공한 뒤 위에서 아래로 구조물을 완성한다","②) 흙막이 가설 시 붕괴현상으로 연약 점성토 지반에서 토압차에 의해 굴착 저면이 부풀어 오르는 히빙, 사질지반에서 지하수가 모래와 함께 솟아오르는 보일링, 이음새 구멍으로 물이 스며드는 파이핑이 발생한다.","③) 오픈컷 공법 외의 흙막이 종류에는 나무널말뚝, 강재널말뚝, 콘크리트널말뚝 지하연속벽이 있다. 지하연속벽은 흙막이 겸 구조벽체로 활용되며 무소음·무진동 공법이나 장비가 고가이고 고도의 기술이 필요하다","④) 아일랜드컷 공법은 부지 중앙부를 먼저 굴토하여 기초 구조물을 만든 후 버팀대를 지지시킨다 인접 건물이 있을 때 흙막이 붕괴와 주변 지반 침하를 미리 막기 위해 기존 건물 기초를 보강하는 언더피닝 공법을 사용한다","⑤) 트렌치컷 공법은 아일랜드컷 공법의 역순으로 전체를 파내지 않고 측벽이나 주열선 부분만을 먼저 파내어 구조체를 축 조한 다음 중앙부 나머지를 파내어 지하구조물을 완성하는 공법이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 42번","noAns":false,"stemBr":false},{"id":"29-44","round":29,"num":44,"part":"건축구조","unit":"토공사 및 기초구조","sub":"토공사 및 터파기 공법","type":"mc","stem":"지반개량공법에 해당하지 않는 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"바이브로 플로테이션 공법","ans":false,"mark":"O","note":"바이브로 플로테이션 공법은 진동 다짐기를 지반 속에 침투시켜 진동과 제트 수압으로 모래나 자갈을 다져 넣음으로써 사질토 지반을 밀실하게 다지는 지반개량공법이다.","rnd":[],"art":""},{"n":"②","text":"모래다짐 말뚝 공법","ans":false,"mark":"O","note":"모래다짐 말뚝 공법은 연약지반에 진동이나 타격으로 파이프를 투입한 후 모래를 채우고 다져서 밀실한 모래 기둥을 형 성하는 지반개량공법이다","rnd":[],"art":""},{"n":"③","text":"약액주입 공법","ans":false,"mark":"O","note":"약액주입 공법은 지반 내의 공극에 시멘트계나 규산나트륨 등의 약액 ":22,"num":45,"part":"건축구조","unit":"철근콘크리트구조","sub":"철근콘크리트구조 일반 및 특성","type":"mc","stem":"철근콘크리트구조에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"콘크리트와 철근은 온도에 의한 선팽창계수가 비슷하여 일체화로 거동한다","ans":false,"mark":"O","note":"콘크리트와 철근의 선팽창계수(열팽창계수)는 약 1.0×10-5/°C로 거의 같다. 열팽창계수가 유사하기 때문에 온도 변화가 발생하더라도 두 재료의 변형률이 비슷하여 일체로 거동한다","rnd":[20,21,23,24,25,26,27,28],"art":""},{"n":"②","text":"알칼리성인 콘크리트를 사용하여 철근의 부식을 방지한다.","ans":false,"mark":"O","note":"콘크리트는 수화 반응 시 생성되는 수산화칼슘에 의해 pH 12~13의 강알칼리성을 띤다. 이러한 알칼리성 환경은 내부 철 근 표면에 보호막인 수동태 피막을 형성하여 철근의 부식을 방지한다.","rnd":[20,21,23,28],"art":""},{"n":"③","text":"이형철근이 원형철근보다 콘크리트와의 부착강도가 크다.","ans":false,"mark":"O","note":"이형철근은 표면에 마디와 리브가 돌기 형태로 형성되어 있어 매끈한 원형철근에 비해 콘크리트와의 기계적 인터로킹 작용이 일어나 부착강도가 훨씬 크다.","rnd":[20,21,23,26,28,29],"art":""},{"n":"④","text":"철근량이 같을 경우, 굵은 철근을 사용하는 것이 가는 철근을 사용하는 것보다 콘크리트와의 부착에 유리하다","ans":true,"mark":"X","note":"동일한 철근 단면적(철근량)일 때 굵은 철근을 적게 배치하는 것보다 가는 철근을 여러 개 나누어 배치하는 것이 콘크리트와 접촉하는 전체 표면적(주장)이 늘어나 부착력 확보에 훨씬 유리하다","rnd":[21,27],"art":""},{"n":"⑤","text":"건조수축 또는 온도변화에 의하여 콘크리트에 발생하는 균열을 방지하기 위해 사용되는 철근을 수축·온도철근이라 한다.","ans":false,"mark":"O","note":"건조수축이나 온도변화로 발생하는 콘크리트의 구체 균열을 제어하기 위하여 배치하는 철근을 수축·온도철근이라 한다.","rnd":[26,27,28,29],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①, ⑤) 부등침하 방지를 위해 건물을 경량화하고 평면길이를 짧게 하며, 건물의 강성을 높이고 중량 분배를 균일하게 한다. 인접 건물과의 거리를 멀게 하고 지하실을 설치하거나 전면기초로 시공한다","③, ④) 부등침하 원인에는 연약층, 경사지반 이질지층, 낭떠러지, 일부증축, 지하수위 변동, 지하구멍 이질지정, 일부지정, 메운땅, 흙막이 등이 있다. 공통) 부등침하 피해 현상으로는 구조체 기울어짐, 마감재 변형, 누수, 인장력과 직각 방향의 균열 발생 등이 있다. 독립기초 상호 간을 연결하는 지중보를 설치하면 주각부 강성이 증대되어 부등침하 억제 및 지진에 대한 저항 효과가 있다. 동결심도를 고려하지 않은 경우 지중 수분 동결로 얕은기초가 떠올라 부등침하가 발생하므로 기초는 반드시 동결선 이하에 설치한다. 연약 점성토 지반의 부등침하 방지용 지반개량공법에는 샌드드레인, 페이퍼드레인, 생석회말뚝 공법이 있으며 사질토 지반 에는 다짐공법과 웰포인트 공법이 있다. 이종형식 기초의 병용은 피해야 하며 동일 구조물에서 지지말뜩과 마찰말뚝을 혼용해서는 안 된다."],"pdf" :"늑근은 단부보다 중앙부에 많이 배근한다","ans":true,"mark":"X","note":"","rnd":[20,21,23,25,27,28,29],"art":""},{"n":"②","text":"전단 균열은 사인장 균열 형태로 나타난다","ans":false,"mark":"O","note":"","rnd":[25],"art":""},{"n":"③","text":"양단 고정답 보의 단부 주근은 상부에 배근한다","ans":false,"mark":"O","note":"","rnd":[20,21,27,28,29],"art":""},{"n":"④","text":"주근은 휨균열 발생을 억제하기 위해 배근한다","ans":false,"mark":"O","note":"","rnd":[20,21,27,28,29],"art":""},{"n":"⑤","text":"휨균열은 보 중앙부에서 수직에 가까운 형태로 발생한다 ※ 문제 내 현행 기준 상 과거 용어: 늑근(현행 용어: 스터럽 또는 전단철근)","ans":false,"mark":"O","note":"","rnd":[20,23,25,27,28,29],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 늑근(현행 용어: 스터럽 또는 전단철근)","철근콘크리트 보에 작용하는 전단력은 중앙부보다 지점 부근인 단부에서 크게 발생한다. 따라서 전단 파괴를 방지하기 위한 스터럽(전단철근)은 중앙부보다 단부에 더 촘촘하게 배치해야 한다.","전단력과 휨모멘트의 복합 작용으로 인해 발생하는 전단 균열은 부재 축선에 대하여 경사각을 가지는 사인장 균열 형태 로 나타난다","양단 고정답 보의 단부에서는 음의 휨모멘트(부모멘트)가 발생하여 단부 상부 측에 인장력이 유발되므로 인장 응력을 부 담하는 주철근을 상부에 배근한다","보에 배근하는 인장 주철근은 휨하중에 의해 발생하는 인장응력에 저항하여 휨균열의 발생 및 균열 폭 확대를 억제하는 역할을 한다.","휨모멘트가 최대로 작용하는 보 중앙부 하단에서는 인장응력에 의해 부재 축선에 수직인 수직 휨균열이 발생한다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"철근콘크리트 보에 작용하는 전단력은 중앙부보다 지점 부근인 단부에서 크게 발생한다. 따라서 전단 파괴를 방지하기 위한 스터럽(전단철근)은 중앙부보다 단부에 더 촘촘하게 배치해야 한다","terms":[],"extra":["①) 스터럽(전단철근)은 사인장력에 저항하고 주근 위치를 고정한다 배근 간격은 보 깊이의 1/2 이하 및 600mm 이하로 정 하며, 전단력이 큰 단부는 촘촘하게 배치하고 중앙부는 간격을 넓힌다","②) 전단력에 의한 사인장 균열은 보 축선과 약 45° 각도로 발생한다. 이에 저항하기 위해 늑근과 함께 주근 일부를 구부려 올린 급힘철근(벤트암)을 활용한다","③) 고정답보 및 연속보 단부에는 부모멘트가 작용하여 상부가 인장측이 되므로 상부근이 주근이 된다. 중앙부는 정모멘트 에 의해 하부가 인장측이 되므로 하부근이 주근이 된다.","④) 보 주근의 이음 위치는 인장력이 적게 작용하는 곳으로 하여, 중앙부에서는 상부근을 단부(지점)에서는 하부근을 이어 준다. 주근의 최소 순간격은 25mm 이상, 주근 지름 이상, 골재 최대치수의 1.33배 이상 중 큰 값을 적용한다.","⑤) 보 중앙부 수직 휨균열은 정모멘트에 의한 인장응력이 원인이다. 옥외 노출되지 않는 보의 표준 피복두께는 4Omm 이상 을 확보하여 철근을 보호하고 내구성을 유지한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제26회 43번","noAns":false,"stemBr":false},{"id":"26-44","round":26,"num":44,"part":"건축구조","unit":"철근콘크리트구조","sub":"철근 및 철근 배근","type":"mc","stem":"철근 및 철근 배근에 관한 설명으 ,"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"표준갈고리는 인장력을 받는 철근의 정착에만 효과가 인정되며, 압축을 받는 철근의 정착에는 유효하지 않은 것으로 규 정되어 있다","terms":[],"extra":["①) 콘크리트 강도가 클수록 부착강도가 증가하므로 철근의 정착길이는 단축된다.","②) 철근의 설계기준 항복강도가 클수록 철근에 작용하는 응력이 커지므로 정착길이는 비례하여 길어진다.","③) 철근을 용접이음하는 경우 용접부 강도는 철근 설계기준 항복강도의 125% 이상 성능을 발휘하여야 한다.","⑤) 서로 다른 크기의 철근을 겹침이음하는 경우 이음길이는 크기가 큰 철근의 정착길이와 크기가 작은 철근의 겹침이음길이 중 큰 값 이상으로 적용한다. 공통) D35를 초과하는 철근은 겹침이음을 할 수 없다. 철근의 이음길이는 갈고리의 길이를 포함하지 않고 산정한다 기둥 주근은 기초 또는 바닥판에 정착하고 큰보 주근은 기둥에, 작은보 주근은 큰보에, 벽철근은 기둥, 보, 바닥판에 정착 한다. 철근의 이음은 큰 응력을 받는 곳을 피하며 연속보에서 상부근은 중앙부에, 하부근은 단부에서 이음을 실시한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제29회 47번","noAns":false,"stemBr":false},{"id":"20-86","round":20,"num":86,"part":"건축구조","unit":"철근콘크리트구조","sub":"거푸집 공사","type":"mc","stem":"철근콘크리트 공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"항복강도 300MPa인 이형철근은 SR300으로 표시하며 양단면 색깔은 황색이다","ans":false,"mark":"X","note":"","rnd":[21,22,23,25,26,27,28,29],"art":""},{"n":"②","text":"철근과 콘크리트의 선팽창계수는 차이가 크므로 서로 다른 값으로 간주한다.","ans":false,"mark":"X","note":"","rnd":[21,22,28],"art":""},{"n":"③","text":"내구성이 중요한 구조물에서 시험에 의해 콘크리트 압축강도가 10MPa 이상이면 기둥 거푸집을 해체할 수 있다.","ans":true,"mark":"O","note":"","rnd":[21,22,23,24,26,27,29],"art":""},{"n":"④","text":"이형철근으로 제작한 근(stirrup)의 갈고리는 생략할 수 있다.","ans":false,"mark":"X","note":"","rnd":[21,22,23,25,26,27,28,29],"art":""},{"n":"⑤","text":"지름이 다른 철근을 이음하는 경우 이음길이는 굵은 철근을 기준으로 계산한다 ※ 문제 내 현행 기준 상 과거 용어: 늑근(현행 용어: 스터럽 또는 전단철근)","ans":false,"mark":"X","note":"","rnd":[23,25,26,27,28,29],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 늑근(현행 용어: 스터럽 또는 전단철근)","항복강도 300 MPa인 이형철근은 SD300으로 표기한다 SR300은 항복강도 300 MPa인 원형철근(Steel Round)을 의미 하며, 이형철근 SD300의 양 단면 색상은 녹색이다 황색 양 단면 표시 색상은 SD400 이형철근에 적용된다","철근과 콘크리트의 선팽창계수(열팽창계수)는 약 1.0×10-5/°C로 서로 거의 같다. 열팽창계수가 유사하기 때문에 온도 변화가 발생하더라도 두 재료 사이의 부착력이 유지되며 일체로 거동한다.","기둥, 벽, 보 측면 등 수직거푸집널의 해체는 콘크리트 압축강도 5 MPa 이상 달성 시 가능하다 다만 내구성이 중요한 구조물의 경우에는 콘크리트 압축강도가 10 MPa 이상에 도달해야 수직거푸집을 해체할 수 있다.","스터럽 및 띠철근의 끝손질에는 전단 정착 성능 확보를 위해 반드시 90도 또는 135도 등의 표준갈고리를 두어야 하며 생략할 수 없다.","지름이 서로 다른 철근을 겹침이음하는 경우 이음길이는 가느다란 철근의 정착길이와 굵은 철근의 겹침이음길이 중 큰 값으로 산정하며 이음 기준 지름은 가느다란 철근을 적용한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"기둥, 벽, 보 측면 등 수직거푸집널의 해체는 콘크리트 압축강도 5 MPa 이상 달성 시 가능하다 다만 내구성이 중요한 구조물의 경우에는 콘크리트 압축강도가 10 MPa 이상에 도달해야 수직거푸집을 해체할 수 있다","terms":[],"extra":["①) 이형철근 중 SD500의 단면 색상은 흑색이며 원형철근 지름은 Ø, 이형철근은 D, 고장력 이형철근은 HD로 표시한다 스터럽 및 띠철근의 가공치수 허용오차는 ±5mm이다.","③) 밑면 거푸집 및 동바리 해체시기는 단층구조인 경우 설계기준 압축강도의 2/3배 이상 및 최소 14MPa 이상이어야 하고, 복층구조는 설계기준 압축강도 이상 및 최소 14MPa 이상이어야 한다.","④) 전체 원형철근의 단부와 이형철근 중 늑근 및 띠철근은 반드시 갈고리를 설치해야 한다. 주철근 표준갈고리는 180'와 90°, 스터럽과 띠철근은 90°와 135°가 규정이다 갈고리 길이는 이음길이에 포함하지 않는다","⑤) D35를 초과하는 철근은 겹침이음을 할 수 없다. 철근 조립 시 수평 순간격은 25mm 이상, 철근 공칭지름 이상, 굵은골재 최대 공칭치수 이상 중 최댓값을 적용한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 86번","noAns":false,"stemBr":false},{"id":"21-87","round":21,"num":87,"part":"건축구조","unit":"철근콘크리트구조","sub":"거푸집 공사","type":"mc","stem":"철근콘크리트공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"콘크리트를 이어 칠 경우 콘크리트 표면에 나타난 레이턴스는 제거한 후 작업한다.","ans":false,"mark":"O","note":"콘크리트를 이어 칠 때는 신·구 콘크리트의 일체성을 확보하기 위해 이음면 표면에 발생한 레이턴스, 취약한 콘크리트 노유물 등을 와이어 브러시나 고압 수세 등으로 완전히 제거하고 표면을 거칠게 한 후 타설해야 한다.","rnd":[],"art":""},{"n":"②","text":"거푸집은 콘크리트 중량, 작업하중, 측압 등에 견딜 수 있어야 한다.","ans":false,"mark":"O","note":"거푸집 및 동바리는 콘크리트 고유 자중, 시공하중(작업하중), 굳지 않은 콘크리트의 측압, 풍하중 및 진동 등에 견딜 수 있는 충분한 강도와 강성을 확보하도록 설계 및 시공해야 한다.","rnd":[20,22,23,24,26,27],"art":""},{"n":"③","text":"철근의 피복두께를 유지하기 위해 긴결재를 사용한다","ans":true,"mark":"X","note":"철근의 피복두께를 일정하게 유지하기 위해 사용하는 부속품은 간격재(스페이서)이다. 긴결재(폼타이)는 굳지 않은 콘크 리트의 측압에 의해 거푸집이 벌어지는 것을 방지하고 거푸집 간격을 유지하기 위해 사용하는 자재이다","rnd":[24,26,28],"art":""},{"n":"④","text":"슬럼프시험은 워커빌리티 검사방법의 일종이다","ans":false,"mark":"O","note":"슬럼프 시험은 굳지 않은 콘크리트의 반죽질기 정도를 측정하여 시공성(워커빌리티) 및 운반·타설 과정에서의 품질 변동 유무를 검사하는 대표적인 방법이다","rnd":[22,25],"art":""},{"n":"⑤","text":"동결융해작용을 받지 않는 콘크리트 구조물에 사용되는 잔골재는 내구성(안정성)시험을 하지 않을 수 있다.","ans":false,"mark":"O","note":"동결융해 작용을 받지 않는 기상 환경이나 구조물에 사용되는 잔골재의 경우 황산나트륨에 의한 내구성(안정성) 시험을 생략할 수 있다.","rnd":[22,26,27],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"철근의 피복두께를 일정하게 유지하기 위해 사용하는 부속품은 간격재(스페이서)이다.","terms":[],"extra":["③) 격리재(세퍼레이터)는 거푸집 상호 간 간격유지 및 오그라드는 것을 방지하며 박리제는 거푸집을 쉽게 제거하기 위해 표면에 바르는 물질이다 공통) 거푸집 측압은 슬럼프가 클수록, 온도가 낮을수록 부배합일수록, 타설 속도가 빠를수록 커진다 콘크리트 비비기로부터 타설 완료까지의 시간은 외기온도 25°C 이상일 때 90분 25°C 미만일 때 120분을 넘어서는 안 된 다. 보와 슬래브의 타설이음은 전단력이 가장 적은 스팬 중앙 부근에서 주근과 직각 방향으로 수직이음한다 굳지 않은 콘크리트 중 염화물 함유량은 원칙적으로 0.30kg/m³ 이하이어야 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 87번","noAns":false,"stemBr":false},{"id":"22-51","round":22,"num":51,"part":"건축구조","unit":"철근콘크리트구조","sub":"거푸집 공사","type":"mc","stem":"콘크리트 공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"보 및 기둥의 측면 거푸집은 콘크리트 압축강도가 5MPa 이상일 때 해체할 수 있다.","ans":false,"mark":"O","note":"","rnd":[20,21,23,24,26,27,29],"art":""},{"n":"②","text":"콘크리트의 배합에서 작업에 적합한 워커빌리티를 갖는 범위 내에서 단위수량은 될 수 있는 대로 적게 한다.","ans":false,"mark":"O","note":"","rnd":[20,21,24,25],"art":""},{"n":"③","text":"콘크리트 혼합부터 부어넣기까지의 시간한도는 외기온이 25°C 미만에서 120분, 25°C 이상에서는 90분으로 한다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"VH(Vertical Horizontal) 분리타설은 수직부재를 먼저 타설하고 수평부재를 나중에 타설하는 공법이다.","ans":false,"mark":"O","note":"","rnd":[20],"art":""},{"n":"⑤","text":"거푸집의 콘크리트 측압은 슬럼프가 클수록, 온도가 높을수록 부배합일수록 크다 ※ 문제 내 현행 기준 상 과거 용어: 부어넣기(현행 용어: 쳐넣기 또는 타설)","ans":true,"mark":"X","note":"","rnd":[20,21,23,24,26,27],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 부어넣기(현행 용어: 쳐넣기 또는 타설)","기둥, 벽, 보 측면 등 수직거푸집널의 해체는 콘크리트 압축강도 5 MPa 이상 달성 시 가능하다","콘크리트 배합 설계 시 소요의 워커빌리티를 얻을 수 있는 범위 내에서 단위수량은 되도록 적게 설정하여 강도 저하 및 건조수축 균열을 방지해야 한다.","비비기 시작부터 쳐넣기 완료까지의 시간 한도는 외기온도가 25°C 미만인 경우 120분, 25°C 이상인 경우 90분이다.","VH(Vertical Horizontal) 분리타설 공법은 수직부재(기둥, 벽)를 먼저 타설하고 침하가 진행된 후 수평부재(보 슬래브) 를 나중에 타설하여 침하균열을 방지하는 시공 공법이다.","굳지 않은 콘크리트의 측압은 슬럼프가 클수록, 부배합일수록 타설 속도가 빠를수록 크다. 다만 외기온도가 높을수록 콘 크리트의 응결 및 경화 속도가 빨라져 측압은 감소하며 반대로 온도가 낮을수록 응결이 지연되어 측압이 커진다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"굳지 않은 콘크리트의 측압은 슬럼프가 클수록, 부배합일수록 타설 속도가 빠를수록 크다.","terms":[],"extra":["①) 측면 거푸집널 해체시기는 일반 구조물 5MPa 이상, 내구성이 중요한 구조물은 10MPa 이상이다. 밑면 거푸집 및 동바 리는 단층 시 설계기준 압축강도의 2/3배 이상, 최소 14MPa 이상일 때 해체한다","③) 신·구 콘크리트 타설 시 콜드조인트 방지를 위한 이어치기 허용시간 간격은 외기온도 25°C 초과 시 120분, 25°C 이하 시 150분이다.","⑤) 거푸집 측압은 벽 두께가 두꺼울수록 습도가 높을수록 타설 속도가 빠를수록 거푸집 내측 표면이 매끈할수록, 거푸집 강성이 클수록, 철근량이 적을수록 커진다 공통) 콘크리트 강도시험용 시료는 하루 1회 이상, 120m³당 1회 이상, 슬래브·벽체 표면적 500m마다 1회 이상 채취한다 압축강도 표준공시체는 150×300mm 기준이며 100×200mm 공시체 사용 시 0.97의 강도보정계수를 적용한다 일평균기온 4°C 이하 예상 시 한중 콘크리트 25°C 초과 예상 시 서중 콘크리트로 시공한다 굳지 않은 콘크리트 중 염화물 함유량은 원칙적으로 0.30kg/m³ 이하로 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 51번","noAns":false,"stemBr":false},{"id":"20-87","round":20,"num":87,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"콘크리트 공사에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"보통 콘크리트에 사용되는 골재의 강도는 시멘트 페이스트 강도 이상이어야 한다.","ans":false,"mark":"O","note":"보통 콘크리트에 사용되는 골재의 강도는 콘크리트의 파괴가 골재 자체의 파괴로 인해 발생하지 않도록 경화된 시멘트 페 이스트의 강도 이상이어야 한다. 골재는 청정하고 강경하며 내구적인 것을 사용해야 한다.","rnd":[],"art":""},{"n":"②","text":"콘크리트 제조 시 혼화제()의 양은 콘크리트 용적 계산에 포함된다.","ans":true,"mark":"X","note":"콘크리트 배합 및 절대용적 계산 시 AE제, 감수제 등의 화학 혼화제는 사용량이 매우 미량이므로 콘크리트 용적 계산에서 배 제하거나 무시한다 반면 플라이애시, 고로슬래그 미분말 등 분말 형태로 다량 사용되는 광물질 혼화재의 양은 절대용적 계산에 포함한다. 혼화제의 용적은 콘크리트 단위용적 계산에 반영하지 않는다.","rnd":[25],"art":""},{"n":"③","text":"센트럴 믹스트(central-mixed) 콘크리트는 믹싱 플랜트에서 비빈 후 현장으로 운반하여 사용하는 콘크리트이다","ans":false,"mark":"O","note":"센트럴 믹스트 콘크리트는 배치 플랜트(믹ㅅ 플랜트)에 설치된 고정식 믹서에서 재료를 완전히 비빈 후 현장으로 운반하 여 사용하는 레디믹스트 콘크리트의 한 종류이다 운반 과정에서는 반죽이 분리되거나 경화되지 않도록 트럭 아지테이터 등 을 사용한다","rnd":[24],"art":""},{"n":"④","text":"콘크리트 배합 시 골재의 함수 상태는 표면건조 내부 포수상태 또는 그것에 가까운 상태로 사용하는 것이 바람직하다","ans":false,"mark":"O","note":"콘크리트의 배합 계산 및 골재 수량 산정 시 기준이 되는 골재의 함수상태는 표면건조 내부포수상태이다 골재 내부의 간극이 물로 가득 차 있고 표면에는 수분이 없는 상태로 실제 시공 시에도 표면건조 내부포수상태 또는 이에 가까운 상태 의 골재를 사용하는 것이 유효수량과 단위수량 관리에 바람직하다","rnd":[],"art":""},{"n":"⑤","text":"콘크리트 배합 시 단위 수량은 작업이 가능한 범위 내에서 될 수 있는 한 적게 되도록 시험을 통해 정하여야 한다.","ans":false,"mark":"O","note":"콘크리트 배합 시 단위수량이 과도하면 블리딩 건조수축, 재료분리 및 강도 저하가 발생하므로 소요의 작업성을 얻을 수 있는 범위 내에서 될 수 있는 한 적게 되도록 시험 배합을 통해 정해야 한다.","rnd":[],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"콘크리트 배합 및 절대용적 계산 시 AE제, 감수제 등의 화학 혼화제는 사용량이 매우 미량이므로 콘크리트 용적 계산에서 배 제하거나 무시한다 반면 플라이애시, 고로슬래그 미분말 등 분말 형태로 다량 사용되는 광물질 혼화재의 양은 절대용적 계산에 포함한다.","terms":[],"extra":["①) 골재는 실적률이 크고 입도가 좋아야 하며 표면이 거칠고 둥근 모양이 바람직하다 잔골재는 5mm 체를 거의 다 통과하 고 굵은골재는 5mm 체에 다 남는 골재이다","②) 약품적으로 소량 사용하는 혼화제 중 AE제는 미세한 독립 기포를 형성해 시공연도 증진, 동결융해 저항성 및 수밀성 증 대, 블리딩 감소 효과가 있다. 다만 AE제 혼입량이 늘면 공기량은 증가하지만 압축강도는 감소한다","③) 레디믹스트 콘크리트 중 믹싱플랜트에서 반비빔 후 트럭믹서로 운반 도중 완전히 비비는 방식은 슈링크 믹스트이고, ㅌ 럭믹서 내에서 운반 도중 완전비비는 방식은 트랜시트 믹스트이다","④) 골재 저장설비는 적당한 배수시설을 갖추어 표면수가 균일한 골재를 사용하도록 하며, 잔골재율은 소요 워커빌리티를 얻는 범위 내에서 단위수량이 최소가 되도록 시험으로 정한다","⑤) 콘크리트는 비비기로부터 타설 완료까지 외기온도 25°C 이상은 90분, 25°C 미만은 120분을 넘지 않아야 하며 운반 및 타설 시 절대로 물을 첨가해서는 안 된다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 87번","noAns":false,"stemBr":false},{"id":"23-47","round":23,"num":47,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"콘크리트의 슬럼프 시험으로 판단할 수 있는 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"시공연도","ans":true,"mark":"O","note":"굳지 않은 콘크리트의 슬럼프 시험은 콘크리트의 반죽질기를 측정하여 시공의 용이성 및 재료분리 저항성 등을 나타내는 시공연도(workability)를 판단하기 위해 실시하는 가장 대표적인 품질 시험이다","rnd":[25],"art":""},{"n":"②","text":"크리프","ans":false,"mark":"X","note":"크리프는 지속 하중에 의해 시간이 경과함에 따라 콘크리트의 변형이 증가하는 굳은 콘크리트의 장기 변형 특성으로, 슬럼프 시험이 아닌 크리프 시험을 통해 판단한다","rnd":[20,27,29],"art":""},{"n":"③","text":"중성화","ans":false,"mark":"X","note":"중성화는 공기 중의 이산화탄소와 반응하여 콘크리트 내부의 알칼리성이 상실되는 현상으로 페놀프탈레인 시약 분사를 통한 중성화 시험으로 판단한다.","rnd":[],"art":""},{"n":"④","text":"내구성","ans":false,"mark":"X","note":"내구성은 동결융해 염해, 화학적 침식 등 외부 환경에 견디는 성능으로 동결융해 저항성 시험 및 염분 함유량 시험 등 을 통해 판단한다","rnd":[],"art":""},{"n":"⑤","text":"수밀성","ans":false,"mark":"X","note":"수밀성은 물의 침투에 견디는 성질로 콘크리트의 투수 시험을 통해 투수계수 및 침투 깊이 등을 측정하여 판단한다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 슬럼프 시험은 높이 300mm 슬럼프콘에 콘크리트를 3층으로 나누어 각각 25회 다져 채운 후 들어 올려 주저앉은 수치를 측정한다 슬럼프값이 크면 물결합재비가 크고 단위수량이 많은 부배합이며, 기온이 높거나 운반시간이 길면 슬럼프값이 저 하된다.","②) 크리프는 지속하중으로 인해 발생하는 장기변형이다 재하응력과 물결합재비가 크고, 온도가 높고 습도가 낮으며 단위 시멘트량과 단위수량이 많을수록 증가하고 압축철근비가 클수록 감소한다","③) 중성화 판정 시 측정용 시약으로 페놀프탈레인 용액을 사용하며 홍색은 알칼리성, 무색은 중성화이다. 방지책으로 피복 두께 증가, 물결합재비 감소, 온도를 낮추고 습도를 높이는 방법이 있다.","④) 콘크리트 내구성 저해요인으로는 중성화 알칼리골재반응, 염해, 동결융해, 화학적 침식, 철근 부식이 있다.","⑤) 수밀 콘크리트는 물결합재비를 50% 이하로 하며 물결합재비가 클수록 수밀성과 내구성이 저하된다 공통) 현장에 반입되는 굳지 않은 콘크리트의 품질관리 검사항목에는 슬럼프, 공기량, 염화물량, 단위수량, 물결합재비 등이 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 47번","noAns":false,"stemBr":false},{"id":"23-48","round":23,"num":48,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"철근콘크리트 공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"콘크리트 타설 후 양생기간 동안의 일평균 기온이 4°C 이하인 경우 서중 콘크리트로 시공한다","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"거푸집이 오므라드는 것을 방지하고, 거푸집 상호간의 간격을 유지하기 위해 간격재(spacer)를 배치한다.","ans":false,"mark":"X","note":"","rnd":[20,21,22,24,26,27],"art":""},{"n":"③","text":"보에서의 이어봇기는 스팬 중앙에서 수직으로 한다.","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"④","text":"보의 철근이음 시 하부주근은 중앙부에서 이음한다","ans":false,"mark":"X","note":"","rnd":[20,25,26,27,29],"art":""},{"n":"⑤","text":"콘크리트의 소요강도는 배합강도보다 충분히 커야한다 ※ 문제 내 현행 기준 상 과거 용어: 이어봇기(현행 용어: 이어치기 또는 시공이음)","ans":false,"mark":"X","note":"","rnd":[27],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 이어봇기(현행 용어: 이어치기 또는 시공이음)","일평균 기온이 4°C 이하일 것으로 예상되는 조건에서 시공하는 콘크리트는 한중 콘크리트이다 서중 콘크리트는 일평균 기온이 25°C를 초과하거나 일최고기온이 30°C를 초과할 것으로 예상될 때 적용한다","거푸집 상호 간의 간격을 유지하고 거푸집이 오므라드는 것을 방지하기 위해 설치하는 부속품은 격리재이다 간격재는 철근과 거푸집 사이의 간격을 유지하여 피복두께를 확보하는 목적으로 사용한다","보 및 슬래브의 시공이음 위치는 전단력이 가장 적게 작용하는 경간 중앙 부근에 수직으로 둔다.","보의 하부주근은 중앙부에서 최대 인장력을 받으므로 인장 응력이 최소인 단부(지점 부근)에서 이음한다 반대로 상부주 근은 중앙부 부근에서 이음한다.","콘크리트의 배합강도는 현장 시공 시의 강도 편차를 고려하여 소요강도(설계기준강도)보다 충분히 크게 정해야 한다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"보 및 슬래브의 시공이음 위치는 전단력이 가장 적게 작용하는 경간 중앙 부근에 수직으로 둔다","terms":[],"extra":["①) 한중 콘크리트는 공기연행콘크리트를 사용하는 것을 원칙으로 하며 물-결합재비는 60% 이하로 하고 동결한 지반 위에 콘크리트를 부어넣지 않는다","②) 거푸집 부속철물 중 긴결재(폼타이)는 거푸집의 형상 유지 및 측압에 의해 벌어지는 것을 방지하고, 박리제는 거푸집을 쉽게 떼어내기 위해 표면에 바른다","④) D35를 초과하는 철근은 겹침이음을 할 수 없으며 서로 다른 지름의 철근 겹침이음 시 큰 철근의 정착길이와 작은 철근 의 겹침이음길이 중 큰 값 이상으로 하고 갈고리 길이는 이음길이에 포함하지 않는다. 공통) 거푸집 해체 기준 시 기둥·보·벽 등의 측면은 일반 구조물 최소 5MPa 이상, 내구성이 중요한 구조물 최소 10MPa 이상이어야 한다. 비비기부터 타설 완료까지 시간은 외기온도 25°C 이상 시 90분 25°C 미만 시 120분 이내이며, 콜드조인트 방지를 위한 이 어치기 허용시간 간격은 25°C 초과 시 120분, 25°C 이하 시 150분 이내이다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제23회 48번","noAns":false,"stemBr":false},{"id":"24-54","round":24,"num":54,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"철근콘크리트공사에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"간격재는 거푸집 상호간에 일정한 간격을 유지하기 위한 것이다","ans":false,"mark":"X","note":"","rnd":[20,21,22,23,26,27],"art":""},{"n":"②","text":"철근 조립시 철근의 간격은 철근 지름의 1.25배 이상, 굵은골재 최대치수의 1.5배 이상, 25 mm 이상의 세 가지 값 중 최대값을 사용한다.","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"기둥의 철근 피복두께는 띠철근(hoop) 외면이 아닌 주철근 외면에서 콘크리트 표면까지의 거리를 말한다","ans":false,"mark":"X","note":"","rnd":[20,21,26,27,28,29],"art":""},{"n":"④","text":"거푸집의 존치기간을 콘크리트 압축강도 기준으로 결정할 경우에 기둥, 보, 벽 등의 측면은 최소 14MPa 이상으로 한다.","ans":false,"mark":"X","note":"","rnd":[20,21,22,23,26,27,29],"art":""},{"n":"⑤","text":"콘크리트의 설계기준압축강도가 30MPa인 경우에 옥외의 공기에 직접 노출되지 않는 철근콘크리트 보의 최소 피복두께는 40 mm이다","ans":true,"mark":"O","note":"","rnd":[20,21,22,23,25,26,27,28,29],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":["거푸집 상호 간에 일정한 간격을 유지하기 위해 사용하는 부속품은 격리재(세퍼레이터)이다. 간격재(스페이서)는 철근과 거푸집 사이의 간격을 유지하여 설계 피복두께를 확보하기 위해 사용하는 부속품이다","동일 평면에서 평행하는 철근의 수평 순간격은 25 mm 이상, 철근 공칭 지름의 1.0배 이상, 굵은골재 최대치수의 1.33 배(4/3배) 이상 중에서 가장 큰 값 이상으로 해야 한다.","피복두께는 콘크리트 표면에서 가장 바깥쪽에 위치한 철근의 외면까지의 거리를 의미하므로 기둥에서는 주철근을 감싸는 가장 바깥쪽 철근인 띠철근 외면에서 콘크리트 표면까지의 최단거리를 뜻한다","거푸집널의 해체를 콘크리트 압축강도 기준으로 결정할 때, 기둥, 벽, 보 측면 등 수직거푸집널의 해체 가능한 콘크리트 압축강도는 최소 5 MPa 이상이다.","현장치기 콘크리트에서 옥외의 공기나 흙에 직접 노출되지 않는 철근콘크리트 보 및 기둥의 최소 피복두께는 40 mm이 다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"현장치기 콘크리트에서 옥외의 공기나 흙에 직접 노출되지 않는 철근콘크리트 보 및 기둥의 최소 피복두께는 40 mm이 다","terms":[],"extra":["①) 긴결재(폼타이)는 측압에 의해 거푸집이 벌어지는 것을 방지하며 박리제는 박리를 쉽게 하기 위해 표면에 바르는 물질 이다. 간격재로 플라스틱 사용 시 책임기술자의 승인을 얻어야 한다.","②) 기둥(압축부재) 내 축방향 철근의 순간격은 40mm 이상, 철근 공칭지름의 1.5배 이상, 굵은골재 최대치수의 4/3배 이상 중 최댓값을 적용한다","③) 피복두께 확보 목적은 철근의 내화성 확보, 부식 방지(내구성), 부착력 확보이다 보에서는 최외측 철근인 늙근(스터럽) 외면을 기준으로 산정한다.","④) 내구성이 중요한 구조물의 수직거푸집널 해체 강도는 최소 10MPa 이상이다. 밑면 거푸집은 단층의 경우 설계기준강도 의 2/3배 이상 및 최소 14MPa 이상, 복층은 설계기준강도 이상 및 최소 14MPa 이상이어야 해체 가능하다","⑤) 옥외 공기나 흙에 노출되는 부재는 D16 이하 40mm, D19 이상 50mm를 적용한다. 영구히 흙에 묻히는 콘크리트는 75mm, 수중 타설 콘크리트는 100mm이다 보·기등의 설계기준강도가 40MPa 이상이면 10mm 저감할 수 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 54번","noAns":false,"stemBr":false},{"id":"24-55","round":24,"num":55,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"콘크리트의 재료분리 발생 원인이 아닌 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"모르타르의 점성이 적은 경우","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"②","text":"부어넣는 높이가 높은 경우","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"입경이 작고 표면이 거친 구형의 골재를 사용한 경우","ans":true,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"단위 수량이 너무 많은 경우","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"운반이나 다짐 시 심한 진동을 가한 경우 ※ 문제 내 현행 기준 상 과거 용어: 부어넣는(현행 용어: 타설하는)","ans":false,"mark":"O","note":"","rnd":[],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 부어넣는(현행 용어: 타설하는)","모르타르의 점성이 부족하면 굵은골재를 둘러싸는 결합력이 약해져 운반 및 타설 과정에서 굵은골재와 모르타르가 쉽게 분리된다","콘크리트 타설 시 자유낙하 높이가 높으면 비중이 큰 굵은골재가 먼저 하부로 떨어져 재료분리가 유발되므로 타설 높이 를 적절히 제한해야 한다.","입경이 적절히 작고 입도가 양호하며 구형인 골재를 사용하면 콘크리트의 워커빌리티가 향상되고 밀실한 반죽이 형성되 어 재료분리 저항성이 증가한다 재료분리는 골재의 입경이 지나치게 크거나 편평하고 가늘고 긴 형상의 골재를 사용할 때 발생하기 쉽다","단위수량이 너무 많으면 반죽이 묶어져 모르타르의 점성이 떨어지고 블리딩 현상과 함께 재료분리가 현저하게 증가한다 운반 시 심한 진동이 가해지거나 타설 후 과도한 진동 다짐을 가하면 무거운 굵은골재는 하부로 침하하고 시멘트 풀과 수분 이 상부로 부유하여 재료분리가 발생한다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["③) 콘크리트에 사용하는 골재는 실적률이 크고 입도가 좋아야 하며, 표면이 거칠고 둥근 모양인 것이 좋다. 골재의 입형이 구 형이고 입도가 적당할수록 시공연도는 증가하나 쇄석을 사용하면 시공연도가 나빠진다 공통) 재료분리는 반죽질기가 지나치게 묶거나 타설속도가 빠를 때도 발생한다. 혼화제인 AE제를 혼입하면 미세한 기포의 볼베어링 역할로 시공연도가 향상되고 단위수량이 감소하여 재료분리 및 블리딩 현상이 감소한다. 경사슈트를 사용할 때 슈트의 경사는 재료분리가 일어나지 않도록 수평 2에 대하여 수직 1 정도를 표준으로 한다. 콘크리트는 운반 및 타설 시 절대로 가수하지 않으며, 비비기 시작부터 타설 완료까지 외기온도 25°C 이상은 90분, 25°C 미만은 120분 이내에 마쳐야 한다. 물결합재비가 클수록 레이턴스와 건조수축, 크리프가 증가한다 레이턴스는 타설 후 블리딩에 의해 부유물과 미세입자가 표 면에 형성하는 경화되지 않은 층으로, 콘크리트를 이어칠 때는 신·구 콘크리트의 일체화를 위해 반드시 표면의 레이턴스를 제거해야 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 55번","noAns":false,"stemBr":false},{"id":"25-44","round":25,"num":44,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재료, 품질 및 성질","type":"mc","stem":"굳지 않은 콘크리트의 특성에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"물의 양에 따른 반죽의 질기를 컨시스턴시(consistency)라고 한다.","ans":false,"mark":"O","note":"건시스턴시(반죽질기)는 수량의 많고 적음에 따른 반죽의 질고 붉은 정도, 즉 유동성의 정도를 나타내는 굳지 않은 콘크리트의 성질을 의미한다.","rnd":[],"art":""},{"n":"②","text":"재료분리가 발생하지 않는 범위에서 단위수량이 증가하면 워커빌리티(workability)는 증가한다","ans":false,"mark":"O","note":"재료분리가 발생하지 않는 범위 내에서 단위수량이 증가하면 콘크리트의 반죽이 묶어지고 유동성이 높아져 시공연도(워 커빌리티)가 증대된다.","rnd":[20,21,22,23,24],"art":""},{"n":"③","text":"골재의 입도 및 입형은 워커빌리티(workability)에 영향을 미친다.","ans":false,"mark":"O","note":"골재의 입도(알갱이 크기 분포)와 입형(알갱이 형상)은 굳지 않은 콘크리트 내부의 유동성과 재료분리 저항성에 영향을 주므로 워커빌리티를 결정하는 주요 요인에 해당한다","rnd":[21,22],"art":""},{"n":"④","text":"물시멘트비가 커질수록 블리딩(bleeding)의 양은 증가한다","ans":false,"mark":"O","note":"물시멘트비(W/C)가 커질수록 단위수량이 상대적으로 많아져 굳지 않은 콘크리트 내부의 잉여 수분이 증가하므로 상부 로 물이 상승하는 블리딩의 양과 속도가 증가한다","rnd":[20,21,24,27],"art":""},{"n":"⑤","text":"콘크리트의 온도는 공기량에 영향을 주지 않는다","ans":true,"mark":"X","note":"콘크리트의 온도가 상승하면 기체의 용해도 감소 및 혼화제(AE제)의 기포 형성 능력 저하 등으로 인해 연행공기량이 감소한다 따라서 콘크리트의 온도는 공기량에 직접적인 영향을 미친다","rnd":[],"art":""}],"short":false,"ansText":"⑤","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 반죽질기는 단위수량의 다소에 따른 혼합물의 붉기 정도이며 아직 굳지 않은 콘크리트의 반죽질기를 측정하여 시공연 도를 판단하는 기준 시험은 슬럼프시험이다","②) 시공연도는 시멘트량이 많은 부배합이 빈배합보다 양호하며 단위수량이 과다할 경우 재료분리가 발생하여 시공연도가 오히려 저하된다.","③) 골재의 입형이 둥근 모양(구형)이고 입도가 적당할수록 시공연도가 증가하며 모서리가 각진 쇄석을 사용하면 시공연도 가 나빠진다","④) 물결합재비가 클수록 블리딩과 함께 표면에 미세입자가 부상하는 레이턴스가 증가하며 AE제를 혼입하면 블리딩과 재료 분리를 감소시킬 수 있다.","⑤) 콘크리트의 온도가 낮아지면 공기량은 증가한다 시멘트의 분말도가 증가하거나 AE제 혼입량이 감소할 경우 연행공기량 은 줄어든다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 44번","noAns":false,"stemBr":false},{"id":"20-85","round":20,"num":85,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 균열 및 내구성 저하","type":"mc","stem":"콘크리트의 변형 및 균열 등에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"크리프(creep) 변형은 지속하중으로 인해 콘크리트에 발생하는 장기 변형이다","ans":false,"mark":"O","note":"크리프(creep)는 콘크리트에 일정한 지속하중이 오랫동안 작용할 때 하중의 증가 없이도 시간에 따라 변형이 계속 증가 하는 현상을 의미한다. 이는 콘크리트 구조물의 장기 변형을 유발하는 주요 원인이다.","rnd":[23,27,29],"art":""},{"n":"②","text":"콘크리트의 단위수량이 증가하면 블리딩과 건조수축이 증가한다","ans":false,"mark":"O","note":"콘크리트 배합 시 단위수량이 증가하면 잉여수가 많아져 타설 후 물이 위로 떠오르는 블리딩 현상이 심해지며 잉여수의 증발에 따라 콘크리트가 수축하면서 발생하는 건조수축 균열의 위험도 함께 증가한다","rnd":[21,22,24,25],"art":""},{"n":"③","text":"AE제는 동결융해에 대한 저항성을 감소시킨다.","ans":true,"mark":"X","note":"AE제(공기연행제)는 콘크리트 내부에 미세하고 독립된 유기 공기포를 균일하게 분산시키는 혼화제이다. 이 미세 공기포는 수분이 동결될 때 발생하는 팽창 압력을 완화해 주는 완충 역할을 하여 콘크리트의 동결융해 저항성을 크게 향상시킨다.","rnd":[21,22,23,25,28],"art":""},{"n":"④","text":"보의 중앙부 하부에 발생한 균열은 휨모멘트가 원인이다.","ans":false,"mark":"O","note":"보의 중앙부 하부는 하중 작용 시 가장 큰 인장 응력을 받는 영역으로 콘크리트의 인장강도를 초과하는 휨모멘트가 작용할 경우 하부 단면에서 수직 방향의 휨균열이 발생한다","rnd":[23,25,26,27,29],"art":""},{"n":"⑤","text":"침하균열은 콘크리트 타설 후 자중에 의한 압밀로 철근 배근을 따라 수평부재 상부면에 발생하는 균열이다","ans":false,"mark":"O","note":"침하균열은 콘크리트 타설 및 다짐 후 아직 가소성 상태일 때 콘크리트 부재가 자중에 의해 침하되면서, 상부에 배치된 철근이나 매설관 등에 침하가 걸려 그 상부 표면을 따라 배근 모양으로 수평부재 상부에 발생하는 균열이다","rnd":[21,22,24],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"AE제(공기연행제)는 콘크리트 내부에 미세하고 독립된 유기 공기포를 균일하게 분산시키는 혼화제이다.","terms":[],"extra":["①) 크리프는 재하응력이 클수록, 물결합재비 및 단위수량이 많을수록 재하시기가 빠를수록 온도가 높고 습도가 낮을수록 단면 치수가 작을수록 증가하며 압축철근비가 클수록 감소한다","②) 건조수축은 단위시멘트량과 단위수량이 많을수록, 상대습도가 낮을수록 굵은골재의 최대치수나 부재 단면이 작을수록 증가한다 반면 수중양생을 하거나 철근량과 골재량이 많을수록 감소한다.","③) AE제는 볼베어링 역할로 시공연도를 높이고 내구성, 수밀성 증대, 단위수량 감소, 알칼리골재반응 및 블리딩 감소 효과가 있다. AE제 혼입량이 늘면 공기량은 증가하나 압축강도는 감소한다","④) 보 단부의 45° 경사 방향 균열은 전단력과 휨응력의 조합으로 발생하는 사인장균열이며 이를 방지하기 위해 전단보강근 (늘근)을 단부에 촘촘히 배근한다","⑤) 소성침하균열은 배근된 철근 직경이 클수록 증가한다. 경화 전 블리딩 속도보다 표면증발 속도가 빠를 때 발생하는 소 성수축균열은 높은 외기온도, 높은 풍속, 낮은 상대습도 조건에서 증가한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 85번","noAns":false,"stemBr":false},{"id":"21-86","round":21,"num":86,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 균열 및 내구성 저하","type":"mc","stem":"콘크리트 구조물에 발생하는 균열에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"보의 전단균열은 부재축에 경사방향으로 발생하는 균열이다","ans":false,"mark":"O","note":"보 부재의 전단균열은 전단력과 휨모멘트의 복합 응력 작용에 의해 주인장응력이 발생하여 부재축에 대하여 대략 45도 경사 방향으로 발생한다.","rnd":[],"art":""},{"n":"②","text":"침하균열은 배근된 철근 직경이 클수록 증가한다","ans":false,"mark":"O","note":"침하균열은 타설 직후 굳지 않은 콘크리트의 침하 현상이 배근된 철근에 걸쳐 방해를 받을 때 발생하며 배근된 철근의 직경이 클수록, 피복 두께가 얇을수록, 슬럼프 값이 클수록 증가한다","rnd":[20,24],"art":""},{"n":"③","text":"건조수축균열은 물시멘트비가 높을수록 증가한다","ans":false,"mark":"O","note":"건조수축균열은 콘크리트 경화 후 내부 수분의 증발에 따른 체적 감소로 발생하며 단위수량과 물-시멘트비(W/C)가 높 을수록 건조수축량이 증대되어 균열이 증가한다","rnd":[24,25,27],"art":""},{"n":"④","text":"소성수축균열은 풍속이 약할수록 증가한다","ans":true,"mark":"X","note":"소성수축균열은 콘크리트 타설 후 경화 전 소성 상태에서 표면 수분 증발 속도가 블리딩 속도보다 빠를 때 발생한다. 풍 속이 강할수록 기온이 높을수록 상대습도가 낮을수록 표면 수분 증발이 촉진되어 소성수축균열이 증가한다","rnd":[24],"art":""},{"n":"⑤","text":"온도균열은 콘크리트 내·외부의 온도차와 부재단면이 클수록 증가한다","ans":false,"mark":"O","note":"온도균열은 시멘트 수화열에 의한 콘크리트 내부와 외부의 온도차, 부재 단면의 크기 등에 의해 발생한다 부재 단면의 크기가 클수록 내부 열 방출이 어려워 내·외부 온도차가 증대되므로 온도균열이 증가한다","rnd":[22,23,24,25,29],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"소성수축균열은 콘크리트 타설 후 경화 전 소성 상태에서 표면 수분 증발 속도가 블리딩 속도보다 빠를 때 발생한다.","terms":[],"extra":["④) 높은 콘크리트 온도는 증발속도를 증가시켜 소성수축균열을 증가시키며, 경화 전에 발생하는 표면수축 현상으로 방지를 위한 양생 관리가 중요하다 공통) 건조수축균열 대책으로는 단위수량과 단위시멘트량 감소, 슬럼프값 감소, 수화열이 적은 시멘트나 팽창 시멘트 사용, 흡수율 이 낮은 골재 사용이 있다. 하중으로 인한 균열의 최대폭은 철근 응력, 철근 지름, 피복두께에 비례하고 철근비에는 반비례한다. 균열을 제한하는 가장 좋은 방법은 콘크리트의 최대인장구역에서 지름이 가는 이형철근을 여러 개 사용하는 것이다 시멘트의 이상응결에 의해 생기는 불규칙한 균열은 망상균열이다 시멘트의 알칼리 성분과 골재 중 실리카가 반응하여 알칼리실리카겔이 생성·팽창하며 균열을 일으키는 현상을 알칼리골재반 응이라고 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 86번","noAns":false,"stemBr":false},{"id":"22-52","round":22,"num":52,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 균열 및 내구성 저하","type":"mc","stem":"철근콘크리트 구조물의 내구성 저하요인으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"수화반응으로 생긴 수산화칼슘","ans":true,"mark":"X","note":"시멘트의 수화반응 과정에서 생성되는 수산화칼슘은 콘크리트에 pH 12~13의 강알칼리성을 부여하여 내부 철근 표면에 방청 역할을 하는 수동태 피막을 형성함으로써 철근 부식을 방지하는 유용한 수화물이다","rnd":[24],"art":""},{"n":"②","text":"기상작용으로 인한 동결융해","ans":false,"mark":"O","note":"콘크리트 내부 공극의 수분이 얼고 녹는 작용이 반복되면서 발생하는 팽창압은 콘크리트에 균열과 표면 박리를 유발하는 대표적인 기상적 내구성 저하요인이다","rnd":[20,21,23],"art":""},{"n":"③","text":"부식성 화학물질과의 반응으로 인한 화학적 침식","ans":false,"mark":"O","note":"황산염, 산성 물질, 유해 염류 등 부식성 화학물질과의 반응은 시멘트 수화물 조직을 분해하거나 팽창 생성물을 형성하여 콘크리트를 침식시키고 구조 성능을 저하시킨다","rnd":[23,25,27],"art":""},{"n":"④","text":"알칼리 골재반응","ans":false,"mark":"O","note":"시멘트의 알칼리 성분과 골재의 반응성 실리카 성분이 화학반응을 일으켜 생성된 겔이 수분을 흡수·팽창하면서 콘크리트 구체에 무늬 균열 및 팽창을 일으킨다.","rnd":[24,29],"art":""},{"n":"⑤","text":"철근의 부식","ans":false,"mark":"O","note":"염해나 탄산화 등에 의해 내부 철근이 부식되면 철근의 체적이 약 2.5배 팽창하면서 피복 콘크리트에 균열과 박리를 발 생시켜 구조물 전반의 내구성을 급격히 저하시킨다","rnd":[],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 수산화칼슘이 대기 중 탄산가스와 반응하여 알칼리성을 잃는 현상을 중성화(탄산화)라 하며, 판정 시 페놀프탈레인 용액 을 사용한다(알칼리성 홍색, 중성화 무색). 중성화 방지대책으로는 피복두께 증가, 물결합재비 감소, 경량골재 사용 금지 등 이 있다.","②) AE제 사용 시 형성된 미세 기포가 팽창 압력을 완화하여 동결융해 저항성을 증대시킨다 동결융해 작용을 받지 않는 콘크리트의 잔골재는 내구성 시험을 생략할 수 있다.","④) 알칼리골재반응은 알칼리 성분과 골재의 실리카 및 탄산염 광물이 반응하여 알칼리실리카겔을 생성하는 현상이며, AE 제 사용으로 반응을 감소시킬 수 있다.","⑤) 염해 방지를 위해 굳지 않은 콘크리트의 염화물 함유량은 0.30kg/m³ 이하로 한다 피복두께 최솟값은 실내 보·기둥 40 mm, 영구 매설 75mm, 수중 100mm를 적용한다. 공통) 콘크리트 구조물의 내구성 저하요인에는 중성화 알칼리골재반응, 염해, 동결융해, 화학적 침식, 철근 부식이 있다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 52번","noAns":false,"stemBr":false},{"id":"24-56","round":24,"num":56,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 균열 및 내구성 저하","type":"mc","stem":"콘크리트의 균열에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"침하균열은 콘크리트의 표면에서 물의 증발속도가 블리딩 속도보다 빠른 경우에 발생한다.","ans":false,"mark":"X","note":"콘크리트 표면에서 물의 증발 속도가 블리딩 속도보다 빠른 경우에 발생하는 것은 소성수축균열이다. 침하균열은 콘크리 ㅌ 타설 후 자중에 의해 침하할 때 굵은 철근이나 매설관 상부에서 침하가 방해받아 철근을 따라 발생한다.","rnd":[20,21],"art":""},{"n":"②","text":"소성수축균열은 굵은 철근 아래의 공극으로 콘크리트가 침하하여 철근 위에 발생한다.","ans":false,"mark":"X","note":"굵은 철근 상부 등에서 콘크리트 침하로 인해 발생하는 균열은 침하균열이다 소성수축균열은 굳지 않은 콘크리트 표면 의 수분 증발 속도가 블리딩 속도보다 빠를 때 표면 인장응력에 의해 발생한다","rnd":[21],"art":""},{"n":"③","text":"하중에 의한 균열은 설계하중을 초과하거나 부동침하 등의 원인으로 생기며 주로 망상균열이 불규칙하게 발생한다.","ans":false,"mark":"X","note":"하중에 의한 구조적 균열은 휨, 전단, 비틀림 등 작용하는 응력의 방향에 따라 일정한 규칙성과 방향성을 지니고 발생한 다. 불규칙한 망상균열은 건조수축, 알칼리-골재 반응 등 비구조적 원인에 의해 주로 발생한다","rnd":[22,29],"art":""},{"n":"④","text":"온도균열은 콘크리트의 내, 외부 온도차가 클수록, 단면치수가 클수록 발생하기 쉽다.","ans":true,"mark":"O","note":"온도균열은 시멘트의 수화열로 인한 콘크리트 내부와 외부의 온도 차이가 클수록 부재의 단면 치수가 클수록 외부 구 속도가 높을수록 발생하기 쉽다.","rnd":[21,22,23,25,29],"art":""},{"n":"⑤","text":"건조수축균열은 콘크리트 경화 전 수분의 증발에 의한 체적 증가로 발생한다","ans":false,"mark":"X","note":"건조수축균열은 콘크리트 경화 후 수분 증발에 따른 체적 수축으로 인해 발생한다 체적 증가가 아닌 체적 수축이 원인 이다.","rnd":[21],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"온도균열은 시멘트의 수화열로 인한 콘크리트 내부와 외부의 온도 차이가 클수록 부재의 단면 치수가 클수록 외부 구 속도가 높을수록 발생하기 쉽다","terms":[],"extra":["①) 반죽질기(컨시스턴시)가 지나치면 재료분리가 발생한다 시멘트 사용량이 많은 부배합이 빈배합보다 시공연도가 좋으며 시멘트 분말도가 클수록 블리딩 및 재료분리가 감소한다","②) 타설 시 경사슈트 경사는 수평 2에 대하여 수직 1 정도가 적당하다. 타설속도가 너무 빠르거나 타설한 콘크리트를 거푸 집 안에서 횡방향으로 이동시키면 재료분리가 발생한다","③) 골재는 실적률이 크고 입도가 양호하며 둥근 모양인 것이 시공연도에 유리하며 쇄석 사용 시 시공연도가 나빠진다 AE 제 사용 시 미세 기포의 볼베어링 역할로 시공연도가 향상되고 재료분리 및 블리딩이 감소한다","④) 단위수량이 과다하여 물결합재비가 커지면 압축강도 감소, 수밀성 및 내구성 저하 레이턴스 증가, 건조수축 및 크리프 증가 현상이 발생한다","⑤) 적당한 진동다짐은 거푸집 내부에 밀실하게 충전시켜 강도를 높이지만 운반이나 다짐 시 과도한 진동은 재료분리를 유발하므로 유의해야 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 56번","noAns":false,"stemBr":false},{"id":"27-52","round":27,"num":52,"part":"건축구조","unit":"철근콘크리트구조","sub":"콘크리트 재는 재질이 균등하며 강도가 커서 철근콘크리트에 비해 건물의 중량이 가볍다","ans":false,"mark":"O","note":"","rnd":[20,21,23,24,25,26,27,28,29],"art":""},{"n":"②","text":"장경간 구조물이나 고층 건축물을 축조할 수 있다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"③","text":"시공정밀도가 요구되어 공사기간이 철근콘크리트에 비해 길다.","ans":true,"mark":"X","note":"","rnd":[20,23,24,25,26,27],"art":""},{"n":"④","text":"고열에 약해 내화설계에 의한 내화피복을 해야 한다.","ans":false,"mark":"O","note":"","rnd":[24,26],"art":""},{"n":"⑤","text":"압축력에 대해 좌굴하기 쉽다. ※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","ans":false,"mark":"O","note":"","rnd":[20,21,24,25,26,28],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","강재는 공장 생산 부재로서 재질이 균일하고 단위중량당 강도가 크다. 따라서 동일한 내력을 가진 구조물 축조 시 철근 콘크리트구조에 비해 건물 구체의 자중을 대폭 경량화할 수 있다.","강재의 우수한 강도를 바탕으로 기둥 간격이 넓은 대경간(장경간) 구조체나 초고층 건축물을 효과적으로 축조할 수 있다.","강구조는 공장에서 가공·제작된 부재를 현장에서 조립 및 접합하는 건식 공법이다 공장 가공 및 현장 조립 시 높은 시 공정밀도가 요구되지만 현장 콘크리트 타설 및 양생 기간이 필수적인 습식 공법인 철근콘크리트구조에 비해 현장 공사기간 을 대폭 단축할 수 있다.","강재는 고온에 노출될 경우 강도 및 탄성계수가 급격히 저하되므로 화재 시 구조 안정성을 확보하기 위해 내화설계기준 에 따른 내화피복 시공을 필히 수행해야 한다.","강재 부재는 단면 두께가 얇고 세장비가 큰 특성이 있어 압축력이나 휨응력을 받을 때 국부좌굴 또는 전체좌굴이 발생하 기 쉽다"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"강구조는 공장에서 가공·제작된 부재를 현장에서 조립 및 접합하는 건식 공법이다 공장 가공 및 현장 조립 시 높은 시 공정밀도가 요구되지만 현장 콘크리트 타설 및 양생 기간이 필수적인 습식 공법인 철근콘크리트구조에 비해 현장 공사기간 을 대폭 단축할 수 있다","terms":[],"extra":["③) 공장 제작작업과 현장 조립작업으로 공사의 표준화를 도모할 수 있는 건식공법으로 철근콘크리트 구조 부분과 분리작 업이 가능하여 공기를 단축할 수 있다.","④) 강재의 내력은 고온에 취약하여 500~600°C에서는 상온강도의 약 1/2, 800°C에서는 거의 0이 되므로 철저한 품질관리와 내화피복이 필요하다.","⑤) 인장응력과 압축응력이 거의 같아 세장한 구조부재가 가능하나 단면에 비해 부재가 세장하여 변형이나 좌굴을 일으키 기 쉽다 공통) 강재의 탄소량이 증가하면 항복강도 인장강도 경도는 증가하나 연성, 인성, 용접성은 감소한다 강재 구성요소 중 크롬, 니켈, 구리는 부식을 방지하고 인과 황은 취성을 증가시킨다 TMCP강재는 판 두께 40mm 이상의 후판이라도 항복강도 변화가 없고 용접성과 소성변형능력이 우수하여 초고층 강구조 건 물에 적용되는 제어열처리강이다. 강구조 접합부는 존재응력과 상관없이 반드시 45kN 이상 지지하도록 설계하며 진동·충격 또는 반복응력을 받는 접합부에는 일반볼트를 사용하지 않는다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제22회 53번","noAns":false,"stemBr":false},{"id":"24-57","round":24,"num":57,"part":"건축구조","unit":"강구조","sub":"강구조의 특징 및 강재 재질","type":"mc","stem":"철골구조에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"단면에 비하여 부재의 길이가 길고 두께가 얇아 좌굴되기 쉽다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"②","text":"접합부의 시공과 품질관리가 어렵기 때문에 신중한 설계가 필요하다.","ans":false,"mark":"O","note":"","rnd":[20,21,25,26,27,28,29],"art":""},{"n":"③","text":"강재의 취성파괴는 고온에서 인장할 때 또는 갑작스런 하중의 집중으로 생기기 쉽다.","ans":true,"mark":"X","note":"","rnd":[20,21,22,25,27,28,29],"art":""},{"n":"④","text":"담금질은 강을 가열한 후 급랭하여 강도와 경도를 향상시키는 열처리 작업이다.","ans":false,"mark":"O","note":"","rnd":[23,26,27],"art":""},{"n":"⑤","text":"고장력볼트 접합은 철골부재간의 마찰력에 의해 응력을 전달하는 방식이다 ※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","ans":false,"mark":"O","note":"","rnd":[20,21,22,25,26,27,28,29],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","강재는 단면적에 비해 부재의 길이가 길고 판 두께가 얇은 세장한 부재로 구성되므로 압축력이나 휨 하중 작용 시 전체 및 국부 좌굴이 발생하기 쉽다.","부재 간 응력을 전달하는 접합부는 시공 정밀도 및 현장 품질관리가 까다로우므로 세심한 상세 설계가 필요하다","강재의 취성파괴는 고온이 아닌 저온 환경에서 인장할 때, 또는 응력 집중, 충격 하중, 용접 잔류응력 등에 의해 연성 변 형 없이 순간적으로 일어나는 파괴 현상이다. 고온에서는 연성이 증가하며 저온일수록 강재의 충격 흡수 능력이 저하되어 취성파괴 위험이 높아진다","담금질은 강재를 변태점 이상의 온도로 가열한 후 급속 냉각하여 경도와 강도를 크게 향상시키는 열처리 방법이다","고장력볼트 마찰접합은 볼트의 강한 도입 인장력으로 발생한 부재 접합면 간의 마찰력에 의해 응력을 전달하는 방식이 다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"강재의 취성파괴는 고온이 아닌 저온 환경에서 인장할 때, 또는 응력 집중, 충격 하중, 용접 잔류응력 등에 의해 연성 변 형 없이 순간적으로 일어나는 파괴 현상이다.","terms":[],"extra":["①) 강재는 인성과 소성변형능력이 우수하지만 반복응력에 따른 피로 현상으로 강도 저하가 심하며 처짐이나 진동 등 사용 성에 대한 고려가 필요하다","②) 모든 접합부는 존재응력과 상관없이 최소 45kN 이상 지지하도록 설계한다. 용접부 내부결함 검사 중 초음파탐상법은 소모품이 적고 기동성이 좋으나 복잡한 형상의 검사가 어렵다","③) 강재는 500~600°C에서 상온강도의 약 1/2, 800°C에서 거의 0이 되므로 내화피복이 필요하다 탄소량이 증가하면 항복강도, 인장강도 경도, 취성은 증가하나 연성, 인성, 용접성은 감소한다","④) 강재의 구멍뚫기는 판 두께 13mm 이하는 편칭, 13mm 초과는 드릴링에 의한다 고장력볼트 표준구멍 직경은 M24 미만 시 볼트 지름 +2mm, M24 이상 시 볼트 지름 +3mm를 적용한다","⑤) 고장력볼트의 조임은 이음 중앙부에서 판 단부 쪽으로 진행한다. 토크전단형 고장력볼트는 너트 측에만 1개의 와셔를 사용하며 강우나 결로 등 습한 상태에서 본조임을 금하고 한번 사용한 볼트는 재사용할 수 없다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제24회 57번","noAns":false,"stemBr":false},{"id":"25-48","round":25,"num":48,"part":"건축구조","unit":"강구조","sub":"강구조의 특징 및 강재 재질","type":"mc","stem":"구조용강재의 재질표시로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"일반구조용 압연강재: SS","ans":false,"mark":"O","note":"","rnd":[27,29],"art":""},{"n":"②","text":"용접구조용 압연강재: SM","ans":false,"mark":"O","note":"","rnd":[27,29],"art":""},{"n":"③","text":"용접구조용 내후성 열간압연강재: SMA","ans":false,"mark":"O","note":"","rnd":[20,21,29],"art":""},{"n":"④","text":"건축구조용 압연강재: SSC","ans":true,"mark":"X","note":"","rnd":[27,29],"art":""},{"n":"⑤","text":"건축구조용 열간압연 H형강: SHN","ans":false,"mark":"O","note":"","rnd":[27],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["구조용 강재의 재질 기호 표시 기준은 다음과 같다.","일반구조용 압연강재의 기호는 SS(Steel Structure)이다.","용접구조용 압연강재의 기호는 SM(Steel Marine 또는 Steel Structure Material for Welding)o다.","용접구조용 내후성 열간압연강재의 기호는 SMA(Steel Material Atmospheric)o다.","건축구조용 압연강재의 기호는 SN(Steel New)o다. SSC는 일반구조용 경량 형강(Steel Structure Light Gauge)을 의 미한다.","건축구조용 열간압연 H형강의 기호는 SHN(Steel H-section New)o]다."],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"건축구조용 압연강재의 기호는 SN(Steel New)o다. SSC는 일반구조용 경량 형강(Steel Structure Light Gauge)을 의 미한다","terms":[],"extra":["①) SS강재는 일반구조용 압연강재로 용접성이 낮아 주요 구조부의 용접 접합에는 사용을 제한한다 강재 표기 기호 뒤의 숫자는 최소인장강도 또는 항복강도를 나타낸다","②) SM강재는 용접구조용 압연강재로 탄소 함량을 낮추어 용접성과 인성을 높인 강재이다 주요 골조의 용접 구조부에 주 로 적용한다","③) SMA강재는 용접구조용 내후성 열간압연강재로 구리, 크롬, 니켈 등을 첨가하여 대기 부식에 대한 저항성과 내식성을 높인 강재이다.","④) SN강재는 건축구조용 압연강재로 내진성능 확보를 위해 항복비 및 탄소당량을 규제한 강재이다 규격 표기 시 숫자는 최소항복강도를 의미한다","⑤) SHN강재는 건축구조용 열간압연 H형강이다 판 두께 40mm 이상 극후판의 용접성과 내진성을 높인 제어열처리강은 TMCP강이라 한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제25회 48번","noAns":false,"stemBr":false},{"id":"27-53","round":27,"num":53,"part":"건축구조","unit":"강구조","sub":"강구조의 특징 및 강재 재질","type":"mc","stem":"구조용 강재에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"강재의 화학적 성질에서 탄소량이 증가하면 강도는 감소하나 연성과 용접성은 증가한다","ans":true,"mark":"X","note":"강재의 탄소 함유량이 증가하면 강도(항복강도 인장강도)와 경도는 증가하지만, 연성, 인성, 신율 및 용접성은 감소한다 강재 내부의 탄소량이 커질수록 취성이 증가하고 용접 열영향부의 경화로 인해 용접성이 저하된다","rnd":[20,21,22,23,24,25,28,29],"art":""},{"n":"②","text":"SN은 건축구조용 압연강재를 의미한다.","ans":false,"mark":"O","note":"SN(Steel New)은 건축구조물의 내진성능 확보 및 용접 성능 향상을 위해 규격화된 건축구조용 압연강재를 의미한다","rnd":[25,29],"art":""},{"n":"③","text":"TMCP강은 극후판의 용접성과 내진성을 개선한 제어열처리강이다.","ans":false,"mark":"O","note":"TMCP(Thermo-Mechanical Control Process)강은 제어열처리 공정을 거쳐 탄소당량을 낮추면서도 높은 강도를 유지하도록 제조된 강재로 두꺼운 판재(극후판)에서도 뛰어난 용접성과 내진성능을 발휘한다.","rnd":[],"art":""},{"n":"④","text":"판두께 16mm 이하인 경우 SS275의 항복강도는 275MPa이다.","ans":false,"mark":"O","note":"SS275 강재의 판두께가 16 mm 이하인 경우 최소 항복강도는 275 MPa이다.","rnd":[20,21,23,25,26,28,29],"art":""},{"n":"⑤","text":"판두께 16mm 초과 40mm 이하인 경우 SM355의 항복강도는 345MPa이다.","ans":false,"mark":"O","note":"SM355 강재의 경우 판두께가 16 mm를 초과하고 40 mm 이하인 구간에서의 최소 항복강도는 345 MPa이다.","rnd":[20,21,23,25,26,28,29],"art":""}],"short":false,"ansText":"①","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 강재의 탄소 이외 성분 중 크롬, 니켈, 구리는 부식을 방지하고, 인과 황은 취성을 증가시키나 기계가공성을 향상시킨 다. 한편 강재는 저온에서 인장하거나 갑작스러운 하중 집중 시 취성파괴가 발생하기 쉽다. 공통) SN 및 SHN 강재는 판 두께에 상관없이 표기 숫자가 최저항복강도이다. 반면 SS 및 SM 강재는 판 두께가 16mm를 초과할 경우 기호 뒤 숫자에서 10을 뺀 값이 최저항복강도가 된다. TMCP강은 판 두께 40mm 이상의 후판이라도 항복강도 변화(저하)가 없고 소성변형능력이 우수하여 초고층 강구조물에 적합하다. 강재는 고온에 약하여 500~600°C에서 상온강도의 약 1/2로 저하되고 800°C에서는 거의 0이 되므로 내화피복이 필수적이 다. 강재의 규격 기호 중 SSC는 일반구조용 경량형강, SPSR은 일반구조용 각형강관 SMA는 용접구조용 내후성 열간압연 강재를 의미한다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제27회 53번","noAns":false,"stemBr":false},{"id":"28-49","round":28,"num":49,"part":"건축구조","unit":"강구조","sub":"강구조의 특징 및 강재 재질","type":"mc","stem":"강판 두께가 20 mm인 SM275 구조용 강재의 항복강도는?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"235MPa","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"②","text":"245MPa","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"255MPa","ans":false,"mark":"X","note":"","rnd":[],"art":""},{"n":"④","text":"265MPa","ans":true,"mark":"O","note":"","rnd":[],"art":""},{"n":"⑤","text":"275MPa","ans":false,"mark":"X","note":"","rnd":[],"art":""}],"short":false,"ansText":"④","blanks":[],"core":"","paras":["구조용 강재 SM275 기호의 숫자 275는 두께 16 mm 이하에서의 기준 항복강도(275 MPa)를 의미한다. 강재는 두께가 두 꺼워질수록 내부 조직의 세립화 정도 및 냉각 속도 차이에 의해 항복강도가 저하되므로 두께 범주에 따른 항복강도 기준이 적용된다. SM275 강재의 두께별 항복강도는 다음과 같다.","1. 두께 16 mm 이하: 275 MPa","2. 두께 16 mm 초과 40 mm 이하: 265 MPa","3. 두께 40 mm 초과 75 mm 이하: 255 MPa","4. 두께 75 mm 초과 100 mm 이하: 245 MPa"],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"265MPa","terms":[],"extra":["⑤) 판 두께 16mm 이하인 경우 SS275, SM275 강재의 최저항복강도는 275MPa이다. 공통) SN, SHN 강재는 판 두께에 관계없이 기호 뒤의 숫자가 그대로 최저항복강도이다. 반면 SS, SM 등 나머지 강재는 판 두께 16mm 이하일 때 기호 뒤 숫자가 최저항복강도이며, 16mm를 초과하면 해당 숫자에서 10을 뺀 값이 최저항복강도가 된다. 강재의 탄소량이 증가하면 항복강도 인장강도 경도는 증가하나 연성, 인성, 용접성은 감소한다 TMCP강은 판 두께 40mm 이상의 후판인 경우에도 항복강도의 저하가 없고 용접성이 우수하다 강재는 고온에 취약하여 500~600°C에서 상온강도의 1/2로 저하되고, 800°C 이상에서는 거의 0이 되므로 내화피복이 필수 적이다."],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제28회 49번","noAns":false,"stemBr":false},{"id":"29-48","round":29,"num":48,"part":"건축구조","unit":"강구조","sub":"강구조의 특징 및 강재 재질","type":"mc","stem":"강재에 관한 설명으로 옳은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"H-600× 200× 11× 17에서 플랜지 폭은 200mm이고, 웨브 두께는 11mm이다.","ans":true,"mark":"O","note":"H형강의 규격 표시는 H- 높이(H)× 플랜지 너비(B)× 웨브 두께(t1)× 플랜지 두께(t2) 순서로 명시한다. 따라서 H-600× 200× 11× 17 표기에서 플랜지 폭은 200 mm, 웨브 두께는 11 mm이다.","rnd":[20,21,25,26,27],"art":""},{"n":"②","text":"건축물에 사용하는 구조용 강재의 탄성계수는 150,000MPa이다.","ans":false,"m d":[23],"art":""}],"short":false,"ansText":"③","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"","terms":[],"extra":["①) 용접부 내부결함 검사에는 방사선투과시험과 초음파탐상시험을 적용한다. 초음파탐상법은 소모품이 적게 들고 기동성이 우수하지만 복잡한 형상의 검사가 어렵다","④) 크레이터 등 용접 시점과 종점의 결함을 방지하기 위하여 용접선 단부에 보조판인 엔드탭을 설치하며 시공 완료 후 제거한다.","⑤) 용접 결함의 종류로는 크랙, 공기구멍, 오버랩, 크레이터 언더컷 외에도 슬래그함입 피트, 피시아이 등이 있다. 공통) 용접선 교차 시 결함을 방지하기 위해 오목하게 파 놓은 홈을 스캘럽이라 한다. 용접접합은 강재량이 절약되고 단면 결손이 없으나 용접열에 의한 부재 변형과 결함 발견이 어렵다. 고장력볼트와 용접을 병용할 때는 고장력볼트를 먼저 체결한 후 용접하여야 각각 응력을 분담한다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제20회 89번","noAns":false,"stemBr":false},{"id":"21-89","round":21,"num":89,"part":"건축구조","unit":"강구조","sub":"강구조의 접합방식 및 용접결함","type":"mc","stem":"철골구조의 고장력볼트에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"토크-전단형(T/S) 고장력볼트는 너트 측에만 1개의 와셔를 사용한다","ans":false,"mark":"O","note":"토크전단형(T/S) 고장력볼트는 조임 완료 시 핀테일이 파단되는 구조이며 와셔는 너트 측에만 1개를 체결하여 시공한 다.","rnd":[22,24,25,27,28,29],"art":""},{"n":"②","text":"볼트는 1차 조임 후 1일 정도의 안정화를 거친 다음 본조임하는 것을 원칙으로 한다.","ans":true,"mark":"X","note":"고장력볼트의 조임은 1차 조임, 마킹, 본조임 순서로 진행하며 부재 간 마찰면의 밀착성과 유효 축력 도입을 유효하게 확보하기 위해 당일 조임 완결을 원칙으로 한다. 1일간의 안정화 기간을 두고 본조임하는 절차는 적용하지 않는다","rnd":[],"art":""},{"n":"③","text":"볼트는 원칙적으로 강우 및 결로 등 습한 상태에서 본조임해서는 안 된다.","ans":false,"mark":"O","note":"강우, 강설, 결로 등으로 인하여 마찰면에 수분이 침투하면 미끄럼 계수 변동 및 축력 도입 저해가 발생하므로 습한 상 태에서는 본조임을 수행하지 않는다","rnd":[],"art":""},{"n":"④","text":"볼트 끼우기 중 나사부분과 볼트머리는 손상되지 않도록 보호한다","ans":false,"mark":"O","note":"고장력볼트의 운반 및 조립 시 나사산 및 볼트 머리 부위가 손상되지 않도록 주의하여 취급한다","rnd":[],"art":""},{"n":"⑤","text":"볼트 조임 및 검사용 토크렌치와 축력계의 정밀도는 ±3% 오차범위 이내가 되도록 한다.","ans":false,"mark":"O","note":"고장력볼트 조임 작업 및 체결력 검사에 사용되는 토크렌치와 축력계는 오차범위 ±3% 이내의 정밀도를 유지하도록 관 리한다","rnd":[20],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":[],"cites":[],"citeLabel":"관련 조문","citeFirst":false,"key":"고장력볼트의 조임은 1차 조임, 마킹, 본조임 순서로 진행하며 부재 간 마찰면의 밀착성과 유효 축력 도입을 유효하게 확보하기 위해 당일 조임 완결을 원칙으로 한다.","terms":[],"extra":["②) 고장력볼트의 조임은 설계볼트장력에 10%를 증가시켜 표준볼트장력을 얻도록 조이며, 한 번 사용한 고장력볼트는 재사용할 수 없다 공통) 고장력볼트 조임 순서는 이음의 중앙부에서 판 단부 쪽으로 조여 나간다 토크전단형 고장력볼트는 너트의 표시기호가 있는 쪽과 와셔의 면치가 있는 쪽이 각각 바깥쪽을 향하도록 시공한다 고장력볼트 접합 시 볼트 중심 간격인 최소 피치는 볼트 지름의 2.5배 이상으로 하고, 체결하는 판의 총두께인 그립 두께는 볼트 지름의 5배 이하로 한다. 고장력볼트와 용접을 병용할 때 고장력볼트를 먼저 체결한 후 용접하면 각각 응력을 분담하는 것으로 본다. 용접구조용 압연강재 기호 SM275A에서 275는 판 두께 16mm 이하 기준 최저항복강도 275MPa을 나타낸다 강재는 500~600C에서 상온강도의 약 1/2로 저하되고 800°C 이상에서 거의 0이 되므로 내화피복이 필수적이다"],"pdf":[],"boxes":[],"diff":"하","roundLabel":"제21회 89번","noAns":false,"stemBr":false},{"id":"22-54","round":22,"num":54,"part":"건축구조","unit":"강구조","sub":"강구조의 접합방식 및 용접결함","type":"mc","stem":"철골구조 접합에 관한 설명으로 옳지 않은 것은?","intro":[],"tables":[],"img":"","imgAlt":"문제 그림","bogi":[],"letters":false,"combo":false,"choices":[{"n":"①","text":"일반볼트접합은 가설건축물 등에 제한적으로 사용되며 높은 강성이 요구되는 주요 구조부분에는 사용하지 않는다.","ans":false,"mark":"O","note":"","rnd":[],"art":""},{"n":"②","text":"언더 컷은 약한 전류로 인해 생기는 용접 결함의 하나이다","ans":true,"mark":"X","note":"","rnd":[],"art":""},{"n":"③","text":"용접봉의 피복제 역할을 하는 분말상의 재료를 플럭스라 한다.","ans":false,"mark":"O","note":"","rnd":[20],"art":""},{"n":"④","text":"고장력볼트 접합은 응력중심이 적으므로 반복응력에 강하다","ans":false,"mark":"O","note":"","rnd":[21,24,25,27,28,29],"art":""},{"n":"⑤","text":"고장력볼트 마찰접합부의 마찰면은 녹막이칠을 하지 않는다 ※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","ans":false,"mark":"O","note":"","rnd":[21,24,25,27,28,29],"art":""}],"short":false,"ansText":"②","blanks":[],"core":"","paras":["※ 문제 내 현행 기준 상 과거 용어: 철골구조(현행 용어: 강구조)","일반볼트접합은 볼트 구멍의 유격 및 진동으로 인한 풀림 가능성이 있어 가설건축물이나 간이구조물 등 제한적인 용도로 적용하며 높은 강성과 안전성이 요구되는 주요 내력구조부 접합에는 사용하지 않는다.","언더컷(Undercut)은 용접 작업 시 과대한 전류를 사용하거나 용접 운봉 속도가 너무 빠를 때 모재가 과도하게 용융되어 홈이 파이고 용착금속이 채워지지 않은 채 남게 되는 용접 결함이다. 과소한(약한) 전류로 인해 발생하는 결함은 용입 불량 이나 오버랩(Overlap) 등이다.","용접 시 용융 금속을 대기 중의 산소 및 질소로부터 보호하고 슬래그를 형성하여 피복제 역할을 수행하는 분말상의 재료 를 플럭스(Flux)라 한다.","고장력볼트 마찰접합은 볼트의 강력한 체결력에 의한 부재 간 마찰력으로 응력을 전달한다 볼트 구멍 주변의 응력집중 이 적어 반복하중에 대한 피로 강도가
